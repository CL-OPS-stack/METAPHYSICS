ook):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "14 Sets, classes and infinity/Set.md": "---\ngroup: Sets, classes and infinity\nrole: concept\nsource: Beebee et al. 2011, entry \"Set\"\npages: p. 230\nstatus: unread\n---\n# Set\n**Page(s):** p. 230\n**Book's definition:** p. 230, the first two sentences of the entry.\n**In one line:** A type of class. On some set theories, 'sets' are the classes that can be members of other classes, unlike 'proper classes'.\n**Role in [[00 – Sets, classes and infinity]]:** Set-theoretic terminology.\n**Explanation:** For most purposes 'set' and 'class' can be treated as synonyms, though they can come apart. Normally classes can be members of other classes ({a} and {b} are members of {{a}, {b}}). To avoid certain paradoxes, some set theories hold that some classes are too big to be members of another class; these are 'proper classes', and 'set' is reserved for the rest.\n**Example:** {a} and {b} as members of {{a}, {b}}.\n**Connections:**\n- is a type of [[Class]]: because sets are the classes that can be members of others.\n- contrasts with [[Proper Class]]: because proper classes can't be members (pointer entry).\n- can be a [[Singleton]]: because a singleton is a one-member class.\n**Bridges to other groups:**\n- [[Class Nominalism]] (Particulars and universals): because class nominalists explain properties by classes or, equivalently, sets.\n**Multiple meanings:** Usually 'set' = 'class'. Strictly, on some set theories, sets are the non-proper classes.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "14 Sets, classes and infinity/Singleton.md": "---\ngroup: Sets, classes and infinity\nrole: concept\nsource: Beebee et al. 2011, entry \"Singleton\"\npages: p. 232\nstatus: unread\n---\n# Singleton\n**Page(s):** p. 232\n**Book's definition:** p. 232, the opening sentence of the entry.\n**In one line:** A class with exactly one member, such as {Brad Pitt}.\n**Role in [[00 – Sets, classes and infinity]]:** Set-theoretic terminology.\n**Explanation:** Singletons can have their own singletons: {{Brad Pitt}} is the singleton of Brad Pitt's singleton. Any class except a proper class can have a singleton.\n**Example:** {Brad Pitt} and {{Brad Pitt}}.\n**Connections:**\n- is a type of [[Class]]: because it is a one-member class.\n- can't be formed from a [[Proper Class]]: because proper classes can't be members (pointer entry).\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "14 Sets, classes and infinity/Supertask.md": "---\ngroup: Sets, classes and infinity\nrole: concept\nsource: Beebee et al. 2011, entry \"Supertask\"\npages: p. 239\nstatus: unread\n---\n# Supertask\n**Page(s):** p. 239\n**Book's definition:** p. 239, the opening sentence of the entry.\n**In one line:** An event in which infinitely many sub-tasks are completed in a finite time.\n**Role in [[00 – Sets, classes and infinity]]:** A test case for the coherence of actual infinity.\n**Explanation:** Counting infinitely many grains of sand within one lifetime would be a supertask. In most cases, supertasks are completed only in thought experiments. But they may be commonplace: if Zeno was right, every time we move we complete an infinite series of tasks.\n**Example:** Counting infinitely many grains of sand in one lifetime.\n**Connections:**\n- involves [[Infinity]]: because the sub-tasks are infinite in number, and Aristotle wouldn't have believed supertasks possible.\n- would happen in every motion according to [[Zeno]]: because moving requires infinitely many sub-journeys.\n**Bridges to other groups:**\n- [[Thought Experiment]] (Method): because supertasks are usually completed only in thought experiments.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "14 Sets, classes and infinity/Transitive Closure.md": "---\ngroup: Sets, classes and infinity\nrole: pointer\nsource: Beebee et al. 2011, entry \"Transitive Closure\"\npages: p. 254\nstatus: unread\n---\n# Transitive Closure\n**Page(s):** p. 254\n**Pointer entry:** the book only says \"see\" → [[Ancestral Relation]]. Read that note.\n**Role in [[00 – Sets, classes and infinity]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "14 Sets, classes and infinity/Transitive Relation.md": "---\ngroup: Sets, classes and infinity\nrole: concept\nsource: Beebee et al. 2011, entry \"Transitive Relation\"\npages: pp. 254–255 (entry starts p. 254)\nstatus: unread\n---\n# Transitive Relation\n**Page(s):** pp. 254–255 (entry starts p. 254)\n**Book's definition:** p. 254, the opening sentence of the entry.\n**In one line:** R is transitive if, necessarily, whenever x bears R to y and y bears R to z, x bears R to z, as with 'taller than'.\n**Role in [[00 – Sets, classes and infinity]]:** A logical property that drives puzzles about identity, memory and causation.\n**Explanation:** If John is taller than Mary, and Mary than Freddy, John is taller than Freddy. *Is at least six feet away from* isn't transitive: Freddy is six feet from John and John from Freddy, but John isn't six feet from himself. Identity is transitive (Clark Kent = Superman = Kal-El), which matters for personal identity, because *remembers the experiences of* isn't. Causation is often taken to be transitive, though this is controversial. From a non-transitive relation we can usually define a transitive one, its ancestral.\n**Example:** Clark Kent, Superman and Kal-El.\n**Connections:**\n- can be produced from any relation by the [[Ancestral Relation]]: because ancestral relations are always transitive.\n- [[Transitive Closure]]: another name for the ancestral (pointer entry).\n**Bridges to other groups:**\n- [[Identity]] (Identity): because identity is transitive.\n- [[Personal Identity]] and [[Psychological Continuity]] (Personal identity): because remembering isn't transitive but identity is.\n- [[Counterfactual Theory of Causation]] (Causation and laws): because causation is often taken to be transitive, and causal dependence isn't.\n- [[Mereology]] (Mereology): because classical mereology takes parthood to be transitive.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "14 Sets, classes and infinity/Zeno.md": "---\ngroup: Sets, classes and infinity\nrole: philosopher\nsource: Beebee et al. 2011, entry \"Zeno\"\npages: pp. 268–269 (entry starts p. 268)\nstatus: unread\n---\n# Zeno\n**Page(s):** pp. 268–269 (entry starts p. 268)\n**Book's definition:** p. 268. Copy the third sentence, which says Zeno (of Elea) aimed to defend Parmenides' monism.\n**In one line:** Zeno of Elea, the ancient Greek whose paradoxes (such as the dichotomy) aimed to show that nothing moves, in defence of Parmenides' monism.\n**Role in [[00 – Sets, classes and infinity]]:** The source of the classic paradoxes of infinity and motion.\n**Explanation:** Don't confuse him with Zeno of Citium, founder of Stoicism. Zeno of Elea's work survives only second-hand, in Aristotle, Plato and Simplicius. He aimed to defend Parmenides' monism, the view that there is only one thing, with 'paradoxes of plurality'. More discussed are his paradoxes of motion, which aimed to show that nothing ever moves. In the *dichotomy*, to run 10 yards you must first run 5, before that 2½, then 1¼, and so on forever: infinitely many finite distances, which nobody can cover, so nothing moves. The others are Achilles and the tortoise, the arrow, and the stadium (often taken to show that space, if it exists, must be infinitely divisible).\n**Example:** The runner who must first cover half the distance, then half of that…\n**Connections:**\n- generates puzzles about [[Infinity]] and [[Supertask]]: because his paradoxes turn on completing infinitely many tasks.\n**Bridges to other groups:**\n- [[Simple]] (Mereology): because he defended monism, the view that there is just one thing (in the Simple entry, the universe as one giant simple).\n- [[Time]] (Time): because the philosophy of time has its roots in Zeno's puzzles about infinity.\n- [[Aristotle]] (Philosophers): because Aristotle preserves and discusses the paradoxes of motion.\n**Multiple meanings:** There are two Zenos: of Elea (this one) and of Citium (the Stoic).\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "15 Philosophers/00 – Philosophers.md": "---\ngroup: Philosophers\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Philosophers\n**What this group is:** the book's ten entries on individual philosophers. Use them to see who stands behind which debates.\n\n## The ten philosophers\n| Philosopher | Dates | Best known for (in this book) | Main groups |\n|---|---|---|---|\n| [[Aristotle]] | 384–322 BC | Immanent universals; substances as organisms; potential infinity | Particulars and universals; Sets |\n| [[Locke, John]] | 1632–1704 | Memory theory; nominal/real essence; primary/secondary qualities | Personal identity; Modality; Kinds of properties |\n| [[Berkeley, George]] | 1685–1753 | Idealism; critique of Locke's qualities | Realism and anti-realism |\n| [[Hume, David]] | 1711–76 | Empiricism; no necessary connections; bundle theory of the self | Causation and laws; Tools; Method |\n| [[Kant, Immanuel]] | 1724–1804 | Synthetic a priori; transcendental idealism | Tools; Method; Realism |\n| [[McTaggart, J. M. E.]] | 1866–1925 | The unreality of time; A- and B-facts | Time |\n| [[Quine, W. V.]] | 1908–2000 | Ontological commitment; against analyticity; nominalism | Ontology; Tools; Method |\n| [[Armstrong, David]] | b. 1926 | Universals; DTA laws; states of affairs; truthmakers | Particulars and universals; Causation; Truth |\n| [[Kripke, Saul]] | b. 1940 | Possible worlds semantics; necessary a posteriori; necessity of origin | Modality |\n| [[Lewis, David]] | 1941–2001 | Modal realism; counterfactual causation; Humean supervenience | Almost everywhere |\n\n## Key rivalries and lines of influence\n- **Hume vs Kant:** the fate of metaphysics after empiricism ([[Hume, David]] (p. 92), [[Kant, Immanuel]] (p. 112)).\n- **Lewis vs Armstrong:** Humean vs anti-Humean views of laws, causation and properties (see [[Causation and Laws]]).\n- **Quine → Lewis:** teacher and student; ontological commitment and classes (see [[Class]]).\n- **Locke → Berkeley → Hume:** the three British Empiricists (see [[Empiricism]]).\n- **McTaggart → the tense debate:** see [[Tensed and Tenseless Theories of Time]].\n\n## Bridges to other groups\n- **Causation and laws:** [[Humean Supervenience]] and [[Dretske-Tooley-Armstrong View of Laws]], because the Lewis–Armstrong divide organises the group.\n- **Modality:** [[Possible Worlds]], because of Kripke's and Lewis's legacy.\n- **Ontology:** [[Ontological Commitment]], because of Quine.\n- **Time:** [[Unreality of Time]], because of McTaggart.\n- **Realism and anti-realism:** [[Phenomenalism and Idealism]], because of Berkeley (and Kant's transcendental idealism).\n\n## Reading path (pages in the book)\n- In historical order: [[Aristotle]] (p. 11), [[Locke, John]] (p. 118), [[Berkeley, George]] (p. 16), [[Hume, David]] (p. 92), [[Kant, Immanuel]] (p. 112), [[McTaggart, J. M. E.]] (p. 119), [[Quine, W. V.]] (p. 204), [[Armstrong, David]] (p. 11), [[Kripke, Saul]] (p. 113), [[Lewis, David]] (p. 115)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "15 Philosophers/Aristotle.md": "---\ngroup: Philosophers\nrole: philosopher\nsource: Beebee et al. 2011, entry \"Aristotle\"\npages: p. 11\nstatus: unread\n---\n# Aristotle\n**Page(s):** p. 11\n**Book's definition:** p. 11. There's no definition: this is a biographical entry. Copy its first sentence.\n**In one line:** Ancient Greek philosopher (384–322 BC), Plato's student, whose metaphysics 'brings Plato's theory of Forms down to Earth'.\n**Role in [[00 – Philosophers]]:** The source of immanent realism about universals and of the notion of substance.\n**Explanation:** Plato put universals outside space and time; Aristotle held that a universal is wholly present in each object that instantiates it. Plato thought ultimate reality lay beyond the observable; Aristotle took the basic substances to be ordinary observable organisms: people, animals, plants. Western philosophy in the thirteenth to fifteenth centuries was dominated by the 'Scholastic tradition', roughly Aristotle's views mixed with Christianity (Aquinas being a key figure). The early modern period, beginning with Descartes, moved away from it.\n**Example:** Organisms (people, animals, plants) as the basic substances.\n**Connections:**\n- None named within this group.\n**Bridges to other groups:**\n- [[Platonism]], [[Universals]] and [[Immanent Realism About Universals]] (Particulars and universals): because he brought Plato's Forms down to Earth as immanent universals.\n- [[Substance]] and [[Form and Matter]] (Particulars and universals): because both notions originate with him.\n- [[Infinity]] and [[Zeno]] (Sets, classes and infinity): because of his potential/actual infinity distinction and his discussion of Zeno's paradoxes.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Barnes (1992)\n  Full references (from the book's bibliography):\n  - Barnes, J. (1992) *Aristotle*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "15 Philosophers/Armstrong, David.md": "---\ngroup: Philosophers\nrole: philosopher\nsource: Beebee et al. 2011, entry \"Armstrong, David\"\npages: pp. 11–12 (entry starts p. 11)\nstatus: unread\n---\n# Armstrong, David\n**Page(s):** pp. 11–12 (entry starts p. 11)\n**Book's definition:** p. 11. There's no definition: this is a biographical entry. Copy its first sentence.\n**In one line:** Australian metaphysician (born 1926) in the realist, naturalist tradition, who helped make metaphysics respectable again after the linguistic turn.\n**Role in [[00 – Philosophers]]:** The leading anti-Humean of the book: universals, laws as necessitation, states of affairs, truthmakers.\n**Explanation:** Armstrong spent most of his career at the University of Sydney, in a tradition that sees metaphysics as continuous with natural science. He is best known for defending immanent realism about universals and for his theory of laws as contingent relations between universals. He also pioneered Australian materialism about the mind: the concept of pain is the concept of a state apt to be caused by bodily damage and to cause avoidance behaviour, and brain states turn out to fit that profile. He holds that the basic constituents of reality are states of affairs, sees the truthmaker principle as the best way to cash out global realism, and in the 1980s advanced a combinatorial theory of modality, on which possibilities are recombinations of actual entities and useful fictions.\n**Example:** Pain as whatever state is apt to be caused by damage and to cause avoidance.\n**Connections:**\n- None named within this group.\n**Bridges to other groups:**\n- [[Immanent Realism About Universals]] and [[Universals]] (Particulars and universals): because he is their best-known modern defender.\n- [[Dretske-Tooley-Armstrong View of Laws]] (Causation and laws): because laws as relations between universals is his theory.\n- [[States of Affairs]] and [[Truthmakers]] (Truth): because of his states-of-affairs ontology and truthmaker theory.\n- [[Linguistic Turn]] and [[Canberra Plan]] (Method): because he helped end the linguistic turn, and his materialism fits the Canberra Plan.\n- [[Modality]] (Modality): because of his combinatorial theory of modality.\n- [[Realism and Anti-Realism (Global)]] (Realism and anti-realism): because his work is in the realist tradition.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Mumford (2007)\n  Full references (from the book's bibliography):\n  - Mumford, S. (2007) *David Armstrong*, Chesham: Acumen.\n**Beyond the book:** —\n**My notes:**\n", "15 Philosophers/Berkeley, George.md": "---\ngroup: Philosophers\nrole: philosopher\nsource: Beebee et al. 2011, entry \"Berkeley, George\"\npages: p. 16\nstatus: unread\n---\n# Berkeley, George\n**Page(s):** p. 16\n**Book's definition:** p. 16. There's no definition: this is a biographical entry. Copy its first sentence.\n**In one line:** Irish philosopher (1685–1753) and Bishop of Cloyne, the second of the three great British Empiricists, best known for idealism.\n**Role in [[00 – Philosophers]]:** The classic idealist.\n**Explanation:** Berkeley comes between Locke and Hume among the British Empiricists. His most famous works are *A Treatise Concerning the Principles of Human Knowledge* (1710) and *Three Dialogues between Hylas and Philonous* (1713). He is best known for defending idealism, for criticising Locke's distinction between primary and secondary qualities, and for his arguments for the existence of God. A famous US university campus is named after him.\n**Example:** 'To be is to be perceived' (Phenomenalism and Idealism entry).\n**Connections:**\n- comes between [[Locke, John]] and [[Hume, David]]: because he is the second of the three British Empiricists.\n**Bridges to other groups:**\n- [[Phenomenalism and Idealism]] and [[Scepticism]] (Realism and anti-realism): because he defended idealism, which he used against scepticism.\n- [[Primary and Secondary Qualities]] (Kinds of properties): because he criticised Locke's distinction.\n- [[Empiricism]] (Tools): because he is one of the classic empiricists.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Berkeley’s *Principles* and *Three Dialogues* are freely available online from various sources. ‘Translations’ of them into contemporary English can be found on Jonathan Bennett’s Early Modern Texts website (www.earlymoderntexts.com/f_berkeley.html)\n**Beyond the book:** —\n**My notes:**\n", "15 Philosophers/Hume, David.md": "---\ngroup: Philosophers\nrole: philosopher\nsource: Beebee et al. 2011, entry \"Hume, David\"\npages: pp. 92–93 (entry starts p. 92)\nstatus: unread\n---\n# Hume, David\n**Page(s):** pp. 92–93 (entry starts p. 92)\n**Book's definition:** p. 92. There's no definition: this is a biographical entry. Copy its first sentence.\n**In one line:** Scottish philosopher and historian (1711–76), the last and most hard-hitting of the British Empiricists, and the 'great denier of necessary connections'.\n**Role in [[00 – Philosophers]]:** The patron of the Humean side of the causation and laws debate, and an early critic of metaphysics.\n**Explanation:** His major works are *A Treatise of Human Nature* (1739–40), *An Enquiry concerning Human Understanding* (1748), *An Enquiry concerning the Principles of Morals* (1751) and *Dialogues concerning Natural Religion* (1779); in his lifetime he was better known for his bestselling *History of England*. Like Locke and Berkeley, he held that all ideas come from experience, but his empiricism was more hard-hitting. Locke thought we could know the external world because our impressions are caused by objects that resemble them; Hume denied we could have grounds for that, since we can't step outside our experience to check. Kant credited Hume's discussion of causation with waking him from his 'dogmatic slumber'. In the English-speaking world, positions on causation and laws are often divided into 'Humean' and 'anti-Humean', and Lewis named Humean supervenience after him.\n**Example:** Hume waking Kant from his 'dogmatic slumber'.\n**Connections:**\n- is the last of the empiricists after [[Locke, John]] and [[Berkeley, George]]: because the entry ranks him that way.\n- provoked [[Kant, Immanuel]]: because Kant's *Critique* responds to him.\n- inspired [[Lewis, David]]: because Lewis named Humean supervenience after him.\n**Bridges to other groups:**\n- [[Empiricism]] and [[Concept]] (Tools): because all ideas come from experience.\n- [[Scepticism]] (Realism and anti-realism): because he denied we have grounds for believing in resembling external objects.\n- [[Humeanism]], [[Humean Supervenience]], [[Natural Necessity]] and [[Regularity Theory of Causation]] (Causation and laws): because Humeanism denies natural necessity, and the regularity theory paraphrases his definition of cause.\n- [[Bundle Theory of the Self or Person]] (Personal identity): because he defended the strong bundle theory.\n- [[Metametaphysics]] (Method): because his 'bonfire' is an early form of metaphobia.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Hume’s major philosophical works are all freely available online from various sources. ‘Translations’ into contemporary English of some of Hume’s works (including the *Enquiries*, the *Dialogues* and the first three books of the *Treatise*) can be found on Jonathan Bennett’s Early Modern Texts website (www.earlymoderntexts.com/f_hume.html)\n**Beyond the book:** —\n**My notes:**\n", "15 Philosophers/Kant, Immanuel.md": "---\ngroup: Philosophers\nrole: philosopher\nsource: Beebee et al. 2011, entry \"Kant, Immanuel\"\npages: pp. 112–113 (entry starts p. 112)\nstatus: unread\n---\n# Kant, Immanuel\n**Page(s):** pp. 112–113 (entry starts p. 112)\n**Book's definition:** p. 112. There's no definition: this is a biographical entry. Copy its first sentence.\n**In one line:** German philosopher (1724–1804) of Königsberg, who tried to rescue metaphysics from Hume's attack and re-establish it as 'the Queen of all the sciences'.\n**Role in [[00 – Philosophers]]:** The great respondent to Hume. His solution leads close to global anti-realism.\n**Explanation:** Kant's two major works for metaphysics are the *Critique of Pure Reason* (1781), which he himself called dry, obscure and long-winded, and the lighter *Prolegomena to Any Future Metaphysics* (1783). His target was Hume, who held that all concepts derive from experience; necessary connection, for instance, comes from habit after seeing A regularly followed by B. Kant argued that the core concepts of metaphysics (unity or identity, substance, possibility, existence, causation) are not derived from experience in this way, so we can know principles of metaphysics a priori. The cost is that this knowledge concerns the world of possible experience. Kant is therefore a 'transcendental idealist' (not the same sense of 'idealism' as Berkeley's), and very close to being a global anti-realist by the book's definition.\n**Example:** Reviving metaphysics as 'the Queen of all the sciences'.\n**Connections:**\n- answers [[Hume, David]]: because Hume was his bête noire.\n**Bridges to other groups:**\n- [[A Priori - A Posteriori]], [[Analytic vs Synthetic Truths]] and [[Rationalism]] (Tools): because he holds that metaphysical principles are knowable a priori, and that synthetic a priori truths exist.\n- [[Metametaphysics]] (Method): because he asked how synthetic a priori metaphysics is possible.\n- [[Realism and Anti-Realism (Global)]] (Realism and anti-realism): because his view is very close to global anti-realism.\n- [[Existence]] (Ontology): because the 'existence is not a predicate' slogan traces to him (Existence entry).\n**Multiple meanings:** 'Transcendental idealism' is a different sense of 'idealism' from Berkeley's.\n**Further reading (book):** Scruton (2001)\n  Full references (from the book's bibliography):\n  - Scruton, R. (2001) *Kant: A Very Short Introduction*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "15 Philosophers/Kripke, Saul.md": "---\ngroup: Philosophers\nrole: philosopher\nsource: Beebee et al. 2011, entry \"Kripke, Saul\"\npages: pp. 113–114 (entry starts p. 113)\nstatus: unread\n---\n# Kripke, Saul\n**Page(s):** pp. 113–114 (entry starts p. 113)\n**Book's definition:** p. 113. There's no definition: this is a biographical entry. Copy its first sentence.\n**In one line:** Philosopher and logician (born 1940) who laid the foundations of possible worlds semantics and wrote *Naming and Necessity*.\n**Role in [[00 – Philosophers]]:** The main source of modern modal metaphysics, alongside Lewis.\n**Explanation:** Kripke laid the foundations of 'possible worlds semantics' for modal logic, on which a proposition is necessary if it is true in all possible worlds and possible if it is true in at least one. Thanks to Kripke and Lewis, it is now hard to find metaphysics that doesn't use possible-worlds talk; Kripke started publishing on modal logic as a teenager. *Naming and Necessity* (1980), based on Princeton lectures from the early 1970s, became a classic of metaphysics and philosophy of language. Its two most influential metaphysical theses are the necessity of origin and the existence of necessary a posteriori truths.\n**Example:** Possible worlds semantics: necessary = true in all worlds.\n**Connections:**\n- shares credit with [[Lewis, David]]: because both made possible-worlds talk ubiquitous.\n**Bridges to other groups:**\n- [[Possible Worlds]] and [[Modality]] (Modality): because he founded possible worlds semantics.\n- [[Necessity of Origin Thesis]] and [[Necessary A Posteriori Truths]] (Modality): because both theses are from *Naming and Necessity*.\n- [[Identity]] (Identity): because he claims all identities are necessary.\n- [[Supervenience]] (Tools): because of his metaphor of God fixing the mental by fixing the physical.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Ahmed (2007)\n  Full references (from the book's bibliography):\n  - Ahmed, A. (2007) *Saul Kripke*, London: Continuum.\n**Beyond the book:** —\n**My notes:**\n", "15 Philosophers/Lewis, David.md": "---\ngroup: Philosophers\nrole: philosopher\nsource: Beebee et al. 2011, entry \"Lewis, David\"\npages: pp. 115–116 (entry starts p. 115)\nstatus: unread\n---\n# Lewis, David\n**Page(s):** pp. 115–116 (entry starts p. 115)\n**Book's definition:** p. 115. There's no definition: this is a biographical entry. Copy its first sentence.\n**In one line:** American philosopher (1941–2001), one of the most influential analytic philosophers of the twentieth century and the leading Humean of this book.\n**Role in [[00 – Philosophers]]:** The most frequently cited figure in the book: modal realism, the counterfactual theory, Humean supervenience.\n**Explanation:** Lewis studied chemistry until Gilbert Ryle's lectures on philosophy of mind switched him to philosophy. He took his PhD at Harvard under Quine and spent most of his career at Princeton, with frequent long visits to Australia, whose football and bush songs he loved. In metaphysics he is most famous for possible worlds and his own genuine modal realism. He invented the counterfactual theory of causation and was partly responsible for the Ramsey–Lewis view of laws. He also contributed to debates on perdurantism, time travel, compatibilism, universals, nominalism, truthmakers, classes and personal identity. His metaphysics was mainly driven by showing that Humean supervenience is true, or at least tenable.\n**Example:** Singing Australian bush songs at conferences.\n**Connections:**\n- studied under [[Quine, W. V.]]: because Quine supervised his PhD.\n- shares the possible-worlds legacy with [[Kripke, Saul]]: because the Kripke entry credits both.\n**Bridges to other groups:**\n- [[Modal Realism]] and [[Possible Worlds]] (Modality): because of his genuine modal realism.\n- [[Counterfactual Theory of Causation]], [[Ramsey–Lewis View of Laws]] and [[Humean Supervenience]] (Causation and laws): because he invented or co-developed these and aimed to defend Humean supervenience.\n- [[Perdurantism]] and [[Time Travel]] (Time): because he contributed to both debates.\n- [[Universals]] and [[Class Nominalism]] (Particulars and universals): because of his work on universals and nominalism.\n- [[Common Sense]] (Method): because he defended mild conservatism about common sense.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Hall (2010); Nolan (2005)\n  Full references (from the book's bibliography):\n  - Hall, E. J. (2010) ‘David Lewis’s metaphysics’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Spring 2010 edn. Online. Available at: http://plato.stanford.edu/archives/spr2010/entries/lewis-metaphysics.\n  - Nolan, D. (2005) *David Lewis*, Chesham: Acumen.\n**Beyond the book:** —\n**My notes:**\n", "15 Philosophers/Locke, John.md": "---\ngroup: Philosophers\nrole: philosopher\nsource: Beebee et al. 2011, entry \"Locke, John\"\npages: pp. 118–119 (entry starts p. 118)\nstatus: unread\n---\n# Locke, John\n**Page(s):** pp. 118–119 (entry starts p. 118)\n**Book's definition:** p. 118. There's no definition: this is a biographical entry. Copy its first sentence.\n**In one line:** English philosopher (1632–1704), the first of the three great British Empiricists, whose *Essay* shaped debates on personal identity, essence, qualities and universals.\n**Role in [[00 – Philosophers]]:** A founding figure for several of the book's debates.\n**Explanation:** Locke's *An Essay concerning Human Understanding* (1690) aimed to uncover the sources and extent of human knowledge, but it is also rich in metaphysics. He was influential on personal identity, essence, primary and secondary qualities, and universals. He was a friend of Newton and Boyle; all three were early members of the Royal Society, and Locke helped spread what was then called 'natural' or 'experimental' philosophy. His political philosophy (*Two Treatises of Government*) shaped the US Declaration of Independence, and Jefferson called him one of the three greatest men who ever lived.\n**Example:** The cobbler and the prince (Thought Experiment entry).\n**Connections:**\n- is followed by [[Berkeley, George]] and [[Hume, David]]: because he is the first of the three British Empiricists.\n**Bridges to other groups:**\n- [[Memory Theory]] and [[Personal Identity]] (Personal identity): because the memory theory is rooted in his work.\n- [[Essence]] (Modality): because of his nominal vs real essence.\n- [[Primary and Secondary Qualities]] (Kinds of properties): because he drew the classic distinction.\n- [[Universals]] and [[Platonism]] (Particulars and universals): because of his influence on universals, and his theory of abstraction.\n- [[Experimental Philosophy]] and [[Thought Experiment]] (Method): because of the Royal Society, and the cobbler-and-prince case.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Locke’s major philosophical works are all freely available online from various sources. A ‘translation’ into contemporary English of Locke’s *Essay* can be found on Jonathan Bennett’s Early Modern Texts website (www.earlymod-erntexts.com/f_locke.html)\n**Beyond the book:** —\n**My notes:**\n", "15 Philosophers/McTaggart, J. M. E..md": "---\ngroup: Philosophers\nrole: philosopher\nsource: Beebee et al. 2011, entry \"McTaggart, J. M. E.\"\npages: pp. 119–120 (entry starts p. 119)\nstatus: unread\n---\n# McTaggart, J. M. E.\n**Page(s):** pp. 119–120 (entry starts p. 119)\n**Book's definition:** p. 119. There's no definition: this is a biographical entry. Copy its first sentence.\n**In one line:** Cambridge idealist (1866–1925), famous for arguing that time does not exist.\n**Role in [[00 – Philosophers]]:** The author of the argument that launched the modern philosophy of time.\n**Explanation:** McTaggart took both his forenames and his surname from a great-uncle as a condition of an inheritance, hence the two 'McTaggart's. He spent most of his life at Trinity College, Cambridge, hosting philosophical breakfasts (without food) attended by Moore and Russell, though he later helped get Russell dismissed from Trinity over his anti-war activities. He was an idealist (more of a phenomenalist on the book's definitions), heavily influenced by Hegel, and a committed atheist who believed that all that really exists are immortal, reincarnating souls bound to one another by love. His argument for the unreality of time is what most influenced analytic philosophy: responses to it drove the debate over tensed and tenseless theories.\n**Example:** Philosophical breakfasts with no food.\n**Connections:**\n- None named within this group.\n**Bridges to other groups:**\n- [[Unreality of Time]], [[Tensed and Tenseless Theories of Time]], [[Moving Spotlight Theory of Time]] and [[Time]] (Time): because his argument shaped these debates and seems aimed at the moving spotlight.\n- [[Phenomenalism and Idealism]] (Realism and anti-realism): because he was an idealist (more of a phenomenalist, on the book's definitions).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Geach (1979)\n  Full references (from the book's bibliography):\n  - Geach, P. (1979) *Truth, Love and Immortality: An Introduction to McTaggart’s Philosophy*, London: Hutchinson.\n**Beyond the book:** —\n**My notes:**\n", "15 Philosophers/Quine, W. V..md": "---\ngroup: Philosophers\nrole: philosopher\nsource: Beebee et al. 2011, entry \"Quine, W. V.\"\npages: pp. 204–205 (entry starts p. 204)\nstatus: unread\n---\n# Quine, W. V.\n**Page(s):** pp. 204–205 (entry starts p. 204)\n**Book's definition:** p. 204. There's no definition: this is a biographical entry. Copy its first sentence.\n**In one line:** American philosopher (1908–2000) who kick-started contemporary ontology with 'On what there is', and argued against the analytic/synthetic distinction.\n**Role in [[00 – Philosophers]]:** The founder of the dominant method of contemporary ontology.\n**Explanation:** Quine chose philosophy after a fellow poker player pointed him to Russell's philosophy of mathematics, and did his PhD at Harvard on *Principia Mathematica*. He served in the Navy in World War II, then became a professor at Harvard; he visited 118 countries and played banjo in jazz groups. In 'On what there is' (1948) he set out his theory of ontological commitment: we are committed to what the sentences we hold true quantify over. As a naturalist, he held that we should read our ontology off our best scientific theory. He argued for austere nominalism, later settling on a form of class nominalism. He is also famous for denying the analytic/synthetic distinction, and for scepticism about de re modality, which he thought as bad as essentialism.\n**Example:** Playing banjo in Dixieland jazz groups.\n**Connections:**\n- supervised [[Lewis, David]]: because Lewis did his PhD under Quine (Lewis entry).\n**Bridges to other groups:**\n- [[Ontological Commitment]] and [[Ontology]] (Ontology): because his criterion kick-started contemporary ontology.\n- [[Austere Nominalism]] and [[Class Nominalism]] (Particulars and universals): because he defended the first, then the second.\n- [[Analytic vs Synthetic Truths]] (Tools): because he denied the distinction.\n- [[Modality]] and [[Essence]] (Modality): because of his scepticism about de re modality and essentialism.\n- [[Metametaphysics]] (Method): because his work drove metaphysics' comeback.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Orenstein (2002)\n  Full references (from the book's bibliography):\n  - Orenstein, A. (2002) *W. V. Quine*, Chesham: Acumen.\n**Beyond the book:** —\n**My notes:**\n", "Journal/How to write here.md": "---\nrole: journal\nstatus: unread\n---\n# How to write here\nThis folder is for **your own writing**: reading notes, arguments, questions and drafts for your research.\n\n- Press the **journal** button (the moon icon) to start today's entry.\n- Type `[[` to link to any of the 247 terms, for example [[Free Will]] or [[Possible Worlds]]. The link will then show up in that term's **backlinks**.\n- Switch between **Read** and **Edit** with the button at the top of the note, or press `Ctrl/Cmd + E`.\n- Open the **graph** to see how your notes connect to the map of metaphysics.\n\nBack to [[00 – START HERE]]\n"};</script>
<script>
'use strict';
/* METAPHYSICS — an Obsidian-style vault for metaphysics. No dependencies. */

/* ---------- pure helpers (testable without a DOM) ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const escAttr = s => esc(s).replace(/"/g, '&quot;');
const titleOf = p => p.split('/').pop().replace(/\.md$/i, '');
const folderOf = p => (p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '');

function parseFrontmatter(text) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(text);
  if (!m) return { props: {}, body: text, raw: '' };
  const props = {};
  m[1].split(/\r?\n/).forEach(line => {
    const i = line.indexOf(':');
    if (i > 0) props[line.slice(0, i).trim()] = line.slice(i + 1).trim().replace(/^"(.*)"$/, '$1');
  });
  return { props, body: text.slice(m[0].length), raw: m[0] };
}

function setProp(text, key, value) {
  const fm = parseFrontmatter(text);
  if (!fm.raw) return `---\n${key}: ${value}\n---\n` + text;
  const lines = fm.raw.replace(/\r?\n?$/, '').split(/\r?\n/);
  const idx = lines.findIndex(l => l.startsWith(key + ':'));
  if (idx >= 0) lines[idx] = `${key}: ${value}`;
  else lines.splice(lines.length - 1, 0, `${key}: ${value}`);
  return lines.join('\n') + '\n' + fm.body;
}

function linkTarget(inner) {
  return inner.split(/\\?\|/)[0].split('#')[0].trim();
}
function extractLinks(text) {
  const out = [];
  const re = /\[\[([^\]\n]+?)\]\]/g;
  let m;
  while ((m = re.exec(text))) out.push(linkTarget(m[1]));
  return out;
}

function slug(s) { return s.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^\wÀ-￿]+/g, '-').replace(/^-|-$/g, ''); }

/* inline markdown → html; resolve(title) returns true if note exists */
function inline(src, resolve) {
  const stash = [];
  const put = html => { stash.push(html); return `\u0000${stash.length - 1}\u0000`; };
  let s = src.replace(/`([^`]+)`/g, (_, c) => put(`<code>${esc(c)}</code>`));
  s = s.replace(/\[\[([^\]\n]+?)\]\]/g, (_, inner) => {
    const parts = inner.split(/\\?\|/);
    const target = parts[0].split('#')[0].trim();
    const label = (parts[1] || parts[0]).trim();
    const ok = resolve ? resolve(target) : true;
    return put(`<a class="wl${ok ? '' : ' unresolved'}" data-target="${escAttr(target)}">${esc(label)}</a>`);
  });
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, t, u) => put(`<a href="${escAttr(u)}" target="_blank" rel="noopener">${esc(t)}</a>`));
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_, pre, u) => pre + put(`<a href="${escAttr(u)}" target="_blank" rel="noopener">${esc(u)}</a>`));
  s = esc(s);
  s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g, '$1<em>$2</em>')
       .replace(/(^|[^\w])_([^_\n]+?)_(?!\w)/g, '$1<em>$2</em>')
       .replace(/~~([^~]+)~~/g, '<del>$1</del>')
       .replace(/==([^=]+)==/g, '<mark>$1</mark>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => stash[+i]);
}

function splitRow(line) {
  let s = line.trim().replace(/^\|/, '').replace(/\|$/, '');
  const cells = []; let cur = '';
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '\\' && s[i + 1] === '|') { cur += '\\|'; i++; continue; }
    if (s[i] === '|') { cells.push(cur.trim()); cur = ''; continue; }
    cur += s[i];
  }
  cells.push(cur.trim());
  return cells;
}

/* block markdown → {html, headings} */
function renderMarkdown(text, resolve) {
  const { body } = parseFrontmatter(text);
  const lines = body.replace(/\r/g, '').split('\n');
  const out = [], headings = [];
  let i = 0, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${para.map(l => inline(l, resolve)).join('<br>')}</p>`); para = []; } };
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flush(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }
    if (!line.trim()) { flush(); i++; continue; }
    let m;
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
      flush(); const lvl = m[1].length; const id = 'h-' + slug(m[2]) + '-' + headings.length;
      headings.push({ lvl, text: m[2].replace(/\*\*/g, ''), id });
      out.push(`<h${lvl} id="${id}">${inline(m[2], resolve)}</h${lvl}>`); i++; continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { flush(); out.push('<hr>'); i++; continue; }
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      flush();
      const head = splitRow(line); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(splitRow(lines[i++]));
      const cell = c => inline(c.replace(/\\\|/g, '\\|'), resolve);
      out.push(`<table><thead><tr>${head.map(h => `<th>${cell(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    if (/^>\s?/.test(line)) {
      flush(); const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      out.push(`<blockquote>${renderMarkdown(buf.join('\n'), resolve).html}</blockquote>`); continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      flush();
      const stack = []; let html = '';
      while (i < lines.length && (m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]))) {
        const ind = m[1].replace(/\t/g, '  ').length; const tag = /\d/.test(m[2]) ? 'ol' : 'ul';
        let body = m[3];
        const task = /^\[([ xX])\]\s+(.*)$/.exec(body);

    collapseAll() { folders().forEach(f => { if (f) ui.closed[f] = true; }); saveUI(); renderExplorer(); },
    palette() {
      const list = [['Open quick switcher', 'switcher'], ['Search all notes', 'search'], ['Open graph view', 'graph'], ['New note', 'newNote'], ["Today's journal entry", 'journal'], ['Toggle read / edit', 'toggleMode'], ['Change status (unread → reading → understood)', 'cycleStatus'], ['Rename current note', 'rename'], ['Delete current note', 'delete'], ['Open random note', 'random'], ['Export vault as .zip', 'exportZip'], ['Import .md files', 'importFiles'], ['Toggle file sidebar', 'toggleLeft'], ['Toggle links panel', 'toggleRight'], ['Collapse all folders', 'collapseAll'], ['Settings', 'settings']];
      chooser('Type a command…', list.map(([label, cmd]) => ({ label, hint: '', cmd })), it => it && commands[it.cmd]());
    }
  };

  /* ---------- hover preview ---------- */
  let pvT, pv;
  document.addEventListener('mouseover', e => {
    const a = e.target.closest && e.target.closest('a.wl'); if (!a || matchMedia('(hover: none)').matches) return;
    clearTimeout(pvT);
    pvT = setTimeout(() => {
      const p = byTitle.get(a.dataset.target.toLowerCase()); if (!p) return;
      pv && pv.remove(); pv = document.createElement('div'); pv.id = 'preview'; pv.className = 'glass';
      pv.innerHTML = `<article class="doc">${renderMarkdown(notes[p].slice(0, 2500), resolve).html}</article>`;
      document.body.appendChild(pv);
      const r = a.getBoundingClientRect(); pv.style.left = Math.min(r.left, innerWidth - pv.offsetWidth - 12) + 'px';
      pv.style.top = (r.bottom + 8 + pv.offsetHeight > innerHeight ? r.top - pv.offsetHeight - 8 : r.bottom + 8) + 'px';
    }, 450);
  });
  document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('a.wl')) { clearTimeout(pvT); pv && pv.remove(); pv = null; } });

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-cmd],[data-open],[data-toggle],[data-tab],[data-close],[data-create],[data-head],a.wl,[data-pick]');
    if (!t) { if (innerWidth <= 900 && !e.target.closest('.side,#ribbon')) app.classList.remove('show-left', 'show-right'); return; }
    if (t.dataset.close != null) { e.stopPropagation(); return closeTab(+t.dataset.close); }
    if (t.dataset.pick != null) return pickSuggest($('#editor'), +t.dataset.pick);
    if (t.dataset.cmd) return commands[t.dataset.cmd] && commands[t.dataset.cmd]();
    if (t.dataset.open) return openNote(t.dataset.open, { newTab: e.ctrlKey || e.metaKey });
    if (t.dataset.tab != null) { ui.active = +t.dataset.tab; saveUI(); return render(); }
    if (t.dataset.toggle != null) { const f = t.dataset.toggle; ui.closed[f] = !(ui.closed[f] !== false); saveUI(); return renderExplorer(); }
    if (t.dataset.create) return createNote(t.dataset.create, folderOf(ui.tabs[ui.active]) || 'Journal');
    if (t.dataset.head) { const h = document.getElementById(t.dataset.head); if (h) h.scrollIntoView({ behavior: 'smooth' }); else { ui.mode[ui.tabs[ui.active]] = 'read'; renderView(); setTimeout(() => { const h2 = document.getElementById(t.dataset.head); h2 && h2.scrollIntoView(); }, 30); } return; }
    if (t.matches('a.wl')) {
      e.preventDefault(); pv && pv.remove();
      const p = byTitle.get(t.dataset.target.toLowerCase());
      if (p) openNote(p, { newTab: e.ctrlKey || e.metaKey });
      else sure(`Create a new note "${t.dataset.target}"?`, 'Create').then(ok => ok && createNote(t.dataset.target, folderOf(ui.tabs[ui.active]) || 'Journal'));
    }
  });
  $('#filter').addEventListener('input', e => { if (leftMode === 'search') renderSearch(e.target.value); else renderExplorer(); });
  $('#tabs').addEventListener('auxclick', e => { const t = e.target.closest('[data-tab]'); if (t && e.button === 1) closeTab(+t.dataset.tab); });
  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey; if (!mod) { if (e.key === 'Escape') { document.querySelectorAll('.overlay').forEach(o => o.remove()); } return; }
    const k = e.key.toLowerCase();
    const map = { o: 'switcher', p: 'palette', e: 'toggleMode', g: 'graph', n: 'newNote', j: 'journal' };
    if (k === 'f' && e.shiftKey) { e.preventDefault(); return commands.search(); }
    if (k === 's') { e.preventDefault(); save(true); return toast('Saved'); }
    if (map[k]) { e.preventDefault(); commands[map[k]](); }
  });
  window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(drawBackground, 150); });
  window.addEventListener('beforeunload', () => save(true));

  if (ui.hideLeft && innerWidth > 900) app.classList.add('hide-left');
  if (ui.hideRight && innerWidth > 900) app.classList.add('hide-right');
  if (!ui.tabs.length) { ui.tabs = ['00 – START HERE.md']; ui.active = 0; }
  if (ui.active == null || ui.active >= ui.tabs.length) ui.active = 0;
  drawBackground();
  render();
})();

</script>
</body>
</html>
