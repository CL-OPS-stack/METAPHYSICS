gianism\n**Page(s):** p. 120\n**Book's definition:** p. 120. The whole entry is one sentence: copy it.\n**In one line:** The view that there are some things that do not exist, and some that don't even subsist.\n**Role in [[00 – Ontology and existence]]:** The main position that accepts non-existent objects. The book discusses it fully under Non-Existent Objects.\n**Explanation:** This entry is a single sentence. The Non-Existent Objects entry (pp. 147–148) explains that the view is named after Alexius Meinong, who held that there are things of which it is not true that they exist: fictional objects, merely intentional objects and impossible objects like round squares. It also explains how Russell's theory of descriptions and Quine's 'On what there is' turned most philosophers against it.\n**Example:** Round squares, Sherlock Holmes, the monster under the bed (Non-Existent Objects entry).\n**Connections:**\n- is explained under [[Non-Existent Objects]]: because this entry sends you there.\n- goes beyond [[Subsistence]]: because Meinongians say some things neither exist nor subsist.\n**Bridges to other groups:**\n- [[Quine, W. V.]] (Philosophers): because Quine's 'On what there is' (1948) targeted Meinong, under the pseudonym 'Wyman' (Non-Existent Objects entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/Non-Existent Objects.md": "---\ngroup: Ontology and existence\nrole: position\nsource: Beebee et al. 2011, entry \"Non-Existent Objects\"\npages: pp. 147–148 (entry starts p. 147)\nstatus: unread\n---\n# Non-Existent Objects\n**Page(s):** pp. 147–148 (entry starts p. 147)\n**Book's definition:** p. 147, the opening sentence of the entry.\n**In one line:** Objects that don't exist: either things that only subsist (Russell's early view of abstracta) or things with no being at all (Meinongianism).\n**Role in [[00 – Ontology and existence]]:** The rival to orthodox ontology's claim that everything there is exists, and the backdrop to Russell's and Quine's founding arguments.\n**Explanation:** The idea comes up in two contexts. (1) Subsistence: Russell held that abstract things like universals and numbers don't exist but have some sort of being, so 'exist' is reserved for concrete things. (2) Until the twentieth century, many thought some things have no being at all: fictional objects (Santa Claus), merely intentional objects (the monster a child fears) and impossible objects (round squares). This is Meinongianism. Priest (2005) holds a variant: some things are non-existent, but *there are* no such things. Russell, initially a Meinongian, rejected contradictory objects and offered the theory of descriptions ('On denoting', 1905): 'the King of France does not exist' just says that nothing satisfies the description. Quine (1948) added that what there is is what our best theories quantify over, so everything there is exists. Since then, contemporary metaphysics has mostly ignored non-existent objects.\n**Example:** 'The King of France does not exist', analysed by Russell's theory of descriptions.\n**Connections:**\n- is the view of [[Meinongianism]]: because Meinong held that there are things that do not exist.\n- includes things that have [[Subsistence]] or [[Being]]: because the first context is being without existence.\n- contradicts the orthodox view of [[Existence]]: because orthodoxy says everything there is exists.\n- was undermined by [[Ontological Commitment]]: because Quine's criterion ties what there is to what exists.\n**Bridges to other groups:**\n- [[Possibilia]] (Modality): because some philosophers count possibilia among non-existent objects (Possibilia entry).\n- [[Universals]] (Particulars and universals): because Russell held that universals subsist rather than exist.\n- [[Quine, W. V.]] (Philosophers): because 'On what there is' was the next blow against Meinongianism.\n**Multiple meanings:** Yes: (1) subsisting but not existing (Russell); (2) having no being at all (Meinong). Priest's version differs again.\n**Further reading (book):** Priest, G. (2009) 'Not to be', in R. Le Poidevin et al. (eds), *The Routledge Companion to Metaphysics*, London: Routledge, pp. 234–45. Reicher, M. (2008) 'Nonexistent objects', SEP, Fall 2008 edn. Also cited: Russell, B. (1905) 'On denoting', *Mind*, 14: 479–93.\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/Numbers.md": "---\ngroup: Ontology and existence\nrole: case\nsource: Beebee et al. 2011, entry \"Numbers\"\npages: pp. 149–150 (entry starts p. 149)\nstatus: unread\n---\n# Numbers\n**Page(s):** pp. 149–150 (entry starts p. 149)\n**Book's definition:** p. 149. There's no definition of 'number'; copy the puzzle stated in paragraph 1 (the primes example and the question that ends the paragraph).\n**In one line:** The puzzle: 'there are at least five primes bigger than 2' is true and knowable a priori, and it seems to say numbers exist. So what could numbers be?\n**Role in [[00 – Ontology and existence]]:** The leading test case for whether abstract objects exist. Platonism, formalism and fictionalism are the main answers.\n**Explanation:** **Platonism** (more popular with mathematicians than philosophers) says numbers are a special kind of object: eternal, causally cut off from concrete things, and necessary existents that exist in all possible worlds, which explains why mathematical truths are necessary. Two worries. How could we know about such objects? Gödel's 'mathematical intuition' seems implausible. And how do facts about a disconnected platonic realm apply to oranges and people? **Formalism** says mathematical truth is just derivability from axioms that aren't *about* anything, so the question of what numbers are doesn't arise. **Fictionalism** says mathematical claims really are existence claims, but true only within the 'fiction' of mathematics, like Holmes's address.\n**Example:** You can't share thirteen whole oranges equally among six people. How does a fact about platonic objects explain that?\n**Connections:**\n- is the main target of [[Fictionalism]]: because fictionalism about numbers is a leading option.\n- is a question about [[Existence]]: because the claim asserts that there are numbers.\n- is the standard case in [[Abstract vs Concrete]]: because numbers are typical abstract objects.\n- is a central question of [[Ontology]]: because ontologists ask whether 'there is a prime between 5 and 11' means the number 7 exists.\n**Bridges to other groups:**\n- [[Platonism]] (Particulars and universals): because platonism is the first answer the entry considers.\n- [[A Priori - A Posteriori]] (Tools): because the puzzle is how we can know a priori that numbers exist.\n- [[Necessity]] and [[Possible Worlds]] (Modality): because platonists take numbers to exist necessarily, in every possible world.\n**Multiple meanings:** None noted. The entry names three positions: platonism, formalism and fictionalism.\n**Further reading (book):** Horsten, L. (2008) 'Philosophy of mathematics', SEP, Fall 2008 edn.\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/Ontological Commitment.md": "---\ngroup: Ontology and existence\nrole: tool\nsource: Beebee et al. 2011, entry \"Ontological Commitment\"\npages: pp. 151–152 (entry starts p. 151)\nstatus: unread\n---\n# Ontological Commitment\n**Page(s):** pp. 151–152 (entry starts p. 151)\n**Book's definition:** p. 151, the opening sentence of the entry.\n**In one line:** A sentence or theory is ontologically committed to certain things if, were it true, those things would exist.\n**Role in [[00 – Ontology and existence]]:** The central tool of ontology: how we read off from a theory what it says exists.\n**Explanation:** 'Jack went to the cinema' seems committed to Jack and a cinema. 'A leprechaun mugged me' is committed to leprechauns. Theories have commitments too: Becher's phlogiston theory is committed to phlogiston. Commitment isn't existence. Things exist only if the committing sentence or theory is also *true*, and phlogiston theory is false. Commitments are themselves contested: does 'the average family has 2.7 children' commit us to an average family? Do event-sentences commit us to events, or 'being red' to universals? The most common criterion is **Quine's**: translate a theory into first-order logic, and whatever it quantifies over exists according to that theory. His slogan is 'to be is to be the value of a bound variable', and we should believe in what our best science is committed to. Alternatives: Strawson (we are committed to whatever is a subject of our sentences) and Armstrong (only to the truthmakers of our sentences).\n**Example:** Phlogiston theory is committed to phlogiston, but since the theory is false, there is no such stuff.\n**Connections:**\n- [[Criterion of Ontological Commitment]]: a pointer entry that sends you here.\n- is avoided by [[Paraphrase]]: because a paraphrase that doesn't quantify over Xs avoids commitment to Xs.\n- is tested by [[Holes]]: because the entry lists holes among disputed commitments.\n- fixes the content of an [[Ontology]]: because 'my ontology' just means what I am committed to.\n- supports a view of [[Existence]]: because Quine's single quantifier suggests a single kind of existence.\n**Bridges to other groups:**\n- [[Quine, W. V.]] (Philosophers): because his is the most common criterion.\n- [[Truthmakers]] (Truth): because Armstrong holds we are committed only to the truthmakers of our sentences.\n- [[Armstrong, David]] (Philosophers): because of his truthmaker alternative.\n- [[Event]] (Causation and laws): because whether event-talk commits us to events is disputed.\n- [[Universals]] (Particulars and universals): because whether 'being red' commits us to universals is disputed.\n- [[Nihilism]] (Mereology): because a nihilist even questions whether talk of people and objects commits us to them.\n**Multiple meanings:** Yes. There are competing criteria: Quine's (what we quantify over), Strawson's (subjects of sentences) and Armstrong's (truthmakers).\n**Further reading (book):** Macdonald, C. (2005) *Varieties of Things*, Oxford: Blackwell, Chapter 1. Quine, W. V. (1948) 'On what there is', *Review of Metaphysics*, 2: 21–38.\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/Ontology.md": "---\ngroup: Ontology and existence\nrole: concept\nsource: Beebee et al. 2011, entry \"Ontology\"\npages: entry starts p. 152\nstatus: unread\n---\n# Ontology\n**Page(s):** entry starts p. 152\n**Book's definition:** p. 152. Copy the opening sentence (two senses), then the first sentence of paragraph 2's second sense, where ontology is the study of what things exist.\n**In one line:** Two senses: (1) the entities a person or theory is committed to ('my ontology'); (2) the part of metaphysics that studies what *kinds* of things exist.\n**Role in [[00 – Ontology and existence]]:** The name of this group's subject, and the entry that maps its questions.\n**Explanation:** Ontologists don't make roll-calls of things ('my spectacles, the Eiffel Tower…'). They ask about broad categories: concrete objects, and what sorts there are (temporal parts? holes?); events, states of affairs, possible worlds; abstract things like numbers, platonic universals and classes. They also ask what fills a category: granting universals, is there one for redness? Granting facts, are there negative facts? (In computer science, 'ontology' means something else.) Not all ontologists think these are open questions. Some say it is obvious and trivial that all these things exist (Thomasson 2008), and whether the questions are substantive is the current metametaphysics debate. Others say ontology is really about what is *fundamental* and what depends on it (Schaffer 2009).\n**Example:** Agreeing that there are pandas, but asking whether the property *being a panda* exists.\n**Connections:**\n- has its content fixed by [[Ontological Commitment]]: because 'my ontology' means what I am committed to.\n- studies [[Existence]]: because ontology is concerned with what things exist.\n- asks about [[Holes]], [[Numbers]] and [[Abstract vs Concrete]]: because these are among the entry's example questions.\n**Bridges to other groups:**\n- [[Metametaphysics]] (Method): because whether ontology's questions are open, or even sensible, is the current metametaphysics debate.\n- [[Temporal Parts]] (Time): because whether there are temporal parts is one of ontology's questions about concrete things.\n- [[States of Affairs]] and [[Negative Facts]] (Truth): because ontology asks whether such things exist.\n- [[Bradley's Regress]] (Particulars and universals): because it bears on whether states of affairs are more fundamental than particulars and universals.\n- [[Categorical and Dispositional Properties]] (Kinds of properties): because fundamentality questions include whether categorical properties are more basic.\n- [[Possible Worlds]] (Modality): because whether there are possible worlds is an ontological question.\n**Multiple meanings:** Yes: 'an ontology' (a set of commitments) vs 'ontology' (the field). Also beware the computer-science sense.\n**Further reading (book):** The entry says many entries in the book are relevant. For how ontologists categorise what exists: Thomasson, A. (2009) 'Categories', SEP, Spring 2009 edn.\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/Paraphrase.md": "---\ngroup: Ontology and existence\nrole: tool\nsource: Beebee et al. 2011, entry \"Paraphrase\"\npages: pp. 155–156 (entry starts p. 155)\nstatus: unread\n---\n# Paraphrase\n**Page(s):** pp. 155–156 (entry starts p. 155)\n**Book's definition:** p. 155, paragraph 1. Copy the sentence beginning \"A paraphrase is, very roughly…\".\n**In one line:** A sentence that is 'just as good as' an original but doesn't quantify over the worrying entity. It is used to avoid ontological commitment.\n**Role in [[00 – Ontology and existence]]:** The main anti-realist technique in ontology.\n**Explanation:** Sentences like '7 is a prime number', 'blue is my favourite colour' and 'the average family has 2.7 children' seem to commit us to numbers, universals and an average family with 70 per cent of a child. Anti-realists offer paraphrases instead: a fictionalist one for numbers, the austere nominalist's for universals, and 'the number of children divided by the number of families is 2.7' for the family. That last one still commits us to numbers. It is unclear exactly how paraphrase helps. Must it mean the same as the original? Is the original still true (van Inwagen 1990), or false but worth asserting (Merricks 2001)? The general idea stands: a paraphrase that avoids quantifying over Xs avoids commitment to Xs.\n**Example:** 'The average family has 2.7 children' becomes 'the number of children divided by the number of families equals 2.7'.\n**Connections:**\n- avoids [[Ontological Commitment]]: because the paraphrase doesn't quantify over the worrying entity.\n- is one form of [[Fictionalism]]: because a fictionalist sentence can serve as a paraphrase.\n- is applied to [[Numbers]] and [[Holes]]: because both entries use paraphrase strategies ('singly perforated').\n**Bridges to other groups:**\n- [[Austere Nominalism]] and [[Universals]] (Particulars and universals): because austere nominalists rely on paraphrase to avoid universals.\n- [[Anti-Realism]] (Realism and anti-realism): because paraphrase is the anti-realist's way to avoid commitment.\n- [[Conceptual Analysis]] (Method): because the entry points there for how paraphrase relates to analysis.\n- [[Primitive]] (Tools): because paraphrasing away properties tends to multiply primitive predicates (Primitive entry).\n**Multiple meanings:** Yes, in what paraphrase is taken to do: give the same meaning; show the original is true (van Inwagen); or show it is false but worth asserting (Merricks).\n**Further reading (book):** None listed. Cited in the entry: van Inwagen (1990: 10–11); Merricks (2001, Chapter 7).\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/Subsistence.md": "---\ngroup: Ontology and existence\nrole: concept\nsource: Beebee et al. 2011, entry \"Subsistence\"\npages: p. 238\nstatus: unread\n---\n# Subsistence\n**Page(s):** p. 238\n**Book's definition:** p. 238, the opening sentence of the entry.\n**In one line:** An object subsists if it has being but does not exist.\n**Role in [[00 – Ontology and existence]]:** An old term for the middle status between existing and being nothing at all.\n**Explanation:** The term is rarely used today, because most philosophers don't distinguish being from existence. Meinong and Russell sometimes used it for non-concrete things like universals and numbers.\n**Example:** On this usage, the number 7 would subsist rather than exist.\n**Connections:**\n- is defined by [[Being]]: because subsisting is having being without existing.\n- is one context for [[Non-Existent Objects]]: because subsisting things don't exist.\n- is denied of some things by [[Meinongianism]]: because Meinongians think some things don't even subsist.\n- was applied to [[Numbers]]: because Meinong and Russell used it for numbers.\n**Bridges to other groups:**\n- [[Universals]] (Particulars and universals): because Meinong and Russell said universals subsist.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "09 Mereology and composition/00 – Mereology and composition.md": "---\ngroup: Mereology and composition\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Mereology and composition\n**Central question:** When do parts make up a whole, and what are the basic facts about parthood?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| Classical mereology ([[Mereology]]) | Parthood is transitive and reflexive; composition always occurs; same parts means identical | Armstrong, Lewis, Quine | Some deny that parthood is transitive |\n| Universalism ([[Special Composition Question]]) | Any things compose a further object | Lewis (1986a), Sider (2001), arguing from vagueness | Strange scattered objects (you plus Brad Pitt's arm) |\n| [[Nihilism]] | Nothing ever composes; only simples exist | — | Tables, goats and people don't exist |\n| Monism ([[Nihilism]], [[Simple]]) | Only one thing, the Universe, exists | Schaffer (2007); Parmenides | — |\n| Restricted composition ([[Special Composition Question]]) | Things compose only sometimes (e.g. when fastened) | — | Stapling two people together would create an object |\n| Mereological essentialism ([[Fusion, Mereological]]) | Everything necessarily has the parts it has | — | — |\n| Extended simples vs point particles ([[Simple]]) | Simples can or cannot be extended | — | — |\n\n## Key arguments and test cases\n- You and Brad Pitt's left arm; stapling yourself to someone: [[Special Composition Question]] (p. 236)\n- The house as a sum of bricks: [[Fusion, Mereological]] (p. 84)\n- Infinitely many point particles vs gunk: [[Gunk]] (p. 88)\n- The universe as one giant simple: [[Simple]] (p. 231)\n\n## Bridges to other groups\n- **Ontology:** [[Fictionalism]] and [[Ontological Commitment]], because whether composite objects exist is an ontological question, and fictionalism is one way around it.\n- **Identity:** [[Identity]] and [[Identity Over Time]], because extensionality links parts to identity, and the Ship of Theseus is an identity puzzle.\n- **Sets:** [[Transitive Relation]] and [[Infinity]], because the transitivity of parthood and infinite divisibility are central issues.\n- **Modality:** [[Essence]], because mereological essentialism says things have their parts essentially.\n- **Tools:** [[Reductionism]], because Merricks and Schaffer disagree over whether tables are real, grounded or nonexistent.\n\n## Reading path (pages in the book)\n1. [[Mereology]] (p. 121), [[Part]] (p. 156), [[Overlap]] (p. 155)\n2. [[Simple]] (p. 231), [[Gunk]] (p. 88)\n3. [[Special Composition Question]] (p. 236), [[Nihilism]] (p. 145), [[Fusion, Mereological]] (p. 84)\n- Short and pointer entries: [[Sum]] (p. 239), [[Unrestricted Mereological Composition]] (p. 268), [[Universalism]] (p. 265), [[Proper Part]] (p. 196), [[Improper Part]] (p. 100), [[Point Particle]] (p. 167), [[Mereological Fusion]] (about p. 120), [[Ship of Theseus]] (p. 230)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258). 'About' means estimated from neighbouring entries.*\n", "09 Mereology and composition/Fusion, Mereological.md": "---\ngroup: Mereology and composition\nrole: concept\nsource: Beebee et al. 2011, entry \"Fusion, Mereological\"\npages: p. 84\nstatus: unread\n---\n# Fusion, Mereological\n**Page(s):** p. 84\n**Book's definition:** p. 84. Copy the first two sentences of paragraph 2: the main usage, where x is the fusion of the ys if the ys compose x.\n**In one line:** In mereology, usually just a composite object: x is the fusion of the ys if the ys compose x. In a rarer sense, a 'sum' that has its parts essentially.\n**Role in [[00 – Mereology and composition]]:** The standard word for a composite whole.\n**Explanation:** This has nothing to do with two objects being welded together, though 'fusion' in that sense, the opposite of fission, does come up in the personal identity debate. In the main usage your body is a fusion of your body parts, which just means it is composed of them. In the rarer usage, a fusion (or 'sum') is a composite object that can never have different parts. A house considered as the sum of its bricks could not change its bricks. 'Mereological essentialists' think every fusion in the first sense is also one in the second: everything necessarily has the parts it actually has. Context usually tells you which is meant; normally it's the first.\n**Example:** Your body is a fusion of all its parts.\n**Connections:**\n- [[Mereological Fusion]] and [[Sum]]: other names for the same notion (the first is a pointer entry).\n- is a basic notion of [[Mereology]]: because 'fusion' is mereology's term for a composite object.\n**Bridges to other groups:**\n- [[Fission]] (Personal identity): because 'fusion' in the welding sense is discussed there as the opposite of fission (Parfit 1971).\n- [[Essence]] (Modality): because on the rarer usage, and for mereological essentialists, a fusion has its parts essentially.\n**Multiple meanings:** Yes, two usages: (1) any composite object (usual); (2) an object that has its parts essentially (rarer).\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "09 Mereology and composition/Gunk.md": "---\ngroup: Mereology and composition\nrole: concept\nsource: Beebee et al. 2011, entry \"Gunk\"\npages: p. 88\nstatus: unread\n---\n# Gunk\n**Page(s):** p. 88\n**Book's definition:** p. 88. Copy the second sentence, which defines being made of atomless gunk.\n**In one line:** Something is made of (atomless) gunk if every part of it has a proper part, so that it bottoms out in no simples.\n**Role in [[00 – Mereology and composition]]:** The alternative to there being simples.\n**Explanation:** It might turn out that you and I are gunky, if physics one day discovers that we have no simples as proper parts. Being gunky is not the same as being infinitely divisible. A gunky object might not be divisible at all, if its infinitely many parts were tightly connected. And an object made of infinitely many point particles (particles with no extension) would be infinitely divisible but not gunky, because the point particles themselves have no proper parts.\n**Example:** An object made of infinitely many point particles: infinitely divisible, but not gunk.\n**Connections:**\n- is the opposite of there being a [[Simple]]: because a gunky object has no part without proper parts.\n- is defined using [[Proper Part]] and [[Part]]: because every part of gunk has a proper part.\n- is contrasted with [[Point Particle]]: because objects made of point particles are divisible without being gunky (pointer entry).\n- is one option within [[Mereology]]: because systems differ on whether everything has proper parts.\n**Bridges to other groups:**\n- [[Infinity]] (Sets, classes and infinity): because the entry distinguishes gunk from infinite divisibility.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Hudson (2007)\n  Full references (from the book's bibliography):\n  - Hudson, H. (2007) ‘Simples and gunk’, *Philosophy Compass*, 2: 291–302.\n**Beyond the book:** —\n**My notes:**\n", "09 Mereology and composition/Improper Part.md": "---\ngroup: Mereology and composition\nrole: pointer\nsource: Beebee et al. 2011, entry \"Improper Part\"\npages: p. 100\nstatus: unread\n---\n# Improper Part\n**Page(s):** p. 100\n**Pointer entry:** the book only says \"see\" → [[Part]]. Read that note.\n**Role in [[00 – Mereology and composition]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "09 Mereology and composition/Mereological Fusion.md": "---\ngroup: Mereology and composition\nrole: pointer\nsource: Beebee et al. 2011, entry \"Mereological Fusion\"\npages: about p. 120 (pointer entry; page estimated from neighbouring entries)\nstatus: unread\n---\n# Mereological Fusion\n**Page(s):** about p. 120 (pointer entry; page estimated from neighbouring entries)\n**Pointer entry:** the book only says \"see\" → [[Fusion, Mereological]]. Read that note.\n**Role in [[00 – Mereology and composition]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "09 Mereology and composition/Mereology.md": "---\ngroup: Mereology and composition\nrole: concept\nsource: Beebee et al. 2011, entry \"Mereology\"\npages: pp. 121–122 (entry starts p. 121)\nstatus: unread\n---\n# Mereology\n**Page(s):** pp. 121–122 (entry starts p. 121)\n**Book's definition:** p. 121, the opening sentence of the entry.\n**In one line:** The study of parts and wholes (from 'mereos', Greek for 'part').\n**Role in [[00 – Mereology and composition]]:** The name of this group's subject, and the entry that sets out its systems and notation.\n**Explanation:** Mereology was formalised in the early twentieth century by Stanisław Leśniewski, and brought to wider attention by Henry S. Leonard and Nelson Goodman in the 1940s. Systems differ on several questions. Is parthood transitive (most say yes)? Does everything have proper parts (gunk), or are there simples? When do things compose a further object? Must things with exactly the same parts be identical? *Classical mereology*, supported by Armstrong, Lewis and Quine, says parthood is transitive, non-symmetric and reflexive, while proper parthood is transitive, asymmetric and irreflexive. It also says things always compose a further object (universalism), and that things with the same parts are identical ('extensionality' or 'uniqueness'). The entry also gives standard notation for part, proper part, improper part and overlap.\n**Example:** Do atoms arranged table-wise compose a table? Do atoms scattered across the galaxy compose anything?\n**Connections:**\n- defines [[Part]], [[Proper Part]], [[Improper Part]] and [[Overlap]]: because these are its basic relations.\n- divides over [[Simple]] vs [[Gunk]]: because systems differ on whether everything has proper parts.\n- includes the [[Special Composition Question]]: because when composition occurs is one of its core disputes.\n- endorses [[Universalism]] in its classical form: because classical mereology says things always compose (pointer entry).\n**Bridges to other groups:**\n- [[Transitive Relation]] (Sets, classes and infinity): because whether parthood is transitive divides systems.\n- [[Identity]] (Identity): because extensionality says that things with the same parts are identical.\n- [[Armstrong, David]], [[Lewis, David]] and [[Quine, W. V.]] (Philosophers): because they are named supporters of classical mereology.\n**Multiple meanings:** Yes: 'mereology' is sometimes used just for classical mereology.\n**Further reading (book):** Varzi (2009)\n  Full references (from the book's bibliography):\n  - Varzi, A. (2009) ‘Mereology’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Summer 2009 edn. Online. Available at: http://plato.stanford.edu/archives/sum2009/entries/mereology.\n**Beyond the book:** —\n**My notes:**\n", "09 Mereology and composition/Nihilism.md": "---\ngroup: Mereology and composition\nrole: position\nsource: Beebee et al. 2011, entry \"Nihilism\"\npages: p. 145\nstatus: unread\n---\n# Nihilism\n**Page(s):** p. 145\n**Book's definition:** p. 145. Copy the second and third sentences, which give the two meanings.\n**In one line:** Usually *mereological* nihilism: things never compose anything further. More rarely, *ontological* nihilism: nothing exists at all.\n**Role in [[00 – Mereology and composition]]:** One of the two extreme answers to the Special Composition Question.\n**Explanation:** Ontological nihilism is a rare, niche position. The Special Composition Question entry explains mereological nihilism. Usually nihilists believe that only tiny simples exist, and that tables, chairs, goats and people don't. Some nihilists, also called monists, say nothing composes because there is only one entity: the Universe (Schaffer 2007).\n**Example:** There are simples arranged table-wise, but no table.\n**Connections:**\n- answers the [[Special Composition Question]]: because it says composition never occurs.\n- usually believes only in a [[Simple]]: because without composition, only simples remain.\n- is the opposite of [[Universalism]]: because universalists say composition always occurs (pointer entry).\n**Bridges to other groups:**\n- [[Ontological Commitment]] (Ontology): because a nihilist denies that talk of people and objects commits us to them.\n- [[Holes]] (Ontology): because the Holes entry sets nihilism aside when assuming the jeans exist.\n**Multiple meanings:** Yes: mereological nihilism (usual) vs ontological nihilism (rare). Monism is also counted as a form of nihilism.\n**Further reading (book):** See the entry on the **Special Composition Question** for more information on nihilism and composition. Information on ontological nihilism is limited and almost without exception very challenging to read. One such contemporary source is O’Leary-Hawthorne and Cortens (1995).\n  Full references (from the book's bibliography):\n  - O’Leary-Hawthorne, J. and Cortens, A. (1995) ‘Towards ontological nihilism’, *Philosophical Studies*, 79: 143–65.\n**Beyond the book:** —\n**My notes:**\n", "09 Mereology and composition/Overlap.md": "---\ngroup: Mereology and composition\nrole: concept\nsource: Beebee et al. 2011, entry \"Overlap\"\npages: p. 155\nstatus: unread\n---\n# Overlap\n**Page(s):** p. 155\n**Book's definition:** p. 155. The whole entry is one sentence: copy it.\n**In one line:** Two things overlap if they have a part in common.\n**Role in [[00 – Mereology and composition]]:** A basic mereological relation.\n**Explanation:** This is a one-sentence entry. The Mereology entry gives the standard notation 'x o y' for x overlaps y.\n**Example:** (The entry gives no example.)\n**Connections:**\n- is defined in terms of [[Part]]: because overlapping is sharing a part.\n- is part of the notation of [[Mereology]]: because it is one of mereology's standard relations.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "09 Mereology and composition/Part.md": "---\ngroup: Mereology and composition\nrole: concept\nsource: Beebee et al. 2011, entry \"Part\"\npages: entry starts p. 156\nstatus: unread\n---\n# Part\n**Page(s):** entry starts p. 156\n**Book's definition:** p. 156. There's no single defining sentence. Copy the definitions of 'proper part', 'improper part' and 'part', in the order the entry gives them.\n**In one line:** In mereology, 'part' covers both proper parts (a table's legs, atoms and top) and the improper part (the table itself). 'Proper part' is what everyday English means by 'part'.\n**Role in [[00 – Mereology and composition]]:** The basic relation of mereology. Its technical sense is easy to misread.\n**Explanation:** One proper part of a table is a leg; others are its atoms and its top. 'Improper part' is a technical term defined so that everything is an improper part of itself, so the table is its own improper part. In mereology 'part' covers anything that is either a proper or an improper part. So the papers you read may use 'part' in this special technical sense, under which everything is a part of itself.\n**Example:** The table has as parts its legs, its atoms, its top, and itself.\n**Connections:**\n- [[Proper Part]] and [[Improper Part]]: pointer entries that send you here.\n- is the basic relation of [[Mereology]]: because mereology is the study of parts and wholes.\n- defines [[Simple]] and [[Overlap]]: because a simple has no proper parts, and overlapping things share a part.\n**Bridges to other groups:**\n- None named in this entry; see [[Mereology]] for the formal properties of parthood.\n**Multiple meanings:** Yes: everyday 'part' = proper part; technical 'part' = proper or improper part.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "09 Mereology and composition/Point Particle.md": "---\ngroup: Mereology and composition\nrole: pointer\nsource: Beebee et al. 2011, entry \"Point Particle\"\npages: p. 167\nstatus: unread\n---\n# Point Particle\n**Page(s):** p. 167\n**Pointer entry:** the book only says \"see\" → [[Simple]]. Read that note.\n**Role in [[00 – Mereology and composition]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "09 Mereology and composition/Proper Part.md": "---\ngroup: Mereology and composition\nrole: pointer\nsource: Beebee et al. 2011, entry \"Proper Part\"\npages: p. 196\nstatus: unread\n---\n# Proper Part\n**Page(s):** p. 196\n**Pointer entry:** the book only says \"see\" → [[Part]]. Read that note.\n**Role in [[00 – Mereology and composition]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "09 Mereology and composition/Ship of Theseus.md": "---\ngroup: Mereology and composition\nrole: pointer\nsource: Beebee et al. 2011, entry \"Ship of Theseus\"\npages: p. 230\nstatus: unread\n---\n# Ship of Theseus\n**Page(s):** p. 230\n**Pointer entry:** the book only says \"see\" → [[Identity Over Time]]. Read that note.\n**Role in [[00 – Mereology and composition]]:** cross-reference only; the book gives no separate definition here.\n**Grouping note:** the book sends this term to Identity Over Time (group 13, Identity), where the Ship of Theseus is treated as a fission case. Consider moving this note to that group.\n**My notes:**\n", "09 Mereology and composition/Simple.md": "---\ngroup: Mereology and composition\nrole: concept\nsource: Beebee et al. 2011, entry \"Simple\"\npages: p. 231\nstatus: unread\n---\n# Simple\n**Page(s):** p. 231\n**Book's definition:** p. 231. Copy the second sentence, the definition (\"Something is a simple if and only if…\").\n**In one line:** Something with no proper parts.\n**Role in [[00 – Mereology and composition]]:** The smallest building blocks, if there are any. The alternative is gunk.\n**Explanation:** The definition needs 'proper', because everything has a part: itself. Those who believe in simples usually identify them with elementary particles such as quarks or superstrings. Some think simples can't be extended, since an extended thing would have a left and a right proper part; then simples are 'point particles' (0-dimensional objects). Others allow 'extended simples', possibly large ones. At the extreme, following Parmenides, some think the whole universe is one giant simple (monism). Those who deny simples hold that the world is gunk, or else that nothing exists at all (ontological nihilism).\n**Example:** A quark, if it has no proper parts.\n**Connections:**\n- is defined by [[Proper Part]] and [[Part]]: because a simple has no proper parts.\n- is the alternative to [[Gunk]]: because gunk has no simples.\n- may be a [[Point Particle]]: because unextended simples would be point particles (pointer entry).\n- is all that exists for [[Nihilism]]: because without composition only simples remain (Special Composition Question entry).\n- appears in monism in the [[Special Composition Question]]: because the monist treats the universe as one giant simple.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** There are two views: simples are point particles, or there can be extended simples.\n**Further reading (book):** Hudson (2007)\n  Full references (from the book's bibliography):\n  - Hudson, H. (2007) ‘Simples and gunk’, *Philosophy Compass*, 2: 291–302.\n**Beyond the book:** —\n**My notes:**\n", "09 Mereology and composition/Special Composition Question.md": "---\ngroup: Mereology and composition\nrole: concept\nsource: Beebee et al. 2011, entry \"Special Composition Question\"\npages: pp. 236–237 (entry starts p. 236)\nstatus: unread\n---\n# Special Composition Question\n**Page(s):** pp. 236–237 (entry starts p. 236)\n**Book's definition:** p. 236. Copy the last two sentences of paragraph 1: van Inwagen's question, and its name.\n**In one line:** Van Inwagen's question: under what circumstances do some things compose a further thing?\n**Role in [[00 – Mereology and composition]]:** The central question of this group.\n**Explanation:** Intuitively atoms compose human beings, but you and Brad Pitt's left arm don't compose a three-armed monstrosity. Two of the most common answers are extreme. **Nihilists** say nothing ever composes: usually only simples exist (or, for monists, only the Universe; Schaffer 2007). **Universalists** say things always compose, so there *is* a scattered object made of you and Pitt's arm. Both answers sound strange, so their defenders give arguments. One starts from vagueness (Lewis 1986a and Sider 2001 for universalism; the same argument can be adapted for nihilism). Another points to the lack of competition: 'restricted' answers are hard to find. For example, 'things compose when fastened together' implies that stapling yourself to someone creates a new object.\n**Example:** You and Brad Pitt's left arm: do you compose anything?\n**Connections:**\n- is answered by [[Nihilism]] and by [[Universalism]]: because these are the two extreme answers (Universalism is a pointer entry).\n- [[Unrestricted Mereological Composition]]: another name for the universalist answer.\n- involves [[Simple]]: because nihilists usually say only simples exist.\n- is a core dispute of [[Mereology]]: because systems differ on when composition occurs.\n**Bridges to other groups:**\n- [[Fictionalism]] (Ontology): because fictionalism about composite objects is one way to avoid answering it (Rosen and Dorr 2002, in the Fictionalism entry).\n- [[Reductionism]] (Tools): because whether tables exist at all, or are 'nothing over and above' their atoms, is the Merricks–Schaffer example there.\n- [[Lewis, David]] (Philosophers): because he argues for universalism from vagueness.\n**Multiple meanings:** Restricted composition (sometimes) vs unrestricted composition (always, universalism) vs none (nihilism).\n**Further reading (book):** Effingham (2009); Markosian (2008)\n  Full references (from the book's bibliography):\n  - Effingham, N. (2009) ‘Composition, persistence and identity’, in R. Le Poidevin, P. Simons, A. McGonigal and R. Cameron (eds), pp. 296–309, *The Routledge Companion to Metaphysics*, London: Routledge.\n  - Markosian, N. (2008) ‘Restricted composition’, in T. Sider, J. Hawthorne and D. Zimmerman (eds), *Contemporary Debates in Metaphysics*, Oxford: Blackwell.\n**Beyond the book:** —\n**My notes:**\n", "09 Mereology and composition/Sum.md": "---\ngroup: Mereology and composition\nrole: concept\nsource: Beebee et al. 2011, entry \"Sum\"\npages: entry starts p. 239\nstatus: unread\n---\n# Sum\n**Page(s):** entry starts p. 239\n**Book's definition:** p. 239. The whole entry is one sentence: copy it.\n**In one line:** A mereology term, usually taken to mean the same as 'fusion'.\n**Role in [[00 – Mereology and composition]]:** A synonym.\n**Explanation:** The Fusion entry adds a rarer sense in which a 'sum' has its parts essentially: the sum of a house's bricks could not change its bricks.\n**Example:** (The entry gives no example.)\n**Connections:**\n- is a synonym of [[Fusion, Mereological]]: because the entry says so.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "09 Mereology and composition/Universalism.md": "---\ngroup: Mereology and composition\nrole: pointer\nsource: Beebee et al. 2011, entry \"Universalism\"\npages: p. 265\nstatus: unread\n---\n# Universalism\n**Page(s):** p. 265\n**Pointer entry:** the book only says \"see\" → [[Special Composition Question]]. Read that note.\n**Role in [[00 – Mereology and composition]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "09 Mereology and composition/Unrestricted Mereological Composition.md": "---\ngroup: Mereology and composition\nrole: concept\nsource: Beebee et al. 2011, entry \"Unrestricted Mereological Composition\"\npages: entry starts p. 268\nstatus: unread\n---\n# Unrestricted Mereological Composition\n**Page(s):** entry starts p. 268\n**Book's definition:** p. 268. The whole entry is one sentence: copy it.\n**In one line:** Another name for universalism: the view that things always compose a further object.\n**Role in [[00 – Mereology and composition]]:** A synonym, pointing to the Special Composition Question.\n**Explanation:** The entry is one sentence and sends you to the Special Composition Question, which explains universalism.\n**Example:** (See the you-plus-Brad-Pitt's-arm object in [[Special Composition Question]].)\n**Connections:**\n- is a synonym of [[Universalism]]: because the entry defines it that way.\n- is explained under [[Special Composition Question]]: because the entry sends you there.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "10 Truth/00 – Truth.md": "---\ngroup: Truth\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Truth\n**Central question:** What is truth, what are the bearers of truth, and what in the world makes truths true?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| Redundancy theory ([[Truth]]) | 'p is true' just means p | — | Can't handle 'everything the Pope says is true' |\n| Minimalism ([[Truth]]) | 'True' is a generalising device, not a substantive property | — | — |\n| Pragmatist theory ([[Truth]], [[Pragmatism]]) | The true is what proves good in the way of belief | William James | — |\n| Coherence theory ([[Truth]]) | To be true is to cohere with a system of beliefs | — | Leads to anti-realism and relativism across schemes |\n| Truthmaker principle ([[Truthmakers]]) | Every truth has something that makes it true | Armstrong | Supporters rarely argue for it; analytic truths may not need truthmakers |\n| Propositions as truthbearers ([[Proposition]], [[Truthbearers]]) | Abstract, necessarily existing propositions are what is true | (Lewis reduces them to sets of worlds) | Anti-realists: the world doesn't 'speak its own language' (they follow Quine) |\n| Facts or states of affairs ontology ([[States of Affairs]], [[Facts]]) | The world is made of facts, not things | Early Wittgenstein, Armstrong | Smart: like mixing your drinks |\n| [[Negative Facts]] | There are facts about what isn't so | Russell | Weird; unparsimonious |\n\n## Key arguments and test cases\n- 'Everything the Pope says is true': [[Truth]] (p. 257)\n- 'There are witches' across two cultures (coherence theory): [[Truth]] (p. 257)\n- Obama exists vs Obama is President: [[Truthmakers]] (p. 262)\n- A round Earth with nobody to say so: [[Proposition]] (p. 196)\n- 'Snow is white' and 'Schnee ist weiss': [[Truthbearers]] (p. 261)\n- Dying in space with no air: [[Negative Facts]] (p. 140)\n\n## Bridges to other groups\n- **Realism and anti-realism:** [[Realism and Anti-Realism (Global)]], [[Pragmatism]], [[Conceptual Scheme]] and [[Relativism]], because theories of truth often decide realism vs anti-realism.\n- **Time:** [[Presentism]] and [[Tensed and Tenseless Theories of Time]], because presentism struggles with truthmakers for the past, and tenseless theorists give truth conditions for tensed sentences.\n- **Particulars and universals:** [[Bradley's Regress]] and [[Austere Nominalism]], because states of affairs answer the regress and truthmaker demands challenge austere nominalism.\n- **Causation and laws:** [[Causal Relata]] and [[Causation by Absence]], because facts and negative facts are candidate causes.\n- **Modality:** [[Possible Worlds]] and [[Modal Realism]], because Lewis reduces propositions to sets of worlds.\n- **Method:** [[Conceptual Analysis]], because analyses state truth conditions.\n\n## Reading path (pages in the book)\n1. [[Truth]] (p. 257), [[Truthbearers]] (p. 261), [[Proposition]] (p. 196)\n2. [[Truthmakers]] (p. 262), [[Truth Conditions]] (p. 262)\n3. [[Facts]] (p. 71), [[States of Affairs]] (p. 237), [[Negative Facts]] (p. 140)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "10 Truth/Facts.md": "---\ngroup: Truth\nrole: concept\nsource: Beebee et al. 2011, entry \"Facts\"\npages: pp. 71–72 (entry starts p. 71)\nstatus: unread\n---\n# Facts\n**Page(s):** pp. 71–72 (entry starts p. 71)\n**Book's definition:** p. 71. Copy the first two sentences (the two ways philosophers use 'fact').\n**In one line:** Either just true propositions or sentences, or, taken seriously, real constituents of nature, often identified with states of affairs.\n**Role in [[00 – Truth]]:** A candidate category for truthmakers, causal relata and the basic make-up of the world.\n**Explanation:** The early Wittgenstein held that the world is the totality of facts, not things. Facts, taken as genuine entities, have been used as the primary causal relata (rather than events), as what true propositions correspond to, and as truthmakers. They are usually thought to contain both a particular and a universal (the apple and roundness), or a particular and a trope. So they are off-limits to some nominalists, in particular austere nominalists, who think predicates don't denote real features of objects. Arguably, there need not be two separate entities (the apple's being round and its being red) to make two different sentences true.\n**Example:** The fact that the apple is round: the apple plus roundness.\n**Connections:**\n- are identified with [[States of Affairs]]: because taken seriously, facts are real occupants of reality with propositional structure.\n- are what true [[Proposition]] correspond to in [[Truth]] theory: because some take facts to be the correspondents of truths.\n- may be [[Truthmakers]]: because some take facts (or states of affairs) to be the truthmakers for true propositions.\n- include [[Negative Facts]]: because negative facts are a kind of fact.\n**Bridges to other groups:**\n- [[Causal Relata]] and [[Event]] (Causation and laws): because some take facts, not events, as the primary causal relata.\n- [[Particulars and Universals]] and [[Trope Theory]] (Particulars and universals): because facts are made of particulars and universals, or particulars and tropes.\n- [[Austere Nominalism]] (Particulars and universals): because austere nominalists reject facts conceived this way.\n**Multiple meanings:** Yes: 'fact' as a true proposition vs 'fact' as a real constituent of nature.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "10 Truth/Negative Facts.md": "---\ngroup: Truth\nrole: concept\nsource: Beebee et al. 2011, entry \"Negative Facts\"\npages: pp. 140–141 (entry starts p. 140)\nstatus: unread\n---\n# Negative Facts\n**Page(s):** pp. 140–141 (entry starts p. 140)\n**Book's definition:** p. 140, the opening sentence of the entry.\n**In one line:** Facts about negative aspects of the world: that there are no unicorns, that there is no air in deep space, that I am not on fire.\n**Role in [[00 – Truth]]:** Disputed entities that would serve as truthmakers for negative truths and as causes in cases of absence.\n**Explanation:** In the trivial sense, where 'it is a fact that p' just means p is true, there are negative facts. If facts are genuine constituents of reality, it's less clear we should believe in them. They would be useful as truthmakers for negative existentials like <there are no unicorns>, and as causal relata: thrown out of a spaceship's airlock, I'd die because there's no air in space. Russell believed in them, but they 'come in for a hard time'. They seem weird, since everything that exists seems 'positive'. And on grounds of parsimony, for there to be no unicorns we just need a lack of something, not an extra entity.\n**Example:** Dying in space because there is no air there.\n**Connections:**\n- are a kind of [[Facts]]: because the entry defines them that way.\n- would be [[Truthmakers]] for negative [[Proposition]]s: because <there are no unicorns> needs something to make it true.\n**Bridges to other groups:**\n- [[Causal Relata]] and [[Causation by Absence]] (Causation and laws): because negative facts could be causes in absence cases.\n- [[Theoretical Virtues]] (Method): because the parsimony objection says a lack needs no entity.\n- [[Ontology]] (Ontology): because whether there are negative facts is an example ontological question (Ontology entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "10 Truth/Proposition.md": "---\ngroup: Truth\nrole: concept\nsource: Beebee et al. 2011, entry \"Proposition\"\npages: pp. 196–197 (entry starts p. 196)\nstatus: unread\n---\n# Proposition\n**Page(s):** pp. 196–197 (entry starts p. 196)\n**Book's definition:** p. 196, the opening sentence of the entry.\n**In one line:** The things that are true or false (truthbearers), usually taken to be necessarily existing abstract objects rather than sentences.\n**Role in [[00 – Truth]]:** The standard candidate for what is fundamentally true or false.\n**Explanation:** Why not just sentences? Even if humans had never existed, it would still be true that the world is round, yet without speakers there would be no sentences. So we seem to need mind-independent truthbearers. Metaphorically, propositions are like sentences in 'God's Big Book of Reality', each marked true or false; the book writes them as <the Earth is round>. They are usually thought of as necessarily existing abstract objects: even if there were no concrete objects, <there are no concrete objects> would be true. Whether to include them in our ontology is a serious question. Some treat them as a category of their own; others reduce them, like Lewis, who identifies a proposition with the class of possible worlds where it is true.\n**Example:** <The Earth is round>, true whether or not anyone exists to say so.\n**Connections:**\n- are the main [[Truthbearers]]: because they are the things that are true or false.\n- are what [[Truth]] applies to: because truth is a property of truthbearers.\n- are made true by [[Truthmakers]]: because the truthmaker principle concerns true propositions.\n**Bridges to other groups:**\n- [[Abstract vs Concrete]] and [[Ontology]] (Ontology): because propositions are usually taken to be abstract, and their place in our ontology is debated.\n- [[Necessity]] (Modality): because propositions are usually thought to exist necessarily.\n- [[Possible Worlds]] (Modality) and [[Lewis, David]] (Philosophers): because Lewis reduces propositions to classes of worlds.\n- [[Concept]] (Tools): because concepts are taken to be constituents of propositions (Concept entry).\n**Multiple meanings:** The book sometimes speaks of sentences and sometimes of propositions without a deep reason; it uses <…> for propositions and quotation marks for sentences.\n**Further reading (book):** Loux (2006, Chapter 4); McGrath (2007)\n  Full references (from the book's bibliography):\n  - Loux, M. (2006) *Metaphysics: A Contemporary Introduction*, 3rd edn, London: Routledge.\n  - McGrath, M. (2007) ‘Propositions’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy**,* Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/propositions.\n**Beyond the book:** —\n**My notes:**\n", "10 Truth/States of Affairs.md": "---\ngroup: Truth\nrole: concept\nsource: Beebee et al. 2011, entry \"States of Affairs\"\npages: pp. 237–238 (entry starts p. 237)\nstatus: unread\n---\n# States of Affairs\n**Page(s):** pp. 237–238 (entry starts p. 237)\n**Book's definition:** p. 237. Copy the second and third sentences of paragraph 2: the second sense of 'fact', a real occupant of reality with propositional structure, sometimes called a 'state of affairs'.\n**In one line:** Real, non-linguistic constituents of reality with a propositional structure, such as Socrates' being wise. Some say the world is made of them rather than of things.\n**Role in [[00 – Truth]]:** The 'facts' of a facts-not-things ontology. Armstrong's answer to Bradley's regress.\n**Explanation:** There is a fundamental divide between those who think the world is made up of facts and those who think it's made up of things; Jack Smart said believing in both is like mixing your drinks. 'Fact' can mean a true proposition, or a real, concrete constituent with the structure of a 'that'-clause (that Socrates is wise); states of affairs are facts in the second sense. David Armstrong defends an ontology of states of affairs, each a fundamental unity of a substratum bearing immanent universals. Metaphorically, God didn't create substrata and universals and then glue them together; he created states of affairs, in which substratum and universal are inseparable aspects. Bradley's regress is one reason this might seem attractive.\n**Example:** Socrates' being wise; grass's being green.\n**Connections:**\n- are [[Facts]] in the substantial sense: because the entry identifies them with facts in that sense.\n- have the structure of a [[Proposition]]: because they are specified by a 'that'-clause.\n- serve as [[Truthmakers]]: because Obama's being President is the usual truthmaker for <Obama is President> (Truthmakers entry).\n**Bridges to other groups:**\n- [[Armstrong, David]] (Philosophers): because he defends the ontology of states of affairs.\n- [[Substratum]], [[Immanent Realism About Universals]] and [[Bradley's Regress]] (Particulars and universals): because Armstrong's states of affairs unify substrata with immanent universals and so avoid the regress.\n- [[Ontology]] (Ontology): because whether there are states of affairs is a question of ontology.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Armstrong (1997)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (1997). *A World of States of Affairs*, Cambridge: Cambridge University Press.\n**Beyond the book:** —\n**My notes:**\n", "10 Truth/Truth Conditions.md": "---\ngroup: Truth\nrole: concept\nsource: Beebee et al. 2011, entry \"Truth Conditions\"\npages: entry starts p. 262\nstatus: unread\n---\n# Truth Conditions\n**Page(s):** entry starts p. 262\n**Book's definition:** p. 262, the opening sentence of the entry.\n**In one line:** The conditions that must obtain for a sentence to be true: 'snow is white' is true just when snow is white.\n**Role in [[00 – Truth]]:** The usual form that a conceptual analysis takes.\n**Explanation:** Admittedly, 'snow is white' is true iff snow is white doesn't sound illuminating. In metaphysics, truth conditions come up mostly in conceptual analysis: analysing 'cause' or 'person' means stating the truth conditions for 'x caused y' or 'x is a person'. Strictly, an analysis should give the *meaning* of a term, and whether meaning *is* truth conditions is a thorny question in philosophy of language. It also arises directly in the tensed/tenseless debate about time. Some metaphysicians today prefer to talk of truthmakers instead.\n**Example:** The truth condition of 'snow is white' is that snow is white.\n**Connections:**\n- are increasingly replaced by talk of [[Truthmakers]]: because some metaphysicians now prefer truthmakers.\n- are conditions for [[Truth]]: because they say when a sentence is true.\n**Bridges to other groups:**\n- [[Conceptual Analysis]] (Method): because an analysis usually states truth conditions.\n- [[Tensed and Tenseless Theories of Time]] (Time): because tenseless theorists give tenseless truth conditions for tensed sentences.\n- [[Counterfactual Conditional]] (Tools): because the truth conditions of counterfactuals are a central question there.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "10 Truth/Truth.md": "---\ngroup: Truth\nrole: concept\nsource: Beebee et al. 2011, entry \"Truth\"\npages: pp. 257–261 (entry starts p. 257)\nstatus: unread\n---\n# Truth\n**Page(s):** pp. 257–261 (entry starts p. 257)\n**Book's definition:** p. 257. There's no definition: the entry opens by saying truth is a tricky notion. Copy its first two sentences.\n**In one line:** The property (if it is one) that true sentences or propositions have. Whether it is a substantive property at all is itself disputed.\n**Role in [[00 – Truth]]:** The central notion of this group.\n**Explanation:** '…is true' looks like a predicate ascribing a property, but calling truth a property needn't commit us to a deep metaphysical account: a class nominalist could say being true is just belonging to the class of true sentences. **Deflationary** views deny that truth is substantive. The *redundancy* theory says 'p is true' just means p, but it can't handle 'everything the Pope says is true'. *Minimalists* accept that 'true' can't simply be defined away, since it lets us generalise over infinitely many sentences, but deny it names a substantive property. **Substantive** views include pragmatism (James: the true is whatever proves good in the way of belief) and the coherence theory (to be true is to be part of a coherent system of beliefs). The coherence theory leads towards anti-realism: two cultures with incompatible belief systems could make 'there are witches' true for one and false for the other.\n**Example:** 'Everything the Pope says is true', which the redundancy theory can't handle.\n**Connections:**\n- applies to [[Truthbearers]] and [[Proposition]]: because those are the things that are true or false.\n- is grounded by [[Truthmakers]] on some views: because truthmaker theory is sometimes offered as a replacement for the correspondence theory (Truthmakers entry).\n- may involve correspondence to [[Facts]]: because some take facts to be what true propositions correspond to.\n**Bridges to other groups:**\n- [[Class Nominalism]] and [[Universals]] (Particulars and universals): because truth may be a property without being a universal.\n- [[Pragmatism]] (Realism and anti-realism): because pragmatism is often presented as a theory of truth.\n- [[Conceptual Scheme]], [[Realism and Anti-Realism (Global)]] and [[Relativism]] (Realism and anti-realism): because the coherence theory leads to anti-realism and relativism across conceptual schemes.\n**Multiple meanings:** Yes: deflationary views (redundancy, minimalism) vs substantive views (pragmatist, coherence, correspondence).\n**Further reading (book):** Kirk (1999, Chapter 2); Glanzberg (2009); David (2009)\n  Full references (from the book's bibliography):\n  - Kirk, R. (1999) *Relativism and Realism*, London: Routledge.\n  - Glanzberg, M. (2009) ‘Truth’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Spring 2009 edn. Online. Available at: http://plato.stanford.edu/archives/spr2009/entries/truth.\n  - David, M. (2009) ‘The correspondence theory of truth’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2009 edn. Online. Available at: http://plato.stanford.edu/archives/fall2009/entries/truth-correspondence.\n**Beyond the book:** —\n**My notes:**\n", "10 Truth/Truthbearers.md": "---\ngroup: Truth\nrole: concept\nsource: Beebee et al. 2011, entry \"Truthbearers\"\npages: pp. 261–262 (entry starts p. 261)\nstatus: unread\n---\n# Truthbearers\n**Page(s):** pp. 261–262 (entry starts p. 261)\n**Book's definition:** p. 261. Copy the question that opens paragraph 1 (\"What are the 'bearers' of truth?…\") and the answer metaphysicians normally give: propositions.\n**In one line:** The things that are true or false. Metaphysicians usually say propositions; anti-realists usually say sentences.\n**Role in [[00 – Truth]]:** A background question for theories of truth.\n**Explanation:** Metaphysicians usually take the fundamental truthbearers to be propositions: abstract objects that are the meanings of sentences. So 'snow is white' and 'Schnee ist weiss' express the same proposition, and both are true *because* it is. Sentences, utterances and inscriptions are truthbearers only derivatively. Anti-realists are suspicious of propositions, which seem to imply that the world 'speaks its own language': the proposition that snow is white isn't in English, or in any actual language. So anti-realists tend to take sentences as the ultimate truthbearers, and, following Quine, treat sameness of meaning across languages as mere intertranslatability.\n**Example:** 'Snow is white' and 'Schnee ist weiss' expressing one proposition.\n**Connections:**\n- are usually a [[Proposition]]: because metaphysicians take propositions as fundamental truthbearers.\n- are what has [[Truth]]: because truthbearers are the items with the property of truth.\n**Bridges to other groups:**\n- [[Realism and Anti-Realism (Global)]] and [[Conceptual Scheme]] (Realism and anti-realism): because anti-realists reject propositions in favour of sentences.\n- [[Quine, W. V.]] (Philosophers): because anti-realists follow him in treating sameness of meaning as intertranslatability.\n**Multiple meanings:** The entry is headed 'See also proposition' but is a full entry, not a pointer.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "10 Truth/Truthmakers.md": "---\ngroup: Truth\nrole: position\nsource: Beebee et al. 2011, entry \"Truthmakers\"\npages: pp. 262–264 (entry starts p. 262)\nstatus: unread\n---\n# Truthmakers\n**Page(s):** pp. 262–264 (entry starts p. 262)\n**Book's definition:** p. 262, the opening sentence of the entry.\n**In one line:** The truthmaker principle: for every true proposition, some existing entity (or entities) makes it true.\n**Role in [[00 – Truth]]:** A principle used, especially by realists, to test which theories 'pay' for their truths.\n**Explanation:** Truthmaker theory is sometimes offered as a replacement for the correspondence theory of truth. Barack Obama plausibly makes <Barack Obama exists> true. A complete truthmaker's existence must necessitate the truth, so Obama alone can't make <Obama is President> true (he might not have been President). The usual candidate is the *state of affairs* of Obama's being President. The principle is used to accuse views of 'cheating', of investing in more truths than they have entities to pay for: presentism (truths about the past), austere nominalism (truths ascribing properties) and phenomenalism. Supporters rarely argue for it; it is often taken to rest on the realist intuition that truth must be grounded in reality. Analytic truths may need no truthmakers. A more moderate idea is that truth *supervenes* on being.\n**Example:** Obama makes <Obama exists> true, but not <Obama is President>.\n**Connections:**\n- make true a [[Proposition]]: because the principle concerns true propositions.\n- are often [[States of Affairs]]: because a state of affairs is the usual truthmaker for predications.\n- would include [[Negative Facts]] for negative truths: because <there are no unicorns> needs one.\n- may replace a correspondence account of [[Truth]]: because truthmaker theory is sometimes offered as its replacement.\n**Bridges to other groups:**\n- [[Presentism]] (Time): because presentism is accused of lacking truthmakers for the past.\n- [[Austere Nominalism]] (Particulars and universals): because it is accused of lacking truthmakers for property ascriptions.\n- [[Phenomenalism and Idealism]] and [[Realism and Anti-Realism (Global)]] (Realism and anti-realism): because phenomenalism is accused of 'cheating', and the principle rests on realist intuitions.\n- [[Analytic vs Synthetic Truths]] and [[Supervenience]] (Tools): because analytic truths may need no truthmakers, and 'truth supervenes on being' is a moderate version.\n- [[Ontological Commitment]] (Ontology): because Armstrong says we are committed only to truthmakers.\n**Multiple meanings:** Strong (every truth has a truthmaker) vs moderate (truth supervenes on being) versions.\n**Further reading (book):** Armstrong (2004); Beebee and Dodd (2005, Introduction)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (2004) *Truth and Truthmakers*, Cambridge: Cambridge University Press.\n  - Beebee, H. and Dodd, J. (eds) (2005) *Truthmakers: The Contemporary Debate*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/00 – Metametaphysics and method.md": "---\ngroup: Metametaphysics and method\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Metametaphysics and method\n**Central question:** Are metaphysical questions real and answerable, and by what methods (analysis, intuition, parsimony, thought experiment) should we answer them?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| Metaphilia ([[Metametaphysics]]) | Metaphysics yields substantive truths about mind-independent reality | — | Hume's bonfire; positivist metaphobia |\n| Metaphobia ([[Metametaphysics]]) | Metaphysical questions are meaningless, unanswerable, or only about our scheme | Hume, Wittgenstein, the positivists, Carnap | Quine's attack on analyticity; metaphysics' comeback |\n| Quinean method ([[Metametaphysics]]) | Believe in what your best theory quantifies over | Quine | Neo-Aristotelian alternatives (see [[Reductionism]]) |\n| Conceptual analysis ([[Conceptual Analysis]]) | Define concepts by necessary and sufficient conditions | Dominant in the 20th century | Counterexamples; sceptics about analysis |\n| [[Canberra Plan]] | Analyse via folk platitudes and role-players | Menzies (on causation); Lewis invented it | Lewis resists it for causation |\n| Mild conservatism ([[Common Sense]]) | Fit with common sense is one virtue among others | Lewis | Lewis's own theories are far from common sense |\n| Naturalness ([[Carving Nature at its Joints]]) | Some predicates are more natural (green vs grue) | Lewis; Sider (quantifiers) | Hirsch (against natural quantifiers) |\n| Parsimony ([[Ockham's Razor]], [[Theoretical Virtues]]) | Don't multiply entities without good reason | — | Opponents cite explanatory power (DTA) |\n\n## Key arguments and test cases\n- Grue and bleen: [[Carving Nature at its Joints]] (p. 27)\n- The folk theory of pain: [[Canberra Plan]] (p. 25)\n- Moore's two hands: [[Moorean Facts]] (p. 131)\n- Locke's cobbler and prince: [[Thought Experiment]] (p. 250)\n- Carnap's internal and external questions: [[Metametaphysics]] (p. 122)\n- 'S does A freely if and only if X': [[Conceptual Analysis]] (p. 45)\n\n## Bridges to other groups\n- **Tools:** [[Analytic vs Synthetic Truths]], [[A Priori - A Posteriori]], [[Empiricism]], [[Rationalism]] and [[Primitive]], because the history of metametaphysics runs through these distinctions.\n- **Ontology:** [[Ontological Commitment]], because Quine's criterion became the dominant method.\n- **Kinds of properties:** [[Natural Property]] and [[Natural Kinds]], because they are defined by carving nature at its joints.\n- **Causation and laws:** [[Process Theories of Causation]] and [[Dretske-Tooley-Armstrong View of Laws]], because of the Canberra Plan's account of causation and the parsimony vs explanatory power example.\n- **Personal identity and Free will:** [[Fission]], [[Bodily Continuity]] and [[Frankfurt's Nefarious Neurosurgeon]], because they are classic thought experiments.\n- **Realism and anti-realism:** [[Realism and Anti-Realism (Global)]] and [[Scepticism]], because metaphilia is tied to global realism, and Moorean facts answer scepticism.\n\n## Reading path (pages in the book)\n1. [[Metametaphysics]] (p. 122), [[Linguistic Turn]] (p. 118)\n2. [[Conceptual Analysis]] (p. 45), [[Canberra Plan]] (p. 25), [[Thought Experiment]] (p. 250), [[Experimental Philosophy]] (p. 70)\n3. [[Theoretical Virtues]] (p. 248), [[Ockham's Razor]] (p. 150), [[Common Sense]] (p. 39), [[Moorean Facts]] (p. 131)\n4. [[Carving Nature at its Joints]] (p. 27)\n- Short and pointer entries: [[Gedankenexperiment]] (p. 84), [[Analysis]] (p. 5), [[Linguistic Framework]] (p. 118)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "11 Metametaphysics and method/Analysis.md": "---\ngroup: Metametaphysics and method\nrole: pointer\nsource: Beebee et al. 2011, entry \"Analysis\"\npages: p. 5\nstatus: unread\n---\n# Analysis\n**Page(s):** p. 5\n**Pointer entry:** the book only says \"see\" → [[Conceptual Analysis]]. Read that note.\n**Role in [[00 – Metametaphysics and method]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "11 Metametaphysics and method/Canberra Plan.md": "---\ngroup: Metametaphysics and method\nrole: position\nsource: Beebee et al. 2011, entry \"Canberra Plan\"\npages: pp. 25–27 (entry starts p. 25)\nstatus: unread\n---\n# Canberra Plan\n**Page(s):** pp. 25–27 (entry starts p. 25)\n**Book's definition:** p. 25. Copy the first two sentences (a specific form of conceptual analysis; its basic idea).\n**In one line:** A form of conceptual analysis: collect the folk 'platitudes' about C (the folk theory), then ask what in the world plays the C role.\n**Role in [[00 – Metametaphysics and method]]:** A less demanding style of analysis, associated with the Australian National University in Canberra.\n**Explanation:** To analyse 'pain', take the folk theory: pain is typically caused by bodily damage (a hot iron, a pin) and typically causes behaviour (saying 'ouch', pulling away). Then ask what satisfies that theory. If a brain state plays the 'pain role', physicalism (the mental supervenes on the physical) looks plausible. Menzies (1996) applies this to causation. The platitudes include 'causes typically raise the chances of their effects' and 'causation is intrinsic', and energy transfer might play the role. The 'typically's would not be allowed in a full reductive analysis. The advantages: an unmysterious account, plus an explanation of *why* causation is energy transfer and of what would count as causation in worlds without energy. Lewis, who more or less invented the Plan, argues that causation is where we should resist it and do old-style reductive analysis instead (Lewis 2004).\n**Example:** Whatever plays the 'pain role' (perhaps a brain state) is pain.\n**Connections:**\n- is a form of [[Conceptual Analysis]]: because the entry says so.\n- starts from [[Common Sense]]: because it begins with folk platitudes.\n- [[Analysis]]: a pointer entry (to Conceptual Analysis).\n**Bridges to other groups:**\n- [[Supervenience]] and [[Reductionism]] (Tools): because the pain case supports physicalism, and the 'typically's block a full reductive analysis.\n- [[Causation and Laws]] and [[Process Theories of Causation]] (Causation and laws): because Menzies applies it to causation, finding energy transfer.\n- [[Ontological Commitment]] (Ontology): because physics already commits us to energy transfer.\n- [[Lewis, David]] (Philosophers): because he more or less invented it, yet resists it for causation.\n- [[Possible Worlds]] (Modality): because it says what would count as causation in worlds without energy.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Lewis (2004)\n  Full references (from the book's bibliography):\n  - Lewis, D. K. (2004) ‘Void and object’, in J. Collins, E. J. Hall and L. A. Paul (eds), *Causation and Counterfactuals*, Cambridge, MA: MIT Press.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/Carving Nature at its Joints.md": "---\ngroup: Metametaphysics and method\nrole: concept\nsource: Beebee et al. 2011, entry \"Carving Nature at its Joints\"\npages: pp. 27–29 (entry starts p. 27)\nstatus: unread\n---\n# Carving Nature at its Joints\n**Page(s):** pp. 27–29 (entry starts p. 27)\n**Book's definition:** p. 27. Copy the last sentence of paragraph 1: whether some true descriptions enjoy a special metaphysical privilege over and above truth.\n**In one line:** The idea that some true descriptions, or predicates like 'green' rather than 'grue', are more natural: they reflect reality's real divisions.\n**Role in [[00 – Metametaphysics and method]]:** The central notion behind natural properties and kinds, and a live metametaphysical issue.\n**Explanation:** Imagine a language with 'grue' (green before midday, blue after) and 'bleen' (the reverse) instead of 'green' and 'blue'. Its speakers could speak truly as often as we do. Does our language nevertheless better reflect reality? Some say 'green' is *more natural*. According to Lewis (1983a), one mark of natural properties is that they figure in causation and laws: grass's greenness causes my green experience, its grueness causes nothing. Some give reductive accounts. Perfectly natural properties might be universals, with other properties treated as classes. A class nominalist struggles to give one, while trope and resemblance nominalists can appeal to degrees of resemblance. Lewis argues that without naturalness we can't account for intrinsic properties, laws, causation or supervenience. A more difficult debate asks whether some meanings of the logical quantifiers are more natural (Sider 2001 for, Hirsch 2005 against).\n**Example:** Grue and bleen vs green and blue.\n**Connections:**\n- is debated within [[Metametaphysics]]: because whether quantifiers 'carve at the joints' is a metametaphysical question.\n**Bridges to other groups:**\n- [[Natural Property]], [[Natural Kinds]] and [[Sparse Property]] (Kinds of properties): because natural properties and kinds are those that carve at the joints.\n- [[Universals]], [[Class Nominalism]], [[Trope Theory]] and [[Resemblance Nominalism]] (Particulars and universals): because each gives (or can't give) a reductive account of naturalness.\n- [[Law of Nature]] (Causation and laws): because natural properties are the ones involved in causation and laws.\n- [[Essence]] (Modality): because on the 'thick' view only kinds that carve at the joints have essences (Essence entry).\n- [[Lewis, David]] (Philosophers): because of his account of natural properties.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Armstrong (1989) is structured around the need to give some account of the distinction between natural and non-natural classes. Chapter 1 argues for this need; later chapters describe various reductionist and non-reductionist accounts of the distinction. See also Lewis (1983a)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (1989) *Universals: An Opinionated Introduction*, Boulder, CO: Westview Press.\n  - Lewis, D. K. (1983a) ‘New work for a theory of universals’, *Australasian Journal of Philosophy*, 61: 343–77; reprinted in Lewis, D. K. (1999) *Papers in Metaphysics and Epistemology*, Cambridge: Cambridge University Press.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/Common Sense.md": "---\ngroup: Metametaphysics and method\nrole: concept\nsource: Beebee et al. 2011, entry \"Common Sense\"\npages: pp. 39–40 (entry starts p. 39)\nstatus: unread\n---\n# Common Sense\n**Page(s):** pp. 39–40 (entry starts p. 39)\n**Book's definition:** p. 39. Copy the sentence near the end of paragraph 1 that names these propositions 'common sense', and the question that follows it.\n**In one line:** The propositions ordinary people are deeply committed to (there is an external world; mammals are conscious but tables aren't), and the question of how far metaphysics must respect them.\n**Role in [[00 – Metametaphysics and method]]:** A key methodological question: how much weight intuition should get.\n**Explanation:** There are three positions. *Strong conservatives* reject any theory that entails that a common-sense proposition is false. *Mild conservatives* treat fit with common sense as one theoretical virtue among others. *Anti-conservatives* say metaphysicians have no obligation to respect common sense. David Lewis defends mild conservatism (going slightly further). Ironically, many of his theories, such as perdurantism, universalism and genuine modal realism, seem a million miles from common sense. Conservatism tends to attract those hostile to metaphysics as a search for mind-independent reality (the 'metaphobes').\n**Example:** Mammals are conscious; tables are not.\n**Connections:**\n- is weighed as one of the [[Theoretical Virtues]]: because mild conservatives count fit with common sense as a virtue.\n- appeals to 'metaphobes' in [[Metametaphysics]]: because those hostile to metaphysics tend to be conservatives.\n- is the basis of [[Moorean Facts]]: because a Moorean fact is a common-sense proposition we should never give up.\n**Bridges to other groups:**\n- [[Perdurantism]] (Time), [[Universalism]] (Mereology) and [[Modal Realism]] (Modality): because they are Lewis's theories that seem far from common sense.\n- [[Lewis, David]] (Philosophers): because he defends mild conservatism.\n**Multiple meanings:** Strong conservatism, mild conservatism and anti-conservatism.\n**Further reading (book):** Lewis (1986a, 133–5) discusses his attitude to common sense. A strong attack on the tendency of metaphysicians to value what is ‘intuitive’ is found in Chapter 1 of Ladyman *et al.* (2007)\n  Full references (from the book's bibliography):\n  - Lewis, D. K. (1986a) *On the Plurality of Worlds*, Oxford: Blackwell.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/Conceptual Analysis.md": "---\ngroup: Metametaphysics and method\nrole: tool\nsource: Beebee et al. 2011, entry \"Conceptual Analysis\"\npages: pp. 45–47 (entry starts p. 45)\nstatus: unread\n---\n# Conceptual Analysis\n**Page(s):** pp. 45–47 (entry starts p. 45)\n**Book's definition:** p. 45. Copy the second sentence: to analyse a concept is, basically, to provide a definition of it.\n**In one line:** Giving a definition of a concept: necessary and sufficient cond
