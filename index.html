urantism.md": "---\ngroup: Time\nrole: position\nsource: Beebee et al. 2011, entry \"Endurantism\"\npages: pp. 62–63 (entry starts p. 62)\nstatus: unread\n---\n# Endurantism\n**Page(s):** pp. 62–63 (entry starts p. 62)\n**Book's definition:** p. 62. Copy the second sentence (objects are 'wholly present' at every time at which they exist) and the start of the third, which says that for most purposes endurantism is just the denial of perdurantism.\n**In one line:** Usually, the view that objects are 'wholly present' at every time at which they exist. For most purposes, simply the denial of perdurantism: objects don't have temporal parts.\n**Role in [[00 – Time]]:** One of the two main theories of persistence, the rival of perdurantism.\n**Explanation:** Endurantism is hard to define, because it isn't clear what 'wholly present' means. Endurantists agree in rejecting temporal parts but differ in detail, especially over temporary intrinsics and the *argument from coincidence*. A lump of clay is shaped into a statue. The lump has existed longer, so the two have different properties, and by the indiscernibility of identicals they must be distinct: two objects in one place at one time. Perdurantists are often thought to have an easy way out, but endurantists have their own responses. One (Burke 1992): if an object's properties supervene on its particles, the statue and the lump should have the same properties. Nihilists say neither the statue nor the lump exists, only the particles.\n**Example:** The statue and the lump of clay it is made from.\n**Connections:**\n- rejects [[Perdurantism]] and [[Temporal Parts]]: because endurantists deny objects have temporal parts.\n- must answer [[Temporary Intrinsics]]: because how to handle that argument is one way endurantists differ (pointer entry).\n**Bridges to other groups:**\n- [[Leibniz's Law]] (Identity): because the argument from coincidence uses the indiscernibility of identicals.\n- [[Supervenience]] (Tools): because one reply says the statue's and lump's properties supervene on the same particles.\n- [[Nihilism]] (Mereology): because nihilists deny that either the statue or the lump exists.\n- [[Persistence]] (Identity): because endurantism is a theory of how objects persist.\n**Multiple meanings:** The entry notes that 'wholly present' resists definition, so endurantism is often defined just by what it denies.\n**Further reading (book):** Olson (1996); Sider (2001, Chapter 5)\n  Full references (from the book's bibliography):\n  - Olson, E. (1996) ‘Composition and coincidence’, *Pacific Philosophical Quarterly*, 77: 374–403.\n  - Sider, T. (2001) *Four-Dimensionalism*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Eternalism.md": "---\ngroup: Time\nrole: position\nsource: Beebee et al. 2011, entry \"Eternalism\"\npages: pp. 65–67 (entry starts p. 65)\nstatus: unread\n---\n# Eternalism\n**Page(s):** pp. 65–67 (entry starts p. 65)\n**Book's definition:** p. 65, the first two sentences of the entry.\n**In one line:** The view that all times exist, past, present and future, though not all of them exist *now*.\n**Role in [[00 – Time]]:** One of the three main theories of the ontology of time.\n**Explanation:** The dinosaurs, the Big Bang and any future outposts on Mars all exist, but not *now*. Just as things on the other side of the planet exist without being *here*, they aren't temporally local. This is a 'tenseless' sense of existence; some find it unintelligible and reject eternalism on that ground (Crisp, Ludlow). Eternalism is almost always combined with a tenseless view of time (the moving spotlight is an exception). It was historically paired with perdurantism, but is now often thought neutral between perdurantism and endurantism. Many accept it because it avoids presentism's problems: true propositions about Genghis Khan, relativity's lack of a privileged present, travelling to other times, and truthmakers for claims about the past.\n**Example:** The dinosaurs exist, just not now.\n**Connections:**\n- rivals [[Presentism]] and [[Growing Block Theory]]: because they deny the existence of future (and past) times.\n- is usually paired with [[Tensed and Tenseless Theories of Time]]: because eternalists usually take the tenseless view, the exception being the [[Moving Spotlight Theory of Time]].\n- is neutral between [[Perdurantism]] and [[Endurantism]]: because, the entry says, this neutrality is now a popular view.\n- handles [[Relativity]] and [[Time Travel]]: because these cause trouble for presentism but not for eternalism.\n**Bridges to other groups:**\n- [[Truthmakers]], [[States of Affairs]] and [[Proposition]] (Truth): because past times and things provide truthmakers for propositions about the past.\n- [[Abstract vs Concrete]] (Ontology): because tenseless existence is compared to abstract objects existing outside time.\n- [[Indexical]] (Tools): because for the eternalist 'now' is an indexical (Growing Block Theory entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Rea (2003); Sider (2001, Chapter 2)\n  Full references (from the book's bibliography):\n  - Rea, M. (2003) ‘Four-dimensionalism’, in M. Loux and D. Zimmerman (eds), *The Oxford Handbook of Metaphysics*, Oxford: Oxford University Press.\n  - Sider, T. (2001) *Four-Dimensionalism*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Flow of Time.md": "---\ngroup: Time\nrole: concept\nsource: Beebee et al. 2011, entry \"Flow of Time\"\npages: pp. 77–78 (entry starts p. 77)\nstatus: unread\n---\n# Flow of Time\n**Page(s):** pp. 77–78 (entry starts p. 77)\n**Book's definition:** p. 77. There's no one-sentence definition. Copy the sentence in paragraph 1 beginning \"In other words, time flows…\".\n**In one line:** The intuitive idea that we are carried continually forward through time, as we are not through space.\n**Role in [[00 – Time]]:** A strong intuition that tensed theories and presentism appeal to, and that rival views must explain away.\n**Explanation:** We can move around in space as we like, but we keep advancing through time whatever we do. That flow is not the same as direction: a river current has a direction, but you can swim upstream. The intuition is sometimes taken as a reason to believe that time is tensed or that only the present exists. Eternalists, tenseless theorists and 'static' theorists take on the job of explaining why time *seems* to flow. Some even argue that an objective flow of time would itself create problems.\n**Example:** Whatever you do, you advance through time second by second.\n**Connections:**\n- differs from the [[Direction of Time]]: because direction is about order, flow about passage.\n- supports [[Tensed and Tenseless Theories of Time]] on the tensed side and [[Presentism]]: because flow's intuitiveness is taken as evidence for them.\n- must be explained away by [[Eternalism]]: because eternalists deny there is objective flow.\n- sets aside [[Backwards Causation]]: because that possibility may bear on whether time flows.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Markosian (1993); Le Poidevin (2009)\n  Full references (from the book's bibliography):\n  - Markosian, N. (1993) ‘How fast does time pass?’, *Philosophy and Phenomenological Research*, 53: 829–44.\n  - Le Poidevin, R. (2009) ‘The experience and perception of time’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Winter 2009 edn. Online. Available at: http://plato.stanford.edu/archives/win2009/entries/time-experience.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Four-Dimensionalism.md": "---\ngroup: Time\nrole: concept\nsource: Beebee et al. 2011, entry \"Four-Dimensionalism\"\npages: p. 79\nstatus: unread\n---\n# Four-Dimensionalism\n**Page(s):** p. 79\n**Book's definition:** p. 79. Copy the first two sentences (the term is ambiguous between three theories).\n**In one line:** An ambiguous label. It can mean perdurantism, eternalism, or a package of perdurantism, eternalism and the tenseless view.\n**Role in [[00 – Time]]:** A term to watch for: always check which of its three senses an author means.\n**Explanation:** In the first sense, objects are extended in time and have temporal parts (perdurantism). In the second, every moment exists, so the Universe and everything lasting longer than an instant is four-dimensional (eternalism). In the third, it names a package of perdurantism, eternalism and the tenseless theory of time.\n**Example:** (The entry gives no example; it lists the three senses.)\n**Connections:**\n- can mean [[Perdurantism]], [[Eternalism]] or a package with [[Tensed and Tenseless Theories of Time]]: because these are its three senses.\n- involves [[Temporal Parts]]: because the first sense is the view that objects have them.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** Yes, three: perdurantism; eternalism; perdurantism + eternalism + the tenseless view.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Grandfather Paradox.md": "---\ngroup: Time\nrole: pointer\nsource: Beebee et al. 2011, entry \"Grandfather Paradox\"\npages: p. 86\nstatus: unread\n---\n# Grandfather Paradox\n**Page(s):** p. 86\n**Pointer entry:** the book only says \"see\" → [[Time Travel]]. Read that note.\n**Role in [[00 – Time]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "05 Time/Growing Block Theory.md": "---\ngroup: Time\nrole: position\nsource: Beebee et al. 2011, entry \"Growing Block Theory\"\npages: pp. 86–88 (entry starts p. 86)\nstatus: unread\n---\n# Growing Block Theory\n**Page(s):** pp. 86–88 (entry starts p. 86)\n**Book's definition:** p. 86, the opening sentence of the entry.\n**In one line:** The view that past and present times exist but future times do not, so the 'block' of what exists grows as time passes.\n**Role in [[00 – Time]]:** The least popular of the three main theories of the ontology of time.\n**Explanation:** As time passes, more moments are added to the past, and the present always sits at the edge of the growing block. The view has supporters and the pedigree of C. D. Broad. Its motivations all appeal to a serious metaphysical difference between past and future. Tooley argues that causal asymmetry (an effect depends on its cause, not vice versa) requires that the cause exists when the effect doesn't yet, and he finds similar asymmetries in counterfactuals. Diekemper focuses on an asymmetry of fixity. The most popular objection is the 'dead past' objection (Bourne 2002; Merricks 2006). Eternalism combined with a tenseless theory avoids that problem, because for the eternalist 'now' is an indexical.\n**Example:** The block of existing times getting bigger as each moment passes.\n**Connections:**\n- rivals [[Presentism]] and [[Eternalism]]: because it accepts the past but not the future.\n- is usually paired with the tensed side of [[Tensed and Tenseless Theories of Time]]: because growing block theorists generally take the tensed view (Tooley is an exception).\n**Bridges to other groups:**\n- [[Causation and Laws]] (Causation and laws): because Tooley's argument rests on the asymmetry of causation.\n- [[Counterfactual Conditional]] (Tools): because Tooley finds the same asymmetry in counterfactuals.\n- [[Indexical]] (Tools): because eternalists avoid the dead past objection by treating 'now' as indexical.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Moving Spotlight Theory of Time.md": "---\ngroup: Time\nrole: position\nsource: Beebee et al. 2011, entry \"Moving Spotlight Theory of Time\"\npages: p. 133\nstatus: unread\n---\n# Moving Spotlight Theory of Time\n**Page(s):** p. 133\n**Book's definition:** p. 133, the opening sentence of the entry.\n**In one line:** Eternalism plus the tensed theory: every time exists, but the present moment is still metaphysically privileged, like a spotlight moving along a street of houses.\n**Role in [[00 – Time]]:** The tensed form of eternalism.\n**Explanation:** Different times are like houses along a street, and the present is a spotlight shone on them one by one. The view appears to be what McTaggart had in mind when he argued against the existence of time.\n**Example:** Times as houses on a street, with the present as the moving spotlight.\n**Connections:**\n- combines [[Eternalism]] with the tensed side of [[Tensed and Tenseless Theories of Time]]: because those are its two parts.\n- is the target of the [[Unreality of Time]]: because it seems to be what McTaggart attacked.\n**Bridges to other groups:**\n- [[McTaggart, J. M. E.]] (Philosophers): because his argument seems aimed at this view.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Perdurantism.md": "---\ngroup: Time\nrole: position\nsource: Beebee et al. 2011, entry \"Perdurantism\"\npages: pp. 158–161 (entry starts p. 158)\nstatus: unread\n---\n# Perdurantism\n**Page(s):** pp. 158–161 (entry starts p. 158)\n**Book's definition:** p. 158. Copy the second sentence of the entry (perdurantism is the thesis that objects also have temporal parts).\n**In one line:** The thesis that objects have temporal parts as well as spatial parts. Napoleon is composed of year-long, day-long and instantaneous temporal parts.\n**Role in [[00 – Time]]:** One of the two main theories of persistence, the rival of endurantism.\n**Explanation:** Just as a table is composed of a top and four legs, Napoleon is composed of temporal parts, which are material objects in their own right. The entry gives three motivations. (1) *Temporary intrinsics*: Hulk Hogan was once 2′ tall and is now 6′7″. Saying he has the properties 'at different times' needs explaining, and perdurantism explains it: different temporal parts have the incompatible properties, as my hand has fingers and my head doesn't. Presentism is a non-perdurantist alternative. (2) *Coincidence*: perdurantism seems to give an easy answer to the statue and the lump, though Wasserman (2002) argues it doesn't really avoid the problem. (3) *Humean supervenience* (Lewis 1983b): Lewis imagines a world of instantaneous objects matching ours instant by instant. If everything supervenes on how the world is at instants, our world, too, must be made up of such instantaneous parts.\n**Example:** Hulk Hogan, 2′ tall as a child and 6′7″ now.\n**Connections:**\n- rivals [[Endurantism]]: because endurantists deny that objects have temporal parts.\n- is built on [[Temporal Parts]]: because they are what objects are composed of on this view.\n- answers [[Temporary Intrinsics]]: because different temporal parts have the incompatible properties (pointer entry).\n- is one sense of [[Four-Dimensionalism]]: because that term sometimes just means perdurantism.\n- is supported by [[Relativity]]: because there are arguments from relativity for perdurantism (Relativity entry).\n**Bridges to other groups:**\n- [[Leibniz's Law]] (Identity): because the argument from coincidence relies on it.\n- [[Humean Supervenience]] (Causation and laws) and [[Lewis, David]] (Philosophers): because Lewis's third argument uses Humean supervenience.\n- [[Persistence]] (Identity): because perdurantism is a theory of how things persist.\n- [[Multiple Occupancy Thesis]] (Personal identity): because that thesis makes most sense given perdurantism (Fission entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Sider (2001, Chapters 3–5)\n  Full references (from the book's bibliography):\n  - Sider, T. (2001) *Four-Dimensionalism*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Presentism.md": "---\ngroup: Time\nrole: position\nsource: Beebee et al. 2011, entry \"Presentism\"\npages: pp. 177–179 (entry starts p. 177)\nstatus: unread\n---\n# Presentism\n**Page(s):** pp. 177–179 (entry starts p. 177)\n**Book's definition:** p. 177, the opening sentence of the entry.\n**In one line:** The view that the only concrete things that exist are those that exist now.\n**Role in [[00 – Time]]:** The most intuitive theory of the ontology of time, and the main rival to eternalism.\n**Explanation:** Now there are dolphins, but there are no dinosaurs and no George Washington. Presentism concerns only *concrete* things, so presentists can accept abstract objects; some even accept all times as abstract 'ersatz' times, like ersatz possible worlds. Motivations: it is intuitive, so it is the default view; some say only it can answer McTaggart's argument; it fits endurantism (Crisp 2003) and solves temporary intrinsics; and it inherits the motivations for tensed theories. Objections: truthmaking (what makes propositions about the past and future true? Some introduce abstract truthmakers such as properties, facts or haecceities; Keller 2004, Zimmerman 2008). And relativity makes simultaneity relative to frames of reference, so no present seems privileged.\n**Example:** Dolphins exist; dinosaurs don't.\n**Connections:**\n- rivals [[Eternalism]] and [[Growing Block Theory]]: because they accept non-present times.\n- always goes with the tensed side of [[Tensed and Tenseless Theories of Time]]: because presentists invariably endorse the tensed theory.\n- claims to answer [[Unreality of Time]]: because presentists say only their view escapes McTaggart.\n- fits [[Endurantism]]: because it is said to be consistent with it and to solve temporary intrinsics.\n- is challenged by [[Relativity]] and [[Time Travel]]: because simultaneity is frame-relative, and there seem to be no other times to travel to.\n**Bridges to other groups:**\n- [[Truthmakers]] and [[Proposition]] (Truth): because the main objection is that nothing makes propositions about the past true.\n- [[Abstract vs Concrete]] (Ontology): because presentism concerns only concrete things.\n- [[Modal Realism]] (Modality): because 'ersatz times' are modelled on ersatz possible worlds.\n- [[Haecceitism]] (Modality): because haecceities are among the proposed abstract truthmakers.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Bourne (2006, especially Chapters 2 and 3); Crisp (2003); Zimmerman (2008)\n  Full references (from the book's bibliography):\n  - Bourne, C. (2006) *A Future for Presentism*, Oxford: Oxford University Press.\n  - Crisp, T. (2003) ‘Presentism’, in M. Loux and D. Zimmerman (eds), *The Oxford Handbook of Metaphysics*, Oxford: Oxford University Press.\n  - Zimmerman, D. (2008) ‘The privileged present: defending an “*A*-theory” of time’, in T. Sider, J. Hawthorne and D. Zimmerman (eds), *Contemporary Debates in Metaphysics*, Oxford: Blackwell.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Relativity.md": "---\ngroup: Time\nrole: concept\nsource: Beebee et al. 2011, entry \"Relativity\"\npages: pp. 223–224 (entry starts p. 223)\nstatus: unread\n---\n# Relativity\n**Page(s):** pp. 223–224 (entry starts p. 223)\n**Book's definition:** p. 223. There's no definition sentence. The entry opens with the Michelson–Morley result: copy its first sentence.\n**In one line:** Einstein's theory, prompted by the finding that light's speed is the same for every observer. It brings time dilation and length contraction, and bears on whether there is a privileged present.\n**Role in [[00 – Time]]:** The physics that the metaphysics of time has to fit.\n**Explanation:** In 1887 Michelson and Morley showed that the speed of light in a vacuum is the same for everything, however it moves. That is very strange: if you ran after a photon at just under light speed, it would still race away from you at light speed. Einstein's Special Theory of Relativity explains this through time dilation and length contraction. The fast traveller's clocks run slow and his rulers shrink, and each observer thinks the other is the one affected. The theory bears directly on presentism. There are also arguments from relativity for perdurantism (Balashov 1999; Gibson and Pooley 2006; Gilmore 2006).\n**Example:** Chasing a photon at one metre per second slower than light.\n**Connections:**\n- challenges [[Presentism]]: because simultaneity is relative to frames of reference (Presentism entry).\n- supports [[Perdurantism]]: because there are relativity-based arguments for it.\n- is used against the tensed side of [[Tensed and Tenseless Theories of Time]]: because tenseless theorists say relativity shows there's no objective present.\n- favours [[Eternalism]]: because eternalism has no difficulty with it (Eternalism entry).\n**Bridges to other groups:**\n- [[God's Eye View]] (Realism and anti-realism): because tenseless theorists say that in the God's eye view there is no special present moment.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** A good introduction to special relativity is Sklar (1992, Chapter 2). For more on the metaphysics see Hawley (2009)\n  Full references (from the book's bibliography):\n  - Sklar, L. (1992) *Philosophy of Physics*, Oxford: Oxford University Press.\n  - Hawley, K. (2009) ‘Metaphysics and relativity’, in R. Le Poidevin, P. Simons, A. McGonigal and R. Cameron (eds), pp. 507–16, *The Routledge Companion to Metaphysics*, London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Temporal Parts.md": "---\ngroup: Time\nrole: concept\nsource: Beebee et al. 2011, entry \"Temporal Parts\"\npages: pp. 244–245 (entry starts p. 244)\nstatus: unread\n---\n# Temporal Parts\n**Page(s):** pp. 244–245 (entry starts p. 244)\n**Book's definition:** p. 244, the opening sentence of the entry.\n**In one line:** A temporal part of a thing is 'all of it' throughout some period of time, as the first half is a temporal part of a football match.\n**Role in [[00 – Time]]:** The posits on which perdurantism is built.\n**Explanation:** For events, temporal parts are uncontroversial. Perdurantists say objects have them too. My first-year temporal part is a genuine object that starts baby-sized, grows, and then ceases to exist, and a century-long life would have a hundred year-long parts, and day-long and hour-long ones too. Most important are *instantaneous* temporal parts: three-dimensional objects, extended in space but not in time, and infinite in number. They are crucial to the argument from temporary intrinsics. The definition most used is Sider's: x is an instantaneous temporal part of y at t if x is part of y, exists only at t, and overlaps every part of y at t.\n**Example:** The first and second halves of a football match.\n**Connections:**\n- are what [[Perdurantism]] says objects have: because objects are composed of them.\n- are rejected by [[Endurantism]]: because endurantists deny objects have temporal parts.\n- feature in [[Four-Dimensionalism]]: because one sense of it is the view that objects have temporal parts.\n**Bridges to other groups:**\n- [[Event]] (Causation and laws): because events uncontroversially have temporal parts.\n- [[Part]] and [[Overlap]] (Mereology): because Sider's definition is stated in mereological terms.\n- [[Infinity]] (Sets, classes and infinity): because instantaneous temporal parts are infinite in number.\n- [[Fictionalism]] (Ontology): because there is a fictionalism about temporal parts (Kroon 2001, in the Fictionalism entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Sider (2001, Chapter 3)\n  Full references (from the book's bibliography):\n  - Sider, T. (2001) *Four-Dimensionalism*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Temporary Intrinsics.md": "---\ngroup: Time\nrole: pointer\nsource: Beebee et al. 2011, entry \"Temporary Intrinsics\"\npages: p. 245\nstatus: unread\n---\n# Temporary Intrinsics\n**Page(s):** p. 245\n**Pointer entry:** the book only says \"see\" → [[Perdurantism]]. Read that note.\n**Role in [[00 – Time]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "05 Time/Tensed and Tenseless Theories of Time.md": "---\ngroup: Time\nrole: position\nsource: Beebee et al. 2011, entry \"Tensed and Tenseless Theories of Time\"\npages: entry starts p. 245\nstatus: unread\n---\n# Tensed and Tenseless Theories of Time\n**Page(s):** entry starts p. 245\n**Book's definition:** p. 245. Copy the first sentence (tensed facts, or 'A-facts') and the sentence in paragraph 1 beginning \"Other temporal facts are tenseless…\".\n**In one line:** The debate over whether tensed facts (past, present, future: 'A-facts') or tenseless facts (earlier, later, simultaneous: 'B-facts') are real or fundamental.\n**Role in [[00 – Time]]:** The central debate about the nature of time, linked to every theory of time's ontology.\n**Explanation:** Tensed facts change: what was future becomes present and then past. Tenseless facts don't: the Battle of Hastings is always earlier than the American Civil War. The debate is put in several ways. Does one kind of fact reduce to the other? Are tensed facts intrinsic to events, and mind-independent? Are tenseless facts the truthmakers for tensed ones? Which is more fundamental? There are standard packages: presentists always take the tensed side, growing block theorists usually do (Tooley is an exception), and eternalists usually take the tenseless side (except the moving spotlight). One tenseless strategy admits that tensed sentences can't be *translated* into tenseless ones, but gives their *truth conditions* in tenseless terms, using tokens of sentence-types. Arguments include McTaggart's (only the tenseless view escapes it), the flow of time, and relativity (no objective present in the God's eye view).\n**Example:** 'The Battle of Hastings took place a thousand years ago', uttered in 2010.\n**Connections:**\n- [[A-Theory]] and [[B-Theory]]: pointer entries for the two sides.\n- packages with [[Presentism]], [[Growing Block Theory]], [[Eternalism]] and [[Moving Spotlight Theory of Time]]: because each typically takes a side.\n- responds to [[Unreality of Time]]: because some argue only the tenseless view escapes McTaggart.\n- is pressed by [[Flow of Time]] and [[Relativity]]: because these are arguments on each side.\n**Bridges to other groups:**\n- [[Truthmakers]] and [[Truth Conditions]] (Truth): because the debate asks whether tenseless facts make tensed claims true, and gives their truth conditions.\n- [[Reductionism]] (Tools): because one formulation asks which kind of fact reduces to the other.\n- [[Type and Tokens]] and [[Indexical]] (Tools): because the tenseless strategy uses tokens of sentence-types, and treats 'now' as indexical.\n- [[God's Eye View]] (Realism and anti-realism): because tenseless theorists cite relativity's God's eye view.\n**Multiple meanings:** The A/B terminology comes from McTaggart. The entry notes the different formulations of the debate may not amount to the same thing.\n**Further reading (book):** Dainton (2001, Chapters 3, 5 and 6); Markosian (2009)\n  Full references (from the book's bibliography):\n  - Dainton, B. (2001) *Time and Space*, Chesham: Acumen.\n  - Markosian, N. (2009) ‘Time’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2009 edn. Online. Available at: http://plato.stanford.edu/archives/fall2009/entries/time.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Time Travel.md": "---\ngroup: Time\nrole: concept\nsource: Beebee et al. 2011, entry \"Time Travel\"\npages: p. 253\nstatus: unread\n---\n# Time Travel\n**Page(s):** p. 253\n**Book's definition:** p. 253. There's no definition. Copy the description of the grandfather paradox in paragraph 1 (from \"Imagine you travel back in time…\").\n**In one line:** The question whether travelling to other times is possible. It is dominated by the grandfather paradox.\n**Role in [[00 – Time]]:** A test case for theories of time, persistence and causation.\n**Explanation:** If you went back and killed your grandfather before he met your grandmother, you would never be born, so you couldn't go back, so he wouldn't be killed. Yet we said he was killed. One hard-line lesson: backwards causation is impossible. A milder lesson: you *can* time travel, but any attempt to kill your grandfather will be thwarted. Perhaps the gun misfires, or you shoot the wrong man, or you slip on a banana peel (Lewis 1976; Smith 1997). If time travel is possible, it seems to conflict with presentism, and to cause problems for endurantism that perdurantism handles better. Since time travel always involves backwards causation, every issue about backwards causation bears on it.\n**Example:** The banana peel that stops you shooting your grandfather.\n**Connections:**\n- [[Grandfather Paradox]]: a pointer entry that sends you here.\n- always involves [[Backwards Causation]]: because travelling into the past means later causes having earlier effects.\n- seems to conflict with [[Presentism]]: because there would be no other times to travel to.\n- favours [[Perdurantism]] over [[Endurantism]]: because endurantism runs into problems with backwards causation that perdurantism is better suited to answer.\n**Bridges to other groups:**\n- [[Lewis, David]] (Philosophers): because his 1976 paper gives the 'you will be thwarted' response.\n- [[Particulars]] (Particulars and universals): because the definition of a particular sets time travel cases aside.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Dainton (2001, Chapter 8); Lewis (1976)\n  Full references (from the book's bibliography):\n  - Dainton, B. (2001) *Time and Space*, Chesham: Acumen.\n  - Lewis, D. K. (1976) ‘The paradoxes of time travel’, *American Philosophical Quarterly*, 13: 145–52; reprinted in Lewis 1986b.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Time.md": "---\ngroup: Time\nrole: concept\nsource: Beebee et al. 2011, entry \"Time\"\npages: entry starts p. 252\nstatus: unread\n---\n# Time\n**Page(s):** entry starts p. 252\n**Book's definition:** p. 252. There's no definition: this is the book's overview entry for the topic. Copy its first sentence.\n**In one line:** The book's overview: the philosophy of time studies the nature of time itself, and how time bears on the things in it.\n**Role in [[00 – Time]]:** The book's own topic entry for this group.\n**Explanation:** The philosophy of time has roots in Zeno's ancient puzzles about infinity, but came into its own with McTaggart's argument for the unreality of time. Responses to McTaggart shaped the modern debate: tensed vs tenseless theories; which times exist (presentism, eternalism, the growing block); whether time flows; the direction of time; and, spurred partly by relativity, whether backwards causation and time travel are possible. It also asks how time bears on things in it: do objects have temporal parts (endurantism vs perdurantism), and when are they identical across time?\n**Example:** McTaggart's claim that nothing really changes and there is no time.\n**Connections:**\n- maps [[Unreality of Time]] and [[Tensed and Tenseless Theories of Time]]: because McTaggart's argument and the responses to it started the modern debate.\n- maps [[Presentism]], [[Eternalism]] and [[Growing Block Theory]]: because they are the theories of which times exist.\n- maps [[Flow of Time]], [[Direction of Time]], [[Backwards Causation]] and [[Time Travel]]: because they are further topics in the field.\n- maps [[Endurantism]], [[Perdurantism]] and [[Temporal Parts]]: because they concern things in time.\n**Bridges to other groups:**\n- [[Zeno]] and [[Infinity]] (Sets, classes and infinity): because the field's roots are Zeno's puzzles about infinity.\n- [[Identity Over Time]] (Identity): because the field asks when things are identical across time.\n- [[McTaggart, J. M. E.]] (Philosophers): because his argument brought the field into its stride.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Markosian (2009)\n  Full references (from the book's bibliography):\n  - Markosian, N. (2009) ‘Time’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2009 edn. Online. Available at: http://plato.stanford.edu/archives/fall2009/entries/time.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Unreality of Time.md": "---\ngroup: Time\nrole: argument\nsource: Beebee et al. 2011, entry \"Unreality of Time\"\npages: pp. 267–268 (entry starts p. 267)\nstatus: unread\n---\n# Unreality of Time\n**Page(s):** pp. 267–268 (entry starts p. 267)\n**Book's definition:** p. 267, the opening sentence of the entry.\n**In one line:** McTaggart's argument that time doesn't exist: time requires tensed A-facts, but A-facts lead to a contradiction.\n**Role in [[00 – Time]]:** The argument that launched the modern philosophy of time.\n**Explanation:** McTaggart distinguishes tensed A-facts ('the Battle of Hastings is past') from tenseless B-facts ('Hastings is earlier than Waterloo'). He argues time requires A-facts. But every event is at some point future, present and past (Hastings was future in 1065, present in 1066, and is past now), so every event is past, present *and* future, which is a contradiction. So there are no A-facts, and therefore no time. The obvious reply is that an event has these properties at *different* times, not at once, a move similar to the problem of temporary intrinsics. McTaggart argues that this reply leads to a vicious regress, but whether he succeeds is debatable. Other responses: drop A-facts but keep time (tenseless theorists), or drop non-present times so that every time is present (presentists).\n**Example:** The Battle of Hastings: future in 1065, present in 1066, past now.\n**Connections:**\n- relies on [[Tensed and Tenseless Theories of Time]]: because it turns on A-facts vs B-facts.\n- is answered by [[Presentism]] and by the tenseless theory: because each drops one premise.\n- seems aimed at the [[Moving Spotlight Theory of Time]]: because that view seems to be what McTaggart had in mind.\n- parallels [[Temporary Intrinsics]]: because the 'at different times' reply resembles that problem (pointer entry).\n**Bridges to other groups:**\n- [[McTaggart, J. M. E.]] (Philosophers): because the argument is his (1908).\n- [[Realism and Anti-Realism]] (Realism and anti-realism): because McTaggart's conclusion is anti-realism about time, one of the entities that realism debates concern.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Dummett (1960); Lowe (1987)\n  Full references (from the book's bibliography):\n  - Dummett, M. (1960) ‘A defense of McTaggart’s proof of the unreality of time’, *The Philosophical Review*, 69: 497–504.\n  - Lowe, E. J. (1987) ‘The indexical fallacy in McTaggart’s proof of the unreality of time’, *Mind*, 96: 62–70.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/00 – Causation and laws.md": "---\ngroup: Causation and laws\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Causation and laws\n**Central question:** What is it for one thing to cause another, and what are laws of nature? Must either involve natural necessity?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| [[Regularity Theory of Causation]] | Causation is constant conjunction plus contiguity and precedence | Humean (after Hume's 'first definition') | Rules out [[Backwards Causation]]; judged inadequate by Lewis |\n| [[INUS Conditions]] | Causes are INUS conditions | Mackie (1965) | Fell into disrepute (Kim 1971) |\n| [[Counterfactual Theory of Causation]] | c causes e if e depends (via a chain) on c | Lewis (1973a) | [[Pre-Emption]], [[Trumping]], [[Overdetermination]] |\n| [[Probabilistic Theories of Causation]] | Causes raise the chances of their effects | Lewis's version; Beebee (1998) on change | Many counterexamples |\n| [[Process Theories of Causation]] | Causation is energy transfer | — | Rules out [[Causation by Absence]]; not a conceptual analysis |\n| [[Singularism]] | Causation needn't fall under laws | Anscombe, Armstrong, Tooley | Seems to bring in [[Natural Necessity]] |\n| [[Regularity Theory of Laws of Nature]] | A law is just a true generalisation | — | Accidental regularities: 'a lost cause' |\n| [[Ramsey–Lewis View of Laws]] | Laws are the axioms and theorems of the best system | Ramsey, Mill, Lewis | Simplicity is relative; the single-particle world |\n| [[Dretske-Tooley-Armstrong View of Laws]] | Laws are necessitation relations between universals | Dretske, Tooley, Armstrong | Uninstantiated laws; what is N? (Lewis); unavailable to nominalists |\n| [[Humean Supervenience]] | Everything supervenes on local, point-sized facts | Lewis | Seems to lead to quidditism |\n\n## Key arguments and test cases\n- Two bridge bombers; the spells world: [[Pre-Emption]] (p. 174)\n- The back-up shooter: [[Counterfactual Theory of Causation]] (p. 54)\n- Two bricks through one window: [[Overdetermination]] (p. 154)\n- The washing and the firing squad: [[Redundant Causation]] (p. 217)\n- The bomb, the timer and the bridge: [[INUS Conditions]] (p. 111)\n- e = mc² vs the giant gold sphere: [[Law of Nature]] (p. 114)\n- The cubes, spheres and sounds (simplicity): [[Ramsey–Lewis View of Laws]] (p. 205)\n- The lack of oxygen; negative events: [[Causation by Absence]] (p. 33)\n- The indeterministic coin-flipping bomb: [[Probabilistic Theories of Causation]] (p. 185)\n\n## Bridges to other groups\n- **Free will:** [[Determinism]], [[Consequence Argument]] and [[Agent Causation]], because determinism is defined by laws, and free will may require agent causation.\n- **Modality:** [[Possible Worlds]] and [[Necessity]], because Humeans make necessity inter-world, and counterfactuals use closest worlds.\n- **Kinds of properties:** [[Categorical and Dispositional Properties]] and [[Quidditism]], because fundamental dispositions are a home for natural necessity.\n- **Truth:** [[Facts]], [[Negative Facts]] and [[Truthmakers]], because of the facts-as-relata view and singularism's local truthmakers.\n- **Time:** [[Backwards Causation]] and [[Direction of Time]], because they clash with the regularity theory's precedence clause.\n- **Sets:** [[Ancestral Relation]], because Lewis defines causation as the ancestral of dependence.\n\n## Reading path (pages in the book)\n1. **Overview:** [[Causation and Laws]] (p. 32), [[Humean Supervenience]] (p. 93), [[Natural Necessity]] (p. 135), [[Humeanism]] (p. 93)\n2. **Laws:** [[Law of Nature]] (p. 114), [[Regularity Theory of Laws of Nature]] (p. 219), [[Ramsey–Lewis View of Laws]] (p. 205), [[Dretske-Tooley-Armstrong View of Laws]] (p. 59)\n3. **Theories of causation:** [[Regularity Theory of Causation]] (p. 217), [[INUS Conditions]] (p. 111), [[Counterfactual Theory of Causation]] (p. 54), [[Process Theories of Causation]] (p. 193), [[Singularism]] (p. 233)\n4. **Problem cases:** [[Pre-Emption]] (p. 174), [[Trumping]] (p. 257), [[Overdetermination]] (p. 154), [[Redundant Causation]] (p. 217), [[Causation by Absence]] (p. 33), [[Neuron Diagram]] (p. 141)\n5. **Probability:** [[Probability]] (p. 189), [[Chance]] (p. 34), [[Probabilistic Theories of Causation]] (p. 185), [[Probabilistic Theories of Causation (Type-Level)]] (p. 187)\n6. **Relata and levels:** [[Causal Relata]] (p. 30), [[Event]] (p. 67), [[Token-Level Causation]] (p. 254), [[Type-Level Causation]] (p. 264)\n- Short entries: [[General Causal Sentences]] (p. 84), [[Singular Causal Sentences]] (p. 233), [[Natural Law]] (p. 135)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "06 Causation and laws/Causal Relata.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Causal Relata\"\npages: pp. 30–32 (entry starts p. 30)\nstatus: unread\n---\n# Causal Relata\n**Page(s):** pp. 30–32 (entry starts p. 30)\n**Book's definition:** p. 30. Copy the first sentence, which poses the question of what causation relates.\n**In one line:** What kinds of thing causation relates. For type-level causation, properties; for token-level causation, most popularly events, or else facts.\n**Role in [[00 – Causation and laws]]:** A background question that every theory of causation has to answer.\n**Explanation:** For 'smoking causes cancer', the relata are fairly uncontroversially properties (*smokes*, *has cancer*). For token claims like 'the brick I threw smashed the window', the most popular view is that the relata are events (Lewis 1986c, Kim 1973, Davidson 1969). Another popular view is that they are facts: Mellor (1995) says the basic form of a causal claim is 'E because C'. Facts help with causation by absence ('the lack of oxygen caused Joe to fall unconscious' can cite a negative fact). But events are concrete, located in space and time, while facts seem abstract, and causation intuitively holds between concrete things, not objects in Platonic Heaven. Others propose states of affairs or tropes. Believers in agent causation reject the idea that all causation has one kind of relata.\n**Example:** 'The brick I threw smashed the window': two events, or two facts?\n**Connections:**\n- takes [[Event]] as the most popular answer: because events are the leading candidate for token-level relata.\n- is shaped by [[Causation by Absence]]: because facts handle absences better than events.\n- differs for [[Type-Level Causation]] and [[Token-Level Causation]]: because type-level relata are properties.\n**Bridges to other groups:**\n- [[Facts]] and [[Negative Facts]] (Truth): because Mellor makes facts the relata, and absences seem to need negative facts.\n- [[Abstract vs Concrete]] (Ontology): because events seem concrete and facts abstract.\n- [[Trope Theory]] (Particulars and universals): because tropes are another proposed relatum.\n- [[Agent Causation]] (Free will): because agent causation denies that all causes are events or facts.\n- [[Relata]] (Sets, classes and infinity): because the question is what the relation's relata are.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Menzies (1989); Lowe (2002, Chapter 9); Schaffer (2008, § 1)\n  Full references (from the book's bibliography):\n  - Menzies, P. (1989) ‘A unified account of causal relata’, *Australasian Journal of Philosophy*, 67: 59–83.\n  - Lowe, E. J. (2002) *A Survey of Metaphysics*, Oxford: Oxford University Press.\n  - Schaffer, J. (2008) ‘The metaphysics of causation’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/causation-metaphysics.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Causation and Laws.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Causation and Laws\"\npages: entry starts p. 32\nstatus: unread\n---\n# Causation and Laws\n**Page(s):** entry starts p. 32\n**Book's definition:** p. 32. There's no definition: this is the book's overview entry. Copy its first sentence.\n**In one line:** The book's overview: the debate between Humeans, who deny natural necessity, and anti-Humeans over what causation and laws of nature are.\n**Role in [[00 – Causation and laws]]:** The book's own topic entry for this group.\n**Explanation:** The modern debate is rooted in Hume, whose line is that there's no natural necessity in the world. Lewis leads the Humeans, Armstrong the anti-Humeans. For laws, the regularity theory worries about accidental regularities, which leads to the sophisticated Ramsey–Lewis view; anti-Humeans offer the Dretske-Tooley-Armstrong view. For causation, Humeans offer the regularity theory, INUS conditions and the counterfactual theory, which face problems with pre-emption, overdetermination and causation by absence. Singularism is an anti-Humean option, and some doubt that causation can be reductively analysed at all (Menzies suggests a Canberra Plan analysis). The debate connects with indeterminism (probabilistic theories), causal relata (events or facts), and free will: Humean laws might help avoid incompatibilism (Beebee and Mele 2001), and some argue free will needs agent causation.\n**Example:** 'Jim's bad driving caused the car to crash.'\n**Connections:**\n- maps the theories of [[Law of Nature]]: [[Regularity Theory of Laws of Nature]], [[Ramsey–Lewis View of Laws]] and [[Dretske-Tooley-Armstrong View of Laws]].\n- maps the theories of causation: [[Regularity Theory of Causation]], [[INUS Conditions]], [[Counterfactual Theory of Causation]] and [[Singularism]].\n- maps the problems [[Pre-Emption]], [[Overdetermination]] and [[Causation by Absence]], and the topics [[Probabilistic Theories of Causation]] and [[Causal Relata]].\n**Bridges to other groups:**\n- [[Free Will]], [[Incompatibilism]] and [[Agent Causation]] (Free will): because causation and laws figure in the free will debate.\n- [[Canberra Plan]] (Method): because Menzies suggests a Canberra Plan analysis of causation.\n- [[Reductionism]] (Tools): because whether causation can be reductively analysed is disputed.\n- [[Hume, David]], [[Lewis, David]] and [[Armstrong, David]] (Philosophers): because they define the two sides.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Armstrong (1983); Carroll and Markosian (2010, Chapters 2 and 4)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (1983) *What Is a Law of Nature?*, Cambridge: Cambridge University Press.\n  - Carroll, J. and Markosian, N. (2010) *An Introduction to Metaphysics*, New York: Cambridge University Press.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Causation by Absence.md": "---\ngroup: Causation and laws\nrole: case\nsource: Beebee et al. 2011, entry \"Causation by Absence\"\npages: pp. 33–34 (entry starts p. 33)\nstatus: unread\n---\n# Causation by Absence\n**Page(s):** pp. 33–34 (entry starts p. 33)\n**Book's definition:** p. 33. There's no definition: paragraph 1 lists examples. Copy its first sentence.\n**In one line:** Cases where an absence seems to cause something: 'the lack of oxygen caused Joe to fall unconscious'.\n**Role in [[00 – Causation and laws]]:** A test case that causes trouble for event-based and process theories of causation.\n**Explanation:** We often say absences cause things: lack of sleep caused the crash, lack of light killed the plant. This is a problem for theories that take events as the causal relata, because then we'd need 'negative events', such as the event of the oxygen *not* being there. Most metaphysicians reject negative events. There would be absurdly many of them: are you right now taking part in the event of not purring like a kitten, or of not spontaneously combusting? The Causal Relata entry notes that facts, including negative facts, handle absences better. The Process Theories entry notes that the process theory rules out causation by absence altogether.\n**Example:** 'The absence of light caused the plant to die.'\n**Connections:**\n- challenges [[Causal Relata]] views that use [[Event]]: because absences seem to need negative events.\n- is ruled out by [[Process Theories of Causation]]: because no energy is transferred by an absence.\n**Bridges to other groups:**\n- [[Negative Facts]] (Truth): because a negative fact (no oxygen here) is a natural candidate cause.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Beebee (2004); Lewis (2004)\n  Full references (from the book's bibliography):\n  - Beebee, H. (2004) ‘Causing and nothingness’, in J. Collins, E. J. Hall and L. A. Paul (eds), *Causation and Counterfactuals*, pp. 291–308, Cambridge, MA: MIT Press.\n  - Lewis, D. K. (2004) ‘Void and object’, in J. Collins, E. J. Hall and L. A. Paul (eds), *Causation and Counterfactuals*, Cambridge, MA: MIT Press.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Chance.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Chance\"\npages: pp. 34–36 (entry starts p. 34)\nstatus: unread\n---\n# Chance\n**Page(s):** pp. 34–36 (entry starts p. 34)\n**Book's definition:** p. 34, the opening sentence of the entry.\n**In one line:** A specific kind of probability: a 'rock-bottom', single-case probability, which takes values strictly between 0 and 1 only if indeterminism is true.\n**Role in [[00 – Causation and laws]]:** The kind of probability that indeterministic causation and laws would involve.\n**Explanation:** Chance is sometimes called 'propensity', and some use 'chance' just to mean 'probability', so beware. The probability that a strontium-90 atom decays in the next 15 years is a chance. The probability that the next card you turn over is an ace is not: the card is already either an ace or not, so its chance is 1 or 0, though its probability *relative to your information* can be something in between. Chances worry Humeans, because they look like irreducible powers, a probabilistic kind of natural necessity. Humean alternatives treat chance as an ideal degree of belief, given all the facts about the past and the laws, or as a relative frequency with a fully specified reference class.\n**Example:** A strontium-90 atom decaying vs the next card being an ace.\n**Connections:**\n- is a kind of [[Probability]]: because it is single-case, 'rock-bottom' probability.\n- worries [[Humean Supervenience]]: because chances look like irreducible propensities, a probabilistic [[Natural Necessity]].\n- is used by [[Probabilistic Theories of Causation]]: because indeterministic causes raise the chances of their effects.\n**Bridges to other groups:**\n- [[Indeterminism]] (Free will): because chances are interesting only if indeterminism is true.\n- [[Categorical and Dispositional Properties]] (Kinds of properties): because chances look like dispositions or powers.\n**Multiple meanings:** Yes: 'chance', 'propensity' and 'probability' are used differently by different authors. The entry uses 'chance' in a restricted, single-case sense.\n**Further reading (book):** Hájek (2010, § 3.4); Gillies (2000, Chapter 6)\n  Full references (from the book's bibliography):\n  - Gillies, D. (2000) *Philosophical Theories of Probability*, London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Counterfactual Theory of Causation.md": "---\ngroup: Causation and laws\nrole: position\nsource: Beebee et al. 2011, entry \"Counterfactual Theory of Causation\"\npages: pp. 54–55 (entry starts p. 54)\nstatus: unread\n---\n# Counterfactual Theory of Causation\n**Page(s):** pp. 54–55 (entry starts p. 54)\n**Book's definition:** p. 54. Copy the displayed formula giving the most basic version of the theory.\n**In one line:** The reductive analysis: c causes e if c and e occur and, had c not occurred, e would not have occurred.\n**Role in [[00 – Causation and laws]]:** The leading Humean analysis of causation, and the target of most of this group's test cases.\n**Explanation:** If you shoot me, it's true that had you not pulled the trigger I wouldn't be bleeding, so you caused my bleeding. But *pre-emption* is a problem. A second shooter who held back because you fired would otherwise have shot me, so my bleeding doesn't depend on your shot. Lewis's solution is to call the basic relation 'causal dependence' and define causation as its *ancestral*, so that a chain of dependences is enough. Trickier cases remain: trumping and late pre-emption, plus overdetermination. Lewis is the main advocate (1973a). He favours the theory because he upholds Humean supervenience and thinks the regularity theory is hopelessly inadequate.\n**Example:** The back-up shooter who held fire because you shot first.\n**Connections:**\n- is threatened by [[Pre-Emption]], [[Trumping]] and [[Overdetermination]]: because in each case the effect doesn't counterfactually depend on the cause.\n- replaces the [[Regularity Theory of Causation]]: because Lewis judges it hopelessly inadequate.\n- is motivated by [[Humean Supervenience]]: because it analyses causation without natural necessity.\n- is tested by [[Neuron Diagram]]: because Lewis introduced the diagrams to depict counterexamples.\n**Bridges to other groups:**\n- [[Counterfactual Conditional]] and [[Reductionism]] (Tools): because it reduces causation to the truth of counterfactuals.\n- [[Ancestral Relation]] (Sets, classes and infinity): because Lewis defines causation as the ancestral of causal dependence.\n- [[Lewis, David]] (Philosophers): because he is the theory's main advocate.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Lewis (1973a, 2000); Menzies (2008); Psillos (2002, Chapter 3)\n  Full references (from the book's bibliography):\n  - Lewis, D. K. (1973a) ‘Causation’, *Journal of Philosophy*, 70: 556–67; reprinted in Lewis 1986b*.*\n  - Lewis, D. K. (2000) ‘Causation as influence’, *Journal of Philosophy*, 97: 182–97; reprinted in Collins, Hall and Paul 2004.\n  - Menzies, P. (2008) ‘Counterfactual theories of causation’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Winter 2008 edn. Online. Available at: http://plato.stanford.edu/entries/causation-counterfactual.\n  - Psillos, S. (2002) *Causation and Explanation*, Chesham: Acumen.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Dretske-Tooley-Armstrong View of Laws.md": "---\ngroup: Causation and laws\nrole: position\nsource: Beebee et al. 2011, entry \"Dretske-Tooley-Armstrong View of Laws\"\npages: pp. 59–61 (entry starts p. 59)\nstatus: unread\n---\n# Dretske-Tooley-Armstrong View of Laws\n**Page(s):** pp. 59–61 (entry starts p. 59)\n**Book's definition:** p. 59. Copy the second sentence of paragraph 1 (DTA holds that a proposition is a law when universals stand in 'contingent necessitation').\n**In one line:** Laws of nature are relations of 'contingent necessitation' between universals: N(F, G).\n**Role in [[00 – Causation and laws]]:** The main anti-Humean theory of laws.\n**Explanation:** Dretske (1977), Tooley (1977) and Armstrong (1983) arrived at the view independently. 'All humans are mortal' states a law because the universal *being human* stands in the necessitation relation N to *being mortal*, so anything with the first must have the second. N is *contingent*: which universals it relates varies between possible worlds, and some worlds have no laws. The view avoids the naive regularity theory's problems, and the Ramsey–Lewis view's reliance on epistemic notions like simplicity. Problems: uninstantiated laws (a problem for Armstrong's immanent universals, but not for a platonist like Tooley); Lewis's (1983a) question of what necessitation actually is; and the view is unavailable to any nominalist.\n**Example:** N(*being human*, *being mortal*).\n**Connections:**\n- posits [[Natural Necessity]]: because 'contingent necessitation' is natural necessity in its narrower sense.\n- is a theory of [[Law of Nature]]: because it says what makes a proposition a law.\n- rivals the [[Regularity Theory of Laws of Nature]] and the [[Ramsey–Lewis View of Laws]]: because it avoids their problems.\n**Bridges to other groups:**\n- [[Universals]], [[Immanent Realism About Universals]], [[Platonism]] and [[Nominalism]] (Particulars and universals): because laws are relations between universals, which immanent realists, platonists and nominalists treat differently.\n- [[Possible Worlds]] (Modality): because N's contingency means laws differ across worlds.\n- [[Armstrong, David]] and [[Lewis, David]] (Philosophers): because it is often called 'Armstrong's view', and Lewis is its chief critic.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Armstrong (1983); Psillos (2002, Chapter 6)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (1983) *What Is a Law of Nature?*, Cambridge: Cambridge University Press.\n  - Psillos, S. (2002) *Causation and Explanation*, Chesham: Acumen.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Event.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Event\"\npages: pp. 67–68 (entry starts p. 67)\nstatus: unread\n---\n# Event\n**Page(s):** pp. 67–68 (entry starts p. 67)\n**Book's definition:** p. 67, the opening sentence of the entry.\n**In one line:** An ontological category roughly matching ordinary events, like the Battle of Hastings or your eighteenth birthday party, but including tiny ones like a single heartbeat.\n**Role in [[00 – Causation and laws]]:** The most popular candidate for what causes and effects are.\n**Explanation:** Events matter for causation, where they are often taken as the relata, and in philosophy of mind (mental vs physical events). Reasons to believe in them: causation seems to need them; Quine's criterion of ontological commitment, since our sentences seem to quantify over events; and they may be truthmakers (Simons 2003). What are they? Lewis (1986c) denies there are 'disjunctive' events, and says events can be more or less 'fragile': saying 'hello' loudly is a different event from saying 'hello'. Lewis takes events to be properties of spatio-temporal regions, others take them to be the regions themselves, and Kim (1973) takes them to be a particular's exemplifying a property at a time. Some (Quine, Anscombe, Davidson) treat them as a category of their own; others reduce them to tropes, states of affairs or classes.\n**Example:** Your heart beating once, and a water molecule moving half an inch.\n**Connections:**\n- is the leading view of [[Causal Relata]]: because events are often taken to be what causes and effects are.\n- creates trouble for [[Causation by Absence]]: because absences would need 'negative events'.\n- is drawn by [[Neuron Diagram]]: because circles in the diagrams represent events.\n- is involved in [[Overdetermination]]: because one response treats events as 'maximally fragile'.\n**Bridges to other groups:**\n- [[Ontological Commitment]] and [[Ontology]] (Ontology): because whether events exist falls under ontology.\n- [[Truthmakers]] and [[States of Affairs]] (Truth): because events may be truthmakers, or may reduce to states of affairs.\n- [[Trope Theory]] and [[Properties]] (Particulars and universals): because events may be tropes, or (Lewis) properties of regions.\n- [[Reductionism]] (Tools): because a key question is whether events are reducible.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Lowe (2002, Chapter 12); Macdonald (2005, Chapter 5); Simons (2003); Casati and Varzi (2010)\n  Full references (from the book's bibliography):\n  - Lowe, E. J. (2002) *A Survey of Metaphysics*, Oxford: Oxford University Press.\n  - Macdonald, C. (2005) *Varieties of Things*, Oxford: Blackwell.\n  - Simons, P. (2003) ‘Events’, in M. Loux and D. Zimmerman (eds), *The Oxford Handbook of Metaphysics*, Oxford: Oxford University Press.\n  - Casati, R. and Varzi, A. (2010) ‘Events’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Spring 2010 edn. Online. Available at: http://plato.stanford.edu/archives/spr2010/entries/events.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/General Causal Sentences.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"General Causal Sentences\"\npages: p. 84\nstatus: unread\n---\n# General Causal Sentences\n**Page(s):** p. 84\n**Book's definition:** p. 84. The whole entry is one sentence: copy it.\n**In one line:** Sentences that express type-level causation, such as 'smoking causes cancer'.\n**Role in [[00 – Causation and laws]]:** Terminology.\n**Explanation:** This one-sentence entry defines the term by type-level causation.\n**Example:** 'Smoking causes cancer.'\n**Connections:**\n- express [[Type-Level Causation]]: because the entry defines them that way.\n- contrast with [[Singular Causal Sentences]]: because those express token-level causation.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Humean Supervenience.md": "---\ngroup: Causation and laws\nrole: position\nsource: Beebee et al. 2011, entry \"Humean Supervenience\"\npages: pp. 93–95 (entry starts p. 93)\nstatus: unread\n---\n# Humean Supervenience\n**Page(s):** pp. 93–95 (entry starts p. 93)\n**Book's definition:** p. 93. Copy the sentence beginning \"The thesis of Humean supervenience is a thesis about what the 'supervenience base' is…\".\n**In one line:** Lewis's thesis that all facts about the actual world supervene on local matters of particular fact: point-sized things with intrinsic properties, standing in spatiotemporal relations.\n**Role in [[00 – Causation and laws]]:** The organising thesis of the Humean side. It rules out natural necessity.\n**Explanation:** Supervenience: no difference in A-facts without a difference in B-facts. If identical twins are identical in every brain state at a time, one can't be happy while the other is sad. Humean supervenience names the base for *all* facts: point-sized things, their intrinsic properties, and the spatiotemporal relations between them. Everything else supervenes on that, including facts about tables, donkeys, causation, laws and personal identity. It is named after Hume, whom Lewis calls 'the great denier of necessary connections': it primarily rules out necessary connections between distinct existences. So Lewis gives truth conditions for laws and causation that make no appeal to natural necessity. Other possible worlds are consistent with it, because on Lewis's theory necessity is a relation *between* worlds, not an intrinsic feature of any one world.\n**Example:** Identical twins, identical down to their brain states, can't differ in mood.\n**Connections:**\n- rules out [[Natural Necessity]]: because it denies necessary connections between distinct existences.\n- defines [[Humeanism]]: because a Humean theory is one that respects this thesis.\n- motivates the [[Counterfactual Theory of Causation]]: because Lewis's analysis of causation respects it.\n**Bridges to other groups:**\n- [[Supervenience]] (Tools): because the thesis is a supervenience claim about all facts.\n- [[Possible Worlds]] and [[Modality]] (Modality): because necessity becomes an inter-world matter.\n- [[Categorical and Dispositional Properties]] and [[Quidditism]] (Kinds of properties): because its believers ground dispositions in categorical properties, which seems to lead to quidditism.\n- [[Perdurantism]] (Time): because Lewis argues for temporal parts from Humean supervenience.\n- [[Lewis, David]] and [[Hume, David]] (Philosophers): because it is Lewis's thesis, named after Hume.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Lewis (1986b, Introduction); Weatherson (2010, § 5)\n  Full references (from the book's bibliography):\n  - Lewis, D. K. (1986b) *Philosophical Papers**, **Vol. II*, Oxford: Blackwell.\n  - Weatherson, B. (2010), ‘David Lewis’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Spring 2010 edn. Online. Available at: http://plato.stanford.edu/archives/spr2010/entries/david-lewis.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Humeanism.md": "---\ngroup: Causation and laws\nrole: position\nsource: Beebee et al. 2011, entry \"Humeanism\"\npages: p. 93\nstatus: unread\n---\n# Humeanism\n**Page(s):** p. 93\n**Book's definition:** p. 93. Copy the second sentence (what the label 'Humean' normally denotes).\n**In one line:** A theory is 'Humean' if it does without natural necessity or, more generally, respects the thesis of Humean supervenience.\n**Role in [[00 – Causation and laws]]:** The label for one side of this group's main divide.\n**Explanation:** The name comes from the theories' relation to Hume's views. The regularity theory of causation is Humean, because causal facts don't depend on facts about natural necessity. The counterfactual theory of causation is arguably Humean for the same reason, and so is the Ramsey–Lewis view of laws.\n**Example:** The regularity theory of causation.\n**Connections:**\n- is defined by rejecting [[Natural Necessity]] or accepting [[Humean Supervenience]]: because that is what 'Humean' denotes.\n- includes [[Regularity Theory of Causation]], [[Counterfactual Theory of Causation]] and [[Ramsey–Lewis View of Laws]]: because the entry lists them as Humean.\n**Bridges to other groups:**\n- [[Hume, David]] (Philosophers): because the label comes from him.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/INUS Conditions.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"INUS Conditions\"\npages: p. 111\nstatus: unread\n---\n# INUS Conditions\n**Page(s):** p. 111\n**Book's definition:** p. 111. There's no opening definition: the entry builds up a bomb example. Copy the later sentence that spells out the acronym.\n**In one line:** An Insufficient but Necessary part of a condition that is itself Unnecessary but Sufficient for an effect. Mackie analysed causes as INUS conditions.\n**Role in [[00 – Causation and laws]]:** A refinement of the regularity theory.\n**Explanation:** I place a bomb on a bridge and its timer reaches zero, so the bridge collapses. Neither event is sufficient on its own (no timer, or no bomb, and the bridge stands), and neither is necessary (rust or another bomber could have brought it down). But placing the bomb plus the timer reaching zero together are sufficient. So each is an INUS condition of the collapse. Mackie (1965) analysed causation this way: c causes e if c is (at least) an INUS condition of e, a variant of the regularity theory. The analysis has fallen into disrepute (see Kim 1971), though the legal 'NESS test' it was based on is still going strong.\n**Example:** The bomb, the timer and the bridge.\n**Connections:**\n- is a version of the [[Regularity Theory of Causation]]: because Mackie's analysis is a variant of it.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Mackie (1965); Kim (1971)\n  Full references (from the book's bibliography):\n  - Mackie, J. L. (1965) ‘Causes and conditions’, *American Philosophical Quarterly*, 2: 245–54; reprinted in Sosa and Tooley 1993.\n  - Kim, J. (1971) ‘Causes and events: Mackie on causation’, *Journal of Philosophy*, 68: 426–41; reprinted in Sosa and Tooley 1993.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Law of Nature.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Law of Nature\"\npages: entry starts p. 114\nstatus: unread\n---\n# Law of Nature\n**Page(s):** entry starts p. 114\n**Book's definition:** p. 114, the opening sentence of the entry.\n**In one line:** A general fact that doesn't merely happen to be true: not an 'accidental regularity'.\n**Role in [[00 – Causation and laws]]:** The second main subject of this group, alongside causation.\n**Explanation:** That e = mc² (if true) isn't just a coincidence. That all lumps of solid gold are less than ten metres across is an accidental regularity: someone rich and odd enough could make a bigger gold sphere. The entry sends you to Causation and Laws, the Ramsey–Lewis view and the Dretske-Tooley-Armstrong view. Laws of nature also appear in the Consequence Argument for incompatibilism.\n**Example:** e = mc² (a law) vs 'all gold lumps are under ten metres across' (an accident).\n**Connections:**\n- is also called [[Natural Law]]: because that entry says so.\n- is analysed by [[Regularity Theory of Laws of Nature]], [[Ramsey–Lewis View of Laws]] and [[Dretske-Tooley-Armstrong View of Laws]]: because they are the rival theories of laws.\n- is surveyed in [[Causation and Laws]]: because the entry sends you there.\n**Bridges to other groups:**\n- [[Consequence Argument]] and [[Incompatibilism]] (Free will): because laws appear in the Consequence Argument.\n- [[Determinism]] (Free will): because determinism is defined by the past together with the laws (Free Will entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Natural Law.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Natural Law\"\npages: entry starts p. 135\nstatus: unread\n---\n# Natural Law\n**Page(s):** entry starts p. 135\n**Book's definition:** p. 135. The whole entry is one sentence: copy it.\n**In one line:** Another way of saying 'law of nature'.\n**Role in [[00 – Causation and laws]]:** A synonym.\n**Explanation:** The entry is a single sentence that sends you to Law of Nature.\n**Example:** (See [[Law of Nature]].)\n**Connections:**\n- is a synonym of [[Law of Nature]]: because the entry says so.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Natural Necessity.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Natural Necessity\"\npages: pp. 135–136 (entry starts p. 135)\nstatus: unread\n---\n# Natural Necessity\n**Page(s):** pp. 135–136 (entry starts p. 135)\n**Book's definition:** p. 135, the opening sentence of the entry.\n**In one line:** Any 'intra-world' necessity: necessity that is part of the intrinsic nature of the actual world. Humeans deny there is any.\n**Role in [[00 – Causation and laws]]:** The concept that divides Humeans from anti-Humeans.\n**Explanation:** For Lewis and all Humeans, necessity is 'inter-world': to be necessary is to be true in all possible worlds, and necessity is no intrinsic feature of any one world. To assert natural necessity is to deny this. Non-Humeans find it in three places. (1) Fundamental dispositions: if it is a rock-bottom fact that an electron is disposed to repel electrons, it *must* repel them. (2) Causation: a real tie between c and e (under indeterminism, perhaps a 'tendency' rather than strict necessity). (3) Laws of nature. In a narrower sense, 'natural necessity' names Armstrong's relation of contingent necessitation between universals.\n**Example:** An electron that *must* repel another electron nearby.\n**Connections:**\n- is denied by [[Humean Supervenience]] and [[Humeanism]]: because Humeans hold all necessity is inter-world.\n- is posited by the [[Dretske-Tooley-Armstrong View of Laws]]: because the narrow sense names its necessitation relation.\n- has a probabilistic cousin in [[Chance]]: because under indeterminism 'tendency' may be the better word.\n**Bridges to other groups:**\n- [[Possible Worlds]], [[Modality]] and [[Necessity]] (Modality): because Humeans analyse all necessity as truth in all worlds.\n- [[Categorical and Dispositional Properties]] (Kinds of properties): because fundamental dispositions are one place it is said to be found.\n- [[Intrinsic vs Extrinsic Properties]] (Kinds of properties): because natural necessity would be an intrinsic feature of the world.\n- [[Empiricism]] (Tools): because Hume arguably held that we have no genuine idea of it (Empiricism entry).\n- [[Armstrong, David]] (Philosophers): because of the narrow sense.\n**Multiple meanings:** Yes: a broad sense (any intra-world necessity) and a narrow sense (Armstrong's contingent necessitation).\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Neuron Diagram.md": "---\ngroup: Causation and laws\nrole: tool\nsource: Beebee et al. 2011, entry \"Neuron Diagram\"\npages: pp. 141–143 (entry starts p. 141)\nstatus: unread\n---\n# Neuron Diagram\n**Page(s):** pp. 141–143 (entry starts p. 141)\n**Book's definition:** p. 141, the opening sentence of the entry.\n**In one line:** Lewis's diagrams of circles (neurons, or events) and arrows (stimulation, or causation), used to depict test cases for the counterfactual theory.\n**Role in [[00 – Causation and laws]]:** The standard picture language for causal test cases.\n**Explanation:** Circles represent events and arrows represent one event causing another. Two bricks hitting a window together is drawn like two neurons both activating a third. A line ending in a reversed arrowhead shows one firing *preventing* another, and dotted lines show a neuron that didn't fire, along with the firings it would have had. Diagrams like this depict alleged counterexamples such as pre-emption.\n**Example:** Two neurons firing and both activating a third (two bricks, one window).\n**Connections:**\n- depicts cases for the [[Counterfactual Theory of Causation]]: because the diagrams were introduced to show its counterexamples.\n- depicts [[Pre-Emption]] and [[Overdetermination]]: because these are the cases it is used for.\n- represents [[Event]] causing event: because circles stand for events.\n**Bridges to other groups:**\n- [[Lewis, David]] (Philosophers): because he introduced them.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Overdetermination.md": "---\ngroup: Causation and laws\nrole: case\nsource: Beebee et al. 2011, entry \"Overdetermination\"\npages: pp. 154–155 (entry starts p. 154)\nstatus: unread\n---\n# Overdetermination\n**Page(s):** pp. 154–155 (entry starts p. 154)\n**Book's definition:** p. 154. Copy the sentence that names the case (it begins \"This is a case of overdetermination…\").\n**In one line:** A case where two or more causes each suffice for an effect and each has an equal claim to be its cause, as when two bricks hit a window at once.\n**Role in [[00 – Causation and laws]]:** A standard counterexample to the counterfactual theory.\n**Explanation:** You and I each throw a brick, and both pass through the window at the same moment. Each throw is a *redundant* cause: had one not happened, the other would still have broken the window. This differs from pre-emption, where only one candidate has a claim to be the cause. On the counterfactual theory, the shattering depends on neither throw, and there's no chain of dependence either, so 'nobody shattered the window'. Bunzl (1979) replies that events are 'maximally modally fragile': without your brick, a *different* shattering would have occurred. That reply is unpopular, because it generates lots of spurious causation. Lewis's response is in effect to tough it out.\n**Example:** Two bricks through one window at the same instant.\n**Connections:**\n- is a kind of [[Redundant Causation]]: because each cause is redundant.\n- contrasts with [[Pre-Emption]]: because there only one potential cause has a claim to be the cause.\n- challenges the [[Counterfactual Theory of Causation]]: because the effect depends on neither cause.\n- involves the fragility of an [[Event]]: because Bunzl's response treats events as maximally fragile.\n- is drawn with a [[Neuron Diagram]]: because two neurons activating a third pictures it.\n**Bridges to other groups:**\n- [[Modality]] (Modality): because Bunzl's reply makes events 'maximally modally fragile'.\n- [[Lewis, David]] (Philosophers): because his response is to tough it out.\n**Multiple meanings:** Also called 'symmetric overdetermination'.\n**Further reading (book):** Schaffer (2003)\n  Full references (from the book's bibliography):\n  - Schaffer, J. (2003) ‘Overdetermining causes’, *Philosophical Studies*, 114: 23–45.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Pre-Emption.md": "---\ngroup: Causation and laws\nrole: case\nsource: Beebee et al. 2011, entry \"Pre-Emption\"\npages: pp. 174–177 (entry starts p. 174)\nstatus: unread\n---\n# Pre-Emption\n**Page(s):** pp. 174–177 (entry starts p. 174)\n**Book's definition:** p. 174. Copy the second sentence, which says what all pre-emption cases involve.\n**In one line:** Cases where c intuitively causes e, but e doesn't counterfactually depend on c, because a back-up would have brought e about anyway.\n**Role in [[00 – Causation and laws]]:** The best-known family of counterexamples to the counterfactual theory.\n**Explanation:** I arrive at 10 a.m. to blow up a bridge, find you already planting a bomb, and go home. Your bomb destroys the bridge at noon. Clearly you caused it. But had you not planted your bomb, I would have planted mine, so the destruction doesn't depend on you, and the naive counterfactual analysis says you didn't cause it. Lewis's original analysis (1973a) defines causation as the *ancestral* of counterfactual dependence, which makes causation transitive. That handles cases like this one through a chain of intermediate events. Harder cases include late pre-emption and *trumping*, for instance a possible world with a law that the first spell cast neutralises all later ones.\n**Example:** Two would-be bridge bombers; the second goes home.\n**Connections:**\n- challenges the [[Counterfactual Theory of Causation]]: because the effect doesn't depend on its cause.\n- includes [[Trumping]]: because trumping is a kind of pre-emption.\n- is a kind of [[Redundant Causation]]: because the back-up makes the cause redundant.\n- contrasts with [[Overdetermination]]: because only one cause has a claim here.\n- is drawn with a [[Neuron Diagram]]: because the diagrams usually represent pre-emption.\n**Bridges to other groups:**\n- [[Ancestral Relation]] and [[Transitive Relation]] (Sets, classes and infinity): because Lewis's fix uses the ancestral, which makes causation transitive.\n- [[Counterfactual Conditional]] (Tools): because the problem is a false counterfactual.\n- [[Possible Worlds]] (Modality): because the trumping case imagines a world with a law about spells.\n**Multiple meanings:** Early pre-emption, late pre-emption and trumping pre-emption.\n**Further reading (book):** Schaffer (2000); Lewis (2000)\n  Full references (from the book's bibliography):\n  - Schaffer, J. (2000) ‘Trumping preemption’, *Journal of Philosophy*, 97: 165–81.\n  - Lewis, D. K. (2000) ‘Causation as influence’, *Journal of Philosophy*, 97: 182–97; reprinted in Collins, Hall and Paul 2004.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Probabilistic Theories of Causation (Type-Level).md": "---\ngroup: Causation and laws\nrole: position\nsource: Beebee et al. 2011, entry \"Probabilistic Theories of Causation (Type-Level)\"\npages: pp. 187–188 (entry starts p. 187)\nstatus: unread\n---\n# Probabilistic Theories of Causation (Type-Level)\n**Page(s):** pp. 187–188 (entry starts p. 187)\n**Book's definition:** p. 187, the opening sentence of the entry.\n**In one line:** Theories of type-level causation ('smoking causes cancer'), on which causation is probability increase, understood as frequencies within populations.\n**Role in [[00 – Causation and laws]]:** The statistical theory of general causal claims.\n**Explanation:** Type-level causation is also called population, property-level or generic causation, and these theories are also called 'statistical relevance' theories. As with token-level probabilistic theories, causation is a matter of increase (or just change) in probability. But here
