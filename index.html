itions that hold in all possible worlds.\n**Role in [[00 – Metametaphysics and method]]:** The dominant method of much twentieth-century metaphysics, and still a central tool.\n**Explanation:** To analyse free action is to fill in 'S does A freely if and only if X', with X something like 'S could have done otherwise'. X must be both sufficient and necessary for acting freely, and the analysis must hold necessarily, for all *possible* free actions too. Analyses are tested against counterexamples. Frankfurt's neurosurgeon is offered as a case of acting freely without being able to do otherwise; the problem of luck suggests that a merely random act isn't free even though the agent could have done otherwise. Much of the literature on the counterfactual theory takes this form. The Canberra Plan is a less demanding variant, and 'revisionary' analyses define a refined concept rather than the everyday one. Why analyse? Linguistic-turn philosophers thought analysis was all metaphysics could do. Others think an analysis has metaphysical import: if causation can be analysed by regularities, we have no reason to posit natural necessity. That fits reductionism.\n**Example:** Filling in 'S does A freely if and only if X'.\n**Connections:**\n- has a variant, the [[Canberra Plan]]: because the Plan is a less demanding form of analysis.\n- can be revisionary of [[Common Sense]]: because revisionary analyses refine everyday concepts.\n- was all that was left under the [[Linguistic Turn]]: because that view confined metaphysics to analysis.\n- is questioned in [[Metametaphysics]]: because some philosophers are sceptical of its role.\n- [[Analysis]]: a pointer entry that sends you here.\n**Bridges to other groups:**\n- [[Possible Worlds]] (Modality): because an analysis must hold in all possible worlds.\n- [[Frankfurt's Nefarious Neurosurgeon]] and [[Problem of Luck]] (Free will): because they are counterexamples to analyses of free action.\n- [[Counterfactual Theory of Causation]] and [[Natural Necessity]] (Causation and laws): because the counterexample method dominates that literature, and analyses bear on natural necessity.\n- [[Reductionism]] and [[Primitive]] (Tools): because analysis fits reductionism, and a primitive is what a theory leaves unanalysed.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/Experimental Philosophy.md": "---\ngroup: Metametaphysics and method\nrole: concept\nsource: Beebee et al. 2011, entry \"Experimental Philosophy\"\npages: pp. 70–71 (entry starts p. 70)\nstatus: unread\n---\n# Experimental Philosophy\n**Page(s):** pp. 70–71 (entry starts p. 70)\n**Book's definition:** p. 70, the opening sentence of the entry.\n**In one line:** The term has two meanings: the Enlightenment name for science, and a recent method of testing ordinary people's intuitions, for example about thought experiments.\n**Role in [[00 – Metametaphysics and method]]:** A methodological movement that tests the intuitions metaphysics relies on.\n**Explanation:** In the Enlightenment, 'experimental philosophy' (like 'natural philosophy') meant science: testing hypotheses by experiment and observation rather than a priori reasoning. It had a symbiotic relationship with philosophy. Bacon's work on method led to the Royal Society (Newton, Boyle and Locke were members), and empiricism owed much to Newton's success; Hume subtitled his *Treatise* 'an attempt to introduce the experimental method of reasoning into moral subjects'. In the recent sense, experimental philosophy tests people's intuitions, especially about thought experiments, for example whether determinism is compatible with moral responsibility. This raises questions about the nature and purpose of metaphysical enquiry.\n**Example:** Surveying ordinary people on whether determinism rules out moral responsibility.\n**Connections:**\n- tests intuitions about [[Thought Experiment]]s: because that is its basic method.\n- matters for [[Conceptual Analysis]], the [[Canberra Plan]] and [[Common Sense]]: because these rely on people's intuitions.\n- raises questions for [[Metametaphysics]]: because it questions the nature and purpose of metaphysical enquiry.\n**Bridges to other groups:**\n- [[Natural Philosophy]] (Tools): because that pointer entry sends you here (the Enlightenment sense).\n- [[Empiricism]] (Tools): because the empiricist tradition owes much to experimental philosophy's success.\n- [[Moral Responsibility]] and [[Determinism]] (Free will): because recent studies test intuitions about responsibility under determinism.\n- [[Locke, John]] and [[Hume, David]] (Philosophers): because Locke was in the Royal Society, and Hume adopted the experimental method.\n**Multiple meanings:** Yes: (1) the Enlightenment sense (science); (2) the recent sense (empirically testing intuitions).\n**Further reading (book):** Knobe and Nichols (2008, especially the Introduction)\n  Full references (from the book's bibliography):\n  - Knobe, J. and Nichols, S. (eds) (2008) *Experimental Philosophy*, New York: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/Gedankenexperiment.md": "---\ngroup: Metametaphysics and method\nrole: concept\nsource: Beebee et al. 2011, entry \"Gedankenexperiment\"\npages: entry starts p. 84\nstatus: unread\n---\n# Gedankenexperiment\n**Page(s):** entry starts p. 84\n**Book's definition:** p. 84. The whole entry is three words: copy it.\n**In one line:** German for 'thought experiment'.\n**Role in [[00 – Metametaphysics and method]]:** A synonym.\n**Explanation:** The entry just translates the term; see Thought Experiment.\n**Example:** (See [[Thought Experiment]].)\n**Connections:**\n- is a synonym of [[Thought Experiment]]: because it is the German term.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/Linguistic Framework.md": "---\ngroup: Metametaphysics and method\nrole: pointer\nsource: Beebee et al. 2011, entry \"Linguistic Framework\"\npages: p. 118\nstatus: unread\n---\n# Linguistic Framework\n**Page(s):** p. 118\n**Pointer entry:** the book only says \"see\" → [[Metametaphysics]]. Read that note.\n**Role in [[00 – Metametaphysics and method]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "11 Metametaphysics and method/Linguistic Turn.md": "---\ngroup: Metametaphysics and method\nrole: concept\nsource: Beebee et al. 2011, entry \"Linguistic Turn\"\npages: p. 118\nstatus: unread\n---\n# Linguistic Turn\n**Page(s):** p. 118\n**Book's definition:** p. 118. The whole entry is one sentence: copy it.\n**In one line:** The mid-twentieth-century turn away from the nature of reality (often on empiricist grounds) towards the nature and purpose of our language.\n**Role in [[00 – Metametaphysics and method]]:** A historical phase of metametaphysics, when metaphysics was reduced to linguistic analysis.\n**Explanation:** The Metametaphysics entry adds that, from the 1930s to the 1970s, most analytic philosophers followed this trend, thinking philosophical puzzles were to be solved by linguistic analysis. The Rationalism entry adds that the linguistic turn conceded Hume's point, so metaphysics could hope only for conceptual analysis, and that many contemporary metaphysicians have since abandoned it.\n**Example:** (The entry gives no example.)\n**Connections:**\n- is explained under [[Metametaphysics]]: because the entry sends you there.\n- reduced metaphysics to [[Conceptual Analysis]]: because the linguistic turn left metaphysics with only analysis (Rationalism entry).\n- relates to [[Linguistic Framework]]: because Carnap's frameworks belong to this period (pointer entry).\n**Bridges to other groups:**\n- [[Empiricism]] (Tools): because the turn was often made on empiricist grounds.\n- [[Rationalism]] (Tools): because abandoning the turn seems to commit metaphysicians to a form of rationalism (Rationalism entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/Metametaphysics.md": "---\ngroup: Metametaphysics and method\nrole: concept\nsource: Beebee et al. 2011, entry \"Metametaphysics\"\npages: pp. 122–126 (entry starts p. 122)\nstatus: unread\n---\n# Metametaphysics\n**Page(s):** pp. 122–126 (entry starts p. 122)\n**Book's definition:** p. 122, the opening sentence of the entry.\n**In one line:** Philosophical enquiry into the nature of metaphysics: what it is, whether and how it is possible, and what its methods and limits are.\n**Role in [[00 – Metametaphysics and method]]:** The study of whether, and how, the debates in every other group are real and answerable.\n**Explanation:** Many debates are between 'metaphiles', who see metaphysics as an a priori enquiry yielding substantive truths about mind-independent reality, and 'metaphobes'. Metaphobes say metaphysical questions are meaningless, or unanswerable, or only about our experience or conceptual scheme. Hume is an early metaphobe: anything that is neither 'relations of ideas' nor 'matters of fact' should go on 'Hume's bonfire'. Kant, responding, asked how synthetic a priori truths are possible. From the 1930s to the 1970s, metaphobia dominated (Wittgenstein, the positivists, the linguistic turn). Carnap distinguished 'internal' questions, asked within a linguistic framework ('do numbers exist?': yes, within mathematics), from 'external' ones, which are meaningless unless they are pragmatic. Quine's rejection of the analytic/synthetic distinction answered Carnap, and his 'On what there is' set the dominant method: believe in what your best theory quantifies over. Metaphysics has come back, but changed: many no longer see it as purely a priori.\n**Example:** Carnap: 'do numbers exist?' is easy inside mathematics, meaningless outside.\n**Connections:**\n- includes the [[Linguistic Turn]] and [[Linguistic Framework]]: because these are its twentieth-century chapters (the second is a pointer entry).\n- asks about the role of [[Conceptual Analysis]] and [[Common Sense]]: because those are disputed methods.\n- debates [[Carving Nature at its Joints]] for quantifiers: because Sider and Hirsch disagree over natural quantifiers.\n**Bridges to other groups:**\n- [[Hume, David]], [[Kant, Immanuel]] and [[Quine, W. V.]] (Philosophers): because they shape the history the entry traces.\n- [[Analytic vs Synthetic Truths]] and [[A Priori - A Posteriori]] (Tools): because Kant's synthetic a priori and Quine's attack on analyticity are central.\n- [[Realism and Anti-Realism (Global)]] (Realism and anti-realism): because metaphilia is connected to global realism, and Carnap counts as a global anti-realist.\n- [[Ontological Commitment]] (Ontology): because Quine's criterion became the dominant method.\n- [[Conceptual Scheme]] (Realism and anti-realism): because one kind of metaphobia confines metaphysics to our conceptual scheme.\n**Multiple meanings:** Metaphiles vs metaphobes; metaphobia comes in three strengths (meaningless / unanswerable / only about our scheme).\n**Further reading (book):** Chalmers*et al*. (2009); Quine (1948, 1951)\n  Full references (from the book's bibliography):\n  - Quine, W. V. (1948) ‘On what there is’, *Review of Metaphysics*, 2: 21–38; reprinted in Loux M. (ed.) (2001) *Metaphysics: Contemporary Readings*, London: Routledge and in Quine 1980.\n  - Quine, W. V. (1951) ‘Two dogmas of empiricism’, *The Philosophical Review*, 60, 1: 20–43; reprinted in Quine 1980.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/Moorean Facts.md": "---\ngroup: Metametaphysics and method\nrole: concept\nsource: Beebee et al. 2011, entry \"Moorean Facts\"\npages: p. 131\nstatus: unread\n---\n# Moorean Facts\n**Page(s):** p. 131\n**Book's definition:** p. 131, the opening sentence of the entry.\n**In one line:** A common-sense proposition whose pre-philosophical justification is so strong that we shouldn't take seriously any philosophical argument that it is false.\n**Role in [[00 – Metametaphysics and method]]:** A methodological constraint: some things any theory must accommodate.\n**Explanation:** The phrase is named after G. E. Moore, who argued against scepticism about the external world by raising his hands and declaring 'Here is one hand… and here is another'. His point was that our certainty that we have hands, and so that there's an external world, outweighs any philosophical argument to the contrary, even one we can't refute. As Armstrong (1980) puts it, accounting for the Moorean facts is answering the 'compulsory questions in the philosophical examination paper'. Common examples are that there is an external world and that other people have minds. Armstrong frames the debate between nominalists and realists about universals in these terms.\n**Example:** Moore raising his hands: 'Here is one hand…'\n**Connections:**\n- is a special case of [[Common Sense]]: because a Moorean fact is a common-sense proposition.\n**Bridges to other groups:**\n- [[Scepticism]] (Realism and anti-realism): because Moore used them against external-world scepticism.\n- [[Armstrong, David]] (Philosophers): because of the 'compulsory questions' image.\n- [[Nominalism]], [[Universals]] and [[Austere Nominalism]] (Particulars and universals): because Armstrong frames that debate around Moorean facts (and accuses the ostrich nominalist of dodging a compulsory question).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Moore (1925, 1939)\n  Full references (from the book's bibliography):\n  - Moore, G. E. (1925) ‘A defence of common sense’, in J. H. Muirhead (ed.), *Contemporary British Philosophy* (2nd series), London: George Allen and Unwin; reprinted in Moore, G. E. (1959) *Philosophical Papers*, London: George Allen and Unwin and Baldwin, T. (ed.) (1993) *G. E. Moore: Selected Writings*, London: Routledge, pp. 106–33.\n  - Moore, G. E. (1939) ‘Proof of an external world’, *Proceedings of the British Academy**,* 25: 273–300; reprinted in Baldwin, T. (ed.) (1993) *G. E. Moore: Selected Writings**,* London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/Ockham's Razor.md": "---\ngroup: Metametaphysics and method\nrole: concept\nsource: Beebee et al. 2011, entry \"Ockham's Razor\"\npages: p. 150\nstatus: unread\n---\n# Ockham's Razor\n**Page(s):** p. 150\n**Book's definition:** p. 150, the opening sentence of the entry.\n**In one line:** The principle that our theories should be as parsimonious as possible in their ontological commitments: don't believe in something without a really good reason.\n**Role in [[00 – Metametaphysics and method]]:** The best-known theoretical virtue: parsimony.\n**Explanation:** The principle is named after William of Ockham (1288–1348), also spelled 'Occam'. Ontological parsimony is generally, but not universally, held to be a theoretical virtue in metaphysics.\n**Example:** 'Do not believe in something unless there is a really, really good reason to.'\n**Connections:**\n- is a kind of [[Theoretical Virtues]]: because parsimony is generally held to be a theoretical virtue.\n**Bridges to other groups:**\n- [[Ontological Commitment]] (Ontology): because the razor is about minimising ontological commitments.\n- [[Being]] (Ontology): because positing being without existence is said to violate Ockham's razor.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/Theoretical Virtues.md": "---\ngroup: Metametaphysics and method\nrole: concept\nsource: Beebee et al. 2011, entry \"Theoretical Virtues\"\npages: pp. 248–249 (entry starts p. 248)\nstatus: unread\n---\n# Theoretical Virtues\n**Page(s):** pp. 248–249 (entry starts p. 248)\n**Book's definition:** p. 248, the opening sentence of the entry.\n**In one line:** The 'good-making' features of theories that give some reason to believe them (with vices as the reverse), weighed against each other in cost–benefit analysis.\n**Role in [[00 – Metametaphysics and method]]:** The working method of much metaphysics: choosing between theories by their virtues.\n**Explanation:** Metaphysics resembles science here, since scientists weigh theoretical virtues too. Which features count is contentious. Commonly accepted virtues include being internally unified, having explanatory power, and fitting with common sense and other theories. The least controversial is *parsimony*: having few ontological commitments. A real example: Ockham's razor is often said to favour Humean theories of causation and laws over theories invoking natural necessity. Defenders of the Dretske-Tooley-Armstrong view reply that their theory has more explanatory power, because it explains *why* there are regularities. Another alleged virtue is consistency with intuitions, or the 'folk theory' of something like causation or personal identity.\n**Example:** Parsimony (Humean laws) vs explanatory power (DTA laws).\n**Connections:**\n- include [[Ockham's Razor]] (parsimony): because it is the least controversial virtue.\n- include fit with [[Common Sense]]: because that is a commonly accepted virtue.\n- are tested by [[Thought Experiment]]s: because thought experiments probe our intuitions and folk theories.\n**Bridges to other groups:**\n- [[Regularity Theory of Causation]], [[Dretske-Tooley-Armstrong View of Laws]] and [[Natural Necessity]] (Causation and laws): because the main example weighs parsimony against explanatory power.\n- [[Ontological Commitment]] (Ontology): because parsimony means having few ontological commitments.\n- [[Primitive]] (Tools): because having few primitives is a standard virtue (Primitive entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Baker (2008)\n  Full references (from the book's bibliography):\n  - Baker, A. (2008) ‘Simplicity’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/simplicity.\n**Beyond the book:** —\n**My notes:**\n", "11 Metametaphysics and method/Thought Experiment.md": "---\ngroup: Metametaphysics and method\nrole: tool\nsource: Beebee et al. 2011, entry \"Thought Experiment\"\npages: pp. 250–252 (entry starts p. 250)\nstatus: unread\n---\n# Thought Experiment\n**Page(s):** pp. 250–252 (entry starts p. 250)\n**Book's definition:** p. 250, the opening sentence of the entry.\n**In one line:** An imagined scenario used to test a theory, usually a theory about how things *must* be.\n**Role in [[00 – Metametaphysics and method]]:** The main experimental method of metaphysics.\n**Explanation:** In Locke's case of the cobbler and the prince, their 'consciousness' (beliefs, desires, memories) is swapped while they sleep. Locke thinks the person who went to bed in the prince's bed wakes up in the cobbler's body, and would be the one to blame for the prince's crimes. So bodily continuity isn't required for personal identity; what matters is what was swapped, consciousness. Imagined cases count because metaphysical theories usually aim at how things *must* be (as conceptual analyses or reductive accounts), so merely possible cases can refute them. Aliens not descended from apes, whom we would happily count as persons, are another example. But your intuition about a case may conflict with an otherwise attractive theory. Other thought experiments in the book include Frankfurt's neurosurgeon, brains in vats and fission.\n**Example:** Locke's cobbler and prince swapping consciousness.\n**Connections:**\n- is also called [[Gedankenexperiment]]: because that is the German term.\n- feeds [[Theoretical Virtues]] and [[Conceptual Analysis]]: because cases test analyses, and intuitions may be outweighed by other virtues.\n- is studied empirically by [[Experimental Philosophy]]: because it tests people's intuitions about such cases.\n**Bridges to other groups:**\n- [[Bodily Continuity]], [[Memory Theory]] and [[Fission]] (Personal identity): because Locke's case argues against bodily continuity and for a memory (consciousness) theory, and fission cases are thought experiments too.\n- [[Frankfurt's Nefarious Neurosurgeon]] (Free will) and [[Brains in a Vat]] (Realism and anti-realism): because they are named examples.\n- [[Possible Worlds]] (Modality): because merely possible cases matter to claims about how things must be.\n- [[Locke, John]] (Philosophers): because of the cobbler and the prince.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Brown (2009)\n  Full references (from the book's bibliography):\n  - Brown, J. R. (2009) ‘Thought experiments’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2009 edn. Online. Available at: http://plato.stanford.edu/archives/fall2009/entries/thought-experiment.\n**Beyond the book:** —\n**My notes:**\n", "12 Kinds of properties/00 – Kinds of properties.md": "---\ngroup: Kinds of properties\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Kinds of properties\n**Central question:** What kinds of property are there (intrinsic or extrinsic, dispositional or categorical, natural or not, mind-dependent or not), and which kinds are fundamental?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| Fundamental dispositions ([[Categorical and Dispositional Properties]]) | Physics characterises mass, charge and spin dispositionally | 'Many philosophers' | Humeans: dispositions must be grounded in categorical properties |\n| Categorical grounding ([[Categorical and Dispositional Properties]]) | Dispositions rest on categorical properties; counterfactuals are settled by the closest world | Believers in Humean supervenience | It seems to lead to [[Quidditism]] |\n| [[Quidditism]] | A property's identity is brute, not fixed by its dispositions | Lewis (2008) | Anti-quidditists: properties just are dispositions |\n| Natural-kind universals ([[Natural Kinds]]) | Natural kinds correspond to universals | Ellis (2001) | — |\n| Pluralism ([[Natural Kinds]]) | Kinds are whatever best serves explanation; there is no single way to carve nature | Dupré (1993) | — |\n| Primary/secondary qualities ([[Primary and Secondary Qualities]]) | Colours are powers to cause sensations; shape is in the object | Locke | Berkeley: primary qualities aren't in objects either |\n| [[Response-Dependence]] | Being red is partly fixed by how things look to us | — | An apple doesn't stop being red in the dark |\n| Reducing determinables ([[Determinables and Determinates]]) | Being shaped is nothing over and above being spherical (etc.) | 'Some philosophers' | — |\n\n## Key arguments and test cases\n- Mass vs weight; becoming an uncle with no intrinsic change: [[Intrinsic vs Extrinsic Properties]] (p. 108)\n- The fragile glass and its counterfactual: [[Categorical and Dispositional Properties]] (p. 29)\n- Mass and charge swapping roles: [[Quidditism]] (p. 203)\n- Ravens-or-writing-desks: [[Natural Kinds]] (p. 134)\n- The red apple in the dark: [[Response-Dependence]] (p. 226)\n\n## Bridges to other groups\n- **Causation and laws:** [[Humean Supervenience]], because the Humean insists that fundamental properties are categorical.\n- **Modality:** [[Possible Worlds]], [[Haecceitism]] and [[Necessary A Posteriori Truths]], because duplicates, quiddities and natural-kind essences are all stated modally.\n- **Metametaphysics and method:** [[Carving Nature at its Joints]], because natural kinds and properties are defined by it.\n- **Particulars and universals:** [[Universals]], because realists take the natural (sparse) properties to be universals.\n- **Realism and anti-realism:** [[Realism and Anti-Realism]], because response-dependence gives realism about red things but anti-realism about intrinsic colours.\n- **Tools:** [[Counterfactual Conditional]] and [[Supervenience]], because dispositions are tied to counterfactuals, and internal relations supervene on intrinsic properties.\n\n## Reading path (pages in the book)\n1. [[Intrinsic vs Extrinsic Properties]] (p. 108), [[Categorical and Dispositional Properties]] (p. 29), [[Quidditism]] (p. 203)\n2. [[Natural Property]] (p. 136), [[Sparse Property]] (p. 235), [[Natural Kinds]] (p. 134)\n3. [[Primary and Secondary Qualities]] (p. 179), [[Response-Dependence]] (p. 226), [[Determinables and Determinates]] (p. 55)\n- Pointer entries: [[Dispositional Properties]] (p. 59), [[Extrinsic Properties]] (p. 71)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "12 Kinds of properties/Categorical and Dispositional Properties.md": "---\ngroup: Kinds of properties\nrole: concept\nsource: Beebee et al. 2011, entry \"Categorical and Dispositional Properties\"\npages: entry starts p. 29\nstatus: unread\n---\n# Categorical and Dispositional Properties\n**Page(s):** entry starts p. 29\n**Book's definition:** p. 29. Copy the first sentence (the distinction, with 'powers' as another name for dispositions), plus the sentence in paragraph 2 beginning \"For an object to have a dispositional property is something to do with how it would be…\".\n**In one line:** Dispositional properties ('powers') concern how a thing *would* behave in certain circumstances; categorical properties concern how it *is*, here and now.\n**Role in [[00 – Kinds of properties]]:** The central distinction of this group. Whether fundamental properties are dispositional is a live dispute.\n**Explanation:** Fragility and solubility are standard examples of dispositions; being square and having a certain molecular structure are standard categorical properties. Each disposition has a definitional connection with a subjunctive or counterfactual conditional: if something is fragile then, other things equal, it would break if struck with a certain force. Categorical properties have no such connection. Many philosophers say fundamental physics characterises mass, charge and spin dispositionally. Others, many of them believers in Humean supervenience, hold that dispositions must be grounded in categorical properties. They give the truth conditions for the counterfactuals through facts about the closest possible world.\n**Example:** A fragile glass (it would break if struck) vs a square table (how it is now).\n**Connections:**\n- [[Dispositional Properties]]: a pointer entry that sends you here.\n- underlies [[Quidditism]]: because if all fundamental properties are categorical, as Humean supervenience holds, quidditism seems to follow (Quidditism entry).\n- is echoed by [[Primary and Secondary Qualities]]: because Locke's primary qualities act as the categorical basis of secondary qualities, which are dispositions to affect our senses.\n**Bridges to other groups:**\n- [[Counterfactual Conditional]] (Tools): because each disposition is definitionally tied to a counterfactual.\n- [[Humean Supervenience]] (Causation and laws): because its believers hold that dispositions must be grounded in categorical properties.\n- [[Possible Worlds]] (Modality): because they give the counterfactuals' truth conditions through facts about the closest possible world.\n- [[Ontology]] (Ontology): because whether categorical properties are more fundamental than dispositional ones is an example of a fundamentality question (Ontology entry).\n**Multiple meanings:** The entry says that characterising the distinction is itself contentious. Dispositions are also called 'powers'.\n**Further reading (book):** Fara (2009)\n  Full references (from the book's bibliography):\n  - Fara, M. (2009) ‘Dispositions’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Summer 2009 edn. Online. Available at: http://plato.stanford.edu/archives/sum2009/entries/dispositions.\n**Beyond the book:** —\n**My notes:**\n", "12 Kinds of properties/Determinables and Determinates.md": "---\ngroup: Kinds of properties\nrole: concept\nsource: Beebee et al. 2011, entry \"Determinables and Determinates\"\npages: pp. 55–56 (entry starts p. 55)\nstatus: unread\n---\n# Determinables and Determinates\n**Page(s):** pp. 55–56 (entry starts p. 55)\n**Book's definition:** p. 55. Copy the sentence near the end of paragraph 1 beginning \"In general, property x is a determinate of property y if and only if…\".\n**In one line:** Property x is a determinate of property y when having x is a specific way of having y. Being scarlet is a determinate of being red, which is a determinate of being coloured.\n**Role in [[00 – Kinds of properties]]:** A way of ordering properties from general (determinable) to specific (determinate).\n**Explanation:** Being square and being round are determinates of the determinable *being shaped*; being six foot two is a determinate of *being tall*. If x is a determinate of y, then y is a determinable of x. Some philosophers, valuing economy as a theoretical virtue, think facts about an object's determinable properties reduce to facts about its determinate ones. On this view, all there is to a baseball's being shaped is its being spherical (or cubical, or pyramid-shaped, and so on).\n**Example:** The baseball is shaped because it is spherical.\n**Connections:**\n- None named within this group.\n**Bridges to other groups:**\n- [[Properties]] (Particulars and universals): because the distinction orders properties by how specific they are.\n- [[Theoretical Virtues]] (Method): because economy motivates reducing determinables to determinates.\n- [[Reductionism]] (Tools): because the proposal is that determinable facts reduce to determinate facts.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Sanford (2008)\n  Full references (from the book's bibliography):\n  - Sanford, D. H. (2008) ‘Determinates vs. determinables’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Winter 2008 edn. Online. Available at: http://plato.stanford.edu/archives/win2008/entries/determinate-determinables.\n**Beyond the book:** —\n**My notes:**\n", "12 Kinds of properties/Dispositional Properties.md": "---\ngroup: Kinds of properties\nrole: pointer\nsource: Beebee et al. 2011, entry \"Dispositional Properties\"\npages: p. 59\nstatus: unread\n---\n# Dispositional Properties\n**Page(s):** p. 59\n**Pointer entry:** the book only says \"see\" → [[Categorical and Dispositional Properties]]. Read that note.\n**Role in [[00 – Kinds of properties]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "12 Kinds of properties/Extrinsic Properties.md": "---\ngroup: Kinds of properties\nrole: pointer\nsource: Beebee et al. 2011, entry \"Extrinsic Properties\"\npages: p. 71\nstatus: unread\n---\n# Extrinsic Properties\n**Page(s):** p. 71\n**Pointer entry:** the book only says \"see\" → [[Intrinsic vs Extrinsic Properties]]. Read that note.\n**Role in [[00 – Kinds of properties]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "12 Kinds of properties/Intrinsic vs Extrinsic Properties.md": "---\ngroup: Kinds of properties\nrole: concept\nsource: Beebee et al. 2011, entry \"Intrinsic vs Extrinsic Properties\"\npages: entry starts p. 108\nstatus: unread\n---\n# Intrinsic vs Extrinsic Properties\n**Page(s):** entry starts p. 108\n**Book's definition:** p. 108. Copy the first two sentences: the 'crude definition' of intrinsic properties, then the definition of extrinsic ones.\n**In one line:** Intrinsic properties concern how an object is 'in itself'. Extrinsic properties are the ones it has only because of how the rest of the world is.\n**Role in [[00 – Kinds of properties]]:** A basic classification of properties, used across metaphysics (supervenience, causation, colour, time).\n**Explanation:** Mass is intrinsic: it stays constant while the object is unchanged. Weight is extrinsic: the same unchanged object weighs one amount on Earth, nothing in deep space and much more near Jupiter. Height, being concrete and having hair are typical intrinsic properties. Being an uncle, being married and being hated by small children are extrinsic: a birth on the other side of the world can make you an uncle with no intrinsic change in you. In ordinary language 'intrinsic' can mean 'essential', a stronger sense than philosophers intend. How to analyse 'intrinsic' is a puzzle. David Lewis's analysis uses qualitative duplicates, including duplicates in other possible worlds. A relation is *internal* if it supervenes on the intrinsic properties of its relata.\n**Example:** An object's mass (intrinsic) vs its weight (extrinsic).\n**Connections:**\n- [[Extrinsic Properties]]: a pointer entry that sends you here.\n- is used by [[Response-Dependence]]: because a response-dependent view denies intrinsic, mind-independent colours.\n**Bridges to other groups:**\n- [[Essence]] (Modality): because the ordinary sense of 'intrinsic' means part of an object's essential nature.\n- [[Possible Worlds]] (Modality) and [[Lewis, David]] (Philosophers): because Lewis analyses intrinsicness by duplicates at other possible worlds.\n- [[Supervenience]] (Tools): because internal relations are those that supervene on the intrinsic properties of their relata.\n- [[Relata]] (Sets, classes and infinity): because the entry extends the distinction to relations and their relata.\n**Multiple meanings:** Yes: the ordinary sense ('essential') vs the philosophical sense. And in the causation debate, 'intrinsic relation' is sometimes used more loosely to mean 'local'.\n**Further reading (book):** Cameron (2009); Weatherson (2008)\n  Full references (from the book's bibliography):\n  - Cameron, R. (2009) ‘Intrinsic and extrinsic properties’, in R. Le Poidevin, P. Simons, A. McGonigal and R. Cameron (eds), pp. 265–75, *The Routledge Companion to Metaphysics*, London: Routledge.\n  - Weatherson, B. (2008) ‘Intrinsic vs. extrinsic properties’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/intrinsic-extrinsic.\n**Beyond the book:** —\n**My notes:**\n", "12 Kinds of properties/Natural Kinds.md": "---\ngroup: Kinds of properties\nrole: concept\nsource: Beebee et al. 2011, entry \"Natural Kinds\"\npages: pp. 134–135 (entry starts p. 134)\nstatus: unread\n---\n# Natural Kinds\n**Page(s):** pp. 134–135 (entry starts p. 134)\n**Book's definition:** p. 134, the opening sentence of the entry.\n**In one line:** A grouping of objects that carves nature at its joints, like electrons or water, unlike the ravens-or-writing-desks.\n**Role in [[00 – Kinds of properties]]:** The kind-level version of the natural/non-natural distinction.\n**Explanation:** There is a class of things that are ravens-or-writing-desks, but it isn't a natural kind. Electrons, samples of water and (perhaps) tigers are. How to account for the difference is disputed. Ellis (2001) has a fundamental commitment to natural-kind universals such as *being an electron*. Others take natural kinds to be those open to necessary a posteriori 'theoretical identifications' like 'water = H2O', where the right-hand side gives the kind's essence. Dupré (1993) is a pluralist: natural kinds are whatever categories best serve explanation and prediction, and there is no one correct, mind-independent way to carve nature.\n**Example:** Ravens-or-writing-desks (not a natural kind) vs electrons (a natural kind).\n**Connections:**\n- shares its criterion with [[Natural Property]]: because both are defined as carving nature at its joints.\n**Bridges to other groups:**\n- [[Carving Nature at its Joints]] (Method): because natural kinds are defined as carving nature at its joints.\n- [[Universals]] (Particulars and universals): because Ellis posits natural-kind universals.\n- [[Necessary A Posteriori Truths]] and [[Essence]] (Modality): because one view picks out natural kinds by theoretical identifications that state their essence.\n- [[Ontological Commitment]] (Ontology): because Ellis has a fundamental ontological commitment to natural kinds.\n**Multiple meanings:** There are rival accounts: natural-kind universals (Ellis), theoretical identifications, and pluralism (Dupré).\n**Further reading (book):** Bird and Tobin (2008)\n  Full references (from the book's bibliography):\n  - Bird, A. and Tobin, E. (2008) ‘Natural kinds’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Spring 2009 edn. Online. Available at: http://plato.stanford.edu/entries/natural-kinds.\n**Beyond the book:** —\n**My notes:**\n", "12 Kinds of properties/Natural Property.md": "---\ngroup: Kinds of properties\nrole: concept\nsource: Beebee et al. 2011, entry \"Natural Property\"\npages: p. 136\nstatus: unread\n---\n# Natural Property\n**Page(s):** p. 136\n**Book's definition:** p. 136. The whole entry is one sentence: copy it.\n**In one line:** A subclass of properties that some philosophers think carve nature at its joints.\n**Role in [[00 – Kinds of properties]]:** The property-level version of the natural/non-natural distinction.\n**Explanation:** This entry is a single sentence. The Sparse Property entry adds that Lewis calls the natural properties 'sparse': a small subclass of all properties. The Universals entry adds that realists usually take natural properties to be universals.\n**Example:** (The entry gives no example. Compare the natural kind *electron* in [[Natural Kinds]].)\n**Connections:**\n- is called a [[Sparse Property]] by Lewis: because that is his term for the natural properties.\n- shares its criterion with [[Natural Kinds]]: because both carve nature at its joints.\n**Bridges to other groups:**\n- [[Carving Nature at its Joints]] (Method): because natural properties are defined by it.\n- [[Universals]] (Particulars and universals): because realists generally take the natural properties to be universals (Universals entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "12 Kinds of properties/Primary and Secondary Qualities.md": "---\ngroup: Kinds of properties\nrole: position\nsource: Beebee et al. 2011, entry \"Primary and Secondary Qualities\"\npages: entry starts p. 179\nstatus: unread\n---\n# Primary and Secondary Qualities\n**Page(s):** entry starts p. 179\n**Book's definition:** p. 179. Copy the sentences in paragraph 2 beginning \"Primary qualities, roughly, are qualities…\" and \"Secondary qualities, by contrast, are supposed to be…\".\n**In one line:** Locke's distinction. Primary qualities (extension, shape, solidity) exist independently of perception and resemble our impressions of them. Secondary qualities (colours, smells) are powers to produce sensations in us.\n**Role in [[00 – Kinds of properties]]:** The historical root of debates about mind-dependent properties and response-dependence.\n**Explanation:** The distinction goes back to Galileo and Descartes; its best-known protagonists are Locke and Berkeley. For Locke, calling an object red says nothing about how it is 'in itself' but how it affects our senses. Secondary qualities are, in today's term, response dependent: our impression of roundness resembles something in the object, but our impression of red does not. Objects have these powers because of their primary qualities, especially those of their 'corpuscles'. So the distinction resembles the categorical/dispositional one, with primary qualities as the categorical basis of secondary ones. Berkeley concluded that primary qualities aren't 'in' material objects either, and that mind-independent 'matter' makes no sense.\n**Example:** An apple's roundness resembles our impression of it; its redness does not.\n**Connections:**\n- is an early form of [[Response-Dependence]]: because Locke's secondary qualities are powers to produce responses in us.\n- resembles [[Categorical and Dispositional Properties]]: because primary qualities act as the categorical basis of the secondary ones.\n**Bridges to other groups:**\n- [[Locke, John]] and [[Berkeley, George]] (Philosophers): because they are the debate's best-known protagonists.\n- [[Phenomenalism and Idealism]] (Realism and anti-realism): because Berkeley's rejection of mind-independent matter leads there.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Blackburn (1999, Chapter 7)\n  Full references (from the book's bibliography):\n  - Blackburn, S. (1999) *Think!*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "12 Kinds of properties/Quidditism.md": "---\ngroup: Kinds of properties\nrole: position\nsource: Beebee et al. 2011, entry \"Quidditism\"\npages: pp. 203–204 (entry starts p. 203)\nstatus: unread\n---\n# Quidditism\n**Page(s):** pp. 203–204 (entry starts p. 203)\n**Book's definition:** p. 203, the opening sentence of the entry.\n**In one line:** The view that a property's identity is brute: independent of how things with that property behave, appear or are detected.\n**Role in [[00 – Kinds of properties]]:** A position on what makes a property the property it is. It is the property analogue of haecceitism.\n**Explanation:** Scientists characterise mass and charge by the dispositions they give things: things with mass fall, negative charges repel each other. For the quidditist the link is contingent. There is a possible world where things with mass behave like things with charge, and vice versa. The anti-quidditist is more likely to hold that properties just *are* dispositions, so no such world is possible. Quidditism is sometimes said to be an inevitable consequence of Humean supervenience, on which all fundamental properties are categorical. Some, notably David Lewis (2008), simply bite the bullet and accept it.\n**Example:** A world where mass and negative charge swap the behaviour they actually produce.\n**Connections:**\n- relies on [[Categorical and Dispositional Properties]]: because quidditism goes with properties that are only contingently connected to dispositions.\n**Bridges to other groups:**\n- [[Haecceitism]] (Modality): because quidditism is often understood as its analogue for properties.\n- [[Humean Supervenience]] (Causation and laws): because quidditism is said to follow from it.\n- [[Possible Worlds]] (Modality): because the view is stated by a world where mass and charge swap roles.\n- [[Lewis, David]] (Philosophers): because he embraces quidditism (Lewis 2008).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "12 Kinds of properties/Response-Dependence.md": "---\ngroup: Kinds of properties\nrole: concept\nsource: Beebee et al. 2011, entry \"Response-Dependence\"\npages: pp. 226–227 (entry starts p. 226)\nstatus: unread\n---\n# Response-Dependence\n**Page(s):** pp. 226–227 (entry starts p. 226)\n**Book's definition:** p. 226. Copy the sentence beginning \"To say that a concept ('red', say) is response-dependent is to say, roughly…\".\n**In one line:** A concept is response-dependent if its correct application is at least partly fixed by our responses, as being red is partly a matter of looking a certain way to us.\n**Role in [[00 – Kinds of properties]]:** A middle position between full realism and anti-realism about properties like colour (and possibly moral properties).\n**Explanation:** Secondary-quality concepts like 'red', 'smooth' and 'tasty' are the usual examples. On the book's definition of realism, a response-dependent view of red makes you a realist about red things, but an anti-realist about intrinsic, mind-independent colours: redness depends on beings with perceptual systems like ours. An apparent problem: a thing isn't red just because it looks red to one person on one occasion. A red apple stays red with the lights off or when seen by a colour-blind person. The view helps reconcile the fact that there are red things with the sense that redness isn't really 'in' objects. A similar move is tried for moral properties such as viciousness.\n**Example:** A red apple is still red in the dark.\n**Connections:**\n- descends from [[Primary and Secondary Qualities]]: because Locke's secondary qualities are response dependent.\n- denies intrinsic colours in [[Intrinsic vs Extrinsic Properties]]: because on this view no colour is a fully mind-independent, intrinsic property.\n**Bridges to other groups:**\n- [[Realism and Anti-Realism]] (Realism and anti-realism): because response-dependence is a key notion there (realism about red things, anti-realism about intrinsic colours).\n- [[Concept]] (Tools): because response-dependence is a feature of concepts.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Joyce (2009, § 5)\n  Full references (from the book's bibliography):\n  - Joyce, R. (2009) ‘Moral anti-realism’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Summer 2009 edn. Online. Available at: http://plato.stanford.edu/archives/sum2009/entries/moral-anti-realism.\n**Beyond the book:** —\n**My notes:**\n", "12 Kinds of properties/Sparse Property.md": "---\ngroup: Kinds of properties\nrole: concept\nsource: Beebee et al. 2011, entry \"Sparse Property\"\npages: p. 235\nstatus: unread\n---\n# Sparse Property\n**Page(s):** p. 235\n**Book's definition:** p. 235. The whole entry is one passage of two sentences: copy both.\n**In one line:** Lewis's term for the natural properties: a relatively small subclass of all properties, contrasted with the 'abundant' properties that don't carve nature at the joints.\n**Role in [[00 – Kinds of properties]]:** Lewis's terminology for the natural/non-natural divide among properties.\n**Explanation:** The sparse properties are the natural ones. The abundant properties are the much larger remainder. The Universals entry adds that realists usually say universals are 'sparse' rather than 'abundant'.\n**Example:** (The entry gives no example.)\n**Connections:**\n- is another name for [[Natural Property]]: because Lewis uses 'sparse property' for the natural properties.\n**Bridges to other groups:**\n- [[Lewis, David]] (Philosophers): because the term is his.\n- [[Carving Nature at its Joints]] (Method): because abundant properties are defined as those that don't carve at the joints.\n- [[Universals]] (Particulars and universals): because realists typically take universals to be sparse.\n**Multiple meanings:** Sparse vs abundant properties.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "13 Identity/00 – Identity.md": "---\ngroup: Identity\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Identity\n**Central question:** What is it for things to be one and the same, at a time and over time, and what principles govern identity?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| Indiscernibility of identicals ([[Leibniz's Law]]) | If x = y, everything true of x is true of y | (Widely accepted) | Few dissent |\n| Identity of indiscernibles ([[Leibniz's Law]]) | If x and y share everything, x = y | Leibniz | Two exactly alike electrons seem distinct |\n| Necessity of identity ([[Identity]]) | All true identities are necessary | Kripke | — |\n| 'Person' as a phase sortal ([[Phase Sortal]]) | A person is a human animal, but only for part of its existence | Animalism | — |\n\n## Key arguments and test cases\n- The same dress at a party; the haircut that doesn't make you 'a different person': [[Identity]] (p. 95)\n- The old photograph; the Ship of Theseus and transitivity: [[Identity Over Time]] (p. 97)\n- The two-electron universe: [[Leibniz's Law]] (p. 114)\n- 'Kitten' and 'person' as phase sortals: [[Phase Sortal]] (p. 162)\n\n## Bridges to other groups\n- **Personal identity:** [[Personal Identity]], [[Fission]] and [[Animalism]], because personal identity is numerical identity over time for persons.\n- **Time:** [[Perdurantism]] and [[Endurantism]], because how things persist through change is debated there.\n- **Modality:** [[Necessary A Posteriori Truths]] and [[Haecceitism]], because Kripke claims identities are necessary, and haecceitism concerns identity across worlds.\n- **Particulars and universals:** [[Universals]] and [[Trope Theory]], because they give rival explanations of qualitative identity.\n- **Sets:** [[Transitive Relation]], because the Ship of Theseus puzzle depends on identity being transitive.\n\n## Reading path (pages in the book)\n1. [[Identity]] (p. 95), then [[Leibniz's Law]] (p. 114)\n2. [[Identity Over Time]] (p. 97), [[Persistence]] (p. 161), [[Synchronic Identity]] (p. 244)\n3. [[Sortals]] (p. 235), [[Phase Sortal]] (p. 162)\n- Pointer entries: [[Diachronic Identity]] (p. 57), [[Identity of Indiscernibles]] (p. 97), [[Indiscernibility of Identicals]] (p. 105)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "13 Identity/Diachronic Identity.md": "---\ngroup: Identity\nrole: pointer\nsource: Beebee et al. 2011, entry \"Diachronic Identity\"\npages: p. 57\nstatus: unread\n---\n# Diachronic Identity\n**Page(s):** p. 57\n**Pointer entry:** the book only says \"see\" → [[Identity]] and [[Identity Over Time]]. Read that note.\n**Role in [[00 – Identity]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "13 Identity/Identity Over Time.md": "---\ngroup: Identity\nrole: concept\nsource: Beebee et al. 2011, entry \"Identity Over Time\"\npages: pp. 97–99 (entry starts p. 97)\nstatus: unread\n---\n# Identity Over Time\n**Page(s):** pp. 97–99 (entry starts p. 97)\n**Book's definition:** p. 97, the opening sentence of the entry.\n**In one line:** When some thing x at one time is numerically identical to some thing y at another time (diachronic identity), as opposed to identity at a single time (synchronic).\n**Role in [[00 – Identity]]:** The 'over time' half of identity. Personal identity is its special case for persons.\n**Explanation:** Looking at a photo of an eight-year-old and saying 'that's me!' asserts identity over time. You are not, however, identical to Genghis Khan or to a table from the 1600s. One question is what the conditions are for x to be identical to y, usually asked relative to a sortal such as 'person' (which gives the question of personal identity), more rarely for any kind of thing. Another involves puzzle cases. In the Ship of Theseus, a fission case, if the original ship is identical to both the plank-by-plank replaced ship and the ship reassembled from the old planks, then by transitivity those two ships would be identical to each other. The statue and the lump of clay is another. Some also find it puzzling how anything can stay identical through change, a problem similar to that of temporary intrinsics.\n**Example:** The Ship of Theseus: replaced plank by plank, and also reassembled from the old planks.\n**Connections:**\n- is the diachronic case of [[Identity]]: because it concerns numerical identity across times.\n- is asked relative to [[Sortals]]: because identity conditions are usually sought for a kind such as 'person'.\n- [[Diachronic Identity]] and [[Synchronic Identity]]: the two terms it contrasts (the first is a pointer entry).\n- is related to [[Persistence]]: because persisting means existing at more than one time (Persistence entry).\n**Bridges to other groups:**\n- [[Personal Identity]] and [[Fission]] (Personal identity): because personal identity is identity over time for persons, and the Ship of Theseus is a fission case.\n- [[Transitive Relation]] (Sets, classes and infinity): because the Ship puzzle relies on identity being transitive.\n- [[Perdurantism]] and [[Endurantism]] (Time): because the statue and clay case and the problem of change are discussed there.\n- [[Ship of Theseus]] (Mereology): because that pointer entry sends you here.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Gallois (2009)\n  Full references (from the book's bibliography):\n  - Gallois, A. (2009) ‘Identity over time’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Winter 2009 edn. Online. Available at: http://plato.stanford.edu/archives/win2009/entries/identity-time.\n**Beyond the book:** —\n**My notes:**\n", "13 Identity/Identity of Indiscernibles.md": "---\ngroup: Identity\nrole: pointer\nsource: Beebee et al. 2011, entry \"Identity of Indiscernibles\"\npages: p. 97\nstatus: unread\n---\n# Identity of Indiscernibles\n**Page(s):** p. 97\n**Pointer entry:** the book only says \"see\" → [[Leibniz's Law]]. Read that note.\n**Role in [[00 – Identity]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "13 Identity/Identity.md": "---\ngroup: Identity\nrole: concept\nsource: Beebee et al. 2011, entry \"Identity\"\npages: pp. 95–97 (entry starts p. 95)\nstatus: unread\n---\n# Identity\n**Page(s):** pp. 95–97 (entry starts p. 95)\n**Book's definition:** p. 95. There's no one-line definition. Copy the end of paragraph 1, where 'qualitative identity' is contrasted with numerical identity.\n**In one line:** Numerical identity is being one and the same thing. It must be kept apart from qualitative identity, which is being exactly alike.\n**Role in [[00 – Identity]]:** The basic notion of this group, and a source of confusion everywhere else.\n**Explanation:** If you and a friend turn up at a party 'in the same dress', you probably imagine two exactly similar dresses (qualitative identity), not both of you squeezed into one dress (numerical identity). Mixing the two up causes errors. Personal identity asks about *numerical* identity, so getting a haircut doesn't make you 'a different person', only a qualitatively different one. Properties complicate the picture: believers in universals say two red dresses share numerically one universal, while disbelievers explain their qualitative identity some other way. Another question is whether true identities (a = b) are necessary; Kripke claims they all are.\n**Example:** Two people wearing 'the same dress'.\n**Connections:**\n- is applied over time in [[Identity Over Time]]: because the entry sends diachronic questions there.\n- [[Diachronic Identity]] and [[Synchronic Identity]]: identity over time vs at a time (the first is a pointer entry).\n**Bridges to other groups:**\n- [[Personal Identity]] (Personal identity): because that debate is about numerical, not qualitative, identity.\n- [[Universals]] (Particulars and universals): because believers in universals explain qualitative sameness by a numerically identical universal.\n- [[Necessary A Posteriori Truths]] (Modality) and [[Kripke, Saul]] (Philosophers): because Kripke claims all identities are necessary.\n- [[Type and Tokens]] (Tools): because 'the same dress' is ambiguous between type and token (Type and Tokens entry).\n**Multiple meanings:** Yes: numerical vs qualitative identity (and numerical vs qualitative difference).\n**Further reading (book):** Noonan (2009)\n  Full references (from the book's bibliography):\n  - Noonan, H. (2009) ‘Identity’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Winter 2009 edn. Online. Available at: http://plato.stanford.edu/archives/win2009/entries/identity.\n**Beyond the book:** —\n**My notes:**\n", "13 Identity/Indiscernibility of Identicals.md": "---\ngroup: Identity\nrole: pointer\nsource: Beebee et al. 2011, entry \"Indiscernibility of Identicals\"\npages: p. 105\nstatus: unread\n---\n# Indiscernibility of Identicals\n**Page(s):** p. 105\n**Pointer entry:** the book only says \"see\" → [[Leibniz's Law]]. Read that note.\n**Role in [[00 – Identity]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "13 Identity/Leibniz's Law.md": "---\ngroup: Identity\nrole: concept\nsource: Beebee et al. 2011, entry \"Leibniz's Law\"\npages: pp. 114–115 (entry starts p. 114)\nstatus: unread\n---\n# Leibniz's Law\n**Page(s):** pp. 114–115 (entry starts p. 114)\n**Book's definition:** p. 114, the opening sentence of the entry.\n**In one line:** Two principles from Leibniz: the indiscernibility of identicals (identical things share all their properties) and the identity of indiscernibles (things that share all their properties are identical).\n**Role in [[00 – Identity]]:** The main logical principles governing identity.\n**Explanation:** The indiscernibility of identicals is usually taken to be uncontroversial. If Obama is 1.87 m tall and Obama is the President, the President is 1.87 m tall, because there is just one person. The identity of indiscernibles is much less popular, since it seems possible for two indistinguishable things to be distinct: for example, a universe containing nothing but two qualitatively identical electrons. Unfortunately, some philosophers use 'Leibniz's Law' for one principle and some for the other. If a philosopher treats it as obviously true, they probably mean the indiscernibility of identicals.\n**Example:** A universe with only two exactly alike electrons: indiscernible, but (allegedly) not identical.\n**Connections:**\n- [[Indiscernibility of Identicals]] and [[Identity of Indiscernibles]]: pointer entries for its two principles.\n- states principles of [[Identity]]: because both principles concern numerical identity and sharing properties.\n**Bridges to other groups:**\n- None named in this entry; see the hub. (Further discussion: Forrest 2009, cited in the entry.)\n**Multiple meanings:** Yes: 'Leibniz's Law' is used for either principle, depending on the author.\n**Further reading (book):** Forrest (2009)\n  Full references (from the book's bibliography):\n  - Forrest, P. (2009) ‘The identity of indiscernibles’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Summer 2009 edn. Online. Available at: http://plato.stanford.edu/archives/sum2009/entries/identity-indiscernible.\n**Beyond the book:** —\n**My notes:**\n", "13 Identity/Persistence.md": "---\ngroup: Identity\nrole: concept\nsource: Beebee et al. 2011, entry \"Persistence\"\npages: entry starts p. 161\nstatus: unread\n---\n# Persistence\n**Page(s):** entry starts p. 161\n**Book's definition:** p. 161, the opening sentence of the entry.\n**In one line:** An object persists if it exists at one time and also at another, distinct time.\n**Role in [[00 – Identity]]:** The basic fact that theories of persistence (endurantism and perdurantism) try to explain.\n**Explanation:** If David Cameron existed in 1980 and exists in 2010, he persists. The entry says there are serious metaphysical questions about how things persist, and sends you to perdurantism and endurantism.\n**Example:** David Cameron in 1980 and in 2010.\n**Connections:**\n- None named within this group in the entry (compare [[Identity Over Time]]).\n**Bridges to other groups:**\n- [[Perdurantism]] and [[Endurantism]] (Time): because they are the rival theories of how things persist.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "13 Identity/Phase Sortal.md": "---\ngroup: Identity\nrole: concept\nsource: Beebee et al. 2011, entry \"Phase Sortal\"\npages: p. 162\nstatus: unread\n---\n# Phase Sortal\n**Page(s):** p. 162\n**Book's definition:** p. 162, the opening sentence of the entry.\n**In one line:** A sortal that applies to an object for only part of its existence, like 'kitten', 'child' or 'pensioner'.\n**Role in [[00 – Identity]]:** A tool in debates about identity over time, especially personal identity.\n**Explanation:** A sortal, for short, is a count noun like 'cat': you can count cats, but not water or wisdom. 'Kitten' is a phase sortal because it applies to a cat for only part of its life. According to animalism, 'person' is a phase sortal too: a person is identical with a human animal, but not for the animal's whole existence (not when it is a foetus).\n**Example:** 'Kitten' applies to a cat only for part of its life.\n**Connections:**\n- is a kind of [[Sortals]]: because it is a sortal limited to a phase of a thing's existence.\n**Bridges to other groups:**\n- [[Animalism]] and [[Personal Identity]] (Personal identity): because animalism treats 'person' as a phase sortal.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "13 Identity/Sortals.md": "---\ngroup: Identity\nrole: concept\nsource: Beebee et al. 2011, entry \"Sortals\"\npages: p. 235\nstatus: unread\n---\n# Sortals\n**Page(s):** p. 235\n**Book's definition:** p. 235. Copy the second sentence, which gives the two uncontroversial features of sortals (the first sentence says the exact definition is contentious).\n**In one line:** Terms (or concepts) that take numerical modifiers, like 'cat' ('two cats'), unlike mass nouns like 'milk'. Some also require that sortals sort things into significant kinds.\n**Role in [[00 – Identity]]:** The kind-terms relative to which identity questions are usually asked.\n**Explanation:** Outside philosophy, sortals are called count nouns; 'beer' works both as a mass noun and as a count noun. Being a count noun is sometimes taken to be necessary but not sufficient for being a sortal. On a stronger reading, sortals sort things into kinds in a metaphysically significant way, perhaps by specifying their essence. Philosophers sometimes distinguish pure or 'substance' sortals ('cat', 'electron'), phase sortals ('kitten', 'child') and restricted sortals ('white kitten', 'green car').\n**Example:** 'Two cats', but not 'two milks'.\n**Connections:**\n- includes [[Phase Sortal]]: because phase sortals are one type of sortal.\n- frames [[Identity Over Time]]: because identity conditions are usually sought relative to a sortal (Identity Over Time entry).\n**Bridges to other groups:**\n- [[Essence]] (Modality): because on the stronger reading, sortals may specify the essence of their kind.\n- [[Concept]] (Tools): because sortals may be concepts rather than words.\n- [[Personal Identity]] (Personal identity): because 'person' is the sortal at issue there (Identity Over Time entry).\n**Multiple meanings:** Yes: the weak sense (count noun) vs the strong sense (sorts things into kinds); pure/substance, phase and restricted sortals.\n**Further reading (book):** Grandy (2008)\n  Full references (from the book's bibliography):\n  - Grandy, R. E. (2008) ‘Sortals’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/sortals.\n**Beyond the book:** —\n**My notes:**\n", "13 Identity/Synchronic Identity.md": "---\ngroup: Identity\nrole: concept\nsource: Beebee et al. 2011, entry \"Synchronic Identity\"\npages: p. 244\nstatus: unread\n---\n# Synchronic Identity\n**Page(s):** p. 244\n**Book's definition:** p. 244. The whole entry is one sentence: copy it.\n**In one line:** Identity at a time, as opposed to identity over time.\n**Role in [[00 – Identity]]:** The 'at a time' half of the identity distinction.\n**Explanation:** The entry is one sentence. The Identity Over Time entry explains synchronic identity as x being identical to y *at the same time*.\n**Example:** (The entry gives no example.)\n**Connections:**\n- contrasts with [[Identity Over Time]]: because it is identity at one time rather than across times.\n- is explained under [[Identity]]: because the entry sends you there.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "14 Sets, classes and infinity/00 – Sets, classes and infinity.md": "---\ngroup: Sets, classes and infinity\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Sets, classes and infinity\n**Central question:** What are classes and relations (and their properties: transitive, one-to-one, ancestral), and how should metaphysics handle the infinite? This is the logical and mathematical toolkit of the field.\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| Only potential infinity ([[Infinity]]) | No completed infinite totals; division can go on forever but never be finished | Aristotle | Infinite time and infinite divisibility seem possible |\n| Actual infinities of different sizes ([[Infinity]], [[Aleph]]) | Same size = one-to-one correspondence | Cantor (using Hume's principle) | Counter-intuitive results (as many positive integers as integers) |\n| Accepting classes despite abstractness ([[Class]]) | Classes are essential to mathematics | Quine, Lewis | General resistance to abstract objects |\n| Proper classes ([[Set]]) | Some classes can't be members, which avoids paradoxes | Some set theories | — |\n| Nothing moves ([[Zeno]]) | Motion would need infinitely many sub-journeys | Zeno (for Parmenides) | Aristotle's potential infinity (whether it works is debated) |\n\n## Key arguments and test cases\n- Pairing positive integers with all integers: [[Infinity]] (p. 105)\n- The dichotomy (the runner): [[Zeno]] (p. 268)\n- Counting infinitely many grains of sand: [[Supertask]] (p. 239)\n- From *parent of* to *ancestor of*: [[Ancestral Relation]] (p. 6)\n- Clark Kent, Superman and Kal-El: [[Transitive Relation]] (p. 254)\n- The dividing amoeba: [[One-to-One Relation]] (p. 150)\n\n## Bridges to other groups\n- **Personal identity:** [[Psychological Continuity]] and [[Fission]], because transitivity, one-to-one-ness and ancestrals drive the memory and fission puzzles.\n- **Causation and laws:** [[Counterfactual Theory of Causation]] and [[Causal Relata]], because Lewis defines causation as an ancestral, and causation's relata are disputed.\n- **Identity:** [[Identity]], because identity is transitive and one-to-one.\n- **Particulars and universals:** [[Class Nominalism]], because properties may be classes.\n- **Mereology:** [[Part]], [[Gunk]] and [[Simple]], because of the subset/part analogy, infinite divisibility, and Zeno's monism.\n- **Time:** [[Time]], because the philosophy of time grew out of Zeno's puzzles.\n\n## Reading path (pages in the book)\n1. [[Class]] (p. 36), [[Set]] (p. 230), [[Singleton]] (p. 232)\n2. [[Relata]] (p. 219), [[Transitive Relation]] (p. 254), [[Ancestral Relation]] (p. 6), [[One-to-One Relation]] (p. 150)\n3. [[Infinity]] (p. 105), [[Aleph]] (p. 5), [[Supertask]] (p. 239), [[Zeno]] (p. 268)\n- Pointer entries: [[Proper Class]] (p. 195), [[Transitive Closure]] (p. 254)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "14 Sets, classes and infinity/Aleph.md": "---\ngroup: Sets, classes and infinity\nrole: concept\nsource: Beebee et al. 2011, entry \"Aleph\"\npages: p. 5\nstatus: unread\n---\n# Aleph\n**Page(s):** p. 5\n**Book's definition:** p. 5. The whole entry is one sentence: copy it.\n**In one line:** Aleph-zero, aleph-one, aleph-two and so on are names for the different sizes of infinity.\n**Role in [[00 – Sets, classes and infinity]]:** Notation for Cantor's sizes of infinity.\n**Explanation:** This one-sentence entry sends you to Infinity, where Cantor's discovery that infinite collections come in different sizes is explained.\n**Example:** (See the integer pairings in [[Infinity]].)\n**Connections:**\n- names sizes of [[Infinity]]: because the alephs are the different infinite sizes.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "14 Sets, classes and infinity/Ancestral Relation.md": "---\ngroup: Sets, classes and infinity\nrole: concept\nsource: Beebee et al. 2011, entry \"Ancestral Relation\"\npages: pp. 6–7 (entry starts p. 6)\nstatus: unread\n---\n# Ancestral Relation\n**Page(s):** pp. 6–7 (entry starts p. 6)\n**Book's definition:** p. 6. Copy the last two sentences of paragraph 1 (calling the 'chain' relation the ancestral of R, also known as its transitive closure).\n**In one line:** The relation of being linked to something by a chain of R-relations. It is always transitive, and is also called the transitive closure of R.\n**Role in [[00 – Sets, classes and infinity]]:** A logical tool for turning an intransitive relation into a transitive one, used in theories of causation and personal identity.\n**Explanation:** If x1 is R-related to x2, x2 to x3, and so on, then x1 stands to all of them in the relation of being linked by a chain of R-relations: the ancestral of R. The name comes from the example. My father is my parent and my grandfather is his parent; only my father bears *parent of* to me, but all of them bear its ancestral, *ancestor of*, to me. Two important uses: in Lewis's counterfactual theory, causation (transitive) is defined as the ancestral of causal dependence (intransitive), and in psychological continuity theory, continuity is the ancestral of psychological connectedness.\n**Example:** *Ancestor of* is the ancestral of *parent of*.\n**Connections:**\n- is always a [[Transitive Relation]]: because chaining makes the relation transitive.\n- [[Transitive Closure]]: a pointer entry that sends you here.\n**Bridges to other groups:**\n- [[Counterfactual Theory of Causation]] and [[Pre-Emption]] (Causation and laws): because Lewis defines causation as the ancestral of causal dependence.\n- [[Psychological Continuity]] (Personal identity): because continuity is defined as the ancestral of connectedness.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "14 Sets, classes and infinity/Class.md": "---\ngroup: Sets, classes and infinity\nrole: concept\nsource: Beebee et al. 2011, entry \"Class\"\npages: pp. 36–38 (entry starts p. 36)\nstatus: unread\n---\n# Class\n**Page(s):** pp. 36–38 (entry starts p. 36)\n**Book's definition:** p. 36. Copy the second sentence (classes are a technical device: given some things, there is a class of those things).\n**In one line:** A collection of things, its members. Any things whatever form a class, and two classes are identical if and only if they have the same members.\n**Role in [[00 – Sets, classes and infinity]]:** The basic set-theoretic object, and a building block for nominalist and Lewisian metaphysics.\n**Explanation:** There is a class of all goats, and also one containing just me and Brad Pitt's left arm: members needn't resemble each other. Classes are written with curly brackets, {a, b, c}, and membership with ∈. Membership isn't transitive: a is a member of {a, b}, which is a member of {{a, b}, {c, d}}, but a isn't a member of that larger class. Classes are usually taken to be abstract objects outside space and time. Many philosophers resist abstract objects, but because classes are crucial to mathematics, metaphysicians such as Quine and Lewis accept them while rejecting other abstracta, or reducing other abstracta to classes (as class nominalism does). Every class is a subset of itself, and the empty set is a subset of every class.\n**Example:** The class {me, Brad Pitt's left arm}.\n**Connections:**\n- is often used interchangeably with [[Set]]: because the entry says so.\n- has a one-member kind, [[Singleton]]: because a singleton is a class with one member.\n- has an outsized kind, [[Proper Class]] (pointer entry): because some classes are too big to be members of others.\n- has membership that isn't a [[Transitive Relation]]: because a member of a member need not be a member.\n**Bridges to other groups:**\n- [[Abstract vs Concrete]] and [[Ontology]] (Ontology): because classes are usually abstract, and whether to admit them is an ontology question.\n- [[Class Nominalism]] (Particulars and universals): because properties can be reduced to classes.\n- [[Quine, W. V.]] and [[Lewis, David]] (Philosophers): because they accept classes while rejecting other abstracta.\n- [[Improper Part]] and [[Proper Part]] (Mereology): because subset and proper subset are compared to improper and proper parts.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** The above will probably suffice, as most discussions of set theory became quite complicated. If needed, however, you might wish to refer to Jech (2009)\n  Full references (from the book's bibliography):\n  - Jech, T. (2009) ‘Set theory’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Spring 2009 edn. Online. Available at: http://plato.stanford.edu/archives/spr2009/entries/set-theory.\n**Beyond the book:** —\n**My notes:**\n", "14 Sets, classes and infinity/Infinity.md": "---\ngroup: Sets, classes and infinity\nrole: concept\nsource: Beebee et al. 2011, entry \"Infinity\"\npages: pp. 105–107 (entry starts p. 105)\nstatus: unread\n---\n# Infinity\n**Page(s):** pp. 105–107 (entry starts p. 105)\n**Book's definition:** p. 105. Copy the first sentence (infinity's role in metaphysics). Its two features of interest are set out in the sections 'Classical themes' and 'Cantor'.\n**In one line:** The infinite as metaphysics treats it: Aristotle's distinction between potential and actual infinity, and Cantor's set-theoretic account of infinite sizes.\n**Role in [[00 – Sets, classes and infinity]]:** The notion behind Zeno's paradoxes, supertasks, gunk and infinite time.\n**Explanation:** Aristotle argued that infinity can't be a number, since nobody could count to it, so there can't be infinitely many things: time can't be eternal, and objects can't be infinitely divisible. That clashes with apparently possible scenarios like time without end. His resolution distinguishes *potential* infinity (you could keep dividing an object forever) from *actual* infinity (you could never complete the process), so he wouldn't have accepted supertasks. Whether this solves Zeno's paradoxes is debated. Cantor's set theory says more. He adopted a principle originating with Hume: two collections are the same in number if they can be put in one-to-one correspondence. Then there are as many positive integers as negative ones, and, bizarrely, as many positive integers as integers altogether.\n**Example:** Pairing 1, 2, 3, 4… with 1, −1, 2, −2…: as many positive integers as integers.\n**Connections:**\n- is measured by [[Aleph]] numbers: because the alephs name its sizes.\n- is involved in [[Supertask]] and [[Zeno]]: because supertasks complete infinitely many tasks, and Zeno's paradoxes turn on infinite division.\n- is studied through [[Class]] (set theory): because Cantor's work on set theory transformed it.\n- uses [[One-to-One Relation]]s: because Cantor counts infinite collections by one-to-one correspondence.\n**Bridges to other groups:**\n- [[Aristotle]] and [[Hume, David]] (Philosophers): because of potential vs actual infinity, and Hume's principle.\n- [[Gunk]] and [[Part]] (Mereology): because infinite divisibility is distinguished from gunk.\n- [[Time]] (Time): because infinity is much used in the philosophy of time.\n**Multiple meanings:** Aristotle's potential vs actual infinity.\n**Further reading (book):** Moore (2001)\n  Full references (from the book's bibliography):\n  - Moore, A. W. (2001) *The Infinite*, 2nd edn, London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "14 Sets, classes and infinity/One-to-One Relation.md": "---\ngroup: Sets, classes and infinity\nrole: concept\nsource: Beebee et al. 2011, entry \"One-to-One Relation\"\npages: pp. 150–151 (entry starts p. 150)\nstatus: unread\n---\n# One-to-One Relation\n**Page(s):** pp. 150–151 (entry starts p. 150)\n**Book's definition:** p. 150, the opening sentence of the entry.\n**In one line:** A relation that, necessarily, has at most one thing on each side, like being married (in British law, at any rate).\n**Role in [[00 – Sets, classes and infinity]]:** A logical property of relations, crucial to puzzles about identity.\n**Explanation:** *Being on the left of* isn't one-to-one: John can be to the left of George, Paul, Ringo and the Eiffel Tower. Most philosophers think identity is one-to-one, since nothing is identical to more than one thing. That's less obvious over time: when an amoeba divides, we might carelessly say the original *is* now two amoebae. This matters for personal identity, because relations like psychological continuity don't seem to be one-to-one (as fission and fusion cases suggest). It's hard to account for a one-to-one relation in terms of one that isn't; one option is to add a 'no branching' clause.\n**Example:** An amoeba dividing into two.\n**Connections:**\n- None named within this group.\n**Bridges to other groups:**\n- [[Identity]] and [[Identity Over Time]] (Identity): because identity is one-to-one, which is less obvious over time.\n- [[Personal Identity]], [[Psychological Continuity]] and [[Fission]] (Personal identity): because psychological continuity can branch.\n- [[Fusion, Mereological]] (Mereology): because 'fusion' in the personal identity sense is the reverse of fission (Fusion entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "14 Sets, classes and infinity/Proper Class.md": "---\ngroup: Sets, classes and infinity\nrole: pointer\nsource: Beebee et al. 2011, entry \"Proper Class\"\npages: p. 195\nstatus: unread\n---\n# Proper Class\n**Page(s):** p. 195\n**Pointer entry:** the book only says \"see\" → [[Set]]. Read that note.\n**Role in [[00 – Sets, classes and infinity]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "14 Sets, classes and infinity/Relata.md": "---\ngroup: Sets, classes and infinity\nrole: concept\nsource: Beebee et al. 2011, entry \"Relata\"\npages: pp. 219–220 (entry starts p. 219)\nstatus: unread\n---\n# Relata\n**Page(s):** pp. 219–220 (entry starts p. 219)\n**Book's definition:** p. 219, the opening sentence of the entry.\n**In one line:** The things that a relation relates ('relatum' is the singular).\n**Role in [[00 – Sets, classes and infinity]]:** Basic terminology for talking about relations.\n**Explanation:** If Jack and Jim are twenty metres apart, they are the relata of the *20 metres away from* relation. If Jack hates Jill, Jack and Jill are the relata of *hating*. A love triangle has three relata. In logic notation, in Rab, Rac and Rabc, the letters after R are the relata. We also talk of the *types* of relata a relation takes: hating needs a person on one side, but anything at all on the other. More philosophically interesting is the debate about what the relata of causation are: facts, events, states of affairs, or even agents.\n**Example:** Jack hates Jill: Jack and Jill are the relata.\n**Connections:**\n- None named within this group.\n**Bridges to other groups:**\n- [[Causal Relata]] (Causation and laws): because the most interesting debate concerns causation's relata.\n- [[Agent Causation]] (Free will): because agents are one proposed kind of causal relatum.\n- [[Intrinsic vs Extrinsic Properties]] (Kinds of properties): because internal relations supervene on their relata's intrinsic properties (Intrinsic vs Extrinsic entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (b
