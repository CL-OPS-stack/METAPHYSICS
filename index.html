the probabilities are statistical frequencies in populations, not the chances of individual events, so they need not be 0 or 1 even if determinism is true. The underlying question is what type-level causation *is*. Some proponents want a Humean theory, on which type-level causation is a matter of regularity.\n**Example:** 'Smoking causes cancer' as a claim about frequencies in a population.\n**Connections:**\n- analyses [[Type-Level Causation]]: because it is a theory of general causal claims.\n- is the population-level counterpart of [[Probabilistic Theories of Causation]]: because both treat causation as probability-raising.\n- uses [[Probability]] as frequency: because its probabilities are frequencies in populations, unlike [[Chance]].\n- can serve [[Humeanism]]: because some proponents want a regularity-based view, like the [[Regularity Theory of Causation]].\n**Bridges to other groups:**\n- [[Determinism]] (Free will): because these probabilities need not be 0 or 1 even under determinism.\n**Multiple meanings:** Also called 'statistical' or 'statistical relevance' theories. Type-level causation is also called population, property-level or generic causation.\n**Further reading (book):** Hitchcock (2008)\n  Full references (from the book's bibliography):\n  - Hitchcock, C. (2008) ‘Probabilistic causation’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/causation-probabilistic.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Probabilistic Theories of Causation.md": "---\ngroup: Causation and laws\nrole: position\nsource: Beebee et al. 2011, entry \"Probabilistic Theories of Causation\"\npages: pp. 185–187 (entry starts p. 185)\nstatus: unread\n---\n# Probabilistic Theories of Causation\n**Page(s):** pp. 185–187 (entry starts p. 185)\n**Book's definition:** p. 185. There's no opening definition: the entry begins with the history of deterministic causation. Copy the later sentence stating the basic idea, that causes raise (or change) the probability of their effects.\n**In one line:** Theories on which a cause raises (or at least changes) the probability of its effect, rather than guaranteeing it.\n**Role in [[00 – Causation and laws]]:** The response to taking indeterminism seriously.\n**Explanation:** Until about the 1960s, causation was assumed to be deterministic: given the background conditions, a cause is both necessary and sufficient for its effect (flip the switch and the kettle *must* boil). This ties causation to determinism. Since the 1960s, philosophers have taken seriously the possibility that indeterminism is true. In the entry's thought experiment, a machine flips a genuinely indeterministic coin and detonates a bomb on heads. If it lands heads, the flip caused the explosion without guaranteeing it. Some say a cause need only *change* the probability (Beebee 1998). Lewis gives one account, a version of his counterfactual theory, and many counterexamples and amendments have followed. The term is sometimes reserved for statistical, type-level theories.\n**Example:** The indeterministic coin-flipping bomb machine.\n**Connections:**\n- uses [[Chance]] and [[Probability]]: because causes raise the chances of effects.\n- has a type-level cousin, [[Probabilistic Theories of Causation (Type-Level)]]: because the term is sometimes reserved for statistical theories.\n- builds on the [[Counterfactual Theory of Causation]]: because Lewis's account is a version of his counterfactual theory.\n**Bridges to other groups:**\n- [[Determinism]] and [[Indeterminism]] (Free will): because the old deterministic picture gave way once indeterminism was taken seriously.\n- [[Thought Experiment]] (Method): because the case is a thought experiment.\n- [[Lewis, David]] (Philosophers): because he offers a straightforward account of probability-raising.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Beebee (1998)\n  Full references (from the book's bibliography):\n  - Beebee, H. (1998) ‘Do causes raise the chances of effects?’, *Analysis*, 58: 182–90.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Probability.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Probability\"\npages: pp. 189–191 (entry starts p. 189)\nstatus: unread\n---\n# Probability\n**Page(s):** pp. 189–191 (entry starts p. 189)\n**Book's definition:** p. 189. Copy the first sentence (probability as a topic in its own right: what *are* probabilities?).\n**In one line:** The metaphysical question of what probabilities are: what in the world makes a probability claim true?\n**Role in [[00 – Causation and laws]]:** Background to chance, indeterministic causation and laws.\n**Explanation:** Mathematically, a probability is anything that satisfies the axioms of the probability calculus, but that doesn't tell us how to interpret the calculus. On the *classical* view, a probability is the number of possibilities where P is true divided by the total (a 1-in-6 chance of rolling a six). Its standard problem is that the possibilities must be *equal* ones. *Frequentism*, like the regularity theory, has problems with accidental regularities. The *propensity* view treats probability as a quantitative disposition to produce results. But it seems to cover only undetermined events (that is, chance), while it still makes sense to say a coin has a 0.5 probability of heads even under determinism.\n**Example:** A die: six outcomes, one a six.\n**Connections:**\n- includes [[Chance]] as a special case: because chance is rock-bottom, single-case probability.\n- is used by [[Probabilistic Theories of Causation]]: because indeterminism seems to require them.\n- has a frequency view that shares a problem with the [[Regularity Theory of Causation]]: because both struggle with accidental regularities.\n**Bridges to other groups:**\n- [[Categorical and Dispositional Properties]] (Kinds of properties): because the propensity view treats probability as a disposition.\n- [[Indeterminism]] and [[Determinism]] (Free will): because propensities seem to cover only undetermined events.\n**Multiple meanings:** Classical, frequency and propensity interpretations. The entry also has a section on standard notation.\n**Further reading (book):** Mellor (2005); Hájek (2010)\n  Full references (from the book's bibliography):\n  - Mellor, D. H. (2005) *Probability: A Philosophical Introduction*, London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Process Theories of Causation.md": "---\ngroup: Causation and laws\nrole: position\nsource: Beebee et al. 2011, entry \"Process Theories of Causation\"\npages: pp. 193–195 (entry starts p. 193)\nstatus: unread\n---\n# Process Theories of Causation\n**Page(s):** pp. 193–195 (entry starts p. 193)\n**Book's definition:** p. 193. Copy the first two sentences of paragraph 2 (process theorists reject the Humean assumption, and take causation to be a fundamental, intrinsic but non-mysterious relation).\n**In one line:** Theories on which causation is a fundamental, intrinsic, yet non-mysterious physical relation, such as energy transfer.\n**Role in [[00 – Causation and laws]]:** A third way between Humean analyses and natural necessity.\n**Explanation:** Humeans assume that any fundamental, intrinsic relation between cause and effect would just be natural necessity, or equally dubious. Process theorists reject that assumption. When one billiard ball moves another, the causal relation is energy transfer, not regularity or necessitation. So, as with the regularity theory, nothing needs adding to our ontology, but the process theory avoids the pre-emption problems that the regularity and counterfactual theories face. Costs: it rules out causation by absence. And it isn't a conceptual analysis: there seem to be possible worlds with different laws and no conserved quantities, worked by a deity's interventions or by wizards' spells, where there is still plenty of causing. The Canberra Plan may offer a way to deal with this.\n**Example:** One billiard ball transferring energy to another.\n**Connections:**\n- rivals the [[Regularity Theory of Causation]] and the [[Counterfactual Theory of Causation]]: because it avoids their problems with [[Pre-Emption]].\n- rules out [[Causation by Absence]]: because absences transfer no energy.\n- denies the Humean equation with [[Natural Necessity]]: because it holds an intrinsic causal relation needn't be natural necessity.\n**Bridges to other groups:**\n- [[Intrinsic vs Extrinsic Properties]] (Kinds of properties): because the causal relation is taken to be intrinsic.\n- [[Ontology]] (Ontology): because the debate is about what belongs in our fundamental ontology.\n- [[Conceptual Analysis]] and [[Canberra Plan]] (Method): because the theory isn't a conceptual analysis, and the Canberra Plan may help.\n- [[Possible Worlds]] (Modality): because worlds with spells and no energy seem to contain causation.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Dowe (2000, Chapter 1); Dowe (2008)\n  Full references (from the book's bibliography):\n  - Dowe, P. (2000) *Physical Causation*, Cambridge: Cambridge University Press.\n  - Dowe, P. (2008) ‘Causal processes’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 Edition. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/causation-process.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Ramsey–Lewis View of Laws.md": "---\ngroup: Causation and laws\nrole: position\nsource: Beebee et al. 2011, entry \"Ramsey–Lewis View of Laws\"\npages: pp. 205–208 (entry starts p. 205)\nstatus: unread\n---\n# Ramsey–Lewis View of Laws\n**Page(s):** pp. 205–208 (entry starts p. 205)\n**Book's definition:** p. 205. Copy the displayed definition in paragraph 1 (the 'simplest version' of the theory).\n**In one line:** A law of nature is an axiom or theorem of the best deductive system for describing the world: a 'sophisticated' regularity theory.\n**Role in [[00 – Causation and laws]]:** The leading Humean theory of laws.\n**Explanation:** The view goes back to Ramsey (1928), with an earlier version in Mill, and was developed by Lewis (1973b). It aims to analyse lawhood without natural necessity. It is a regularity theory, because the best system contains only generalisations about what happens, but a sophisticated one, because it rules out accidental regularities (like the gold lumps) that the naive theory counts as laws. 'Best' doesn't mean the theory we currently think best. Two sample problems: simplicity seems relative to a culture's vocabulary (in the entry's world of coloured cubes and spheres, two cultures would rank the theories differently), and a possible world containing only a single particle moving in a straight line.\n**Example:** The weird universe of cubes, spheres and sounds, where 'simplest theory' depends on your vocabulary.\n**Connections:**\n- is a sophisticated [[Regularity Theory of Laws of Nature]]: because laws are still generalisations, now chosen by the best system.\n- rivals the [[Dretske-Tooley-Armstrong View of Laws]]: because DTA posits necessitation and avoids appeals to simplicity.\n- is a [[Humeanism]] theory: because it avoids [[Natural Necessity]].\n- analyses [[Law of Nature]]: because it says what makes a proposition a law.\n**Bridges to other groups:**\n- [[Conceptual Analysis]] (Method): because it offers a conceptual analysis of lawhood.\n- [[Reductionism]] (Tools): because the Reductionism entry lists it as reductionist.\n- [[Theoretical Virtues]] (Method): because 'best' depends on simplicity, whose objectivity is disputed.\n- [[Lewis, David]] (Philosophers): because he 'put the flesh on the bones'.\n**Multiple meanings:** Also called the Mill–Ramsey–Lewis view.\n**Further reading (book):** Beebee (2000); Psillos (2002, Chapter 5)\n  Full references (from the book's bibliography):\n  - Beebee, H. (2000) ‘The non-governing conception of laws of nature’, *Philosophy and Phenomenological Research*, 61: 571–94.\n  - Psillos, S. (2002) *Causation and Explanation*, Chesham: Acumen.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Redundant Causation.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Redundant Causation\"\npages: p. 217\nstatus: unread\n---\n# Redundant Causation\n**Page(s):** p. 217\n**Book's definition:** p. 217, the opening sentence of the entry.\n**In one line:** Usually used to mean pre-emption or overdetermination: cases where, had the cause not occurred, the effect would have happened anyway.\n**Role in [[00 – Causation and laws]]:** An umbrella term for the two main kinds of case that challenge the counterfactual theory.\n**Explanation:** You hang the washing out, but if you hadn't, your flatmate would have: the drying didn't depend on you (pre-emption). Two members of a firing squad both shoot, and either shot alone would have killed the victim: his death depends on neither, yet arguably each is causally responsible (overdetermination).\n**Example:** The washing and the flatmate; the firing squad.\n**Connections:**\n- covers [[Pre-Emption]] and [[Overdetermination]]: because the entry defines it as either.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Regularity Theory of Causation.md": "---\ngroup: Causation and laws\nrole: position\nsource: Beebee et al. 2011, entry \"Regularity Theory of Causation\"\npages: pp. 217–219 (entry starts p. 217)\nstatus: unread\n---\n# Regularity Theory of Causation\n**Page(s):** pp. 217–219 (entry starts p. 217)\n**Book's definition:** p. 217. Copy the canonical formulation displayed in paragraph 2 (conditions i–iii).\n**In one line:** The Humean theory: c causes e if c and e are contiguous, c precedes e, and all events of c's type are followed by events of e's type.\n**Role in [[00 – Causation and laws]]:** The original Humean theory of causation, whose spirit survives in later theories.\n**Explanation:** Regularity theories may be about causation, causal laws or laws of nature, and all aim to avoid natural necessity. They are rooted in Hume, 'natural necessity's arch-nemesis'. The canonical formulation closely paraphrases Hume's (1739–40: 172) 'first definition' of causation, though it's unclear Hume meant to *define* causation, so it's better called a 'Humean' theory than Hume's. The requirement that causes precede effects conflicts with backwards causation (Marty's DeLorean). The theory's spirit survives in the counterfactual theory (and, for laws, in the Ramsey–Lewis view). For Lewis, causation ultimately boils down to regularities, because counterfactuals depend on similarity between worlds, similarity depends mainly on laws, and laws get a sophisticated regularity analysis.\n**Example:** Marty's 1985 trip causing his 1955 arrival violates the 'cause precedes effect' clause.\n**Connections:**\n- is a [[Humeanism]] theory: because causal facts don't depend on [[Natural Necessity]].\n- has a counterpart for laws, the [[Regularity Theory of Laws of Nature]]: because the two theories are very similar.\n- survives in the [[Counterfactual Theory of Causation]] and the [[Ramsey–Lewis View of Laws]]: because their Humean spirit is the same.\n- is refined by [[INUS Conditions]]: because Mackie's analysis is a variant of it.\n**Bridges to other groups:**\n- [[Backwards Causation]] and [[Direction of Time]] (Time): because the precedence clause rules out backwards causation and blocks causal accounts of time's direction.\n- [[Hume, David]] (Philosophers): because the formulation paraphrases his first definition.\n- [[Reductionism]] (Tools): because it reduces causation to regular succession.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Armstrong (1983, Part I); Psillos (2002, Chapter 1)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (1983) *What Is a Law of Nature?*, Cambridge: Cambridge University Press.\n  - Psillos, S. (2002) *Causation and Explanation*, Chesham: Acumen.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Regularity Theory of Laws of Nature.md": "---\ngroup: Causation and laws\nrole: position\nsource: Beebee et al. 2011, entry \"Regularity Theory of Laws of Nature\"\npages: entry starts p. 219\nstatus: unread\n---\n# Regularity Theory of Laws of Nature\n**Page(s):** entry starts p. 219\n**Book's definition:** p. 219, the opening sentence of the entry.\n**In one line:** It is a law that all Fs are (or are followed by) Gs if and only if all Fs are (or are followed by) Gs.\n**Role in [[00 – Causation and laws]]:** The naive Humean theory of laws.\n**Explanation:** The theory is very similar to the regularity theory of causation. One might add 'bells and whistles' to avoid obvious counterexamples, like 'all the carpets in my house are beige' or 'all unicorns are made of cheese', but it is generally agreed that this is a lost cause. Its Humean spirit is kept in the more sophisticated Ramsey–Lewis view.\n**Example:** 'All the carpets in my house are beige' would count as a law.\n**Connections:**\n- parallels the [[Regularity Theory of Causation]]: because the two are very similar.\n- is improved on by the [[Ramsey–Lewis View of Laws]]: because that view keeps its Humean spirit while avoiding accidental regularities.\n- is a theory of [[Law of Nature]]: because it says when a generalisation is a law.\n- is avoided by the [[Dretske-Tooley-Armstrong View of Laws]]: because DTA avoids its problems (DTA entry).\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Armstrong (1983, Chapters 2–4)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (1983) *What Is a Law of Nature?*, Cambridge: Cambridge University Press.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Singular Causal Sentences.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Singular Causal Sentences\"\npages: p. 233\nstatus: unread\n---\n# Singular Causal Sentences\n**Page(s):** p. 233\n**Book's definition:** p. 233. The whole entry is one sentence: copy it.\n**In one line:** Sentences that express token-level causation, such as 'the short circuit caused the fire'.\n**Role in [[00 – Causation and laws]]:** Terminology.\n**Explanation:** This one-sentence entry defines the term by token-level causation.\n**Example:** 'The short circuit caused the fire.'\n**Connections:**\n- express [[Token-Level Causation]]: because the entry defines them that way.\n- contrast with [[General Causal Sentences]]: because those express type-level causation.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Singularism.md": "---\ngroup: Causation and laws\nrole: position\nsource: Beebee et al. 2011, entry \"Singularism\"\npages: pp. 233–234 (entry starts p. 233)\nstatus: unread\n---\n# Singularism\n**Page(s):** pp. 233–234 (entry starts p. 233)\n**Book's definition:** p. 233. There's no single definition: the entry lists four versions, (a)–(d). Copy (a).\n**In one line:** A family of views denying that causation must be grounded in laws or regularities. For example, a cause need not fall under any covering law.\n**Role in [[00 – Causation and laws]]:** The anti-Humean family of views about token causation.\n**Explanation:** The entry lists several versions. (a) Causation can occur without a covering law of nature. (b) The correct analysis doesn't reduce causation to anything involving laws: the counterfactual theory doesn't count, since it uses worlds with similar laws, but taking causation as *primitive* would. (c) Causation isn't reducible to relations between *types* of event. (d) The truthmakers for causal claims are local to the cause and effect, so no facts about the rest of the universe are needed. Contrast the regularity theory, on which c causes e only as an instance of a universal regularity. Singularism is fairly popular, with Anscombe, Armstrong and Tooley among its supporters. Opponents worry it means accepting natural necessity.\n**Example:** Event c causes e even though no law says events like c cause events like e.\n**Connections:**\n- opposes the [[Regularity Theory of Causation]] and the [[Counterfactual Theory of Causation]]: because both ground causation in laws or regularities.\n- concerns the [[Causal Relata]]: because version (d) makes truthmakers local to the relata.\n- is suspected of [[Natural Necessity]]: because opponents fear it commits us to it.\n- is not the same as 'singular causation', another name for [[Token-Level Causation]]: because the Token-Level Causation entry warns against the confusion.\n**Bridges to other groups:**\n- [[Reductionism]] and [[Primitive]] (Tools): because some versions treat causation as primitive and irreducible.\n- [[Truthmakers]] (Truth): because version (d) concerns the truthmakers of causal claims.\n- [[Intrinsic vs Extrinsic Properties]] (Kinds of properties): because version (d) says causation is local to its relata.\n- [[Armstrong, David]] (Philosophers): because he is a named supporter.\n**Multiple meanings:** Yes: the entry lists four versions, each slightly different.\n**Further reading (book):** Anscombe (1971); Moore (2009)\n  Full references (from the book's bibliography):\n  - Anscombe, G. E. M. (1971) *Causality and Determination*, London: Cambridge University Press; relevant sections reprinted in Sosa and Tooley 1993.\n  - Moore, M. (2009). ‘Introduction: the nature of singularist theories of causation’, *The Monist*, 92: 3–22.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Token-Level Causation.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Token-Level Causation\"\npages: entry starts p. 254\nstatus: unread\n---\n# Token-Level Causation\n**Page(s):** entry starts p. 254\n**Book's definition:** p. 254, the opening sentence of the entry.\n**In one line:** Causation between particular events or facts ('John's smoking caused him to get cancer'), as opposed to type-level causation ('smoking causes cancer').\n**Role in [[00 – Causation and laws]]:** The kind of causation most theories in this group analyse.\n**Explanation:** Token-level causation is sometimes called 'singular causation', which must not be confused with singularism, a specific thesis about its nature. Usually it is just called 'causation', as in the counterfactual theory, unless the context contrasts it with type-level causation.\n**Example:** 'John's smoking caused him to get cancer.'\n**Connections:**\n- contrasts with [[Type-Level Causation]]: because one concerns particular cases, the other general claims.\n- is not the same as [[Singularism]]: because 'singular causation' is just another name for it.\n- is expressed by [[Singular Causal Sentences]]: because those sentences express it.\n- is what the [[Counterfactual Theory of Causation]] analyses: because there it is just called 'causation'.\n**Bridges to other groups:**\n- [[Type and Tokens]] (Tools): because it is the token side of the type/token distinction.\n- [[Facts]] (Truth): because its relata may be events or facts.\n**Multiple meanings:** Also called 'singular causation'.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Trumping.md": "---\ngroup: Causation and laws\nrole: case\nsource: Beebee et al. 2011, entry \"Trumping\"\npages: p. 257\nstatus: unread\n---\n# Trumping\n**Page(s):** p. 257\n**Book's definition:** p. 257, the opening sentence of the entry.\n**In one line:** A kind of pre-emption where the effect would still have happened without the cause, and there is no chain of intervening events linking cause to effect.\n**Role in [[00 – Causation and laws]]:** A hard case for the counterfactual theory.\n**Explanation:** Because there's no chain of events to exploit, Lewis's ancestral fix doesn't help, which makes trumping particularly challenging for the counterfactual theory. The Pre-Emption entry gives the example: a world with a law that the first spell cast neutralises any later ones.\n**Example:** Two wizards cast the same spell; the first one's spell does the work (Pre-Emption entry).\n**Connections:**\n- is a kind of [[Pre-Emption]]: because the entry defines it that way.\n- challenges the [[Counterfactual Theory of Causation]]: because there's neither dependence nor a chain.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "06 Causation and laws/Type-Level Causation.md": "---\ngroup: Causation and laws\nrole: concept\nsource: Beebee et al. 2011, entry \"Type-Level Causation\"\npages: p. 264\nstatus: unread\n---\n# Type-Level Causation\n**Page(s):** p. 264\n**Book's definition:** p. 264, the opening sentence of the entry.\n**In one line:** Causation as a relation between types or properties, or as a general feature of a population ('smoking causes cancer').\n**Role in [[00 – Causation and laws]]:** The general counterpart of token causation.\n**Explanation:** The entry sends you to probabilistic theories of type-level causation. It contrasts with token-level causation, which is often just called 'causation' because it is the kind most metaphysicians worry about.\n**Example:** 'Smoking causes cancer.'\n**Connections:**\n- is analysed by [[Probabilistic Theories of Causation (Type-Level)]]: because the entry sends you there.\n- contrasts with [[Token-Level Causation]]: because that is causation between particulars.\n- is expressed by [[General Causal Sentences]]: because they express type-level causation.\n- has properties as its [[Causal Relata]]: because type-level relata are properties.\n**Bridges to other groups:**\n- [[Type and Tokens]] (Tools): because it is causation at the level of types.\n- [[Properties]] (Particulars and universals): because it relates properties.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "07 Modality/00 – Modality.md": "---\ngroup: Modality\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Modality\n**Central question:** What is it for something to be necessary or possible, and what, if anything, are the possible worlds we use to talk about it?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| Genuine modal realism ([[Modal Realism]]) | Possible worlds are concrete universes like ours, spatiotemporally disconnected from it | David Lewis | The 'incredulous stare': infinitely many universes, found by armchair reasoning. Lewis says this is a look, not an objection |\n| Ersatz modal realism ([[Modal Realism]]) | Worlds exist but are abstract representations (e.g. sets of propositions) | No individual named; 'ersatzers' | Needs 'consistency', a modal notion, so modality isn't reduced; no possibilia |\n| Modal fictionalism ([[Possible Worlds]]) | 'Possibly P' = according to the fiction of GMR, P holds at some world | Rosen (1990) | Not assessed in this group's entries; see [[Fictionalism]] |\n| World talk as heuristic ([[Possible Worlds]]) | World talk is useful, but doesn't give the meaning of modal claims | Some ersatzers and fictionalists | — |\n| Modalist ('thin') essence ([[Essence]]) | Essence is analysed through necessity and possibility | Locke (nominal essence) | — |\n| Anti-modalist ('thick') essence ([[Essence]]) | Things have their modal properties *because* of their essence | Linked to Kripke's water example | — |\n| [[Haecceitism]] | Cross-world identity is brute, not fixed by qualities | — | Haecceities, one way of holding it, are widely seen as weird |\n| [[Necessity of Origin Thesis]] | An object's actual origin is essential to it | Kripke | Replacing a desk leg would seem to create a different desk |\n| Against de re modality ([[Modality]]) | De re modality is incoherent | Quine | — |\n\n## Key arguments and test cases\n- Kripke's Hesperus = Phosphorus and rigid designation, in [[Necessary A Posteriori Truths]], p. 136\n- Twin Earth (Putnam/Kripke): XYZ isn't water, in [[Necessary A Posteriori Truths]]\n- Stella McCartney and the replaced desk leg, in [[Necessity of Origin Thesis]], p. 139\n- The Elvis–Napoleon swap world, in [[Haecceitism]], p. 89\n- Quine's 'possible man in the doorway', in [[Possibilia]], p. 167\n- The consistency objection to ersatzism, and Lewis's 'incredulous stare', in [[Modal Realism]], pp. 127–131\n- 'It is impossible for me to fly': kinds of possibility, in [[Possible Worlds]], pp. 167–171\n- Locke's watch (nominal vs real essence), in [[Essence]], p. 63\n\n## Bridges to other groups\n- **Tools:** [[A Priori - A Posteriori]] and [[Conceptual vs Logical Truths]], because Kripke's necessary a posteriori truths separate necessity from the a priori.\n- **Ontology:** [[Ontological Commitment]], [[Abstract vs Concrete]], [[Non-Existent Objects]] and [[Fictionalism]], because whether worlds and possibilia exist, and what kind of thing they are, are ontology questions.\n- **Causation and laws:** [[Natural Necessity]], [[Humeanism]] and [[Law of Nature]], because Humeans want modality reduced to worlds, anti-Humeans deny that natural necessity can be, and physical possibility is defined by the laws.\n- **Particulars and universals:** [[Class Nominalism]], because GMR's possibilia make it workable.\n- **Identity:** [[Identity]], because identity claims are necessary (Kripke), and haecceitism and necessity of origin are about cross-world identity.\n- **Truth:** [[Proposition]], because propositions carry modal status and GMR identifies them with sets of worlds.\n\n## Reading path (pages in the book)\n1. **The basics:** [[Modality]] (p. 126), then [[Possible Worlds]] (p. 167), then [[Necessity]] (p. 139), [[Possibility]] (p. 171) and [[Contingent Truths]] (p. 52)\n2. **Do worlds exist?** [[Modal Realism]] (p. 127), [[Possibilia]] (p. 167)\n3. **Essence and Kripke:** [[Essence]] (p. 63), [[Necessary A Posteriori Truths]] (p. 136), [[Necessity of Origin Thesis]] (p. 139), [[Haecceitism]] (p. 89)\n\n**Further reading (from the entries):** Divers (2002; 2009); Melia (2003); Ahmed (2007); Adams (1979); Lewis (1986a); Mackie (2006); Locke (1690). Full details are in each note.\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "07 Modality/Contingent Truths.md": "---\ngroup: Modality\nrole: concept\nsource: Beebee et al. 2011, entry \"Contingent Truths\"\npages: pp. 52–53 (entry starts p. 52)\nstatus: unread\n---\n# Contingent Truths\n**Page(s):** pp. 52–53 (entry starts p. 52)\n**Book's definition:** p. 52, the opening sentence of the entry.\n**In one line:** A truth that is true but not *necessarily* true. It might have been false.\n**Role in [[00 – Modality]]:** One of the basic modal statuses a truth can have; the contrast case to necessity.\n**Explanation:** A sentence or proposition is a contingent truth if it is true and not necessarily true. That Barack Obama won the 2008 US presidential election is true, but it might have been false, so it is contingent. (The entry is only this short; the Modality entry places contingency among the modal statuses.)\n**Example:** \"Barack Obama won the 2008 US presidential election.\"\n**Connections:**\n- is the contrast to [[Necessity]]: because a contingent truth is defined as a truth that is *not* necessary.\n- is one status within [[Modality]]: because the Modality entry lists necessary, contingent, possible and impossible as modal statuses (p. 126).\n- can be put in terms of [[Possible Worlds]]: because, as the Analytic vs Synthetic entry puts it, a contingent truth is false in at least one possible world (Analytic vs Synthetic Truths entry, pp. 5–6).\n**Bridges to other groups:**\n- [[Analytic vs Synthetic Truths]] (Tools): because whether necessary/contingent lines up with analytic/synthetic is disputed.\n- [[Proposition]] (Truth): because what is contingently true is a sentence or proposition.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "07 Modality/Essence.md": "---\ngroup: Modality\nrole: concept\nsource: Beebee et al. 2011, entry \"Essence\"\npages: pp. 63–65 (entry starts p. 63)\nstatus: unread\n---\n# Essence\n**Page(s):** pp. 63–65 (entry starts p. 63)\n**Book's definition:** p. 63. Copy the opening sentence (it quotes Locke), plus the two sentences in paragraph 1 that define *kind* essence and *individual* essence.\n**In one line:** What makes a thing what it is: either what makes it a member of its kind, or what makes it the particular individual it is.\n**Role in [[00 – Modality]]:** The key notion behind de re modality ('essentially human'), Kripke's necessary a posteriori truths and the necessity of origin.\n**Explanation:** The *kind* essence of a horse is whatever makes it a member of the kind *horse*. Its *individual* essence is what makes Dobbin this particular horse. The term is slippery, because different philosophers mean different things by it. Roughly, accounts are **modalist** or **anti-modalist**. On a modalist view, essence is analysed in modal terms: 'a is essentially F' means 'a is F in every possible world where a exists'. This gives a 'thin' notion with no substantive ontological commitments. Locke's 'nominal essence', the features we classify by, fits this view. On the anti-modalist ('thick') view, things have the modal properties they have *because* of their essence. This view usually adds three claims: only kinds that carve nature at its joints have essences; essences are a mind- and language-independent matter; and they are discovered a posteriori (water is H2O).\n**Example:** Locke's watch. Its nominal essence is being portable and telling the time. Its 'real essence' is the underlying mechanism, which differs between a mechanical and a digital watch, yet both are watches.\n**Connections:**\n- is analysed by [[Necessity]] and [[Possibility]] on the modalist view: because essential properties are those a thing has in every world where it exists.\n- is the subject of de re claims in [[Modality]]: because de re modality is about whether a predicate applies essentially or accidentally (p. 126).\n- underlies [[Necessary A Posteriori Truths]]: because on the thick view essences are discovered a posteriori, as with water being H2O.\n- is applied to individuals by the [[Necessity of Origin Thesis]]: because that thesis says an object's origin is part of its essence.\n**Bridges to other groups:**\n- [[Carving Nature at its Joints]] (Method): because on the thick view only joint-carving kinds have genuine essences.\n- [[Ontological Commitment]] (Ontology): because the modalist notion is 'thin' and brings no substantive ontological commitments.\n- [[Natural Kinds]] (Kinds of properties): because Kripke holds that we can name natural kinds like water or gold without knowing their essence (Necessary A Posteriori Truths entry, pp. 136–139).\n- [[Locke, John]] (Philosophers): because his nominal vs real essence is the entry's model of a thin view.\n**Multiple meanings:** Yes, several: kind vs individual essence; Locke's nominal vs real essence; modalist ('thin') vs anti-modalist ('thick').\n**Further reading (book):** Locke, J. (1690) *An Essay Concerning Human Understanding*, Book III, Chapter 3. Freely available online; a contemporary-English version is on Jonathan Bennett's Early Modern Texts website.\n**Beyond the book:** —\n**My notes:**\n", "07 Modality/Haecceitism.md": "---\ngroup: Modality\nrole: position\nsource: Beebee et al. 2011, entry \"Haecceitism\"\npages: p. 89\nstatus: unread\n---\n# Haecceitism\n**Page(s):** p. 89\n**Book's definition:** p. 89, the opening sentence of the entry.\n**In one line:** The view that what makes an object the same object across possible worlds is a brute fact, not fixed by its qualities and relations.\n**Role in [[00 – Modality]]:** A position on cross-world identity: whether two worlds could differ only in *which* thing is which.\n**Explanation:** Imagine a world w just like ours, except that Elvis has all the qualities Napoleon actually has, and Napoleon has all of Elvis's. For the haecceitist, w differs from our world even though the two contain all the same qualities and relations; the difference lies only in the identity of the objects. Haecceitism must be distinguished from belief in *haecceities*: non-qualitative properties, like *being Elvis*, that would ground a thing's identity. Believing in haecceities is one way to be a haecceitist, but they are widely seen as weird. Many haecceitists instead take identity across worlds to be brute, grounded in nothing. Haecceitism about objects is often seen as analogous to quidditism about properties.\n**Example:** The Elvis–Napoleon swap world: qualitatively identical to ours, yet different on the haecceitist view.\n**Connections:**\n- is a claim about [[Possible Worlds]]: because it concerns how objects are identified across worlds.\n**Bridges to other groups:**\n- [[Supervenience]] (Tools): because haecceitism says cross-world identity does *not* supervene on qualities and relations.\n- [[Identity]] (Identity): because the swapped worlds differ only in the identity of their objects.\n- [[Quidditism]] (Kinds of properties): because haecceitism is often understood as its analogue for objects.\n- [[Properties]] (Particulars and universals): because haecceities would be non-qualitative properties.\n**Multiple meanings:** Yes: *haecceitism* (identity across worlds is brute) vs belief in *haecceities* (non-qualitative identity properties). The second is only one version of the first.\n**Further reading (book):** Adams, R. M. (1979) 'Primitive thisness and primitive identity', *Journal of Philosophy*, 76: 5–26. Lewis, D. K. (1986a) *On the Plurality of Worlds*, Oxford: Blackwell, § 4.4. Mackie, P. (2006) *How Things Might Have Been*, Oxford: Clarendon Press.\n**Beyond the book:** —\n**My notes:**\n", "07 Modality/Modal Realism.md": "---\ngroup: Modality\nrole: position\nsource: Beebee et al. 2011, entry \"Modal Realism\"\npages: pp. 127–131 (entry starts p. 127)\nstatus: unread\n---\n# Modal Realism\n**Page(s):** pp. 127–131 (entry starts p. 127)\n**Book's definition:** p. 127, the opening sentence of the entry.\n**In one line:** The view that possible worlds really exist and that talk about them is literally true, not just a useful way of speaking.\n**Role in [[00 – Modality]]:** The central position on whether possible worlds exist. It splits into genuine (concrete) and ersatz (abstract) versions.\n**Explanation:** If we accept a modal claim ('cats might have gone extinct') and possible worlds semantics, we seem ontologically committed to a world where cats are extinct. Modal realists agree that worlds exist but disagree on what they are. **Genuine modal realism (GMR)**, defended by David Lewis, says other worlds are concrete universes like ours, spatiotemporally disconnected from it. Its claimed benefits: modal facts reduce to non-modal facts about what exists, which matters to Humeans who deny natural necessity; propositions can be sets of worlds; and properties can be sets of possibilia (class nominalism). Lewis treats 'actual' as an indexical and calls the usual reaction an 'incredulous stare', not an objection. **Ersatz modal realism** says worlds exist but are abstract things that *represent* possibilities, like a picture of two people arguing. Candidates include universals and sets of propositions, sentences or states of affairs. Ersatzism's problem: only *consistent* sets can count as worlds, and consistency is a modal notion, so modality isn't reduced. It also lacks possibilia, so it can't use class nominalism the same way.\n**Example:** Everyone spontaneously dressing as clowns and singing. GMR says a concrete universe exists where this happens. Ersatzism says there is a consistent set of propositions representing it.\n**Connections:**\n- is a view about [[Possible Worlds]]: because it holds that they exist, and its two versions disagree about what they are.\n- is divided over [[Possibilia]]: because GMR has real inhabitants of other worlds, while ersatz worlds have none.\n- is defended in its genuine form by [[Lewis, David]]: because he is GMR's main advocate.\n**Bridges to other groups:**\n- [[Ontological Commitment]] (Ontology): because accepting modal claims plus possible worlds semantics seems to commit us to worlds.\n- [[Abstract vs Concrete]] (Ontology): because the genuine/ersatz dispute is whether worlds are concrete or abstract.\n- [[Class Nominalism]] (Particulars and universals): because GMR makes class nominalism workable by identifying properties with sets of possibilia.\n- [[Proposition]] (Truth): because GMR identifies propositions with sets of worlds, which ersatzism can't do without circularity.\n- [[Humean Supervenience]] and [[Natural Necessity]] (Causation and laws): because reducing modal facts to non-modal ones matters to Humeans who deny natural necessity.\n- [[Indexical]] (Tools): because Lewis treats 'actual' as indexical, so Santa exists but does not *actually* exist.\n**Multiple meanings:** Yes. 'Modal realism' is sometimes used for GMR alone, which the book calls 'terminologically annoying'. GMR is also called 'concrete modal realism'.\n**Further reading (book):** Divers, J. (2009) 'Possible worlds and possibilia', in R. Le Poidevin, P. Simons, A. McGonigal and R. Cameron (eds), *The Routledge Companion to Metaphysics*, London: Routledge, pp. 335–45. Melia, J. (2003) *Modality*, Chesham: Acumen, Chapters 5–7.\n**Beyond the book:** —\n**My notes:**\n", "07 Modality/Modality.md": "---\ngroup: Modality\nrole: concept\nsource: Beebee et al. 2011, entry \"Modality\"\npages: pp. 126–127 (entry starts p. 126)\nstatus: unread\n---\n# Modality\n**Page(s):** pp. 126–127 (entry starts p. 126)\n**Book's definition:** p. 126, the opening sentence of the entry.\n**In one line:** The field of metaphysics about the nature of possibility, necessity and related notions.\n**Role in [[00 – Modality]]:** The name of this group's whole subject, and the entry that maps its parts.\n**Explanation:** Propositions have a truth value and also a *modal status*. They may be necessarily true (2 + 2 = 4), contingently true (Obama is President, which might have been false), possibly true (McCain is President, which is false but might have been true), or impossible (2 + 2 = 6). Modal status applied to propositions is *de dicto* modality, written with 'box' (necessarily) and 'diamond' (possibly). *De re* modality concerns whether a predicate applies to a thing essentially or accidentally: I may be essentially human but only accidentally a philosopher. Quine argued that de re modality is incoherent. Modality also covers counterfactual conditionals. Possible worlds are now commonly, though not universally, used to study all this, which raises the question of whether they exist.\n**Example:** 'I am essentially human' (de re, essential) vs 'I am a philosopher' (de re, accidental: I could have become a fisherman).\n**Connections:**\n- covers [[Necessity]], [[Possibility]] and [[Contingent Truths]]: because these are the modal statuses the entry lists.\n- includes de re claims about [[Essence]]: because de re modality is about essential vs accidental predication.\n- is studied using [[Possible Worlds]]: because world talk is the common tool for investigating modal concepts.\n- raises the question of [[Modal Realism]]: because using possible worlds prompts asking whether they exist.\n**Bridges to other groups:**\n- [[Counterfactual Conditional]] (Tools): because counterfactuals are part of modality's subject matter.\n- [[Quine, W. V.]] (Philosophers): because he argued that de re modality is incoherent.\n- [[Proposition]] (Truth): because propositions are the bearers of de dicto modal status.\n**Multiple meanings:** Yes: *de dicto* (modal status of propositions) vs *de re* (essential vs accidental properties of things).\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "07 Modality/Necessary A Posteriori Truths.md": "---\ngroup: Modality\nrole: concept\nsource: Beebee et al. 2011, entry \"Necessary A Posteriori Truths\"\npages: pp. 136–139 (entry starts p. 136)\nstatus: unread\n---\n# Necessary A Posteriori Truths\n**Page(s):** pp. 136–139 (entry starts p. 136)\n**Book's definition:** p. 136, the opening sentence of the entry (Kripke's claim and his three examples).\n**In one line:** Truths that could not have been false but can only be known by empirical investigation, such as 'Hesperus is Phosphorus' and 'water is H2O'.\n**Role in [[00 – Modality]]:** Kripke's category that separates necessity from a priori knowability. It is one of the most influential results in modern metaphysics.\n**Explanation:** Traditionally, necessity and a priori knowability were thought to go together: necessary truths are true in virtue of meaning. Kripke accepts this for cases like 'all bachelors are unmarried', but denies it holds universally. Against descriptivism, he argues that proper names refer *directly*, not via a description: 'Plato' would still name Plato even if Aristotle had never been born. Names are also *rigid designators*, picking out the same object in every possible world. All identity claims are necessary, so 'Hesperus is Phosphorus' is necessary, yet it took astronomy to discover it. Natural-kind terms work the same way. In the Twin Earth thought experiment (Putnam's example), the stuff that fills the rivers there is XYZ, not H2O, and it is not water. So 'water is H2O' states water's essence: it is necessary but a posteriori. This shows there are metaphysically necessary truths that are neither conceptual nor logical truths.\n**Example:** 'Hesperus is Phosphorus': the evening star and the morning star were discovered to be the same body, Venus.\n**Connections:**\n- separates [[Necessity]] from a priori knowledge: because these truths are necessary but knowable only through experience.\n- rests on a view of [[Essence]]: because the water case says it is of water's essence to be H2O.\n**Bridges to other groups:**\n- [[A Priori - A Posteriori]], [[Conceptual vs Logical Truths]] and [[Analytic vs Synthetic Truths]] (Tools): because Kripke breaks the traditional link between necessity, the a priori and truth in virtue of meaning.\n- [[Identity]] (Identity): because the argument relies on all identity claims being necessary.\n- [[Natural Kinds]] (Kinds of properties): because names like 'water' and 'gold' pick out natural kinds without encoding their essence.\n- [[Thought Experiment]] (Method): because Twin Earth is the thought experiment used to establish water's essence.\n- [[Kripke, Saul]] (Philosophers): because the thesis comes from his *Naming and Necessity* (1980).\n**Multiple meanings:** None noted. The entry introduces 'rigid designator' and 'descriptivism' as part of the argument.\n**Further reading (book):** Ahmed, A. (2007) *Saul Kripke*, London: Continuum, Chapters 2 and 3.\n**Beyond the book:** —\n**My notes:**\n", "07 Modality/Necessity of Origin Thesis.md": "---\ngroup: Modality\nrole: position\nsource: Beebee et al. 2011, entry \"Necessity of Origin Thesis\"\npages: pp. 139–140 (entry starts p. 139)\nstatus: unread\n---\n# Necessity of Origin Thesis\n**Page(s):** pp. 139–140 (entry starts p. 139)\n**Book's definition:** p. 139, paragraph 1. Copy the sentence beginning \"The basic idea is that…\".\n**In one line:** Kripke's thesis that it is essential to a particular object to have the origin it actually has.\n**Role in [[00 – Modality]]:** A specific claim about individual essence, defended by Kripke and challenged by everyday intuitions about replacing parts.\n**Explanation:** Kripke defends this in *Naming and Necessity* (1980). Stella McCartney could not have had different biological parents. A possible world where John Lennon and Yoko Ono have a daughter who looks and lives just like Stella is not a world where Stella has other parents; it is a world where Stella doesn't exist. Likewise, your pine desk could not have been made of oak, or even of pine from a different tree. The objection: replace one of the desk's legs and, by this thesis, the result seems to be a numerically different desk, since part of it has a different origin. Yet ordinarily we say your desk just has a new leg, as when a bike gets a new chain or a car a new engine. (The entry once says 'John and Linda' where it clearly means Paul and Linda.)\n**Example:** Stella McCartney and the Lennon–Ono look-alike world; the desk and its replaced leg.\n**Connections:**\n- is a claim about [[Essence]]: because it says origin is an essential feature of an individual.\n- is stated using [[Possible Worlds]]: because no inhabitant of any world with different parents is Stella.\n**Bridges to other groups:**\n- [[Identity]] (Identity): because the objection turns on whether the repaired desk is numerically identical to the original.\n- [[Identity Over Time]] (Identity): because the entry sends the replaced-parts problem there.\n- [[Kripke, Saul]] (Philosophers): because he defends the thesis in *Naming and Necessity*.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Ahmed, A. (2007) *Saul Kripke*, London: Continuum, § 3.1.\n**Beyond the book:** —\n**My notes:**\n", "07 Modality/Necessity.md": "---\ngroup: Modality\nrole: concept\nsource: Beebee et al. 2011, entry \"Necessity\"\npages: p. 139\nstatus: unread\n---\n# Necessity\n**Page(s):** p. 139\n**Book's definition:** p. 139, the opening sentence of the entry.\n**In one line:** To call something necessary is to say how things *must* be, not just how they happen to be.\n**Role in [[00 – Modality]]:** One of the two core modal notions, with possibility as its close relative.\n**Explanation:** Necessity is usually cashed out in terms of possible worlds: 'necessarily P' (written with the box operator) means P is true in all possible worlds. Metaphysicians distinguish kinds of necessity, such as epistemic, physical and metaphysical; the Possible Worlds entry explains the standard way to draw these lines. Anti-Humeans sometimes claim that at least one kind, natural necessity, cannot be cashed out in terms of possible worlds.\n**Example:** '2 + 2 = 4' is necessary: true at all possible worlds (Modality and Possible Worlds entries).\n**Connections:**\n- is the close relative of [[Possibility]]: because both are modal notions cashed out through worlds.\n- is defined through [[Possible Worlds]]: because 'necessarily P' means P is true in all of them.\n- contrasts with [[Contingent Truths]]: because a contingent truth is one that is not necessary.\n- is part of [[Modality]]: because necessity is a modal notion.\n**Bridges to other groups:**\n- [[Natural Necessity]] (Causation and laws): because anti-Humeans claim it can't be reduced to possible worlds.\n- [[Humeanism]] (Causation and laws): because the dispute over natural necessity is a Humean vs anti-Humean one.\n- [[Supervenience]] (Tools): because the strength of a supervenience claim depends on which kind of necessity it uses.\n**Multiple meanings:** Yes: epistemic, physical (nomological) and metaphysical necessity (see [[Possible Worlds]]).\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "07 Modality/Possibilia.md": "---\ngroup: Modality\nrole: concept\nsource: Beebee et al. 2011, entry \"Possibilia\"\npages: p. 167\nstatus: unread\n---\n# Possibilia\n**Page(s):** p. 167\n**Book's definition:** p. 167, the opening sentence of the entry.\n**In one line:** Merely possible things, if there are any: hobbits, talking donkeys, the birthday party you never organised.\n**Role in [[00 – Modality]]:** The disputed 'inhabitants' of possible worlds. Whether they exist divides genuine from ersatz modal realists.\n**Explanation:** Possibilia include fictional creatures, and also things that would have existed had events gone differently, like the tree you pulled out as a sapling. Do they exist? Quine (1948) mocked the idea: is the possible man in the doorway fat or thin, and are the possible fat man and the possible bald man one man or two? Some philosophers count possibilia among non-existent objects. Genuine modal realists say possibilia exist but are not *actual*: they live in real, concrete, non-actual worlds. The Modal Realism entry adds that ersatz worlds have no possibilia at all.\n**Example:** Quine's 'possible man in the doorway'.\n**Connections:**\n- are inhabitants of [[Possible Worlds]] on genuine modal realism: because GMR's worlds are concrete and contain real things.\n- divide versions of [[Modal Realism]]: because GMR has possibilia, while ersatzism has worlds without inhabitants.\n**Bridges to other groups:**\n- [[Non-Existent Objects]] (Ontology): because some philosophers classify possibilia as non-existent objects.\n- [[Quine, W. V.]] (Philosophers): because his 1948 doorway example mocks belief in possibilia.\n- [[Class Nominalism]] (Particulars and universals): because Lewis identifies properties with sets of possibilia (Modal Realism entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed. Cited in the entry: Quine, W. V. (1948) 'On what there is', *Review of Metaphysics*, 2: 21–38.\n**Beyond the book:** —\n**My notes:**\n", "07 Modality/Possibility.md": "---\ngroup: Modality\nrole: concept\nsource: Beebee et al. 2011, entry \"Possibility\"\npages: p. 171\nstatus: unread\n---\n# Possibility\n**Page(s):** p. 171\n**Book's definition:** p. 171, the opening sentence of the entry.\n**In one line:** To call something possible is to say how things *might be* or *might have been*, not how they are.\n**Role in [[00 – Modality]]:** One of the two core modal notions, the counterpart of necessity.\n**Explanation:** Possibility is usually cashed out in terms of possible worlds: 'possibly P' (written with the diamond operator) means P is true in at least one possible world. As with necessity, metaphysicians distinguish epistemic, physical and metaphysical possibility, explained in the Possible Worlds entry. (The book's index sends 'possibility' to Modality, so read this alongside that entry.)\n**Example:** 'John McCain is President' is false but possible: he might have won (Modality entry, p. 126).\n**Connections:**\n- is the close relative of [[Necessity]]: because both are modal notions cashed out through worlds.\n- is defined through [[Possible Worlds]]: because 'possibly P' means P is true in at least one world.\n- is part of [[Modality]]: because possibility is a modal notion.\n**Bridges to other groups:**\n- [[Law of Nature]] (Causation and laws): because physical possibility is possibility relative to our laws (see the Possible Worlds entry). This entry itself names no other group.\n**Multiple meanings:** Yes: epistemic, physical and metaphysical possibility (see [[Possible Worlds]]).\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "07 Modality/Possible Worlds.md": "---\ngroup: Modality\nrole: tool\nsource: Beebee et al. 2011, entry \"Possible Worlds\"\npages: pp. 167–171 (entry starts p. 167)\nstatus: unread\n---\n# Possible Worlds\n**Page(s):** pp. 167–171 (entry starts p. 167)\n**Book's definition:** p. 167 (it may run onto p. 168). It is in the paragraph straight after the three example sentences, where a possible world is defined as a total way the world could be.\n**In one line:** A possible world is a complete way the whole of reality could be. Possible means true at some world, necessary means true at all, and impossible means true at none.\n**Role in [[00 – Modality]]:** The main working tool of modal metaphysics. The entry warns that using it does not by itself make someone a modal realist.\n**Explanation:** World talk replaces modal words: 'the Queen could play the banjo' becomes 'at some possible world, the Queen plays the banjo'. Worlds can be grouped. The *logically* possible worlds are all those without contradiction, and one of them is the *actual* world. The *physically* (nomologically) possible worlds share our laws of nature, so the actual laws are physically necessary by definition. The *epistemically* possible worlds are those consistent with what someone knows. This explains how 'it is impossible for me to fly' is true when I'm on a rooftop (physical sense) but false in a debate about an omnipotent God (logical sense). Four questions remain: do worlds exist, what are they, how are propositions true at them, and how does world talk relate to modal claims? Believers in *possible worlds semantics* (e.g. Lewis) take the translations as full analyses, which appeals to Humeans and seems to commit them to worlds. Ersatzers are said not to be entitled to this, because 'consistency' stays a modal primitive. Some fictionalists (Rosen 1990) use the semantics without believing in worlds. Others treat world talk as just a convenient heuristic.\n**Example:** 'It is impossible for me to fly': true for physically possible worlds, false for logically possible ones.\n**Connections:**\n- defines [[Necessity]] and [[Possibility]]: because they become truth at all, or at least one, world.\n- is the tool of [[Modality]]: because world talk is the standard way to study modal concepts.\n- is interpreted differently by versions of [[Modal Realism]]: because genuine and ersatz realists disagree on what worlds are.\n**Bridges to other groups:**\n- [[Law of Nature]] (Causation and laws): because physically possible worlds are defined as those sharing our laws.\n- [[Conceptual Analysis]] (Method): because possible worlds semantics treats the translations as full conceptual analyses of modal claims.\n- [[Primitive]] (Tools): because ersatzers are left with 'consistency' as an unanalysed modal primitive.\n- [[Fictionalism]] (Ontology): because modal fictionalists use world talk without committing to worlds.\n- [[Counterfactual Conditional]] (Tools): because possible worlds semantics also analyses counterfactuals.\n- [[Humeanism]] (Causation and laws): because Humeans, who reject natural necessity, welcome reducing modal facts to facts about worlds.\n**Multiple meanings:** Yes: logical, physical (nomological) and epistemic possibility, plus the 'actual' world. Also, 'world' means the whole of existence, not just planet Earth.\n**Further reading (book):** Divers, J. (2002) *Possible Worlds*, London: Routledge, Chapters 1–2. Melia, J. (2003) *Modality*, Chesham: Acumen, Chapter 2.\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/00 – Ontology and existence.md": "---\ngroup: Ontology and existence\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Ontology and existence\n**Central question:** What kinds of things exist, and how do we tell what a theory or sentence commits us to?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| Quine's criterion ([[Ontological Commitment]]) | To be is to be the value of a bound variable; believe what our best science quantifies over | Quine | Commitments are contested ('the average family has 2.7 children') |\n| Truthmaker criterion ([[Ontological Commitment]]) | We are committed only to the truthmakers of our sentences | Armstrong | — |\n| Orthodox view of [[Existence]] | Existence is all-or-nothing, univocal, and everything there is exists | Quine (one-quantifier argument) | Aristotle, Russell and McDaniel (2009): there are different modes of existence |\n| [[Meinongianism]] / [[Non-Existent Objects]] | Some things do not exist | Meinong (Priest has a variant) | Russell's theory of descriptions (1905); Quine's 'On what there is' (1948) |\n| [[Fictionalism]] | Disputed entities don't exist; talk of them is true according to a fiction | Field (numbers), Rosen (possible worlds) | Which fiction?; the Brock–Rosen objection |\n| Platonism about [[Numbers]] | Numbers are eternal, causally inert, necessary existents | Popular among mathematicians; Gödel (mathematical intuition) | How could we know them, and how do they apply to oranges? |\n| Formalism about [[Numbers]] | Mathematical truth = derivability from axioms that aren't about anything | — | — |\n| Realism vs anti-realism about [[Holes]] | Holes exist (as linings, regions or sui generis), or are paraphrased away | Lewis and Lewis (1970), Ludovician | Each realist view has a puzzle; paraphrase lacks a general method |\n| Deflationary or fundamentality views of [[Ontology]] | Existence questions are trivial (Thomasson), or ontology is about what's fundamental (Schaffer) | Thomasson (2008); Schaffer (2009) | Debated in [[Metametaphysics]] |\n\n## Key arguments and test cases\n- Russell's 'the King of France does not exist', in [[Non-Existent Objects]], p. 147\n- Quine's 'On what there is' and the single quantifier, in [[Ontological Commitment]] (p. 151) and [[Existence]] (p. 69)\n- Phlogiston and the leprechaun mugging (commitment isn't existence), in [[Ontological Commitment]]\n- The average family with 2.7 children, in [[Paraphrase]], p. 155\n- The tooth, the probe and the Ludovician lining, in [[Holes]], p. 90\n- Thirteen oranges and six people, in [[Numbers]], p. 149\n- The Brock–Rosen objection, in [[Fictionalism]], pp. 72–74\n\n## Bridges to other groups\n- **Modality:** [[Possibilia]], [[Possible Worlds]] and [[Modal Realism]], because whether possibilia and worlds exist is an ontology question, and modal fictionalism applies fictionalism to worlds.\n- **Particulars and universals:** [[Platonism]], [[Universals]] and [[Austere Nominalism]], because whether abstract properties exist, and whether we can paraphrase them away, is ontology applied to properties.\n- **Metametaphysics and method:** [[Metametaphysics]] and [[Theoretical Virtues]], because whether ontological questions are substantive, and how parsimony judges them, is debated there.\n- **Mereology:** [[Nihilism]] and [[Special Composition Question]], because whether composite objects exist is an ontological question.\n- **Truth:** [[Truthmakers]], [[States of Affairs]] and [[Negative Facts]], because Armstrong's criterion uses truthmakers, and facts are among ontology's categories.\n- **Causation and laws:** [[Event]], because whether event-talk commits us to events is a standard example.\n\n## Reading path (pages in the book)\n1. **What ontology is:** [[Ontology]] (p. 152), then [[Ontological Commitment]] (p. 151), then [[Existence]] (p. 69)\n2. **Tools for avoiding commitment:** [[Paraphrase]] (p. 155), [[Fictionalism]] (p. 72)\n3. **Test cases:** [[Abstract vs Concrete]] (p. 3), [[Numbers]] (p. 149), [[Holes]] (p. 90)\n4. **Non-existence:** [[Non-Existent Objects]] (p. 147), [[Meinongianism]] (p. 120), [[Subsistence]] (p. 238), [[Being]] (p. 15)\n- Pointer entries: [[Concrete]] (p. 50), [[Criterion of Ontological Commitment]] (p. 55)\n\n**Further reading (from the entries):** Swoyer (2008); Daly (2009); van Inwagen (1998); Balaguer (2008); Eklund (2009); Nolan (2008); Casati and Varzi (2009); Priest (2009); Reicher (2008); Horsten (2008); Macdonald (2005); Quine (1948); Thomasson (2009). Full details are in each note.\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "08 Ontology and existence/Abstract vs Concrete.md": "---\ngroup: Ontology and existence\nrole: concept\nsource: Beebee et al. 2011, entry \"Abstract vs Concrete\"\npages: p. 3\nstatus: unread\n---\n# Abstract vs Concrete\n**Page(s):** p. 3\n**Book's definition:** p. 3. There's no single defining sentence: the last sentence of paragraph 1 gives the rough mark of concreteness, and the first two sentences of paragraph 2 introduce abstract objects.\n**In one line:** Roughly, concrete things are in space and time; abstract things, such as numbers, platonic universals and classes, are not.\n**Role in [[00 – Ontology and existence]]:** The basic division of entities in ontology. Whether there are any abstract objects at all is one of the field's main questions.\n**Explanation:** Concrete things include material objects: tables, mountains, stars, you and me. Also usually counted as concrete are immaterial objects, if there are any (ghosts, souls, God); events; immanent universals; tropes; and holes, for those who believe in them. 'Roughly' is needed because angels and God are not in space and time. Abstract things include platonic universals, numbers and classes: you won't find the number six in Liverpool or trip over *redness*. There are dissenters even about this rough picture. The debate has two parts: whether abstract objects exist (the crux of platonism), and how exactly to define 'abstract' and 'concrete'.\n**Example:** The number six isn't 'lurking around somewhere in Liverpool'.\n**Connections:**\n- [[Concrete]]: a pointer entry that sends you here.\n- frames the question about [[Numbers]]: because numbers are a standard example of abstract objects.\n- is a core question of [[Ontology]]: because whether abstracta exist is a major issue in contemporary ontology.\n- applies to [[Holes]]: because, for those who believe in them, holes are concrete objects.\n**Bridges to other groups:**\n- [[Platonism]] (Particulars and universals): because whether properties, numbers and so on exist is the crux of whether platonism is true.\n- [[Immanent Realism About Universals]] and [[Universals]] (Particulars and universals): because immanent universals count as concrete, while platonic universals are abstract.\n- [[Trope Theory]] (Particulars and universals): because tropes are usually said to be concrete.\n- [[Event]] (Causation and laws): because events are often labelled concrete.\n- [[Class]] (Sets, classes and infinity): because classes are a standard example of abstracta.\n- [[Modal Realism]] (Modality): because genuine modal realists take worlds to be concrete and ersatzers take them to be abstract.\n**Multiple meanings:** The entry stresses that both definitions are contested. The 'in space and time' test is only rough.\n**Further reading (book):** Swoyer, C. (2008) 'Abstract entities', in T. Sider, J. Hawthorne and D. Zimmerman (eds), *Contemporary Debates in Metaphysics*, Oxford: Blackwell. Also cited: Lewis (1986a: 81–6); Rosenkrantz, G. (1995) 'Concrete/abstract', in J. Kim (ed.), *A Companion to Metaphysics*, Oxford: Blackwell.\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/Being.md": "---\ngroup: Ontology and existence\nrole: concept\nsource: Beebee et al. 2011, entry \"Being\"\npages: pp. 15–16 (entry starts p. 15)\nstatus: unread\n---\n# Being\n**Page(s):** pp. 15–16 (entry starts p. 15)\n**Book's definition:** pp. 15–16. There's no single definition; the entry says most metaphysicians avoid the term. Copy the two uses it describes, which begin in paragraph 2 ('First…', 'Second…').\n**In one line:** A term most metaphysicians avoid. Where it does appear, it means either subsistence (being without existing) or, following Locke, a thing's essence.\n**Role in [[00 – Ontology and existence]]:** Marks a distinction (being vs existence) that orthodox ontology rejects.\n**Explanation:** Metaphysics is sometimes said to be all about being, but most metaphysicians aren't sure what 'being' is supposed to be. It shows up in two places. First, being is equated with subsistence, which on some views differs from existence; relatedly, being is what non-existent objects would have. Second, Locke defined essence as 'the being of a thing, whereby it is what it is'. Most metaphysicians think existence and essence are the only notions needed. Saying unicorns have being but don't exist is a commitment we can do without (it violates Ockham's razor), and defining essence through 'being' is less clear than the notion of essence itself.\n**Example:** The idea that unicorns have being but lack existence.\n**Connections:**\n- is equated with [[Subsistence]]: because on some views being is subsistence, which differs from existence.\n- is what [[Non-Existent Objects]] would have: because they would have being without existing.\n- is usually replaced by [[Existence]]: because most metaphysicians think existence (with essence) is all we need.\n**Bridges to other groups:**\n- [[Essence]] (Modality): because Locke defined essence as 'the being of a thing'.\n- [[Theoretical Virtues]] and [[Ockham's Razor]] (Method): because positing being without existence is an unneeded commitment that violates Ockham's razor.\n- [[Locke, John]] (Philosophers): because his definition of essence is one of the two uses of 'being'.\n**Multiple meanings:** Yes, two: (1) being as subsistence; (2) being as a thing's essence (Locke).\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/Concrete.md": "---\ngroup: Ontology and existence\nrole: pointer\nsource: Beebee et al. 2011, entry \"Concrete\"\npages: p. 50\nstatus: unread\n---\n# Concrete\n**Page(s):** p. 50\n**Pointer entry:** the book only says \"see\" → [[Abstract vs Concrete]]. Read that note.\n**Role in [[00 – Ontology and existence]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "08 Ontology and existence/Criterion of Ontological Commitment.md": "---\ngroup: Ontology and existence\nrole: pointer\nsource: Beebee et al. 2011, entry \"Criterion of Ontological Commitment\"\npages: p. 55\nstatus: unread\n---\n# Criterion of Ontological Commitment\n**Page(s):** p. 55\n**Pointer entry:** the book only says \"see\" → [[Ontological Commitment]]. Read that note.\n**Role in [[00 – Ontology and existence]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "08 Ontology and existence/Existence.md": "---\ngroup: Ontology and existence\nrole: concept\nsource: Beebee et al. 2011, entry \"Existence\"\npages: p. 69\nstatus: unread\n---\n# Existence\n**Page(s):** p. 69\n**Book's definition:** p. 69. There's no one-line definition. Copy the three 'generally accepted' features in paragraph 1 ('First…', 'Second…', 'Third…').\n**In one line:** The concept at the centre of ontology. On the orthodox view it is all-or-nothing, the same for everything, and everything there is exists.\n**Role in [[00 – Ontology and existence]]:** Sets out the assumptions most analytic metaphysicians make about existence, and who disputes them.\n**Explanation:** Three features are generally, though not universally, accepted. (1) Existence doesn't come in degrees: you can be a bit bald, but you can't exist a bit. (2) Everything exists in the same way. One argument comes from Quine's criterion: there is only one existential quantifier, so there is only one kind of existence. Dissenters include Aristotle (many types of existence), Russell (abstracta subsist rather than exist) and McDaniel (2009, after Heidegger: modes of existence). (3) Everything that there is exists; nothing there is fails to exist. Two less secure features: everything that exists actually exists, which Lewis's modal realism denies; and existence is not a predicate. Kant actually held that it is a predicate, just not a 'determining' one that adds anything to a concept.\n**Example:** 'You might be a bit tall… but you cannot exist just a bit.'\n**Connections:**\n- is what [[Ontology]] studies: because ontology concerns what exists.\n- is tied to [[Ontological Commitment]]: because Quine's criterion supports the claim that existence is the same for everything.\n- is denied of some things by believers in [[Non-Existent Objects]] and [[Being]]: because they reject the third feature.\n- is contrasted with [[Subsistence]]: because Russell held that abstract things subsist rather than exist.\n**Bridges to other groups:**\n- [[Quine, W. V.]] (Philosophers): because his single-quantifier argument supports one way of existing.\n- [[Modal Realism]] (Modality): because Lewis's version says things in other worlds exist without actually existing.\n- [[Indexical]] (Tools): because Lewis treats 'actually' as indexical, like 'here'.\n- [[Possibilia]] (Modality): because 'everything that exists actually exists' would rule out mere possibilia.\n- [[Kant, Immanuel]] (Philosophers): because the 'existence is not a predicate' slogan traces to him, though he held a subtler view.\n**Multiple meanings:** Yes: one mode of existence (orthodox) vs many modes (Aristotle, McDaniel); and whether existence is a predicate.\n**Further reading (book):** Daly, C. (2009) 'To be', in R. Le Poidevin, P. Simons, A. McGonigal and R. Cameron (eds), *The Routledge Companion to Metaphysics*, London: Routledge, pp. 225–33. van Inwagen, P. (1998) 'Metaontology', *Erkenntnis*, 48: 233–50.\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/Fictionalism.md": "---\ngroup: Ontology and existence\nrole: position\nsource: Beebee et al. 2011, entry \"Fictionalism\"\npages: pp. 72–74 (entry starts p. 72)\nstatus: unread\n---\n# Fictionalism\n**Page(s):** pp. 72–74 (entry starts p. 72)\n**Book's definition:** p. 72, the first two sentences of the entry.\n**In one line:** Anti-realism about some category of thing: the things don't exist, but talk about them is true *according to a fiction*.\n**Role in [[00 – Ontology and existence]]:** A general technique for avoiding unwanted ontological commitments, applied to numbers, possible worlds, composite objects and more.\n**Explanation:** It is literally false that Sherlock Holmes lived at 221b Baker Street, yet it is true *according to* the stories. Fictionalism applies this to metaphysics, to remove entities that are unneeded or objectionable. 'There is a prime between 5 and 11' seems to commit us to the abstract number 7. The fictionalist says it is literally false, but true according to the fiction of platonism, and that no more commits us to numbers than a film commits us to aliens. There are several versions: hermeneutic (the fictional translation is what we really mean), paraphrase, fixing truth conditions, or revolutionary (we *should* say the fictional sentence instead). Modal fictionalism (Rosen 1990) is misnamed: modal sentences come out literally true, and only the possible-world translations are false, though true according to the worlds fiction. It faces two problems: which fiction to use (Lewis's or an ersatz one), and the Brock–Rosen objection. On Lewis's fiction it is *necessary* that infinitely many worlds exist, and whatever is necessary is actual, so worlds would exist after all.\n**Example:** 'Sherlock Holmes lived at 221b Baker Street' is true according to the Holmes stories.\n**Connections:**\n- targets [[Numbers]]: because numbers are the leading case (Field 1980).\n- works through [[Paraphrase]]: because one version treats the fictional sentence as a paraphrase of the original.\n- aims to shrink our [[Ontology]]: because the point is to remove entities from what we are committed to.\n- is often aimed at abstract things in [[Abstract vs Concrete]]: because abstract numbers are the motivating worry.\n**Bridges to other groups:**\n- [[Anti-Realism]] (Realism and anti-realism): because fictionalism is a type of anti-realism about a category of entities.\n- [[Platonism]] (Particulars and universals): because the fiction used for numbers is the platonist theory.\n- [[Possible Worlds]] and [[Modal Realism]] (Modality): because modal fictionalism treats world talk as true according to a worlds fiction.\n- [[Special Composition Question]] (Mereology): because fictionalism about composite objects is one way to avoid answering it (Rosen and Dorr 2002).\n- [[Temporal Parts]] (Time): because there is a fictionalism about temporal parts (Kroon 2001).\n- [[Theoretical Virtues]] (Method): because the motive is a simpler ontology.\n**Multiple meanings:** Yes: hermeneutic vs revolutionary fictionalism. 'Modal fictionalism' is, the book says, a misnomer for 'possible worlds fictionalism'.\n**Further reading (book):** Balaguer, M. (2008) 'Fictionalism in the philosophy of mathematics', SEP, Fall 2008 edn. Eklund, M. (2009) 'Fictionalism', SEP, Spring 2009 edn. Nolan, D. (2008) 'Modal fictionalism', SEP, Fall 2008 edn. (SEP = *The Stanford Encyclopedia of Philosophy*, ed. E. N. Zalta.)\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/Holes.md": "---\ngroup: Ontology and existence\nrole: case\nsource: Beebee et al. 2011, entry \"Holes\"\npages: pp. 90–92 (entry starts p. 90)\nstatus: unread\n---\n# Holes\n**Page(s):** pp. 90–92 (entry starts p. 90)\n**Book's definition:** p. 90, paragraph 1. This is a test case, not a definition: copy the question it poses about the hole in the jeans.\n**In one line:** A test case for ontology: if 'there is a hole in my jeans' is true, does a hole exist, and if so, what is it?\n**Role in [[00 – Ontology and existence]]:** A classic small case showing the main strategies of ontology (paraphrase vs realism) and their costs.\n**Explanation:** **Anti-realists** avoid committing to holes by paraphrase: 'my jeans are singly perforated' quantifies only over the jeans. But some sentences resist this, like 'the hole in the tooth was smaller than the dentist's finest probe' (Geach 1968). Even if paraphrases are found, there may be no general method for finding them. **Realists** accept holes but disagree on what they are. (1) The 'Ludovician' view (Lewis and Lewis 1970): a hole is its hole lining. Problem: enlarging a hole makes its lining smaller, so the hole would get bigger and smaller at once. (2) A hole is a region of space. Problem: regions can't move, yet the hole moves with the jeans. (3) Holes are *sui generis*, a category of their own. Problem: ontological profligacy.\n**Example:** 'There were as many bullet holes in his corpse as there were dirty cops on the force.'\n**Connections:**\n- is a test of [[Paraphrase]]: because the anti-realist strategy is to paraphrase hole-talk away.\n- is a question of [[Ontological Commitment]]: because saying 'there is a hole' seems to commit us to holes.\n- falls under [[Ontology]]: because the entry presents it as an ontology question.\n- is classed in [[Abstract vs Concrete]]: because, for believers, holes are concrete objects.\n**Bridges to other groups:**\n- [[Nihilism]] (Mereology): because the entry sets nihilism aside when granting that the jeans exist.\n- [[Theoretical Virtues]] (Method): because the anti-realist motive is avoiding an unneeded commitment, and the sui generis view risks profligacy.\n- [[Lewis, David]] (Philosophers): because the Ludovician theory is Lewis and Lewis (1970).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Casati, R. and Varzi, A. (2009) 'Holes', SEP, Spring 2009 edn. Also cited: Casati, R. and Varzi, A. (1994) *Holes and Other Superficialities*, Cambridge, MA: MIT Press, Chapter 3.\n**Beyond the book:** —\n**My notes:**\n", "08 Ontology and existence/Meinongianism.md": "---\ngroup: Ontology and existence\nrole: position\nsource: Beebee et al. 2011, entry \"Meinongianism\"\npages: p. 120\nstatus: unread\n---\n# Meinon
