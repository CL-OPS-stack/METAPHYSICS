<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03050d">
<title>METAPHYSICS</title>
<style>
:root{
  --bg:#03050d; --panel:rgba(8,14,34,.78); --panel-2:rgba(12,20,46,.86); --line:rgba(150,180,255,.14);
  --text:#e3ebff; --muted:#8fa3cf; --faint:#5d6f99; --accent:#8cbcff; --accent-2:#4f8dff; --silver:#cfd8ea;
  --gold:#f2c98a; --danger:#ff8a8a; --radius:10px; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
button{font:inherit;color:inherit}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1;display:grid;grid-template-columns:52px var(--lw,270px) 1fr var(--rw,290px);grid-template-rows:1fr 26px;height:100%;height:100dvh}
#app.hide-left{--lw:0px} #app.hide-right{--rw:0px}
.glass{background:var(--panel);backdrop-filter:blur(14px) saturate(130%);-webkit-backdrop-filter:blur(14px) saturate(130%)}

/* ribbon */
#ribbon{grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-right:1px solid var(--line)}
#ribbon .logo{width:30px;height:30px;margin-bottom:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#b9d4ff 18%,#4f84e8 50%,#16275e 78%,#050a1d 100%);box-shadow:0 0 16px #4f8dff99,0 0 2px #fff}
.rb{width:36px;height:36px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.rb:hover,.rb.on{background:rgba(140,188,255,.12);color:var(--text)}
.rb svg{width:19px;height:19px}
#ribbon .spacer{flex:1}

/* sidebars */
.side{overflow:hidden;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
#right{border-right:0;border-left:1px solid var(--line)}
.side-head{display:flex;align-items:center;gap:6px;padding:10px 10px 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.side-head .grow{flex:1}
.side-body{overflow:auto;flex:1;padding:2px 6px 16px}
.mini{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px 5px;border-radius:6px;font-size:13px}
.mini:hover{background:rgba(140,188,255,.12);color:var(--text)}
.field{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(4,8,22,.7);color:var(--text);outline:none;font-size:14px}
.field:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(79,141,255,.18)}

/* explorer */
.tree{font-size:14px;user-select:none}
.folder>.row{font-weight:600;color:var(--silver)}
.row{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.row:hover{background:rgba(140,188,255,.08);color:var(--text)}
.row.active{background:linear-gradient(90deg,rgba(79,141,255,.28),rgba(79,141,255,.06));color:#fff}
.row .chev{width:12px;flex:0 0 12px;opacity:.7;transition:transform .15s}
.folder.closed .chev{transform:rotate(-90deg)}
.folder.closed>.kids{display:none}
.kids{margin-left:12px;border-left:1px solid var(--line);padding-left:4px}
.row .count{margin-left:auto;font-size:11px;color:var(--faint);font-weight:400}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:#3c4a6e}
.dot.reading{background:var(--accent-2);box-shadow:0 0 6px var(--accent-2)}
.dot.understood{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.row .name{overflow:hidden;text-overflow:ellipsis}

/* search */
.result{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.result:hover{background:rgba(140,188,255,.08);border-color:var(--line)}
.result .t{font-weight:600;font-size:14px}
.result .s{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
mark{background:rgba(242,201,138,.3);color:#fff;border-radius:3px;padding:0 2px}

/* main */
#main{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:rgba(4,8,22,.72)}
#view .graphwrap{background:rgba(2,4,12,.25)}
#tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-height:40px}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;max-width:220px;padding:7px 10px;border-radius:9px 9px 0 0;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap;border:1px solid transparent;border-bottom:0}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--panel-2);color:#fff;border-color:var(--line)}
.tab .x{border:0;background:transparent;color:var(--faint);cursor:pointer;border-radius:5px;padding:0 4px}
.tab .x:hover{color:#fff;background:rgba(255,255,255,.1)}
#viewhead{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--faint);min-height:42px}
#viewhead .crumbs{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{border:1px solid var(--line);background:rgba(8,14,34,.6);color:var(--text);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--accent-2)}
#view{flex:1;overflow:auto;position:relative}
.empty{display:grid;place-items:center;height:100%;text-align:center;color:var(--muted);padding:30px}
.empty h1{font-family:var(--serif);letter-spacing:.32em;font-weight:500;color:#fff;font-size:clamp(28px,6vw,54px);margin:0 0 6px;text-shadow:0 0 24px #4f8dffaa}
.empty p{max-width:460px;line-height:1.6}

/* reading view */
.doc{max-width:780px;margin:0 auto;padding:26px 28px 120px;font-size:var(--fs);line-height:1.72}
.doc h1,.doc h2,.doc h3{font-family:var(--serif);font-weight:600;color:#fff;line-height:1.25}
.doc h1{font-size:2em;margin:.2em 0 .5em;text-shadow:0 0 22px rgba(79,141,255,.35)}
.doc h2{font-size:1.45em;margin:1.6em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
.doc h3{font-size:1.18em;margin:1.3em 0 .4em}
.doc p{margin:.6em 0}
.doc a{color:var(--accent);text-decoration:none}
.doc a.wl{color:var(--accent);border-bottom:1px dotted rgba(140,188,255,.5);cursor:pointer}
.doc a.wl:hover{color:#fff;border-bottom-color:#fff;text-shadow:0 0 10px #4f8dff}
.doc a.wl.unresolved{color:#9aa6c7;opacity:.75;border-bottom-style:dashed}
.doc strong{color:#fff}
.doc code{font-family:var(--mono);font-size:.88em;background:rgba(140,188,255,.1);padding:.1em .35em;border-radius:5px}
.doc pre{background:rgba(2,5,15,.8);border:1px solid var(--line);padding:12px 14px;border-radius:9px;overflow:auto}
.doc pre code{background:none;padding:0}
.doc blockquote{margin:1em 0;padding:.3em 1em;border-left:3px solid var(--accent-2);background:rgba(79,141,255,.07);border-radius:0 8px 8px 0;color:var(--silver)}
.doc ul,.doc ol{padding-left:1.5em;margin:.5em 0}
.doc li{margin:.25em 0}
.doc hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.doc table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.9em;display:block;overflow-x:auto}
.doc th,.doc td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.doc th{background:rgba(79,141,255,.12);color:#fff}
.doc mark{background:rgba(242,201,138,.35)}
.props{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(8,14,34,.55)}
.prop{font-size:12.5px;padding:3px 9px;border-radius:999px;background:rgba(140,188,255,.08);color:var(--silver)}
.prop b{color:var(--faint);font-weight:500;margin-right:5px}
.prop.status{cursor:pointer;border:1px solid var(--line)}
.prop.status.reading{border-color:var(--accent-2);color:#fff}
.prop.status.understood{border-color:var(--gold);color:var(--gold)}

/* editor */
#editor{width:100%;height:100%;border:0;outline:none;resize:none;background:transparent;color:var(--text);font-family:var(--mono);font-size:calc(var(--fs) - 1.5px);line-height:1.7;padding:26px max(28px,calc((100% - 780px)/2)) 140px;tab-size:2}
#suggest{position:absolute;z-index:20;min-width:240px;max-width:360px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.6);padding:4px}
#suggest div{padding:6px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
#suggest div.on,#suggest div:hover{background:rgba(79,141,255,.3)}
#suggest small{display:block;color:var(--faint);font-size:11px}

/* right sidebar */
.sect{margin:4px 4px 14px}
.sect h4{margin:6px 6px 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;display:flex;justify-content:space-between}
.linkitem{padding:6px 9px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.linkitem:hover{background:rgba(140,188,255,.08);color:#fff}
.linkitem small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px;line-height:1.4}
.outline a{display:block;padding:3px 9px;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:none;border-radius:6px}
.outline a:hover{color:#fff;background:rgba(140,188,255,.08)}
#localgraph{width:100%;height:230px;display:block;border:1px solid var(--line);border-radius:10px;background:rgba(2,5,15,.5)}

/* graph */
.graphwrap{position:absolute;inset:0}
.graphwrap canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.graphbar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.graphbar>*{pointer-events:auto}
.graphbar .field{width:200px}
.graphbar select{width:auto}
.legend{position:absolute;bottom:12px;left:12px;max-width:min(560px,calc(100% - 24px));display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.legend span.off{opacity:.35}

/* status bar */
#status{grid-column:2/5;display:flex;align-items:center;gap:16px;justify-content:flex-end;padding:0 14px;font-size:11.5px;color:var(--faint);border-top:1px solid var(--line)}

/* modals */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(1,3,10,.55);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.modal{width:min(620px,92vw);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden}
.modal .field{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:16px;background:transparent}
.modal .list{max-height:50vh;overflow:auto;padding:6px}
.modal .opt{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.modal .opt small{color:var(--faint)}
.modal .opt.on{background:rgba(79,141,255,.28)}
.modal .body{padding:18px;line-height:1.6;color:var(--silver);font-size:14px}
.modal .body h3{margin:0 0 10px;color:#fff;font-family:var(--serif)}
.modal .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#preview{position:fixed;z-index:40;width:min(420px,90vw);max-height:320px;overflow:hidden;border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);pointer-events:none}
#preview .doc{padding:14px 18px;font-size:13.5px}
#preview .doc h1{font-size:1.4em}
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:60;padding:9px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

/* mobile */
#mtoggle{display:none}
@media (max-width: 900px){
  #app{grid-template-columns:48px 1fr;grid-template-rows:1fr 24px}
  #left,#right{position:fixed;top:0;bottom:0;z-index:30;width:min(320px,86vw);transition:transform .22s ease;border:1px solid var(--line)}
  #left{left:48px;transform:translateX(calc(-100% - 60px))}
  #right{right:0;transform:translateX(110%)}
  #app.show-left #left{transform:none}
  #app.show-right #right{transform:none}
  #main{grid-column:2}
  #status{grid-column:2}
  .doc{padding:18px 18px 120px}
  #editor{padding:18px 18px 140px}
  #status .hide-m{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app">
  <nav id="ribbon" class="glass" aria-label="Main tools">
    <div class="logo" title="METAPHYSICS"></div>
    <button class="rb" data-cmd="toggleLeft" title="Files (toggle sidebar)" aria-label="Files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="rb" data-cmd="search" title="Search (Ctrl+Shift+F)" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="rb" data-cmd="switcher" title="Quick switcher (Ctrl+O)" aria-label="Quick switcher"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h7"/><path d="m17 15 3 3-3 3"/></svg></button>
    <button class="rb" data-cmd="graph" title="Graph view (Ctrl+G)" aria-label="Graph view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2"/><circle cx="16" cy="17" r="3"/><circle cx="6" cy="17" r="1.8"/><path d="M8.3 7.6 16 6.4M7.6 9 14 15M7.8 17h5.2M17.3 8l-.8 6"/></svg></button>
    <button class="rb" data-cmd="newNote" title="New note (Ctrl+N)" aria-label="New note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg></button>
    <button class="rb" data-cmd="journal" title="Today's journal entry" aria-label="Journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button class="rb" data-cmd="random" title="Random note" aria-label="Random note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/></svg></button>
    <div class="spacer"></div>
    <button class="rb" data-cmd="palette" title="Command palette (Ctrl+P)" aria-label="Commands"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m7 8-4 4 4 4M17 8l4 4-4 4M14 5l-4 14"/></svg></button>
    <button class="rb" data-cmd="toggleRight" title="Links panel" aria-label="Links panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
    <button class="rb" data-cmd="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </nav>

  <aside id="left" class="side glass" aria-label="Sidebar">
    <div class="side-head"><span id="leftTitle" class="grow">Explorer</span>
      <button class="mini" data-cmd="newNote" title="New note">＋</button>
      <button class="mini" data-cmd="collapseAll" title="Collapse all">⇤</button>
    </div>
    <div style="padding:0 10px 8px"><input id="filter" class="field" placeholder="Filter files…" autocomplete="off"></div>
    <div id="leftBody" class="side-body"></div>
  </aside>

  <main id="main">
    <div id="tabs" role="tablist"></div>
    <div id="viewhead" class="glass"></div>
    <div id="view"></div>
  </main>

  <aside id="right" class="side glass" aria-label="Links panel">
    <div class="side-head"><span class="grow">Links</span></div>
    <div id="rightBody" class="side-body"></div>
  </aside>

  <footer id="status" class="glass"></footer>
</div>

<script>window.__VAULT__ = {"00 Tools and background/00 – Tools and background.md": "---\ngroup: Tools and background\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Tools and background\n**What this group is:** the book doesn't treat this as one of its topics. It's the shared toolkit that the debates in every other group rely on.\n\n**Central question (as a group):** How can we know things about reality, what do our words and concepts contribute, and how can one thing be 'nothing over and above' another?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| [[Empiricism]] | All knowledge of the external world is a posteriori | Locke, Berkeley, Hume | Meaning-empiricism would make terms like 'quark' meaningless; most now reject it |\n| [[Rationalism]] | Some truths about reality are knowable a priori | Descartes, Spinoza, Leibniz | Hume: such work is 'sophistry and illusion'; Kant's rescue limits us to the phenomenal world |\n| A genuine [[Analytic vs Synthetic Truths\\|analytic/synthetic]] distinction | Some truths hold in virtue of meaning alone | Kant (introduced the terms); Grice & Strawson (1957, 'In defense of a dogma') | Quine (1951): no genuine line can be drawn |\n| [[Reductionism]] | Ks exist but are nothing over and above other things | Schaffer (2009, neo-Aristotelian grounding) | Merricks: no intelligible middle way between 'exist' and 'don't exist' |\n| Concepts as abstract objects (see [[Concept]]) | Concepts are abstract ingredients of propositions | Frege (anti-psychologism) | Hard to explain what 'grasping' an abstract object is |\n\n## Key arguments and test cases\n- Kant's synthetic a priori (mathematics), in [[Analytic vs Synthetic Truths]], p. 5\n- Quine's attack on analyticity, in [[Analytic vs Synthetic Truths]] and [[Conceptual vs Logical Truths]]\n- Kripke's necessary a posteriori truths, in [[Conceptual vs Logical Truths]] (and see [[Necessary A Posteriori Truths]])\n- Hume's meaning-empiricism, in [[Empiricism]], p. 61\n- The Chelsea–Arsenal counterfactual, in [[Counterfactual Conditional]], p. 54\n- The pound coin and global supervenience, in [[Supervenience]]\n- Merricks vs Schaffer on tables and chairs, in [[Reductionism]]\n- 'War is war' (2 types, 3 tokens), in [[Type and Tokens]]\n\n## Bridges to other groups\n- **Modality:** [[Necessary A Posteriori Truths]], because Kripke separates necessity from the a priori. [[Possible Worlds]], because counterfactuals and supervenience are both explained through possible worlds.\n- **Metametaphysics and method:** [[Metametaphysics]], because empiricism, rationalism, Quine on analyticity and reductionism all bear on whether, and how, armchair metaphysics works. [[Conceptual Analysis]] and [[Theoretical Virtues]], because primitives and reduction are judged with them.\n- **Causation and laws:** [[Counterfactual Theory of Causation]], because it is built on counterfactual conditionals. [[Humean Supervenience]], because it is defined with supervenience.\n- **Particulars and universals:** [[Universals]], because of the primitives trade-off with [[Austere Nominalism]] and the type/token framing.\n- **Realism and anti-realism:** [[Realism and Anti-Realism]], because reductionism is a middle way and meaning-empiricism is an argument for anti-realism.\n\n## Reading path (pages in the book)\n1. **Knowledge:** [[A Priori - A Posteriori]] (p. 10), then [[Analytic vs Synthetic Truths]] (p. 5), then [[Conceptual vs Logical Truths]] (p. 49)\n2. **Where knowledge and ideas come from:** [[Empiricism]] (p. 61), [[Rationalism]] (p. 208), [[Concept]] (p. 44)\n3. **Working tools:** [[Counterfactual Conditional]] (p. 53), [[Supervenience]] (p. 239), [[Reductionism]] (p. 215), [[Primitive]] (p. 181), [[Indexical]] (p. 104), [[Type and Tokens]] (p. 264)\n- Pointer entries: [[A Posteriori]] (p. 10), [[Logical Truth]] (p. 119), [[Natural Philosophy]] (p. 136), [[Synthetic Truths]] (p. 244), [[Token]] (p. 253)\n\n**Further reading (from the entries):** Quine (1951); Grice and Strawson (1957); Margolis and Laurence (2008); Braun (2008); Schaffer (2009); McLaughlin and Bennett (2008); Kim (1993); L. Wetzel (2008). Full details are in each note.\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "00 Tools and background/A Posteriori.md": "---\ngroup: Tools and background\nrole: pointer\nsource: Beebee et al. 2011, entry \"A Posteriori\"\npages: p. 10\nstatus: unread\n---\n# A Posteriori\n**Page(s):** p. 10\n**Pointer entry:** the book only says \"see\" → [[A Priori - A Posteriori]]. Read that note.\n**Role in [[00 – Tools and background]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "00 Tools and background/A Priori - A Posteriori.md": "---\ngroup: Tools and background\nrole: concept\nsource: Beebee et al. 2011, entry \"A Priori/A Posteriori\"\npages: pp. 10–11 (entry starts p. 10)\nstatus: unread\n---\n# A Priori/A Posteriori\n**Page(s):** pp. 10–11 (entry starts p. 10)\n**Book's definition:** p. 10. Copy two sentences: the one defining *a priori* in paragraph 1 (it starts \"A claim is knowable *a priori* if…\"), and the opening sentence of paragraph 2, defining *a posteriori*.\n**In one line:** A claim is knowable *a priori* if it can be justified without relying on experience at all. It is knowable only *a posteriori* if experience is the only way to justify it.\n**Role in [[00 – Tools and background]]:** The basic distinction about kinds of knowledge. Empiricism, rationalism and the analytic/synthetic debate are all built on it.\n**Explanation:** The distinction concerns how a claim *can* be justified, not how one person happened to learn it. A child may learn 2 + 5 = 7 by counting objects. You may believe there are infinitely many primes because a trustworthy mathematician told you. Both claims are still knowable a priori, because *someone* can justify them by proof without appeal to experience. Most of our knowledge, such as that kettles heat water or that Canberra is Australia's capital, can only be justified through the senses, so it is a posteriori.\n**Example:** \"There are infinitely many primes\" is a priori (provable from basic axioms). \"Canberra is the capital of Australia\" is a posteriori.\n**Connections:**\n- is assumed by [[Empiricism]]: because empiricism is defined as the view that all our knowledge of the external world is a posteriori.\n- is assumed by [[Rationalism]]: because rationalists claim that some truths about reality can be known by a priori reasoning alone.\n- is often matched with [[Analytic vs Synthetic Truths]]: because analytic truths are intuitively the a priori ones. But Kant denied the match: he held mathematics to be synthetic yet a priori.\n- is linked to [[Conceptual vs Logical Truths]]: because conceptual and logical truths are knowable a priori, needing only knowledge of meaning or logical form.\n**Bridges to other groups:**\n- [[Necessary A Posteriori Truths]] (Modality): because Kripke argues that some necessary truths can only be known a posteriori, breaking the assumed link between necessity and a priori knowledge.\n- [[Metametaphysics]] (Method): because metaphysicians still disagree about whether metaphysics produces, or even aims at, a priori knowledge of the world (Empiricism entry, p. 62).\n**Multiple meanings:** None noted in the entry. The entry stresses one point: 'knowable a priori' is about whether *anyone* could justify the claim without experience.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "00 Tools and background/Analytic vs Synthetic Truths.md": "---\ngroup: Tools and background\nrole: concept\nsource: Beebee et al. 2011, entry \"Analytic vs Synthetic Truths\"\npages: pp. 5–6 (entry starts p. 5)\nstatus: unread\n---\n# Analytic vs Synthetic Truths\n**Page(s):** pp. 5–6 (entry starts p. 5)\n**Book's definition:** p. 5, the opening sentence of the entry.\n**In one line:** An analytic truth is true just because of what its words mean. A synthetic truth is any truth that isn't like that.\n**Role in [[00 – Tools and background]]:** A core distinction that other distinctions (a priori/a posteriori, necessary/contingent) are compared against. Whether it exists at all is a famous dispute.\n**Explanation:** \"All bachelors are unmarried\" is analytic, while \"some bachelors are tall\" is synthetic. Intuitively, and according to some philosophers, the analytic truths are exactly the ones knowable a priori, and the synthetic ones are knowable only a posteriori. But Kant, who introduced the terms, held that some truths (mathematics) are synthetic yet knowable a priori. Quine (1951) went further and argued that no genuine analytic/synthetic distinction can be drawn. A further dispute is whether analytic/synthetic lines up with necessary/contingent. Kripke argues that some necessary truths are not analytic and cannot be known a priori.\n**Example:** \"All bachelors are unmarried\" (analytic) vs \"some bachelors are tall\" (synthetic).\n**Connections:**\n- compared with [[A Priori - A Posteriori]]: because the intuitive view equates analytic with a priori, and Kant's synthetic a priori truths are the main counterexample.\n- includes [[Conceptual vs Logical Truths]]: because the conceptual and logical truths together make up what are sometimes called the analytic truths (Conceptual vs Logical Truths entry, p. 50).\n- [[Synthetic Truths]]: a pointer entry that sends you here.\n- introduced by [[Kant, Immanuel]]: because he coined the terms and argued that mathematics is synthetic a priori.\n- opposed by [[Quine, W. V.]]: because he argued (1951) that there is no genuine line between analytic and synthetic.\n**Bridges to other groups:**\n- [[Necessity]] and [[Contingent Truths]] (Modality): because whether necessary/contingent lines up with analytic/synthetic is disputed.\n- [[Necessary A Posteriori Truths]] (Modality): because Kripke's examples are necessary but not analytic.\n- [[Metametaphysics]] (Method): because the Metametaphysics entry presents Quine's rejection of this distinction as his most influential reply to Carnap and logical positivism.\n**Multiple meanings:** The entry notes the distinction may not exist at all (Quine), so 'analytic' is itself contested.\n**Further reading (book):** Quine, W. V. (1951) 'Two dogmas of empiricism', *The Philosophical Review*, 60, 1: 20–43. Grice, H. P. and Strawson, P. F. (1957) 'In defense of a dogma', *The Philosophical Review*, 65: 141–58.\n**Beyond the book:** —\n**My notes:**\n", "00 Tools and background/Concept.md": "---\ngroup: Tools and background\nrole: concept\nsource: Beebee et al. 2011, entry \"Concept\"\npages: pp. 44–45 (entry starts p. 44)\nstatus: unread\n---\n# Concept\n**Page(s):** pp. 44–45 (entry starts p. 44)\n**Book's definition:** p. 44, the opening sentence of the entry.\n**In one line:** Concepts are, roughly, the ingredients of thought. What exactly they *are* is hotly disputed.\n**Role in [[00 – Tools and background]]:** A basic notion used by conceptual analysis, conceptual truths, empiricism and the theory of propositions.\n**Explanation:** Locke, Berkeley and Hume called concepts 'ideas' and mostly thought of them as mental images. That view fell away, partly because many concepts have no obvious image: a poltergeist, God, a magnetic field. Many philosophers keep the core idea that concepts are *mental representations*, and some contemporary philosophers hold that concepts are simply linguistic items. Others, following Frege (who attacked psychologism), take concepts to be **abstract objects** that make up propositions. The difficulty for that view is explaining what 'grasping' an abstract object could be.\n**Example:** Thinking that the Queen is wearing a crown uses the concepts *Queen*, *crown* and *wearing*.\n**Connections:**\n- is the basis of [[Conceptual vs Logical Truths]]: because a conceptual truth is true just in virtue of the meanings of its concepts.\n- is the subject of a claim by [[Empiricism]]: because traditional empiricists held that all concepts come from experience (no innate ideas).\n- can be a [[Primitive]]: because a primitive is a predicate or concept that a theory leaves unanalysed.\n**Bridges to other groups:**\n- [[Proposition]] (Truth): because if concepts are the ingredients of propositions, and propositions are abstract, then concepts should be abstract too.\n- [[Abstract vs Concrete]] (Ontology): because one main view makes concepts abstract objects rather than things in our heads.\n- [[Psychologism]] (Realism and anti-realism): because Frege's rejection of psychologism motivates the abstract-object view.\n**Multiple meanings:** Three views in the entry: (1) mental images (early moderns); (2) mental representations, possibly just linguistic items; (3) abstract objects (Fregean).\n**Further reading (book):** Margolis, E. and Laurence, S. (2008) 'Concepts', in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn.\n**Beyond the book:** —\n**My notes:**\n", "00 Tools and background/Conceptual vs Logical Truths.md": "---\ngroup: Tools and background\nrole: concept\nsource: Beebee et al. 2011, entry \"Conceptual vs Logical Truths\"\npages: pp. 49–50 (entry starts p. 49)\nstatus: unread\n---\n# Conceptual vs Logical Truths\n**Page(s):** pp. 49–50 (entry starts p. 49)\n**Book's definition:** p. 49. Copy the opening sentence of paragraph 1 (conceptual truth) and of paragraph 2 (logical truth).\n**In one line:** A conceptual truth is true because of the meanings of its concepts. A logical truth is true because of its logical form alone.\n**Role in [[00 – Tools and background]]:** Marks out two kinds of truth that are necessary and knowable a priori, and that together are often called 'analytic'.\n**Explanation:** \"All bachelors are unmarried\" follows from the definition of 'bachelor', so it is a conceptual truth. \"If snow is white, then snow is white\" has the form 'if P then P', and it stays true whatever sentence replaces P, so it is a logical truth. A conceptual truth does not survive substitution: 'all As are Bs' can become 'all cats are dogs'. Both kinds are necessary and knowable a priori. That tempts some to think necessary truths are *just* conceptual and logical truths, and *just* the a priori ones. Kripke argued against this. The entry also cautions that these truths are what is sometimes called 'analytic', a distinction Quine attacked.\n**Example:** Conceptual: \"All bachelors are unmarried.\" Logical: \"Either unicorns exist or unicorns do not exist.\"\n**Connections:**\n- [[Logical Truth]]: a pointer entry that sends you here.\n- depends on [[Concept]]: because conceptual truths are true in virtue of the meanings of their constituent concepts.\n- is part of [[Analytic vs Synthetic Truths]]: because conceptual plus logical truths make up the class sometimes called analytic.\n- is knowable by [[A Priori - A Posteriori]] means: because no empirical investigation is needed, only knowledge of meaning or form.\n- is challenged by [[Quine, W. V.]]: because he argued there is no hard and fast analytic/synthetic distinction.\n**Bridges to other groups:**\n- [[Necessity]] (Modality): because conceptual and logical truths could not have been false.\n- [[Necessary A Posteriori Truths]] (Modality): because Kripke's class shows that not every necessary truth is conceptual or logical.\n**Multiple meanings:** The entry warns that the very notion of a conceptual truth is questionable, given Quine's attack.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "00 Tools and background/Counterfactual Conditional.md": "---\ngroup: Tools and background\nrole: concept\nsource: Beebee et al. 2011, entry \"Counterfactual Conditional\"\npages: pp. 53–54 (entry starts p. 53)\nstatus: unread\n---\n# Counterfactual Conditional\n**Page(s):** pp. 53–54 (entry starts p. 53)\n**Book's definition:** p. 53, the first two sentences of the entry.\n**In one line:** A statement of the form \"if P had been the case, Q would have been the case\", where P is actually false.\n**Role in [[00 – Tools and background]]:** A key logical tool. Theories of causation and dispositions are built on it.\n**Explanation:** A counterfactual is a special case of the subjunctive conditional, and its 'if' part must be contrary to fact. The standard account of its truth conditions is David Lewis's: 'if P had been, Q would have been' is true just when Q is true at the closest possible world (the one most similar to ours) where P is true. Some cases are easy, like getting up an hour earlier and getting more work done. Others are hard. If Chelsea hadn't equalised, would Arsenal have won? Not clearly, because Chelsea would then have played the rest of the match differently.\n**Example:** \"If I'd got up an hour earlier this morning, I would have got more work done.\"\n**Connections:**\n- analysed by [[Lewis, David]]: because his closest-possible-world account is the standard theory of counterfactuals.\n**Bridges to other groups:**\n- [[Possible Worlds]] (Modality): because Lewis states the truth conditions in terms of the closest possible worlds.\n- [[Counterfactual Theory of Causation]] (Causation and laws): because one major use of counterfactuals is to analyse causation.\n- [[Categorical and Dispositional Properties]] (Kinds of properties): because counterfactuals are also used to analyse dispositions.\n- [[Truth Conditions]] (Truth): because the entry's central question is what the truth conditions of counterfactuals are.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "00 Tools and background/Empiricism.md": "---\ngroup: Tools and background\nrole: position\nsource: Beebee et al. 2011, entry \"Empiricism\"\npages: pp. 61–62 (entry starts p. 61)\nstatus: unread\n---\n# Empiricism\n**Page(s):** pp. 61–62 (entry starts p. 61)\n**Book's definition:** p. 61, the opening sentence of the entry.\n**In one line:** At minimum, the view that all our knowledge of the external world is a posteriori.\n**Role in [[00 – Tools and background]]:** One of the two classic positions on where knowledge comes from (the other is rationalism). It poses a challenge to armchair metaphysics.\n**Explanation:** The classic empiricists are Locke, Berkeley and Hume. Traditionally, empiricists also held that all concepts come from experience: the mind starts as a blank slate, with no innate knowledge or innate ideas. A stronger version, *meaning-empiricism* (notably Hume's), says a supposed idea that can't be traced to sensory experience is not a genuine idea at all. Hume arguably applied this to natural necessity and to the self. Empiricism seems to conflict with metaphysics, which reasons 'from the armchair'. Most philosophers now reject meaning-empiricism, partly because physicists' terms for unobservables (quarks, the Higgs boson) are not meaningless. Whether metaphysics yields, or aims at, a priori knowledge of the world is still debated.\n**Example:** Hume's claim that, since we never experience necessary connection between events, we have no genuine idea of natural necessity.\n**Connections:**\n- is defined by [[A Priori - A Posteriori]]: because empiricism says knowledge of the external world is all a posteriori.\n- opposes [[Rationalism]]: because rationalists claim some knowledge of reality is a priori.\n- makes a claim about [[Concept]]: because traditional empiricists say all concepts come from experience.\n- is held by [[Locke, John]], [[Berkeley, George]] and [[Hume, David]]: because they are the 'British Empiricists'.\n**Bridges to other groups:**\n- [[Natural Necessity]] (Causation and laws): because Hume arguably held that we have no genuine idea of it.\n- [[Bundle Theory of the Self or Person]] (Personal identity): because the same reasoning targets the idea of the self.\n- [[Realism and Anti-Realism]] (Realism and anti-realism): because meaning-empiricism provides one argument for anti-realism.\n- [[Metametaphysics]] (Method): because whether metaphysics gives a priori knowledge of reality is still disputed.\n**Multiple meanings:** Three strengths in the entry: (1) minimal: all knowledge of the external world is a posteriori; (2) no innate ideas; (3) meaning-empiricism.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "00 Tools and background/Indexical.md": "---\ngroup: Tools and background\nrole: concept\nsource: Beebee et al. 2011, entry \"Indexical\"\npages: pp. 104–105 (entry starts p. 104)\nstatus: unread\n---\n# Indexical\n**Page(s):** pp. 104–105 (entry starts p. 104)\n**Book's definition:** p. 104, the opening sentence of the entry.\n**In one line:** A word like 'I' or 'here' that refers to different things depending on who says it, and where or when.\n**Role in [[00 – Tools and background]]:** A tool that lets metaphysicians treat 'actual' and 'now' as context-relative words rather than marks of something special.\n**Explanation:** When Angela Merkel says 'I am here' in Berlin, 'I' refers to Merkel and 'here' to Berlin. When Barack Obama says it in the White House, the words refer differently. David Lewis treats 'actual' as an indexical: it refers to whatever world the speaker is in. So other possible worlds and their inhabitants can exist without being *actual*, just as the Eiffel Tower exists without being 'here' when you're in Birmingham. Tenseless theorists of time similarly treat 'now' as an indexical, so present things are not metaphysically special. They are just temporally close to the speaker.\n**Example:** Gandalf does not *actually* exist. But in a world where he exists, its inhabitants truly say he 'actually' exists, because 'actual' picks out *their* world.\n**Connections:**\n- used by [[Lewis, David]]: because his genuine modal realism depends on 'actual' being indexical.\n**Bridges to other groups:**\n- [[Modal Realism]] (Modality): because treating 'actual' as indexical lets possible worlds exist without being actual.\n- [[Existence]] (Ontology): because, on this view, actual existence is no special *kind* of existence.\n- [[Tensed and Tenseless Theories of Time]] (Time): because tenseless theorists take 'now' to be an indexical.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Braun, D. (2008) 'Indexicals', in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn.\n**Beyond the book:** —\n**My notes:**\n", "00 Tools and background/Logical Truth.md": "---\ngroup: Tools and background\nrole: pointer\nsource: Beebee et al. 2011, entry \"Logical Truth\"\npages: p. 119\nstatus: unread\n---\n# Logical Truth\n**Page(s):** p. 119\n**Pointer entry:** the book only says \"see\" → [[Conceptual vs Logical Truths]]. Read that note.\n**Role in [[00 – Tools and background]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "00 Tools and background/Natural Philosophy.md": "---\ngroup: Tools and background\nrole: pointer\nsource: Beebee et al. 2011, entry \"Natural Philosophy\"\npages: p. 136\nstatus: unread\n---\n# Natural Philosophy\n**Page(s):** p. 136\n**Pointer entry:** the book only says \"see\" → [[Experimental Philosophy]]. Read that note.\n**Role in [[00 – Tools and background]]:** cross-reference only; the book gives no separate definition here.\n**Grouping note:** the book sends this term to Experimental Philosophy (group 11, Method). Consider moving this note to that group.\n**My notes:**\n", "00 Tools and background/Primitive.md": "---\ngroup: Tools and background\nrole: tool\nsource: Beebee et al. 2011, entry \"Primitive\"\npages: pp. 181–182 (entry starts p. 181)\nstatus: unread\n---\n# Primitive\n**Page(s):** pp. 181–182 (entry starts p. 181)\n**Book's definition:** p. 181, the opening sentence of the entry.\n**In one line:** A predicate (or concept) that a particular theory leaves unanalysed.\n**Role in [[00 – Tools and background]]:** A measure of a theory's cost. Comparing theories often means trading primitives against other virtues.\n**Explanation:** 'x is a brother of y' can be analysed as 'x is male and x is a sibling of y', so a theory that accepts this analysis doesn't treat 'brother' as primitive. 'x is located in space' is treated as primitive by many theories. Whether something is primitive is always relative to a theory. It is standard to think fewer primitives is a theoretical virtue, but every theory needs some. Other virtues, such as a smaller ontology or greater explanatory power, can outweigh the cost. There are no fixed rules for these trade-offs, so metaphysicians disagree.\n**Example:** A realist about abundant universals has fewer primitives but more entities. The austere nominalist has fewer entities but must take many predicates as primitive.\n**Connections:**\n- can be a [[Concept]]: because the entry allows primitives to be concepts as well as predicates.\n**Bridges to other groups:**\n- [[Conceptual Analysis]] (Method): because a primitive is precisely what has no conceptual analysis in a theory.\n- [[Theoretical Virtues]] (Method): because having few primitives is standardly counted a virtue.\n- [[Universals]] and [[Austere Nominalism]] (Particulars and universals): because their dispute is the entry's main example of trading entities against primitives.\n- [[Modal Realism]] (Modality): because the genuine modal realist removes all modal primitives by positing concrete possible worlds, while ersatzists and fictionalists keep some.\n- [[Paraphrase]] (Ontology): because paraphrasing away talk of properties tends to multiply primitive predicates.\n**Multiple meanings:** None noted. The entry stresses that 'primitive' is always relative to a theory.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "00 Tools and background/Rationalism.md": "---\ngroup: Tools and background\nrole: position\nsource: Beebee et al. 2011, entry \"Rationalism\"\npages: pp. 208–209 (entry starts p. 208)\nstatus: unread\n---\n# Rationalism\n**Page(s):** pp. 208–209 (entry starts p. 208)\n**Book's definition:** p. 208, paragraph 1. Copy the sentence beginning \"Roughly speaking, the rationalists…\" (the opening sentences only say what the term does *not* mean).\n**In one line:** The early modern view that we can know some things about the nature of reality by a priori reasoning alone.\n**Role in [[00 – Tools and background]]:** The classic rival to empiricism. Contemporary metaphysics may rely on it without admitting so.\n**Explanation:** In philosophy, 'rationalism' doesn't mean favouring reason and evidence; every respectable philosopher does that. It names the view of Descartes, Spinoza and Leibniz that some truths about reality, such as that every event has a cause or that God exists, can be known a priori, and that some knowledge is innate. It matters for metaphysics because metaphysics studies reality without experiments. Hume rejected such work as sophistry and illusion. Kant tried to rescue metaphysics, but only by limiting our access to the world of possible experience, which risks global anti-realism. The twentieth-century 'linguistic turn' conceded Hume's point and reduced metaphysics to conceptual analysis. Many metaphysicians today have left the linguistic turn behind and so implicitly endorse a form of rationalism.\n**Example:** The rationalist claim that 'every event has a cause' can be known by reason alone.\n**Connections:**\n- opposes [[Empiricism]]: because empiricists deny any a priori knowledge of the external world.\n- is defined by [[A Priori - A Posteriori]]: because the view is about a priori knowledge of reality.\n- is attacked by [[Hume, David]]: because he held that such reasoning can contain nothing but sophistry and illusion.\n- is answered by [[Kant, Immanuel]]: because his *Critique of Pure Reason* responds to Hume by limiting knowledge to the phenomenal world.\n**Bridges to other groups:**\n- [[Realism and Anti-Realism (Global)]] (Realism and anti-realism): because Kant's route is likely to lead to global anti-realism.\n- [[Linguistic Turn]] (Method): because the twentieth century's main response accepted Hume's verdict.\n- [[Conceptual Analysis]] (Method): because under the linguistic turn, conceptual analysis was all metaphysics could hope for.\n- [[Metametaphysics]] (Method): because it can be seen as a new attempt at Hume's question of whether armchair metaphysics is a form of rationalism.\n**Multiple meanings:** The entry warns that the everyday sense (the Rationalist Association's 'reason and evidence') is not the philosophical sense.\n**Further reading (book):** None listed. Cited in the entry: Hume (1748/51), the *Enquiry*.\n**Beyond the book:** —\n**My notes:**\n", "00 Tools and background/Reductionism.md": "---\ngroup: Tools and background\nrole: position\nsource: Beebee et al. 2011, entry \"Reductionism\"\npages: pp. 215–216 (entry starts p. 215)\nstatus: unread\n---\n# Reductionism\n**Page(s):** pp. 215–216 (entry starts p. 215)\n**Book's definition:** p. 215, paragraph 1. Copy the sentence beginning \"Broadly speaking, a reductionist (or reductive) account…\".\n**In one line:** A reductionist account of Ks says (i) Ks exist, but (ii) their existence can be fully explained by a description of reality that never mentions Ks.\n**Role in [[00 – Tools and background]]:** A general strategy that runs through almost every group: a middle way between denying Ks and treating them as fundamental.\n**Explanation:** The word is used in different senses. In philosophy of mind, 'reductionist' physicalism (each mental type is a physical type) is contrasted with 'non-reductive' views that only claim the mental *supervenes* on the physical. In the metaphysics sense used here, both count as reductionist. Examples are bundle theories of the person, regularity and counterfactual theories of causation, and the Ramsey–Lewis view of laws. Reductionism usually goes with conceptual analysis. Some, such as Merricks, say there's no coherent middle way: Ks either exist as extra items or don't exist. That attitude may come from the Quinean view that metaphysics just answers existence questions. Schaffer (2009) proposes a 'neo-Aristotelian' alternative: grounded entities are nothing over and above fundamental ones, and they add no cost to a theory.\n**Example:** Tables and chairs. Merricks allows two options (they exist, or they don't), and he sides with 'don't'. Schaffer allows three: strong realism (fundamental), mild realism (grounded in arranged atoms), or anti-realism.\n**Connections:**\n- relates to [[Supervenience]]: because some hope supervenience can capture the 'nothing over and above' relation that reductionism needs.\n**Bridges to other groups:**\n- [[Bundle Theory of the Self or Person]] (Personal identity): because it is a reductionist account of persons.\n- [[Regularity Theory of Causation]], [[Counterfactual Theory of Causation]] and [[Ramsey–Lewis View of Laws]] (Causation and laws): because each is a reductionist theory.\n- [[Conceptual Analysis]] (Method): because an analysis of K that doesn't mention Ks supports reductionism's second condition.\n- [[Realism and Anti-Realism]] (Realism and anti-realism): because reductionism is a middle way between anti-realism and strong realism.\n- [[Metametaphysics]] (Method): because the Quinean and neo-Aristotelian approaches disagree about whether reduction makes sense.\n- [[Ontological Commitment]] (Ontology): because on Schaffer's view we are committed to grounded entities, but they come at no ontological cost.\n**Multiple meanings:** Yes. The metaphysics sense (used here) counts non-reductive physicalism as reductionist; the philosophy-of-mind sense does not.\n**Further reading (book):** Schaffer, J. (2009) 'On what grounds what', in D. J. Chalmers, D. Manley and R. Wasserman (eds), *Metametaphysics: New Essays on the Foundations of Ontology*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "00 Tools and background/Supervenience.md": "---\ngroup: Tools and background\nrole: tool\nsource: Beebee et al. 2011, entry \"Supervenience\"\npages: pp. 239–241 (entry starts p. 239)\nstatus: unread\n---\n# Supervenience\n**Page(s):** pp. 239–241 (entry starts p. 239)\n**Book's definition:** p. 239. Copy the first two sentences, the one defining it as a relation of necessary co-variation and the 'basic idea' sentence.\n**In one line:** A-properties supervene on B-properties when no two things can differ in their A-properties without also differing in their B-properties.\n**Role in [[00 – Tools and background]]:** A precise tool for saying that one kind of fact is fixed by another, often used to try to express 'nothing over and above'.\n**Explanation:** If the mental supervenes on the physical, then when Jack thinks about dinner and Joe multiplies 6 by 23, there must be some physical difference between them. Supervenience claims vary in two ways. First, the 'can' may express *metaphysical* necessity (all possible worlds) or only *nomological* necessity (worlds with our laws of nature). Second, supervenience may be *local* (between individuals) or *global* (whole worlds that match in B-properties also match in A-properties). Kripke's metaphor: God only had to fix the physical facts to fix the mental ones. Global supervenience is needed for extrinsic properties like a coin's value. The idea came from Hare and Moore (moral and natural properties), was applied by Davidson to mind and body, and was developed most influentially by Kim. Armstrong claimed supervenience gives an 'ontological free lunch'.\n**Example:** A pound coin's value doesn't *locally* supervene on its physical make-up (a duplicate in a world without money is worthless). But it may *globally* supervene on all the physical facts.\n**Connections:**\n- is used to express [[Reductionism]]: because some hope supervenience captures 'nothing over and above'.\n- features in work by [[Kripke, Saul]] and [[Armstrong, David]]: because the entry cites Kripke's God metaphor and Armstrong's 'free lunch'.\n**Bridges to other groups:**\n- [[Possible Worlds]] and [[Necessity]] (Modality): because the strength of a supervenience claim depends on which necessity, and which worlds, it ranges over.\n- [[Intrinsic vs Extrinsic Properties]] (Kinds of properties): because global supervenience is needed for extrinsic supervenient properties.\n- [[Humean Supervenience]] (Causation and laws): because that thesis is defined using supervenience.\n- [[Theoretical Virtues]] (Method): because on Armstrong's view a theory's parsimony is judged only by its supervenience base.\n**Multiple meanings:** Yes: metaphysical vs nomological; local vs global.\n**Further reading (book):** McLaughlin, B. and Bennett, K. (2008) 'Supervenience', in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Kim, J. (ed.) (1993) *Supervenience and Mind: Selected Philosophical Essays*, Cambridge: Cambridge University Press.\n**Beyond the book:** —\n**My notes:**\n", "00 Tools and background/Synthetic Truths.md": "---\ngroup: Tools and background\nrole: pointer\nsource: Beebee et al. 2011, entry \"Synthetic Truths\"\npages: p. 244\nstatus: unread\n---\n# Synthetic Truths\n**Page(s):** p. 244\n**Pointer entry:** the book only says \"see\" → [[Analytic vs Synthetic Truths]]. Read that note.\n**Role in [[00 – Tools and background]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "00 Tools and background/Token.md": "---\ngroup: Tools and background\nrole: pointer\nsource: Beebee et al. 2011, entry \"Token\"\npages: p. 253\nstatus: unread\n---\n# Token\n**Page(s):** p. 253\n**Pointer entry:** the book only says \"see\" → [[Type and Tokens]]. Read that note.\n**Role in [[00 – Tools and background]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "00 Tools and background/Type and Tokens.md": "---\ngroup: Tools and background\nrole: concept\nsource: Beebee et al. 2011, entry \"Type and Tokens\"\npages: pp. 264–265 (entry starts p. 264)\nstatus: unread\n---\n# Type and Tokens\n**Page(s):** pp. 264–265 (entry starts p. 264)\n**Book's definition:** p. 264, paragraph 2. Copy the sentence beginning \"In general, the distinction between type and token…\".\n**In one line:** The distinction between a general category (a type) and its particular instances (its tokens).\n**Role in [[00 – Tools and background]]:** A tool for removing ambiguity in 'how many?' and 'the same' questions. It also frames the problem of universals.\n**Explanation:** How many words are in 'war is war'? Two word *types* ('war', 'is'), but three word *tokens*. A dealer who sells only Minis sells one *type* of car but perhaps five car *tokens* a week. 'Sam and Jo are wearing the same dress' is ambiguous between the same type and the very same token. In philosophy of mind, type identity theories identify kinds of mental state with kinds of physical state. Token identity theories identify only particular mental states with particular physical states. In metaphysics, the problem of universals is sometimes put as the need to explain how tokens fall under types.\n**Example:** 'War is war': 2 types, 3 tokens.\n**Connections:**\n- [[Token]]: a pointer entry that sends you here.\n**Bridges to other groups:**\n- [[Identity]] (Identity): because 'the same dress' is ambiguous between sameness of type and sameness of token.\n- [[Universals]] (Particulars and universals): because the problem of universals is sometimes framed as explaining how tokens fall under types.\n- [[Type-Level Causation]] and [[Token-Level Causation]] (Causation and laws): because the book has separate entries for general and particular causal claims, and its index sends 'token-level causation' to this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Wetzel, L. (2008) 'Types and tokens', in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Winter 2008 edn.\n**Beyond the book:** —\n**My notes:**\n", "00 – A–Z index.md": "# 00 – A–Z index\nAll 247 entries in alphabetical order, with each one's group and page.\n\n| Term | Group | Page |\n|---|---|---|\n| [[A Posteriori]] | Tools and background | p. 10 |\n| [[A Priori - A Posteriori]] | Tools and background | p. 10 |\n| [[A-Theory]] | Time | p. 12 |\n| [[Abstract vs Concrete]] | Ontology and existence | p. 3 |\n| [[Agent Causation]] | Free will | p. 3 |\n| [[Aleph]] | Sets, classes and infinity | p. 5 |\n| [[Analysis]] | Metametaphysics and method | p. 5 |\n| [[Analytic vs Synthetic Truths]] | Tools and background | p. 5 |\n| [[Ancestral Relation]] | Sets, classes and infinity | p. 6 |\n| [[Animalism]] | Personal identity | p. 7 |\n| [[Anti-Criterialism]] | Personal identity | p. 10 |\n| [[Anti-Realism]] | Realism and anti-realism | p. 10 |\n| [[Aristotle]] | Philosophers | p. 11 |\n| [[Armstrong, David]] | Philosophers | p. 11 |\n| [[Austere Nominalism]] | Particulars and universals | p. 12 |\n| [[B-Theory]] | Time | p. 21 |\n| [[Backwards Causation]] | Time | p. 14 |\n| [[Being]] | Ontology and existence | p. 15 |\n| [[Berkeley, George]] | Philosophers | p. 16 |\n| [[Bilking Argument]] | Time | p. 16 |\n| [[Bodily Continuity]] | Personal identity | p. 17 |\n| [[Bradley's Regress]] | Particulars and universals | p. 18 |\n| [[Brains in a Vat]] | Realism and anti-realism | p. 20 |\n| [[Bundle Theory of the Self or Person]] | Personal identity | p. 21 |\n| [[Bundle Theory vs Substance-Attribute Theory]] | Particulars and universals | p. 23 |\n| [[Canberra Plan]] | Metametaphysics and method | p. 25 |\n| [[Carving Nature at its Joints]] | Metametaphysics and method | p. 27 |\n| [[Categorical and Dispo  [[Unrestricted Mereological Composition]] | Mereology and composition | p. 268 |\n| [[Zeno]] | Sets, classes and infinity | p. 268 |\n\nBack to [[00 – START HERE]]\n", "00 – START HERE.md": "# 00 – START HERE\nA map of *Metaphysics: The Key Concepts* (Beebee, Effingham & Goff, Routledge 2011): all **247 entries**, sorted into **16 groups**, with a hub note for each group.\n\n## How to use this vault\n1. Open a **group hub** (below). It gives the group's central question, the main positions, the key test cases, the bridges to other groups, and a reading path with page numbers.\n2. Follow the links into the **term notes**. Each has the same fields: page(s), where the book's definition is, a one-line summary, the term's role in its group, an explanation, an example, connections (\"because…\"), bridges to other groups, any multiple meanings, and the book's Further reading.\n3. Use **graph view** to see how terms connect within and across groups.\n4. Change `status: unread` in a note's frontmatter as you work through it (for example to `read` or `understood`).\n\n## The 16 groups\n**The book's six topics**\n- [[00 – Free will]]\n- [[00 – Personal identity]]\n- [[00 – Particulars and universals]]\n- [[00 – Realism and anti-realism]]\n- [[00 – Time]]\n- [[00 – Causation and laws]]\n\n**Study groupings (not the book's own)**\n- [[00 – Modality]]\n- [[00 – Ontology and existence]]\n- [[00 – Mereology and composition]]\n- [[00 – Truth]]\n- [[00 – Metametaphysics and method]]\n- [[00 – Kinds of properties]]\n- [[00 – Identity]]\n- [[00 – Sets, classes and infinity]]\n\n**Other**\n- [[00 – Tools and background]] (start here: these terms are used everywhere)\n- [[00 – Philosophers]]\n\nAll terms, A–Z: [[00 – A–Z index]]\n\n## Conventions\n- **Pages** are the print-edition pages recorded in the ebook (ISBN 9780203835258). \"Entry starts p. X\" gives where the entry begins, and a span such as \"pp. 239–241\" comes from the book's index. **\"About p. X\"** means the page was estimated from the neighbouring entries (this applies to a few short pointer entries).\n- **Book's definition:** the notes don't reproduce the book's wording. They tell you the page and sentence where the definition is, so you can copy it in from your own copy.\n- **Explanations, examples and \"because\" reasons** come only from the book's entries. Where a note draws on a *different* entry, it names that entry.\n- **Beyond the book** is left empty for you to fill in as your research goes past the 2011 book (start with the *Stanford Encyclopedia of Philosophy*).\n- **Pointer entries** (the book just says \"see X\") have short notes that link to X.\n- **Filenames:** a \"/\" in an entry title becomes \" - \" (for example *A Priori - A Posteriori* and *Quasi-Memory - Quasi-States*).\n\n## Grouping notes\nThe book's own cross-references suggest three possible moves, if you prefer:\n- *Natural Philosophy* (Tools) points to Experimental Philosophy (Method).\n- *Ship of Theseus* (Mereology) points to Identity Over Time (Identity).\n- *Psychologism* (Realism and anti-realism) points to Concept (Tools).\n", "01 Free will/00 – Free will.md": "---\ngroup: Free will\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Free will\n**Central question:** Can we act freely, and be morally responsible, if determinism is true, or if it is false?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| [[Compatibilism]] | Free will is compatible with determinism | Hume, Frankfurt, Dennett, Fischer (semicompatibilism) | The [[Consequence Argument]] |\n| [[Incompatibilism]] | Free will is incompatible with determinism | van Inwagen | [[Frankfurt's Nefarious Neurosurgeon]] against PAP |\n| [[Libertarianism]] | We sometimes act freely, so indeterminism is true | Kane (on luck) | [[Problem of Luck]]; no evidence decisions are undetermined |\n| [[Hard Determinism]] | Determinism is true, so no one acts freely | — | Strawson: we can't give up the reactive attitudes |\n| [[Soft Determinism]] | Compatibilism, and determinism is true | — | Indeterminism may well be true |\n| [[Illusion of Free Will]] | Free will seems real but isn't | Pereboom ('hard incompatibilism'); Libet (neuroscience) | Libet's inference is widely criticised |\n| [[Agent Causation]] | Agents themselves cause their free acts | Markosian (compatibilist version) | It seems to rule out reasons causing actions |\n\n## Key arguments and test cases\n- Jane's cup of tea: [[Consequence Argument]] (p. 50)\n- Black, Jones and the device: [[Frankfurt's Nefarious Neurosurgeon]] (p. 79)\n- Drunk Sam and indirect responsibility: [[Principle of Alternate Possibilities (PAP)]] (p. 182)\n- The indeterministic coin toss: [[Problem of Luck]] (p. 191)\n- Libet's readiness potentials: [[Neuroscience and Free Will]] (p. 143)\n- Hume's prisoner in chains; Frankfurt's second-order desires: [[Compatibilism]] (p. 40)\n- Strawson on reactive attitudes: [[Hard Determinism]] (p. 90), [[Moral Responsibility]] (p. 132)\n\n## Bridges to other groups\n- **Causation and laws:** [[Law of Nature]], [[Chance]], [[Causal Relata]] and [[Humeanism]], because determinism is defined by laws, indeterminism involves chance, agent causation rejects event causation, and Humean laws may ease incompatibilism.\n- **Modality:** [[Possible Worlds]], because the problem of luck uses worlds identical to ours up to a decision.\n- **Method:** [[Thought Experiment]] and [[Experimental Philosophy]], because Frankfurt cases are thought experiments and experimental philosophy tests ordinary intuitions about responsibility.\n- **Truth:** [[Proposition]], because van Inwagen analyses ability as the power to render a proposition false.\n- **Philosophers:** [[Hume, David]], because of the classic compatibilist account.\n\n## Reading path (pages in the book)\n1. **Overview:** [[Free Will]] (p. 81), [[Determinism]] (p. 56), [[Indeterminism]] (p. 102)\n2. **The core debate:** [[Incompatibilism]] (p. 100), [[Consequence Argument]] (p. 50), [[Compatibilism]] (p. 40), [[Principle of Alternate Possibilities (PAP)]] (p. 182), [[Frankfurt's Nefarious Neurosurgeon]] (p. 79)\n3. **Positions:** [[Libertarianism]] (p. 116), [[Hard Determinism]] (p. 90), [[Soft Determinism]] (p. 234), [[Agent Causation]] (p. 3)\n4. **Further problems:** [[Problem of Luck]] (p. 191), [[Illusion of Free Will]] (p. 99), [[Neuroscience and Free Will]] (p. 143), [[Moral Responsibility]] (p. 132), [[Guidance Control vs Regulative Control]] (p. 88)\n- Pointer entries: [[Frankfurt-Style Cases]] (p. 81), [[Reactive Attitudes]] (p. 209), [[Regulative Control]] (p. 219), [[Source Incompatibilism]] (p. 235)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "01 Free will/Agent Causation.md": "---\ngroup: Free will\nrole: position\nsource: Beebee et al. 2011, entry \"Agent Causation\"\npages: pp. 3–5 (entry starts p. 3)\nstatus: unread\n---\n# Agent Causation\n**Page(s):** pp. 3–5 (entry starts p. 3)\n**Book's definition:** p. 3. Copy the second sentence of paragraph 1 (the relation between an agent and her free actions is 'agent causation').\n**In one line:** The view that agents themselves, rather than events like their beliefs and desires, cause their free actions, as 'uncaused causes'.\n**Role in [[00 – Free will]]:** A demanding condition on free will that some incompatibilists (and a few compatibilists) accept.\n**Explanation:** Some philosophers hold that only by being an 'uncaused cause' of one's actions can one be ultimately responsible for them. Most contemporary philosophers take causes to be events (or facts, or states of affairs): Jane's *being hungry* caused her decision to order pizza. On the agent-causal view, Jane herself, conceived as a substance, causes the decision. Agent causation is often thought to require indeterminism, since neither the agent's causing nor the decision may be fixed by the past and the laws, though some agent-causalists (Markosian 1999) are compatibilists. A main criticism: acting rationally means acting for reasons, and the standard story is that reasons *cause* actions, an explanation the agent-causal view seems to rule out.\n**Example:** Jane herself, not her hunger, causing her decision to order pizza.\n**Connections:**\n- is proposed as a condition of [[Free Will]] and [[Moral Responsibility]]: because only an uncaused cause is said to be ultimately responsible.\n- usually requires [[Indeterminism]] rather than [[Determinism]]: because the agent's causing must not be fixed by the past and laws.\n- is accepted by some [[Compatibilism]]: because some agent-causalists (Markosian) think it is compatible with determinism.\n- is required by some [[Libertarianism]]: because source libertarians sometimes require agent causation.\n**Bridges to other groups:**\n- [[Causal Relata]] and [[Event]] (Causation and laws): because agent causation denies that all causes are events or facts.\n- [[Substance]] (Particulars and universals): because the agent-cause is conceived as a substance.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Clarke (1993, 2008, §§ 3–4)\n  Full references (from the book's bibliography):\n  - Clarke, R. (1993) ‘Toward a credible agent-causal account of free will’, *Noûs*, 27: 191–203.\n  - Clarke, R. (2008) ‘Incompatibilist (nondeterministic) theories of free will’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/incompatibilism-theories.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Compatibilism.md": "---\ngroup: Free will\nrole: position\nsource: Beebee et al. 2011, entry \"Compatibilism\"\npages: pp. 40–44 (entry starts p. 40)\nstatus: unread\n---\n# Compatibilism\n**Page(s):** pp. 40–44 (entry starts p. 40)\n**Book's definition:** p. 40, the opening sentence of the entry.\n**In one line:** The view that free will, and so moral responsibility, is compatible with determinism.\n**Role in [[00 – Free will]]:** One of the two sides of the traditional free will debate.\n**Explanation:** Even if everything we do were fixed by the laws and the past, that would be no bar to acting freely. The powerful objection is the Consequence Argument: acting freely requires the ability to do otherwise (PAP), and determinism rules that ability out. Answering it still isn't a full theory of what freedom requires. Hume's account is permissive: liberty is the power of acting or not according to the will, a 'hypothetical liberty' that everyone has who is not a prisoner in chains. This is a 'conditional analysis' of being able to do otherwise. Frankfurt (1971) distinguishes first-order desires (for a cigarette) from second-order desires (to *want* to go to the gym), and so freedom of action (which a dog can have) from freedom of the will. Dennett (1984) argues that the ability to do otherwise isn't required, and that determinism doesn't rob us of control. Fischer's 'semicompatibilism' ties responsibility to guidance control, staying neutral on regulative control.\n**Example:** Hume's prisoner in chains: the only one who lacks 'hypothetical liberty'.\n**Connections:**\n- opposes [[Incompatibilism]]: because it holds free will and determinism are compatible.\n- must answer the [[Consequence Argument]] and [[Principle of Alternate Possibilities (PAP)]]: because that argument is its main objection.\n- is supported by [[Frankfurt's Nefarious Neurosurgeon]]: because the case suggests responsibility without the ability to do otherwise.\n- uses [[Guidance Control vs Regulative Control]]: because Fischer's semicompatibilism rests on the distinction.\n- includes [[Soft Determinism]]: because soft determinism is compatibilism plus belief in determinism.\n**Bridges to other groups:**\n- [[Hume, David]] (Philosophers): because his conditional analysis is the classic permissive compatibilism.\n- [[Humeanism]] (Causation and laws): because some argue a Humean view of laws helps avoid incompatibilism (Causation and Laws entry, Beebee and Mele 2001).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** McKenna (2009); Dennett (1984)\n  Full references (from the book's bibliography):\n  - McKenna, M. (2009) ‘Compatibilism’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Winter 2009 edn. Online. Available at: http://plato.stanford.edu/archives/win2009/entries/compatibilism.\n  - Dennett, D. (1984) *Elbow Room: The Varieties of Free Will Worth Wanting*, Cambridge, MA: Bradford Books.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Consequence Argument.md": "---\ngroup: Free will\nrole: argument\nsource: Beebee et al. 2011, entry \"Consequence Argument\"\npages: pp. 50–52 (entry starts p. 50)\nstatus: unread\n---\n# Consequence Argument\n**Page(s):** pp. 50–52 (entry starts p. 50)\n**Book's definition:** p. 50. Copy the second sentence of paragraph 1, which explains the name: actions as logical consequences of the past and the laws.\n**In one line:** Van Inwagen's argument for incompatibilism: if determinism is true, our acts are logical consequences of the past and the laws, so we can never do otherwise.\n**Role in [[00 – Free will]]:** The main argument for incompatibilism.\n**Explanation:** Peter van Inwagen set it out in 1975, though the incompatibilist view is much older. It assumes that acting freely requires the ability to do otherwise, understood as the ability to *render a proposition false*. Jane made tea at 8 a.m. on 1 January 2009; it seems she could have chosen coffee and made 'Jane makes tea at t1' false. Let P0 describe the whole Universe at an earlier time and L all the laws. Determinism says P0 and L together entail a description of every other time, so they entail that Jane makes tea at t1. The argument concludes that, if determinism is true, Jane could not have rendered that proposition false at any time. Whether the argument is sound is hugely debated (see Incompatibilism and PAP).\n**Example:** Jane's cup of tea at 8 a.m. on 1 January 2009.\n**Connections:**\n- argues for [[Incompatibilism]]: because its conclusion is that free will is incompatible with determinism.\n- assumes the [[Principle of Alternate Possibilities (PAP)]]: because it treats the ability to do otherwise as required for acting freely.\n- uses [[Determinism]]: because the argument turns on P0 and L entailing every later state.\n- is answered by [[Compatibilism]] and [[Frankfurt's Nefarious Neurosurgeon]]: because they attack the PAP premise or the claim that determinism rules out ability.\n**Bridges to other groups:**\n- [[Law of Nature]] (Causation and laws): because L, the laws, is one of the argument's two fixed inputs.\n- [[Proposition]] (Truth): because the ability to do otherwise is analysed as the ability to render a proposition false.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** van Inwagen (1975); Vihvelin (2008); Fischer (1995, Chapters 1–4)\n  Full references (from the book's bibliography):\n  - van Inwagen, P. (1975) ‘The incompatibility of free will and determinism’, *Philosophical Studies*, 27: 185–99; reprinted in Watson 1982 and Beebee and Dodd 2006.\n  - Vihvelin, K. (2008) ‘Arguments for incompatibilism’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/incompatibilism-arguments.\n  - Fischer, J. M. (1995) *The Metaphysics of Free Will*, Oxford: Blackwell.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Determinism.md": "---\ngroup: Free will\nrole: concept\nsource: Beebee et al. 2011, entry \"Determinism\"\npages: pp. 56–57 (entry starts p. 56)\nstatus: unread\n---\n# Determinism\n**Page(s):** pp. 56–57 (entry starts p. 56)\n**Book's definition:** p. 56. Copy the sentence in paragraph 3 beginning \"Rather less roughly, determinism is the thesis that…\".\n**In one line:** The thesis that the exact state of the Universe at any one time, together with the laws of nature, fixes its exact state at every other time.\n**Role in [[00 – Free will]]:** The thesis whose compatibility with free will is the traditional problem.\n**Explanation:** If you knew everything about a pool shot (the cue ball's speed and line, a normal table, nobody interfering), you could predict that the red goes in. Determinism says, roughly, that the whole Universe is like that. More precisely, a complete description of the Universe at any time, together with a statement of all the laws, logically entails a complete description of it at any other time. Whether determinism is true can't be settled by philosophy; our best science does not settle it. It matters for free will: incompatibilists hold that if it is true we never act freely, and the Consequence Argument is one argument for that. It also matters for causation, though most philosophers now agree that indeterministic causation is possible.\n**Example:** The pool shot whose outcome is predictable with certainty.\n**Connections:**\n- is denied by [[Indeterminism]]: because indeterminism is its denial.\n- is held incompatible with [[Free Will]] by [[Incompatibilism]]: because, for example, of the [[Consequence Argument]].\n- is accepted by [[Hard Determinism]] and [[Soft Determinism]]: because both claim determinism is actually true.\n**Bridges to other groups:**\n- [[Law of Nature]] (Causation and laws): because determinism is defined through the laws of nature.\n- [[Probabilistic Theories of Causation]] (Causation and laws): because most now accept indeterministic causation.\n- [[Causation and Laws]] (Causation and laws): because the entry says determinism bears on that topic.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Hoefer (2008); Salmon (1998, Chapter 2); Earman (1986, Chapters 1 and 2)\n  Full references (from the book's bibliography):\n  - Hoefer, C. (2008) ‘Causal determinism’, in E. N. Zalta (ed.), *Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/determinism-causal.\n  - Salmon, W. C. (1998) *Causality and Explanation*, New York: Oxford University Press.\n  - Earman, J. (1986) *A Primer on Determinism*, Dordrecht: Reidel.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Frankfurt's Nefarious Neurosurgeon.md": "---\ngroup: Free will\nrole: case\nsource: Beebee et al. 2011, entry \"Frankfurt's Nefarious Neurosurgeon\"\npages: pp. 79–81 (entry starts p. 79)\nstatus: unread\n---\n# Frankfurt's Nefarious Neurosurgeon\n**Page(s):** pp. 79–81 (entry starts p. 79)\n**Book's definition:** p. 79. There's no definition. Copy the description of the case in paragraph 2, from the sentence introducing Black, the nefarious neurosurgeon.\n**In one line:** Frankfurt's (1969) thought experiment, meant to show that someone can be morally responsible even though they couldn't have done otherwise.\n**Role in [[00 – Free will]]:** The main case against PAP, and so a key support for compatibilism.\n**Explanation:** Black wants Jones to kill Smith. He implants a device that can make Jones decide to do it, but he will use it only if he sees (say, from a tell-tale twitch) that Jones is about to decide *not* to. In fact Jones decides to kill Smith on his own, so the device is never used. Jones seems morally responsible, yet he couldn't have done otherwise. That suggests PAP is false, which is good news for compatibilism, since PAP is a premise of the Consequence Argument. The standard incompatibilist reply is a dilemma. If Jones's decision process is deterministic, he wouldn't be responsible even without Black, so the case begs the question. If it is indeterministic, Black can't predict with certainty what Jones will decide.\n**Example:** Black, the device, and Jones's tell-tale twitch.\n**Connections:**\n- is aimed at the [[Principle of Alternate Possibilities (PAP)]]: because it claims responsibility without alternatives.\n- supports [[Compatibilism]] against the [[Consequence Argument]]: because it undermines that argument's PAP premise.\n- is resisted by [[Incompatibilism]]: because of the determinism/indeterminism dilemma.\n- [[Frankfurt-Style Cases]]: a pointer entry for cases of this kind.\n- is used for [[Guidance Control vs Regulative Control]]: because Fischer thinks the case shows these two kinds of control are distinct (Compatibilism entry).\n**Bridges to other groups:**\n- [[Thought Experiment]] (Method): because it is a famous thought experiment.\n- [[Counterfactual Conditional]] (Tools): because Black is a 'counterfactual intervener', acting only in the case where Jones would decide otherwise.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Frankfurt (1969); Fischer (1995, Chapter 7); Fischer (1999, §§ II and III)\n  Full references (from the book's bibliography):\n  - Frankfurt, H. (1969). ‘Alternate possibilities and moral responsibility’, *The Journal of Philosophy*, 66: 829–39.\n  - Fischer, J. M. (1995) *The Metaphysics of Free Will*, Oxford: Blackwell.\n  - Fischer, J. M. (1999) ‘Recent work on moral responsibility’, *Ethics*, 110: 93–139.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Frankfurt-Style Cases.md": "---\ngroup: Free will\nrole: pointer\nsource: Beebee et al. 2011, entry \"Frankfurt-Style Cases\"\npages: p. 81\nstatus: unread\n---\n# Frankfurt-Style Cases\n**Page(s):** p. 81\n**Pointer entry:** the book only says \"see\" → [[Frankfurt's Nefarious Neurosurgeon]]. Read that note.\n**Role in [[00 – Free will]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "01 Free will/Free Will.md": "---\ngroup: Free will\nrole: concept\nsource: Beebee et al. 2011, entry \"Free Will\"\npages: entry starts p. 81\nstatus: unread\n---\n# Free Will\n**Page(s):** entry starts p. 81\n**Book's definition
