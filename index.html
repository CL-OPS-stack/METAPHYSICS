sm]] and [[Possible Worlds]] (Modality): because Lewis solves the co-extension problem with non-actual possible things.\n- [[Reductionism]] (Tools): because identifying properties with classes is a reductive analysis.\n- [[Lewis, David]] (Philosophers): because his version is the entry's main defence.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Armstrong (1989, Chapter 2); Loux (2006, Chapter 2)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (1989) *Universals: An Opinionated Introduction*, Boulder, CO: Westview Press.\n  - Loux, M. (2006) *Metaphysics: A Contemporary Introduction*, 3rd edn, London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Exemplification.md": "---\ngroup: Particulars and universals\nrole: pointer\nsource: Beebee et al. 2011, entry \"Exemplification\"\npages: about p. 68 (pointer entry; page estimated from neighbouring entries)\nstatus: unread\n---\n# Exemplification\n**Page(s):** about p. 68 (pointer entry; page estimated from neighbouring entries)\n**Pointer entry:** the book only says \"see\" → [[Instantiation]]. Read that note.\n**Role in [[00 – Particulars and universals]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "03 Particulars and universals/Form and Matter.md": "---\ngroup: Particulars and universals\nrole: concept\nsource: Beebee et al. 2011, entry \"Form and Matter\"\npages: pp. 78–79 (entry starts p. 78)\nstatus: unread\n---\n# Form and Matter\n**Page(s):** pp. 78–79 (entry starts p. 78)\n**Book's definition:** p. 78. Copy the third sentence of the entry, which defines 'matter' and 'form'.\n**In one line:** Aristotle's distinction between what an object is made of (its matter) and the organising principle that makes it the kind of thing it is (its form).\n**Role in [[00 – Particulars and universals]]:** Background to the debate about what makes an object what it is. It also underlies Plato's Theory of Forms.\n**Explanation:** The distinction is central to Aristotle's metaphysics. What exactly Aristotle meant is a matter of scholarly debate, but the basic idea is intuitive. A toaster's matter is the metal it's made of; its form is the arrangement of that metal to toast bread, which makes it a toaster rather than a can opener. The entry points to Platonism, where Plato's Theory of Forms is explained using the same distinction.\n**Example:** A toaster: the metal is its matter; being arranged to toast bread is its form.\n**Connections:**\n- is used by [[Platonism]]: because Plato's Theory of Forms is introduced through the matter/form distinction (Platonism entry).\n**Bridges to other groups:**\n- [[Aristotle]] (Philosophers): because the distinction is central to his metaphysics.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Immanent Realism About Universals.md": "---\ngroup: Particulars and universals\nrole: position\nsource: Beebee et al. 2011, entry \"Immanent Realism About Universals\"\npages: entry starts p. 100\nstatus: unread\n---\n# Immanent Realism About Universals\n**Page(s):** entry starts p. 100\n**Book's definition:** p. 100, the opening sentence of the entry.\n**In one line:** The view that a universal is wholly present in each object that instantiates it.\n**Role in [[00 – Particulars and universals]]:** The Aristotelian form of realism about universals, the main rival to platonism.\n**Explanation:** Immanent realism opposes the platonist view that universals exist outside space and time. One consequence: there are no uninstantiated universals. If there had never been any spherical objects, the universal *being spherical* would not exist. The view goes back to Aristotle, and its best-known contemporary defender is David Armstrong. The Universals entry compares it to legendary saints wholly present in more than one place: redness is wholly present in a phone box in England and in a sunset in China.\n**Example:** If nothing were ever spherical, there would be no universal *being spherical*.\n**Connections:**\n- is a version of realism about [[Universals]]: because it takes universals to exist, wholly present in their instances.\n- opposes [[Platonism]]: because platonists put universals outside space and time.\n- faces an objection from [[Nominalism]]: because if red is wholly present in two places, it seems to be a metre away from itself (Nominalism entry).\n**Bridges to other groups:**\n- [[Abstract vs Concrete]] (Ontology): because immanent universals count as concrete.\n- [[Aristotle]] and [[Armstrong, David]] (Philosophers): because the view originates with Aristotle and Armstrong is its leading modern defender.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Instantiation.md": "---\ngroup: Particulars and universals\nrole: concept\nsource: Beebee et al. 2011, entry \"Instantiation\"\npages: p. 108\nstatus: unread\n---\n# Instantiation\n**Page(s):** p. 108\n**Book's definition:** p. 108, the opening sentence of the entry.\n**In one line:** The relationship between an object and its properties. 'Exemplification' is another name for the same thing.\n**Role in [[00 – Particulars and universals]]:** The relation at the heart of realism about universals, and the target of Bradley's regress.\n**Explanation:** Some realists about universals who are also substance-attribute theorists treat instantiation as a non-reductive relation, a view thought to face Bradley's regress. To avoid this, others deny that instantiation is really a relation at all: Armstrong calls it a 'non-relational tie'. Other accounts reduce it. If redness is just the class of red things, then for an object to instantiate a property is just for it to be a member of that class.\n**Example:** On class nominalism, the ball instantiates redness just by being a member of the class of red things.\n**Connections:**\n- [[Exemplification]] and [[Participation]]: pointer entries that send you here.\n- is the relation behind [[Bradley's Regress]]: because the non-reductive view of instantiation is what the regress targets.\n- is reduced by [[Class Nominalism]]: because instantiating becomes class membership.\n- relates objects to [[Universals]]: because realists say objects instantiate universals.\n- is a problem for substance-attribute theory in [[Bundle Theory vs Substance-Attribute Theory]]: because that view must tie substrata to properties.\n**Bridges to other groups:**\n- [[Reductionism]] (Tools): because accounts divide into non-reductive and reductive views of the relation.\n- [[States of Affairs]] (Truth): because the entry sends you there for Armstrong's 'non-relational tie'.\n- [[Armstrong, David]] (Philosophers): because the 'non-relational tie' view is his.\n**Multiple meanings:** Yes: 'instantiation' and 'exemplification' are equivalent names. Participation (Plato's term) also points here.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Nominalism.md": "---\ngroup: Particulars and universals\nrole: position\nsource: Beebee et al. 2011, entry \"Nominalism\"\npages: pp. 145–147 (entry starts p. 145)\nstatus: unread\n---\n# Nominalism\n**Page(s):** pp. 145–147 (entry starts p. 145)\n**Book's definition:** p. 145. Copy the first sentence (it says the word has two uses), then the sentence beginning \"Sometimes – and perhaps more commonly…\", which gives the 'no universals' sense used in the rest of the entry.\n**In one line:** Either the view that there are no abstract objects, or (more commonly, and in this entry) the view that there are no universals.\n**Role in [[00 – Particulars and universals]]:** The family of views that deny universals: austere, class, resemblance and trope nominalism.\n**Explanation:** Armstrong is a nominalist in the first sense but not the second; the later Quine is the reverse. Nominalists argue against universals in three main ways. They question intelligibility: if red is wholly present in my lamp and my curtains, red is a metre away from itself. They point out there are no clear, non-circular criteria of identity for universals (Quine's 'no entity without identity'). And they invoke Bradley's regress. Most nominalists are moved by parsimony, Quine's 'taste for desert landscapes': realists believe in two categories, universals and particulars, while nominalists believe only in particulars.\n**Example:** The red lamp and the red curtains: is one thing, redness, wholly in both?\n**Connections:**\n- opposes [[Universals]]: because, in its main sense, it denies there are any.\n- has varieties [[Austere Nominalism]], [[Class Nominalism]], [[Resemblance Nominalism]] and [[Trope Theory]]: because each is a different nominalist account of resemblance.\n- uses [[Bradley's Regress]]: because the regress is one argument against universals.\n- admits only [[Particulars]]: because nominalists believe in only one category of entity.\n**Bridges to other groups:**\n- [[Theoretical Virtues]] (Method): because the main motive for nominalism is parsimony.\n- [[Identity]] (Identity): because one argument is that we lack criteria for when universals are numerically identical.\n- [[Fictionalism]] (Ontology): because Field calls his fictionalism about mathematics 'nominalist' in the first sense.\n- [[Quine, W. V.]] and [[Armstrong, David]] (Philosophers): because they illustrate the two senses of the word.\n**Multiple meanings:** Yes: (1) no abstract objects (denial of platonism); (2) no universals (the usual sense).\n**Further reading (book):** Armstrong (1989); Loux (2006, Chapter 2); Oliver (1996)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (1989) *Universals: An Opinionated Introduction*, Boulder, CO: Westview Press.\n  - Loux, M. (2006) *Metaphysics: A Contemporary Introduction*, 3rd edn, London: Routledge.\n  - Oliver, A. (1996) ‘The metaphysics of properties’, *Mind*, 105: 1–80.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Ostrich Nominalism.md": "---\ngroup: Particulars and universals\nrole: concept\nsource: Beebee et al. 2011, entry \"Ostrich Nominalism\"\npages: about p. 153 (estimated: it falls between Ontology, p. 152, and Overdetermination, p. 154)\nstatus: unread\n---\n# Ostrich Nominalism\n**Page(s):** about p. 153 (estimated: it falls between Ontology, p. 152, and Overdetermination, p. 154)\n**Book's definition:** p. 153. The whole entry is one sentence: copy it.\n**In one line:** A pejorative name for austere nominalism.\n**Role in [[00 – Particulars and universals]]:** A critic's label, not a separate view.\n**Explanation:** The Austere Nominalism entry explains the name: Armstrong coined it for the nominalist who, instead of giving an account of resemblance, 'sticks her head in the sand'.\n**Example:** Armstrong's jibe: refusing 'to answer a compulsory question on the examination paper' (Austere Nominalism entry).\n**Connections:**\n- is another name for [[Austere Nominalism]]: because the entry defines it that way.\n**Bridges to other groups:**\n- [[Armstrong, David]] (Philosophers): because he coined the term (Austere Nominalism entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Participation.md": "---\ngroup: Particulars and universals\nrole: pointer\nsource: Beebee et al. 2011, entry \"Participation\"\npages: about p. 156 (pointer entry; page estimated from neighbouring entries)\nstatus: unread\n---\n# Participation\n**Page(s):** about p. 156 (pointer entry; page estimated from neighbouring entries)\n**Pointer entry:** the book only says \"see\" → [[Instantiation]]. Read that note.\n**Role in [[00 – Particulars and universals]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "03 Particulars and universals/Particulars and Universals.md": "---\ngroup: Particulars and universals\nrole: concept\nsource: Beebee et al. 2011, entry \"Particulars and Universals\"\npages: pp. 157–158 (entry starts p. 157)\nstatus: unread\n---\n# Particulars and Universals\n**Page(s):** pp. 157–158 (entry starts p. 157)\n**Book's definition:** p. 157. There's no single definition: this is the book's overview entry for the topic. Copy its first two sentences, which pose its two questions.\n**In one line:** The book's overview of two questions: what is it, in general, to be an object, and what are properties?\n**Role in [[00 – Particulars and universals]]:** The book's own topic entry for this group, mapping all the main positions.\n**Explanation:** Bundle theorists think an object, such as your chair, is wholly made up of its properties standing in a relation like compresence. Substance-attribute theorists add a substratum that bears the properties. Realists about universals take properties to be repeatable constituents (your chair's hardness may be the very same thing as mine). They divide into Aristotelians, for whom a universal is wholly located in each object, and Platonists, for whom universals exist outside space and time. Nominalists deny universals: trope theorists make properties unrepeatable particulars, class nominalists identify hardness with the class of hard things, and austere nominalists deny there are properties at all.\n**Example:** The hardness of your chair and the hardness of mine: one thing or two?\n**Connections:**\n- maps [[Bundle Theory vs Substance-Attribute Theory]]: because that is its first question.\n- maps [[Universals]], [[Platonism]] and [[Immanent Realism About Universals]]: because those are the realist options.\n- maps [[Nominalism]], [[Trope Theory]], [[Class Nominalism]] and [[Austere Nominalism]]: because those are the nominalist options.\n**Bridges to other groups:**\n- [[Ontology]] (Ontology): because it starts from the question of what objects there are.\n- [[Aristotle]] (Philosophers): because one realist camp follows him.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Particulars.md": "---\ngroup: Particulars and universals\nrole: concept\nsource: Beebee et al. 2011, entry \"Particulars\"\npages: p. 157\nstatus: unread\n---\n# Particulars\n**Page(s):** p. 157\n**Book's definition:** p. 157, the opening sentence of the entry.\n**In one line:** A concrete entity that occupies a single place at any time it exists (setting time travel aside): tables, trees, persons, stars.\n**Role in [[00 – Particulars and universals]]:** The category that everyone accepts; the dispute is whether there are universals as well.\n**Explanation:** Particulars are contrasted with universals, which (if they exist, which is far from agreed) can be instantiated by many objects in different places at the same time. Trope theorists take properties themselves to be particulars: Socrates's wisdom is a different trope from Plato's.\n**Example:** Tables, chairs, persons and planets.\n**Connections:**\n- contrast with [[Universals]]: because universals can be in many places at once and particulars can't.\n- include properties on [[Trope Theory]]: because tropes are particular properties.\n- are the only category for [[Nominalism]]: because nominalists believe in particulars alone (Nominalism entry).\n**Bridges to other groups:**\n- [[Abstract vs Concrete]] (Ontology): because particulars are defined as concrete.\n- [[Time Travel]] (Time): because the single-location condition sets time travel cases aside.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Platonic Heaven.md": "---\ngroup: Particulars and universals\nrole: concept\nsource: Beebee et al. 2011, entry \"Platonic Heaven\"\npages: p. 165\nstatus: unread\n---\n# Platonic Heaven\n**Page(s):** p. 165\n**Book's definition:** p. 165. Copy the sentence beginning \"Instead, when someone says that something is in Platonic Heaven…\" (the first sentences describe Plato's literal belief).\n**In one line:** A metaphor: to say something is 'in Platonic Heaven' is to say it is an abstract thing that exists but is not in space and time.\n**Role in [[00 – Particulars and universals]]:** A common figure of speech for abstract objects.\n**Explanation:** Plato believed that after death you pass through a realm of Forms, effectively platonic universals, and that seeing them lets you recognise the things that exemplify them when you are reincarnated. The phrase is no longer used literally. 'Numbers are in Platonic Heaven' or 'sets are up there in Platonic Heaven' is a heuristic, not a commitment to some literal otherworldly place.\n**Example:** 'Numbers are in Platonic Heaven.'\n**Connections:**\n- is the imagery of [[Platonism]]: because it pictures abstract objects as living in a 'realm'.\n- originally housed [[Universals]]: because Plato's Forms were platonic universals.\n**Bridges to other groups:**\n- [[Abstract vs Concrete]] and [[Numbers]] (Ontology): because the phrase now just marks something as abstract.\n- [[Class]] (Sets, classes and infinity): because classes or sets are said to be 'up there'.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Platonism.md": "---\ngroup: Particulars and universals\nrole: position\nsource: Beebee et al. 2011, entry \"Platonism\"\npages: pp. 165–167 (entry starts p. 165)\nstatus: unread\n---\n# Platonism\n**Page(s):** pp. 165–167 (entry starts p. 165)\n**Book's definition:** p. 165, the opening sentence of the entry.\n**In one line:** In contemporary metaphysics, the view that there are abstract objects: roughly, entities with no location in space and time that can't take part in causal interactions.\n**Role in [[00 – Particulars and universals]]:** The realist view about abstract objects, including platonic universals.\n**Explanation:** The name comes from Plato's Theory of Forms. An object has a property, say being a dog, by 'participating' in the Form *dog*. Forms are not in space and time, and are eternal and changeless (though Plato didn't deny them causal powers). Talk of their 'realm' shouldn't be taken literally. Most philosophers now deny that *properties* are abstract (see immanent realism), but many accept other abstract objects such as numbers or classes. Some debates are about whether a given thing is abstract or concrete: Lewis says possible worlds are concrete, while his opponents say they are abstract. The word 'abstract' comes from Locke's theory of abstraction, though Locke himself was a nominalist.\n**Example:** Plato's Form *dog*, in which all dogs 'participate'.\n**Connections:**\n- is pictured as [[Platonic Heaven]]: because Plato spoke of a realm of Forms.\n- is rejected for properties by [[Immanent Realism About Universals]]: because most philosophers see no reason to think properties are abstract.\n- is one form of realism about [[Universals]]: because platonic universals are abstract.\n- draws on [[Form and Matter]]: because the Theory of Forms is introduced through that distinction.\n- [[Participation]]: Plato's term for how objects relate to Forms (a pointer entry).\n**Bridges to other groups:**\n- [[Abstract vs Concrete]] and [[Numbers]] (Ontology): because platonism is the view that abstract objects such as numbers exist.\n- [[Class]] (Sets, classes and infinity): because classes are among the abstract objects many accept.\n- [[Modal Realism]] (Modality): because Lewis's concrete worlds vs ersatz abstract worlds is a dispute over abstractness.\n- [[Locke, John]] (Philosophers) and [[Concept]] (Tools): because 'abstract' comes from Locke's theory of abstracting concepts.\n**Multiple meanings:** Yes. The modern sense (there are abstract objects) is broader than Plato's Theory of Forms. 'Nominalism' in one sense is just the denial of platonism.\n**Further reading (book):** Balaguer (2009)\n  Full references (from the book's bibliography):\n  - Balaguer, M. (2009) ‘Platonism in metaphysics’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Summer 2009 edn. Online. Available at: http://plato.stanford.edu/archives/sum2009/entries/platonism.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Properties.md": "---\ngroup: Particulars and universals\nrole: concept\nsource: Beebee et al. 2011, entry \"Properties\"\npages: p. 195\nstatus: unread\n---\n# Properties\n**Page(s):** p. 195\n**Book's definition:** p. 195, the opening sentence of the entry.\n**In one line:** Characteristics of things, such as redness, solidity, squareness and beauty.\n**Role in [[00 – Particulars and universals]]:** The general term that the realist and nominalist theories in this group are all theories of.\n**Explanation:** Austere nominalists are anti-realists about properties: 'the cricket ball is red' is often true, but there is no such thing as *redness*. The realist accounts are universals, tropes, class nominalism and resemblance nominalism. Two cautions. First, even austere nominalists happily use property-talk, but they understand 'sharing a property' as just both things being red. Second, some take 'a has property F' to mean that a has a distinctive intrinsic nature. On that reading only believers in universals and tropes are realists about properties, and the class nominalist is not.\n**Example:** The pillar box and the Coke can 'share a property', said by someone who denies properties exist.\n**Connections:**\n- are denied by [[Austere Nominalism]]: because it is anti-realist about properties.\n- are accounted for by [[Universals]], [[Trope Theory]], [[Class Nominalism]] and [[Resemblance Nominalism]]: because these are the realist theories of their nature.\n**Bridges to other groups:**\n- [[Paraphrase]] (Ontology): because austere nominalists reinterpret property-talk without committing to properties.\n- [[Realism and Anti-Realism]] (Realism and anti-realism): because the main division is realism vs anti-realism about properties.\n- [[Intrinsic vs Extrinsic Properties]] (Kinds of properties): because the restrictive reading ties having a property to an intrinsic nature.\n**Multiple meanings:** Yes: a broad sense (anything one can truly predicate) and a restrictive sense (a distinctive intrinsic nature), which changes who counts as a realist.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Resemblance Nominalism.md": "---\ngroup: Particulars and universals\nrole: position\nsource: Beebee et al. 2011, entry \"Resemblance Nominalism\"\npages: pp. 225–226 (entry starts p. 225)\nstatus: unread\n---\n# Resemblance Nominalism\n**Page(s):** pp. 225–226 (entry starts p. 225)\n**Book's definition:** p. 225. Copy the first sentence of paragraph 2 (paragraph 1 only says what the view denies).\n**In one line:** Nominalism that takes resemblance between particulars as primitive and explains properties by it: a thing is red because it resembles all the other red things.\n**Role in [[00 – Particulars and universals]]:** A nominalist rival to class nominalism, with a more intuitive order of explanation.\n**Explanation:** Everything is a particular; there are no universals. The resemblance nominalist may be anti-realist about properties, paraphrasing 'red is a colour', or may identify properties with classes of resembling objects. Compared with class nominalism it is slightly less parsimonious, since it adds a primitive resemblance relation, but slightly more intuitive: it explains class membership by resemblance rather than the reverse. It faces many of the same difficulties as class nominalism.\n**Example:** The Coke can and the telephone box are both red because they resemble each other and the other red things.\n**Connections:**\n- is a form of [[Nominalism]]: because it denies universals.\n- is compared with [[Class Nominalism]]: because it reverses the order of explanation between class membership and resemblance.\n- takes resemblance as primitive like [[Trope Theory]]: because the trope theorist also treats resemblance as basic.\n- gives an account of [[Properties]]: because it identifies them with classes of resembling objects, or paraphrases them away.\n**Bridges to other groups:**\n- [[Primitive]] (Tools): because resemblance is its primitive.\n- [[Theoretical Virtues]] (Method): because the comparison with class nominalism is about parsimony.\n- [[Paraphrase]] (Ontology): because one option is to paraphrase property-talk.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Armstrong (1989, Chapter 3); Lowe (2002, 355–60); Loux (2006)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (1989) *Universals: An Opinionated Introduction*, Boulder, CO: Westview Press.\n  - Lowe, E. J. (2002) *A Survey of Metaphysics*, Oxford: Oxford University Press.\n  - Loux, M. (2006) *Metaphysics: A Contemporary Introduction*, 3rd edn, London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Substance-Attribute Theory.md": "---\ngroup: Particulars and universals\nrole: pointer\nsource: Beebee et al. 2011, entry \"Substance-Attribute Theory\"\npages: p. 238 or 239 (pointer entry; it falls between Substance, p. 238, and Substratum, p. 239)\nstatus: unread\n---\n# Substance-Attribute Theory\n**Page(s):** p. 238 or 239 (pointer entry; it falls between Substance, p. 238, and Substratum, p. 239)\n**Pointer entry:** the book only says \"see\" → [[Bundle Theory vs Substance-Attribute Theory]]. Read that note.\n**Role in [[00 – Particulars and universals]]:** cross-reference only; the book gives no separate definition here.\n**Note:** the page is uncertain (p. 238 or 239).\n**My notes:**\n", "03 Particulars and universals/Substance.md": "---\ngroup: Particulars and universals\nrole: concept\nsource: Beebee et al. 2011, entry \"Substance\"\npages: p. 238\nstatus: unread\n---\n# Substance\n**Page(s):** p. 238\n**Book's definition:** p. 238. Copy the sentence beginning \"In philosophy, 'substance' normally means…\" (the first sentences contrast it with the ordinary English sense).\n**In one line:** In philosophy, an 'irreducible particular thing', not a kind of stuff, as in ordinary English.\n**Role in [[00 – Particulars and universals]]:** A traditional notion of a fundamental particular, from Aristotle to Spinoza.\n**Explanation:** In ordinary English 'substance' is a mass noun for a stuff like magnesium. In philosophy it means an irreducible particular thing: if there are souls, seven souls are seven substances, whereas seven samples of magnesium are samples of one substance. The notion begins with Aristotle, who took organisms to be the substances, the fundamental constituents of reality, and was developed by Aquinas and the scholastics. Descartes defined substance as what depends on nothing else for its existence, so that strictly only God qualifies. Spinoza argued there is only one substance, 'God or nature'.\n**Example:** Seven souls are seven substances; seven samples of magnesium are not.\n**Connections:**\n- is a kind of [[Particulars]]: because a substance is defined as an irreducible particular thing.\n**Bridges to other groups:**\n- [[Aristotle]] (Philosophers): because the notion originates in his writings.\n- [[Reductionism]] (Tools): because a substance is *irreducible*.\n**Multiple meanings:** Yes: the ordinary sense (a stuff) vs the philosophical sense; and different philosophical versions (Aristotle, Descartes, Spinoza).\n**Further reading (book):** Robinson (2009)\n  Full references (from the book's bibliography):\n  - Robinson, H. (2009) ‘Substance’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Winter 2009 edn. Online. Available at: http://plato.stanford.edu/archives/win2009/entries/substance.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Substratum.md": "---\ngroup: Particulars and universals\nrole: concept\nsource: Beebee et al. 2011, entry \"Substratum\"\npages: p. 239\nstatus: unread\n---\n# Substratum\n**Page(s):** p. 239\n**Book's definition:** p. 239, the opening sentence of the entry.\n**In one line:** The constituent of an object that is not itself a property but bears the object's properties.\n**Role in [[00 – Particulars and universals]]:** What the substance-attribute theorist adds to an object's properties.\n**Explanation:** Substance-attribute theorists believe in substrata; bundle theorists deny them. The Bradley's Regress entry shows the problem they face: explaining how a substratum and its properties are bound together.\n**Example:** In the Bradley's Regress entry, 'Plato is wise' is explained by Plato's substratum plus the universal wisdom.\n**Connections:**\n- is accepted by substance-attribute theorists in [[Bundle Theory vs Substance-Attribute Theory]]: because it is what is left when the properties are stripped away.\n- [[Substance-Attribute Theory]]: a pointer entry for the view that accepts it.\n- faces [[Bradley's Regress]]: because the substratum must somehow be tied to its properties.\n**Bridges to other groups:**\n- None named in this entry; see the hub.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Trope Theory.md": "---\ngroup: Particulars and universals\nrole: position\nsource: Beebee et al. 2011, entry \"Trope Theory\"\npages: pp. 255–257 (entry starts p. 255)\nstatus: unread\n---\n# Trope Theory\n**Page(s):** pp. 255–257 (entry starts p. 255)\n**Book's definition:** p. 255. Copy the first sentence (trope theory as a form of nominalism) and the sentence that ends paragraph 1, which names 'tropes'.\n**In one line:** The nominalist view that properties are real constituents of objects but are unrepeatable particulars ('tropes'): your book's hardness and mine are two distinct things.\n**Role in [[00 – Particulars and universals]]:** The form of nominalism closest to realism about universals.\n**Explanation:** The trope theorist accepts that a book's hardness, colour and shape exist, but treats each one as a one-off. How do two books 'have something in common'? In the way two soldiers wear 'the same uniform' (distinct uniforms of one type), not the way two brothers have 'the same father' (one man). Books resemble each other because each has a trope of the same type, and resemblance between tropes is the primitive bottom line. A trope theorist may paraphrase away general properties like 'wisdom', but more often analyses them reductively, much as the class nominalist does. That account avoids class nominalism's problem with co-extensive properties.\n**Example:** Two soldiers in 'the same uniform' vs two brothers with 'the same father'.\n**Connections:**\n- is a form of [[Nominalism]]: because it denies universals.\n- is the closest rival to [[Universals]]: because it agrees that properties are constituents of objects.\n- treats properties as [[Particulars]]: because tropes are unrepeatable.\n- fixes a problem for [[Class Nominalism]]: because its reductive account handles co-extensive properties.\n**Bridges to other groups:**\n- [[Type and Tokens]] (Tools): because resembling tropes are tokens of the same type.\n- [[Identity]] (Identity): because the uniform/father contrast is between qualitative and numerical sameness.\n- [[Primitive]] (Tools): because resemblance between tropes is primitive.\n- [[Abstract vs Concrete]] (Ontology): because tropes are usually said to be concrete (Abstract vs Concrete entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Loux (2006, 79–89); Oliver (1996).\n  Full references (from the book's bibliography):\n  - Loux, M. (2006) *Metaphysics: A Contemporary Introduction*, 3rd edn, London: Routledge.\n  - Oliver, A. (1996) ‘The metaphysics of properties’, *Mind*, 105: 1–80.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Universals.md": "---\ngroup: Particulars and universals\nrole: position\nsource: Beebee et al. 2011, entry \"Universals\"\npages: pp. 265–267 (entry starts p. 265)\nstatus: unread\n---\n# Universals\n**Page(s):** pp. 265–267 (entry starts p. 265)\n**Book's definition:** p. 265. Copy the sentence in paragraph 1 that begins \"We call properties understood as entities which can be had by more than one object 'universals'…\".\n**In one line:** Properties understood as repeatable: one and the same universal, say redness, can be a constituent of many objects at once.\n**Role in [[00 – Particulars and universals]]:** The central realist posit of this group. Every other view here is defined by how it stands on universals.\n**Explanation:** Among those who think properties are constituents of objects, realists about universals say one property can be in many objects, while trope theorists deny it. Nominalists deny universals altogether. Realists divide into Platonists (universals are abstract, outside space and time) and Aristotelians (universals are concrete, wholly present in each instance, like a legendary saint in two places at once). Realists argue that universals explain facts about resemblance and sentences that seem to refer to general properties ('wisdom is a virtue'). Nominalists answer with classes or tropes, deny any deeper explanation is needed (austere nominalism), or paraphrase. The biggest difficulty for realism is accounting for instantiation without Bradley's regress. Realists usually take only *natural* properties to be universals, so universals are 'sparse' rather than 'abundant'.\n**Example:** Redness wholly present in a phone box in England and in a sunset in China.\n**Connections:**\n- are denied by [[Nominalism]] and its forms [[Trope Theory]], [[Class Nominalism]] and [[Austere Nominalism]]: because each offers a rival account of resemblance.\n- come in two versions, [[Platonism]] and [[Immanent Realism About Universals]]: because realists disagree on whether universals are in space and time.\n- face [[Bradley's Regress]]: because realists must explain how objects instantiate universals.\n**Bridges to other groups:**\n- [[Natural Property]] and [[Sparse Property]] (Kinds of properties): because realists usually take only natural properties to be universals.\n- [[Common Sense]] (Method): because the entry asks whether common sense compels us to believe in universals.\n- [[Ontological Commitment]] (Ontology): because nominalists try to avoid commitment to universals.\n- [[Type and Tokens]] (Tools): because the problem of universals is sometimes framed as how tokens fall under types (Type and Tokens entry).\n**Multiple meanings:** The entry flags 'sparse' vs 'abundant' conceptions of universals.\n**Further reading (book):** Armstrong (1989); Loux (2006, Chapter 1); Oliver (1996)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (1989) *Universals: An Opinionated Introduction*, Boulder, CO: Westview Press.\n  - Loux, M. (2006) *Metaphysics: A Contemporary Introduction*, 3rd edn, London: Routledge.\n  - Oliver, A. (1996) ‘The metaphysics of properties’, *Mind*, 105: 1–80.\n**Beyond the book:** —\n**My notes:**\n", "04 Realism and anti-realism/00 – Realism and anti-realism.md": "---\ngroup: Realism and anti-realism\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Realism and anti-realism\n**Central question:** Does a disputed thing exist, or exist independently of us? And is there, or can we even conceive of, a mind-independent reality at all?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| Local realism ([[Realism and Anti-Realism]]) | X exists | e.g. Lewis on possible worlds | Epistemological and meaning-based arguments for anti-realism |\n| [[Metaphysical Realism]] | Most things exist mind-independently | Implicit in many metaphysicians | Anti-realists: we can't conceive of mind-independent reality |\n| Global anti-realism ([[Realism and Anti-Realism (Global)]]) | Reality is the world-as-conceptualised-by-us | Kant (as background); Putnam | Realists: truth is simply observer-independent |\n| [[Phenomenalism and Idealism]] | Objects are collections of experiences | Berkeley | Truthmakers for 'would' claims; common sense |\n| [[Pragmatism]] | Truth is tied to practical difference | Peirce, James, Dewey | — |\n| [[Postmodernism]] | No one true theory; relativism | Foucault, Derrida, Baudrillard, Rorty | — |\n| [[Relativism]] | Truth is relative to features of beings | — | — |\n| Distinct schemes are impossible ([[Conceptual Scheme]]) | Distinct schemes would be untranslatable, and there can't be any | Davidson (1974) | — |\n\n## Key arguments and test cases\n- Brains in a vat and Putnam's reply: [[Brains in a Vat]] (p. 20)\n- 'From whose point of view is the story being told?': [[God's Eye View]] (p. 85)\n- The banana that just is its appearances: [[Phenomenalism and Idealism]] (p. 162)\n- Mouse droppings (inference to the best explanation): [[Realism and Anti-Realism]] (p. 209)\n- Descartes' evil demon: [[Scepticism]] (p. 228)\n\n## Bridges to other groups\n- **Truth:** [[Truth]], [[Truthbearers]] and [[Truthmakers]], because coherence and pragmatist theories of truth support anti-realism, and truthmakers express realist intuitions.\n- **Kinds of properties:** [[Primary and Secondary Qualities]] and [[Response-Dependence]], because colour is the standard entry point.\n- **Tools:** [[Empiricism]], [[Reductionism]] and [[Concept]], because meaning-empiricism argues for anti-realism, reductionism is a middle way, and schemes are stocks of concepts.\n- **Method:** [[Carving Nature at its Joints]] and [[Thought Experiment]], because anti-realists reject joint-carving, and the sceptical scenarios are thought experiments.\n- **Time:** [[God's Eye View]] and [[Relativity]], because tenseless theorists cite relativity's God's eye view.\n- **Philosophers:** [[Kant, Immanuel]] and [[Berkeley, George]], because of the 'world in itself' and 'to be is to be perceived'.\n\n## Reading path (pages in the book)\n1. [[Realism and Anti-Realism]] (p. 209), [[Realism and Anti-Realism (Global)]] (p. 212), [[Metaphysical Realism]] (p. 126)\n2. [[Scepticism]] (p. 228), [[Brains in a Vat]] (p. 20), [[God's Eye View]] (p. 85)\n3. [[Conceptual Scheme]] (p. 47), [[Relativism]] (p. 220)\n4. [[Phenomenalism and Idealism]] (p. 162), [[Pragmatism]] (p. 172), [[Postmodernism]] (p. 172)\n- Pointer entries: [[Anti-Realism]] (p. 10), [[Global Realism]] (p. 84), [[Idealism]] (p. 95), [[Psychologism]] (p. 199)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "04 Realism and anti-realism/Anti-Realism.md": "---\ngroup: Realism and anti-realism\nrole: pointer\nsource: Beebee et al. 2011, entry \"Anti-Realism\"\npages: p. 10\nstatus: unread\n---\n# Anti-Realism\n**Page(s):** p. 10\n**Pointer entry:** the book only says \"see\" → [[Realism and Anti-Realism]]. Read that note.\n**Role in [[00 – Realism and anti-realism]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "04 Realism and anti-realism/Brains in a Vat.md": "---\ngroup: Realism and anti-realism\nrole: case\nsource: Beebee et al. 2011, entry \"Brains in a Vat\"\npages: pp. 20–21 (entry starts p. 20)\nstatus: unread\n---\n# Brains in a Vat\n**Page(s):** pp. 20–21 (entry starts p. 20)\n**Book's definition:** p. 20. Copy the third sentence of paragraph 1, which states the possibility Putnam asks us to imagine.\n**In one line:** Putnam's modern version of Descartes' evil demon: perhaps we are envatted brains fed all our experiences by a computer, including the experiences that lead us to believe we aren't.\n**Role in [[00 – Realism and anti-realism]]:** The leading sceptical scenario, and the case behind Putnam's anti-realist reply to scepticism.\n**Explanation:** On the hypothesis, a computer feeds our brains impulses that produce exactly the experiences, and so the beliefs, we actually have, including the belief that we aren't brains in vats. (It resembles *The Matrix*, where whole bodies are envatted.) Sceptical scenarios like this are meant to show that we don't know, or have no reason to believe, what we think about the external world, since we can't tell the two situations apart. Putnam replies that the scenario presupposes an external perspective from which the story is told, a 'God's eye view'. Once the evil scientist is removed from the story, there is no such perspective. Whatever our best theory is, it can't step outside our conceptual scheme. This is an anti-realist response to scepticism.\n**Example:** Being a brain in a vat that believes it is not a brain in a vat.\n**Connections:**\n- is the modern form of [[Scepticism]]: because it updates Descartes' evil demon.\n- bears on [[Realism and Anti-Realism (Global)]]: because Putnam's response is anti-realist.\n- presupposes a [[God's Eye View]] according to Putnam: because someone must be telling the story from outside.\n- is answered by appeal to our [[Conceptual Scheme]]: because no theory can step outside it.\n**Bridges to other groups:**\n- [[Thought Experiment]] (Method): because it is a sceptical thought experiment.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Putnam (1981, Chapter 1); Brueckner (2008); Chalmers (undated)\n  Full references (from the book's bibliography):\n  - Putnam, H. (1981) *Reason, Truth and History*, Cambridge: Cambridge University Press.\n  - Brueckner, T. (2008) ‘Brains in a vat’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/brain-vat.\n**Beyond the book:** —\n**My notes:**\n", "04 Realism and anti-realism/Conceptual Scheme.md": "---\ngroup: Realism and anti-realism\nrole: concept\nsource: Beebee et al. 2011, entry \"Conceptual Scheme\"\npages: pp. 47–49 (entry starts p. 47)\nstatus: unread\n---\n# Conceptual Scheme\n**Page(s):** pp. 47–49 (entry starts p. 47)\n**Book's definition:** p. 47. The entry declines to define the term. Copy its 'first pass' sentence in paragraph 2 (the entire stock of concepts you use to think about the world).\n**In one line:** Roughly, the whole stock of concepts we use to think about the world. Anti-realists say we can describe reality only as constrained by our scheme.\n**Role in [[00 – Realism and anti-realism]]:** A key notion in the case for global anti-realism and relativism.\n**Explanation:** A conceptual scheme isn't just a vocabulary: 'Schnee' and 'snow' express one concept, so two languages don't automatically mean two schemes. Davidson (1974, 'On the very idea of a conceptual scheme') defines distinct schemes as mutually untranslatable languages, and then argues that distinct schemes are impossible. The standard metaphysical account of propositions, and quite a lot of other metaphysical theory, won't suit believers in different schemes. Anti-realists cast the realist as holding the correspondence theory of truth, and argue it is a non-starter. So too, they say, is the idea of carving nature at its joints, and even the idea that we can conceive of mind-independent reality.\n**Example:** German and English: two languages, but (being intertranslatable) one scheme.\n**Connections:**\n- constrains reality on [[Realism and Anti-Realism (Global)]]: because anti-realists say we only grasp the world as conceptualised by us.\n- underlies [[Relativism]]: because global relativists appeal to radically different schemes.\n- can't be escaped according to Putnam's [[Brains in a Vat]] reply: because no theory steps outside our scheme.\n- is linked to the [[God's Eye View]]: because a view from outside every scheme is what anti-realists reject.\n**Bridges to other groups:**\n- [[Concept]] (Tools): because a scheme is a stock of concepts.\n- [[Proposition]] and [[Truth]] (Truth): because believers in schemes reject the standard view of propositions and the correspondence theory.\n- [[Carving Nature at its Joints]] (Method): because anti-realists reject the idea of carving nature at its joints.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Abridged versions of Davidson (1974) and Nagel (1986, Chapter 6), along with some commentary and explanation, are to be found in Beebee and Dodd (2006, Chapter 3). See also Kirk (1999, Chapter 2)\n  Full references (from the book's bibliography):\n  - Davidson, D. (1974) ‘On the very idea of a conceptual scheme’, *Proceedings and Addresses of the American Philosophical Association*, 47: 5–20; reprinted in Davidson, D. (2001) *Inquiries into Truth and Interpretation*, 2nd edn, Oxford: Clarendon Press. An abridged version is reprinted in Beebee and Dodd 2006.\n  - Nagel, T. (1986) *The View From Nowhere*, New York: Oxford University Press.\n  - Beebee, H. and Dodd, J. (eds) (2006) *Reading Metaphysics*, Oxford: Blackwell.\n  - Kirk, R. (1999) *Relativism and Realism*, London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "04 Realism and anti-realism/Global Realism.md": "---\ngroup: Realism and anti-realism\nrole: pointer\nsource: Beebee et al. 2011, entry \"Global Realism\"\npages: p. 84\nstatus: unread\n---\n# Global Realism\n**Page(s):** p. 84\n**Pointer entry:** the book only says \"see\" → [[Realism and Anti-Realism (Global)]]. Read that note.\n**Role in [[00 – Realism and anti-realism]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "04 Realism and anti-realism/God's Eye View.md": "---\ngroup: Realism and anti-realism\nrole: concept\nsource: Beebee et al. 2011, entry \"God's Eye View\"\npages: pp. 85–86 (entry starts p. 85)\nstatus: unread\n---\n# God's Eye View\n**Page(s):** pp. 85–86 (entry starts p. 85)\n**Book's definition:** p. 85, the opening sentence of the entry.\n**In one line:** The supposed perspective, independent of all observers, from which one could check whether our theories match reality. Global anti-realists say realism presupposes it, and that it is unintelligible.\n**Role in [[00 – Realism and anti-realism]]:** The anti-realist's diagnosis of what realism (and scepticism) assumes.\n**Explanation:** Putnam (1981: 50) argues that supposing all sentient beings might be brains in vats presupposes a God's Eye view, or better a 'No Eye' view, of truth as independent of all observers. By itself that isn't an objection: the realist can reply that yes, truth *is* observer-independent. The claim only makes the alleged problem vivid. A real argument must show that such a view is unintelligible, as Putnam tries to do by asking what a brain in a vat could *mean* by 'I am a brain in a vat'. The idea arises from the thought that if truth is independent of our theories, evidence and conceptual scheme, there must be some perspective from which they could be seen to be wrong.\n**Example:** Putnam: 'from whose point of view is the story being told?'\n**Connections:**\n- is said to be presupposed in [[Brains in a Vat]] and [[Scepticism]]: because the sceptical story needs an outside perspective.\n- is rejected by [[Realism and Anti-Realism (Global)]] anti-realists: because they deny we can make sense of it.\n- is denied by [[Postmodernism]]: because postmodernists reject one true theory as seen from the God's eye view.\n- is the view outside every [[Conceptual Scheme]]: because it would let us see our scheme as in error.\n**Bridges to other groups:**\n- [[Relativity]] and [[Tensed and Tenseless Theories of Time]] (Time): because tenseless theorists say relativity shows that, in the God's eye view, there is no special present.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Kirk (1999, Chapter 9)\n  Full references (from the book's bibliography):\n  - Kirk, R. (1999) *Relativism and Realism*, London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "04 Realism and anti-realism/Idealism.md": "---\ngroup: Realism and anti-realism\nrole: pointer\nsource: Beebee et al. 2011, entry \"Idealism\"\npages: p. 95\nstatus: unread\n---\n# Idealism\n**Page(s):** p. 95\n**Pointer entry:** the book only says \"see\" → [[Phenomenalism and Idealism]]. Read that note.\n**Role in [[00 – Realism and anti-realism]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "04 Realism and anti-realism/Metaphysical Realism.md": "---\ngroup: Realism and anti-realism\nrole: position\nsource: Beebee et al. 2011, entry \"Metaphysical Realism\"\npages: p. 126\nstatus: unread\n---\n# Metaphysical Realism\n**Page(s):** p. 126\n**Book's definition:** p. 126. The whole entry is one sentence: copy it.\n**In one line:** The position, implicitly held by many metaphysicians, that most things (sheep, potatoes, stars; perhaps not colours, smells or moral values) exist independently of our minds, beliefs, language or experience.\n**Role in [[00 – Realism and anti-realism]]:** The realist side of the global debate.\n**Explanation:** This is a one-sentence entry. Realism and Anti-Realism (Global) describes it as the seemingly obvious view: we didn't create trees, cats and planets, they aren't figments of our imagination, and they would exist even if humans had never existed.\n**Example:** Sheep, potatoes and stars existing whatever we think.\n**Connections:**\n- is the realist position in [[Realism and Anti-Realism (Global)]]: because it says most things exist mind-independently.\n**Bridges to other groups:**\n- [[Primary and Secondary Qualities]] and [[Response-Dependence]] (Kinds of properties): because colours and smells are the entry's possible exceptions.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "04 Realism and anti-realism/Phenomenalism and Idealism.md": "---\ngroup: Realism and anti-realism\nrole: position\nsource: Beebee et al. 2011, entry \"Phenomenalism and Idealism\"\npages: pp. 162–165 (entry starts p. 162)\nstatus: unread\n---\n# Phenomenalism and Idealism\n**Page(s):** pp. 162–165 (entry starts p. 162)\n**Book's definition:** p. 162, the opening sentence of the entry.\n**In one line:** The view that the external world and its objects are nothing more than collections of sensations, experiences or sense data. As Berkeley put it, 'to be is to be perceived'.\n**Role in [[00 – Realism and anti-realism]]:** The classic forms of global anti-realism.\n**Explanation:** Intuitively, a banana is distinct from your experiences of it. For the phenomenalist or idealist it isn't: the banana *is* the collection of its looks, smells, tastes and feels, which are experiences. In crude form the view makes much of what we believe false (the milk being in the fridge, your feet existing while you sleep), which violates common sense. So claims about the world are treated as disguised subjunctives, roughly counterfactuals about what experiences we would have. The starting point is rejecting Locke's primary/secondary distinction, and the view has generally been taken to follow from empiricism. One advantage is that it answers scepticism: if to be is to be perceived, the evil demon and the brain-in-a-vat hypotheses are unintelligible. A standard objection is a truthmaker argument: what makes it true that I *would* have a tree-experience? For the phenomenalist, that is just a brute fact.\n**Example:** The banana that just is its look, smell, taste and feel.\n**Connections:**\n- [[Idealism]]: a pointer entry that sends you here.\n- is a form of anti-realism in [[Realism and Anti-Realism (Global)]]: because the world becomes mind-dependent.\n- answers [[Scepticism]] and [[Brains in a Vat]]: because there is no gap between seeming and being.\n**Bridges to other groups:**\n- [[Berkeley, George]] (Philosophers): because of 'esse est percipi'.\n- [[Primary and Secondary Qualities]] (Kinds of properties): because the view starts by rejecting Locke's distinction.\n- [[Empiricism]] and [[Counterfactual Conditional]] (Tools): because it is taken to follow from empiricism, and analyses claims about the world as subjunctives.\n- [[Truthmakers]] (Truth): because the standard objection is that it 'cheats' on truthmakers.\n- [[Common Sense]] (Method): because the crude version violates common sense.\n- [[Possible Worlds]] (Modality): because it rejects possible worlds semantics for its counterfactuals.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Dancy (1985, Chapter 10)\n  Full references (from the book's bibliography):\n  - Dancy, J. (1985) *Introduction to Contemporary Epistemology*, Oxford: Blackwell.\n**Beyond the book:** —\n**My notes:**\n", "04 Realism and anti-realism/Postmodernism.md": "---\ngroup: Realism and anti-realism\nrole: position\nsource: Beebee et al. 2011, entry \"Postmodernism\"\npages: p. 172\nstatus: unread\n---\n# Postmodernism\n**Page(s):** p. 172\n**Book's definition:** p. 172. Copy the first sentence (a movement that rose in popularity in the late twentieth century); Eagleton's description follows it.\n**In one line:** A late-twentieth-century movement suspicious of classical notions of truth, reason and objectivity. Metaphysically, a broadly anti-realist, relativist view.\n**Role in [[00 – Realism and anti-realism]]:** The cultural form of global anti-realism.\n**Explanation:** Postmodernist authors include Foucault, Derrida, Baudrillard and Rorty. The literary theorist Eagleton (1996) describes it as suspicious of classical notions of truth, reason, identity and objectivity, and of grand narratives and ultimate grounds of explanation. Its roots lie in art, architecture and politics rather than philosophy, but at its heart are metaphysical claims. These are broadly anti-realist: postmodernists reject the idea of one true theory of how the world really is (seen, perhaps, from the God's eye view) and replace it with a more relativist view.\n**Example:** (The entry gives no case; it names authors and Eagleton's description.)\n**Connections:**\n- is a form of anti-realism in [[Realism and Anti-Realism (Global)]]: because it rejects one true theory of reality.\n- embraces [[Relativism]]: because it replaces one true theory with a relativist view.\n- rejects the [[God's Eye View]]: because there is no single view from which the one true theory could be seen.\n**Bridges to other groups:**\n- [[Truth]] (Truth): because it is suspicious of classical notions of truth.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Rorty (1989, Chapter 1); Kirk (1999, Chapter 9)\n  Full references (from the book's bibliography):\n  - Rorty, R. (1989) *Contingency, Irony and Solidarity*, Cambridge: Cambridge University Press.\n  - Kirk, R. (1999) *Relativism and Realism*, London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "04 Realism and anti-realism/Pragmatism.md": "---\ngroup: Realism and anti-realism\nrole: position\nsource: Beebee et al. 2011, entry \"Pragmatism\"\npages: pp. 172–174 (entry starts p. 172)\nstatus: unread\n---\n# Pragmatism\n**Page(s):** pp. 172–174 (entry starts p. 172)\n**Book's definition:** p. 172. Copy the sentence in paragraph 1 beginning \"The basic tenet of pragmatism is that…\".\n**In one line:** A form of global anti-realism on which what is true is tied to the practical difference that asserting or believing it makes.\n**Role in [[00 – Realism and anti-realism]]:** An anti-realist theory of truth and reality from the American tradition.\n**Explanation:** Pragmatism has its roots in Peirce, William James and Dewey. Many pragmatists call themselves realists, but on the book's definition (the anti-realist denies that reality is mind-independent) they count as anti-realists. Pragmatists differ over how to spell out 'practical difference', and some versions are more radically anti-realist than others. One way in is to ask what theories are *for*. The realist answer is that they are for finding the truth, understood as correspondence with how things really are and tested by predictions. The pragmatist instead ties truth to practical purposes.\n**Example:** Asking what the point of having a theory is.\n**Connections:**\n- is a variety of [[Realism and Anti-Realism (Global)]] anti-realism: because it denies that reality is mind-independent.\n**Bridges to other groups:**\n- [[Truth]] (Truth): because pragmatism is often characterised as a theory of truth (James: the true is what proves good in the way of belief).\n**Multiple meanings:** On the book's definition, pragmatists are anti-realists even if they call themselves realists.\n**Further reading (book):** Hookway (2010)\n  Full references (from the book's bibliography):\n  - Hookway, C. (2010) ‘Pragmatism’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Spring 2010 edn. Online. Available at: http://plato.stanford.edu/archives/spr2010/entries/pragmatism.\n**Beyond the book:** —\n**My notes:**\n", "04 Realism and anti-realism/Psychologism.md": "---\ngroup: Realism and anti-realism\nrole: pointer\nsource: Beebee et al. 2011, entry \"Psychologism\"\npages: p. 199\nstatus: unread\n---\n# Psychologism\n**Page(s):** p. 199\n**Pointer entry:** the book only says \"see\" → [[Concept]]. Read that note.\n**Role in [[00 – Realism and anti-realism]]:** cross-reference only; the book gives no separate definition here.\n**Grouping note:** the book sends this term to Concept (in Tools and background), where psychologism is explained as the view that the laws of logic and mathematics are facts about the human mind. Consider moving this note to that group.\n**My notes:**\n", "04 Realism and anti-realism/Realism and Anti-Realism (Global).md": "---\ngroup: Realism and anti-realism\nrole: position\nsource: Beebee et al. 2011, entry \"Realism and Anti-Realism (Global)\"\npages: entry starts p. 212\nstatus: unread\n---\n# Realism and Anti-Realism (Global)\n**Page(s):** entry starts p. 212\n**Book's definition:** p. 212. Copy the sentence in paragraph 1 that states the central question: whether there is, or could be, mind-independent reality.\n**In one line:** The dispute over whether there is, or can coherently be thought to be, a mind-independent reality at all.\n**Role in [[00 – Realism and anti-realism]]:** The big-picture form of the realism debate.\n**Explanation:** It seems obvious that trees, cats and planets are mind-independent; that is metaphysical realism. A way into anti-realism: our experience isn't an untainted picture of reality. Colours look like mind-independent properties, but something's looking red depends on how our eyes and brains work. The global anti-realist concludes that the reality we describe, in science as in daily life, is the world-as-conceptualised-by-us, not (following Kant) the world as it is in itself. We can't even coherently think about a mind-independent reality, because our conception is constrained by our conceptual scheme. A more moderate thought is that primary qualities, such as shape, might be features of things in themselves. Varieties of anti-realism include pragmatism, phenomenalism and postmodernism. On these views truth is a matter of serving a practical purpose, not correspondence, and one potential consequence is relativism.\n**Example:** Something's looking red depends on our eyes and brains.\n**Connections:**\n- [[Global Realism]]: a pointer entry that sends you here.\n- sets [[Metaphysical Realism]] against anti-realism: because that is the realist side.\n- appeals to our [[Conceptual Scheme]]: because anti-realists say reality is constrained by it.\n- includes [[Pragmatism]], [[Phenomenalism and Idealism]] and [[Postmodernism]] as varieties of anti-realism: because the entry lists them.\n- can lead to [[Relativism]]: because anti-realism may make truth non-absolute.\n**Bridges to other groups:**\n- [[Kant, Immanuel]] (Philosophers): because of the 'world as it is in itself'.\n- [[Primary and Secondary Qualities]] and [[Response-Dependence]] (Kinds of properties): because colour is the way into anti-realism.\n- [[Truth]] (Truth): because the theory of truth changes under anti-realism.\n- [[Rationalism]] (Tools): because Kant's answer to Hume risks global anti-realism (Rationalism entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Blackburn (1999, Chapter 7); Kirk (1999); Miller (2008); Nagel (1986, Chapter 6); Beebee and Dodd (2006, Chapter 3), this includes an abridged version of Nagel (1986, Chapter 6)\n  Full references (from the book's bibliography):\n  - Blackburn, S. (1999) *Think!*, Oxford: Oxford University Press.\n  - Kirk, R. (1999) *Relativism and Realism*, London: Routledge.\n  - Miller, A. (2008) ‘Realism’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/realism.\n  - Nagel, T. (1986) *The View From Nowhere*, New York: Oxford University Press.\n  - Beebee, H. and Dodd, J. (eds) (2006) *Reading Metaphysics*, Oxford: Blackwell.\n**Beyond the book:** —\n**My notes:**\n", "04 Realism and anti-realism/Realism and Anti-Realism.md": "---\ngroup: Realism and anti-realism\nrole: position\nsource: Beebee et al. 2011, entry \"Realism and Anti-Realism\"\npages: pp. 209–212 (entry starts p. 209)\nstatus: unread\n---\n# Realism and Anti-Realism\n**Page(s):** pp. 209–212 (entry starts p. 209)\n**Book's definition:** p. 209. The entry says the terms are hard to define. Copy the definition it adopts, in paragraph 2: realism about X is simply the view that X exists.\n**In one line:** Debates over whether a disputed entity exists, or has some special status (irreducible, mind-independent). The book uses: realism about X is the view that X exists.\n**Role in [[00 – Realism and anti-realism]]:** The book's own topic entry for this group. It frames debates in nearly every other group.\n**Explanation:** In one usage, a realist holds that the entity exists *and* is irreducible or mind-independent. Then a regularity theorist is an anti-realist about causation, and a response-dependence theorist an anti-realist about colours. In the book's usage, realism about X is just the view that X exists. So the reductionist is a realist about causation but an anti-realist about irreducible causal relations. Some also add an epistemic component (Wright 1992). Arguments for anti-realism: epistemological (no evidence, as with God, or causation, which Hume says we never observe) and meaning-based (meaning-empiricism: without an idea from experience, the talk is meaningless). Arguments for realism: inference to the best explanation (droppings and nibbled bread mean a mouse), and theoretical benefits (Lewis on possible worlds). There is also a 'global' debate about mind-independent reality as a whole.\n**Example:** Mouse droppings and nibbled bread: inferring an unseen mouse.\n**Connections:**\n- [[Anti-Realism]]: a pointer entry that sends you here.\n- has a global form, [[Realism and Anti-Realism (Global)]]: because the entry closes with the global debate.\n- includes [[Metaphysical Realism]]: because that is realism about the world as a whole.\n**Bridges to other groups:**\n- [[Reductionism]] and [[Empiricism]] (Tools): because reductionism is a middle way, and meaning-empiricism argues for anti-realism.\n- [[Regularity Theory of Causation]] (Causation and laws): because on the first usage it counts as anti-realism about causation.\n- [[Response-Dependence]] (Kinds of properties): because it gives realism about red things but anti-realism about intrinsic colours.\n- [[Possible Worlds]] (Modality): because Lewis's case for possible worlds is the example of a theoretical-benefits argument.\n- [[Hume, David]] (Philosophers): because his arguments about miracles and unobserved causation illustrate the epistemological argument.\n**Multiple meanings:** Yes, several: realism as existence (the book's usage); as existence plus irreducibility or mind-independence; and with an added epistemic component (Wright).\n**Further reading (book):** Miller (2008, §§ 1–5)\n  Full references (from the book's bibliography):\n  - Miller, A. (2008) ‘Realism’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/realism.\n**Beyond the book:** —\n**My notes:**\n", "04 Realism and anti-realism/Relativism.md": "---\ngroup: Realism and anti-realism\nrole: position\nsource: Beebee et al. 2011, entry \"Relativism\"\npages: pp. 220–223 (entry starts p. 220)\nstatus: unread\n---\n# Relativism\n**Page(s):** pp. 220–223 (entry starts p. 220)\n**Book's definition:** p. 220. Copy the first sentence of paragraph 2: relativism is the view that truth is relative to something.\n**In one line:** The view that truth, and so what exists, is relative to something about human (or other language-using) beings, such as a society's beliefs.\n**Role in [[00 – Realism and anti-realism]]:** A potential consequence of global anti-realism.\n**Explanation:** Relativism is usually a thesis about truth, though it can also be seen as one about meaning. Since 'p' is true iff p, being a relativist about the truth of 'God exists' means being a relativist about God's existence. So anyone who makes truth relative to some feature of human beings is an anti-realist about mind-independent reality. There are stronger and weaker, and broader and narrower, forms. One argument asks what a genuine fact of the matter in a domain (beauty, taste, ethics) could look like. *Global* relativists extend this to planets, chairs and elephants, appealing to radically different worldviews or conceptual schemes.\n**Example:** The truth of 'God exists' relative to a society's religious beliefs.\n**Connections:**\n- is a form of anti-realism in [[Realism and Anti-Realism (Global)]]: because truth becomes mind-dependent.\n- appeals to different [[Conceptual Scheme]]s: because global relativists cite radically different schemes.\n- is embraced by [[Postmodernism]]: because postmodernists replace one true theory with relativism.\n**Bridges to other groups:**\n- [[Truth]] (Truth): because relativism is chiefly a thesis about truth.\n**Multiple meanings:** There are stronger/weaker and broader/narrower forms, and relativism about truth vs about meaning.\n**Further reading (book):** Kirk (1999, Chapter 3)\n  Full references (from the book's bibliography):\n  - Kirk, R. (1999) *Relativism and Realism*, London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "04 Realism and anti-realism/Scepticism.md": "---\ngroup: Realism and anti-realism\nrole: position\nsource: Beebee et al. 2011, entry \"Scepticism\"\npages: pp. 228–230 (entry starts p. 228)\nstatus: unread\n---\n# Scepticism\n**Page(s):** pp. 228–230 (entry starts p. 228)\n**Book's definition:** p. 228. Copy the last sentence of paragraph 1: scepticism as the position that some claims can't be known, or that there is no reason to believe them.\n**In one line:** The position that some class of claims (usually about the external world) can't be known, or that we have no reason at all to believe them.\n**Role in [[00 – Realism and anti-realism]]:** The epistemological challenge that drives much of the global realism debate.\n**Explanation:** In philosophy, scepticism isn't a psychological state of doubt but a position. Usually it concerns the external world: we can't know, or have no reason to believe, that chairs, trees and elephants exist. Narrower forms include inductive scepticism (no reason to think the sun will rise tomorrow) and scepticism about other minds. Descartes' evil demon is the classic scenario; brains in a vat is its modern version. Some responses try to show the scenario is incoherent by appealing to global anti-realism. Berkeley's idealism ('to be is to be perceived') leaves no gap between how things seem and how they are. Anti-realists argue that realism, and so scepticism, presuppose a God's eye view that makes no sense, since we can't step outside our conceptual scheme.\n**Example:** Descartes' evil demon.\n**Connections:**\n- uses [[Brains in a Vat]]: because it is the contemporary sceptical scenario.\n- is answered by [[Phenomenalism and Idealism]]: because idealism removes the seems/is gap.\n- presupposes the [[God's Eye View]] according to anti-realists: because doubting needs a perspective outside our scheme.\n- is resisted through [[Conceptual Scheme]] and [[Realism and Anti-Realism (Global)]]: because the responses appeal to global anti-realism.\n**Bridges to other groups:**\n- [[Berkeley, George]] (Philosophers): because his idealism is a response to scepticism.\n**Multiple meanings:** Yes: ordinary doubt vs the philosophical position; external-world, inductive and other-minds scepticism.\n**Further reading (book):** Descartes (1641, Meditation I); Blackburn (1999, Chapter 1); Stroud (1984)\n  Full references (from the book's bibliography):\n  - Descartes, R. (1641) *Meditations on First Philosophy* (available in many editions and freely available online).\n  - Blackburn, S. (1999) *Think!*, Oxford: Oxford University Press.\n  - Stroud, B. (1984) *The Significance of Philosophical Scepticism*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/00 – Time.md": "---\ngroup: Time\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Time\n**Central question:** What is time like: do only present things exist, are tensed facts real, does time flow, and how do objects persist through it?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| [[Presentism]] | Only present concrete things exist | Crisp (2003); Keller (2004) and Zimmerman (2008) on truthmakers | Truthmaking for the past; relativity |\n| [[Eternalism]] | All times exist, tenselessly | — | Some find tenseless existence unintelligible (Crisp, Ludlow) |\n| [[Growing Block Theory]] | Past and present exist, the future doesn't | Broad, Tooley, Diekemper | The 'dead past' objection (Bourne 2002; Merricks 2006) |\n| [[Moving Spotlight Theory of Time]] | All times exist, but the present is privileged | — | Seems to be McTaggart's target |\n| Tensed theory ([[Tensed and Tenseless Theories of Time]]) | Tensed (A-)facts are real or fundamental | — | Relativity: no objective present |\n| Tenseless theory ([[Tensed and Tenseless Theories of Time]]) | Only tenseless (B-)facts are fundamental | — | Must explain the apparent [[Flow of Time]] |\n| [[Perdurantism]] | Objects have temporal parts | Lewis | Wasserman (2002) on coincidence |\n| [[Endurantism]] | Objects are wholly present at each time | Burke (1992) on coincidence | Hard to define; temporary intrinsics |\n| [[Unreality of Time]] | Time doesn't exist | McTaggart | 'At different times' (McTaggart's regress reply is debatable) |\n\n## Key arguments and test cases\n- The Battle of Hastings as future, present and past: [[Unreality of Time]] (p. 267)\n- Hulk Hogan's changing height; Lewis's instantaneous world: [[Perdurantism]] (p. 158)\n- The statue and the lump of clay: [[Endurantism]] (p. 62)\n- Marty's kiss and Dummett's dancing shaman: [[Backwards Causation]] (p. 14)\n- The grandfather paradox and the banana peel: [[Time Travel]] (p. 253)\n- Chasing a photon: [[Relativity]] (p. 223)\n- Entropy and the order of historical events: [[Direction of Time]] (p. 57)\n\n## Bridges to other groups\n- **Truth:** [[Truthmakers]], [[Proposition]] and [[Truth Conditions]], because presentism's main problem is truthmaking, and tenseless theorists give truth conditions for tensed sentences.\n- **Identity:** [[Leibniz's Law]], [[Persistence]] and [[Identity Over Time]], because the arguments about persistence use Leibniz's Law.\n- **Causation and laws:** [[Regularity Theory of Causation]] and [[Humean Supervenience]], because backwards causation conflicts with the regularity theory, and Lewis argues for temporal parts from Humean supervenience.\n- **Personal identity:** [[Multiple Occupancy Thesis]], because it assumes perdurantism.\n- **Tools:** [[Indexical]] and [[Type and Tokens]], because tenseless theorists treat 'now' as indexical and use sentence tokens.\n- **Sets:** [[Zeno]] and [[Infinity]], because the field's ancient roots are Zeno's puzzles.\n\n## Reading path (pages in the book)\n1. **Overview and McTaggart:** [[Time]] (p. 252), [[Unreality of Time]] (p. 267), [[Tensed and Tenseless Theories of Time]] (p. 245)\n2. **Which times exist:** [[Presentism]] (p. 177), [[Eternalism]] (p. 65), [[Growing Block Theory]] (p. 86), [[Moving Spotlight Theory of Time]] (p. 133)\n3. **Persistence:** [[Perdurantism]] (p. 158), [[Endurantism]] (p. 62), [[Temporal Parts]] (p. 244), [[Four-Dimensionalism]] (p. 79)\n4. **Flow, direction, physics, travel:** [[Flow of Time]] (p. 77), [[Direction of Time]] (p. 57), [[Relativity]] (p. 223), [[Backwards Causation]] (p. 14), [[Time Travel]] (p. 253)\n- Pointer entries: [[A-Theory]] (p. 12), [[B-Theory]] (p. 21), [[Bilking Argument]] (p. 16), [[Grandfather Paradox]] (p. 86), [[Temporary Intrinsics]] (p. 245)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "05 Time/A-Theory.md": "---\ngroup: Time\nrole: pointer\nsource: Beebee et al. 2011, entry \"A-Theory\"\npages: p. 12\nstatus: unread\n---\n# A-Theory\n**Page(s):** p. 12\n**Pointer entry:** the book only says \"see\" → [[Tensed and Tenseless Theories of Time]]. Read that note.\n**Role in [[00 – Time]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "05 Time/B-Theory.md": "---\ngroup: Time\nrole: pointer\nsource: Beebee et al. 2011, entry \"B-Theory\"\npages: p. 21\nstatus: unread\n---\n# B-Theory\n**Page(s):** p. 21\n**Pointer entry:** the book only says \"see\" → [[Tensed and Tenseless Theories of Time]]. Read that note.\n**Role in [[00 – Time]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "05 Time/Backwards Causation.md": "---\ngroup: Time\nrole: concept\nsource: Beebee et al. 2011, entry \"Backwards Causation\"\npages: pp. 14–15 (entry starts p. 14)\nstatus: unread\n---\n# Backwards Causation\n**Page(s):** pp. 14–15 (entry starts p. 14)\n**Book's definition:** p. 14, the opening sentence of the entry.\n**In one line:** Causation in which the cause happens *after* its effect.\n**Role in [[00 – Time]]:** A possibility that tests theories of time and of causation, and is closely tied to time travel.\n**Explanation:** Marty kisses his girlfriend in 2010, travels to 1955 and catches her cold there: the later kiss causes the earlier cough. Backwards causation is related to time travel but distinct from it. A magic button that gave someone a cold in 1955 would be backwards causation with nothing travelling through time. The *bilking argument* (Black 1956) says we could never have evidence for backwards causation. If a shaman dances after a successful hunt to make it have succeeded (Dummett 1964), it's more reasonable to think the hunt causes the dance. The grandfather paradox threatens backwards causation even when nothing travels. And backwards causation conflicts with analyses of causation that require causes to precede their effects, such as the regularity theory.\n**Example:** Marty's 2010 kiss causing his 1955 cough; Dummett's dancing shaman.\n**Connections:**\n- is closely related to [[Time Travel]]: because time travel always involves backwards causation, though not vice versa.\n- is attacked by the [[Bilking Argument]] and threatened by the [[Grandfather Paradox]]: because both are discussed here (pointer entries).\n- complicates the [[Direction of Time]]: because causal accounts of time's direction struggle where causes can follow their effects.\n- bears on the [[Flow of Time]]: because the Flow of Time entry sets backwards causation aside.\n**Bridges to other groups:**\n- [[Regularity Theory of Causation]] (Causation and laws): because that theory requires the cause to come before the effect.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Faye (2010)\n  Full references (from the book's bibliography):\n  - Faye, J. (2010) ‘Backward causation’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Spring 2010 edn. Online. Available at: http://plato.stanford.edu/archives/spr2010/entries/causation-backwards.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/Bilking Argument.md": "---\ngroup: Time\nrole: pointer\nsource: Beebee et al. 2011, entry \"Bilking Argument\"\npages: p. 16\nstatus: unread\n---\n# Bilking Argument\n**Page(s):** p. 16\n**Pointer entry:** the book only says \"see\" → [[Backwards Causation]]. Read that note.\n**Role in [[00 – Time]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "05 Time/Direction of Time.md": "---\ngroup: Time\nrole: concept\nsource: Beebee et al. 2011, entry \"Direction of Time\"\npages: pp. 57–59 (entry starts p. 57)\nstatus: unread\n---\n# Direction of Time\n**Page(s):** pp. 57–59 (entry starts p. 57)\n**Book's definition:** p. 57. There's no one-sentence definition. Copy the sentence that ends the passage comparing events and cities, which says that only time has a direction.\n**In one line:** Events are ordered from earliest to latest, and, unlike spatial orderings, that order has a direction. What explains it?\n**Role in [[00 – Time]]:** One of the core questions about the nature of time.\n**Explanation:** The Battle of Hastings, the American Revolution and the Boer War come in a natural order. Cities can be ordered west to east or east to west, and neither order is privileged. So both series have an order, but only time has a direction. The *thermodynamic* answer (favoured by Boltzmann) says the direction is fixed by increasing entropy, a measure of disorder. Local decreases, such as building something, cost energy and raise entropy overall. But a decrease in entropy is possible, if unlikely, consistent with the laws of nature. Another answer appeals to the direction of causation. That is only open to those who don't analyse causation in temporal terms, so it rules out the regularity theory. It also struggles with worlds with little causation, or with backwards causation.\n**Example:** Hastings → American Revolution → Boer War, vs Paris, Moscow, Beijing.\n**Connections:**\n- is distinct from the [[Flow of Time]]: because a river's current has a direction but you can still swim upstream (Flow of Time entry).\n- is challenged by [[Backwards Causation]]: because in such worlds causes can come after their effects.\n**Bridges to other groups:**\n- [[Event]] (Causation and laws): because the direction is the ordering of events.\n- [[Law of Nature]] (Causation and laws): because entropy could decrease consistently with the laws.\n- [[Regularity Theory of Causation]] (Causation and laws): because the causal account is unavailable to theories that define causes as earlier.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Dainton (2001, Chapter 4); Le Poidevin (2003, Chapter 12)\n  Full references (from the book's bibliography):\n  - Dainton, B. (2001) *Time and Space*, Chesham: Acumen.\n  - Le Poidevin, R. (2003) *Travels in Four Dimensions*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "05 Time/End
