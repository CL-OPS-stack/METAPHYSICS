:** p. 81. Copy the first sentence, which states the traditional 'problem of free will'.\n**In one line:** The book's overview: the problem of reconciling free will with determinism, and the further problems it has grown into.\n**Role in [[00 – Free will]]:** The book's own topic entry for this group, with a table sorting the positions.\n**Explanation:** 'Freedom of the will' comes from an older picture of the mind as having distinct faculties, one of which was the will; today philosophers usually talk of freedom of *action*. Incompatibilists (with the Consequence Argument) say either determinism is false or we never act freely. Libertarians say some decisions are undetermined, which seems to make free will hostage to science and so to moral responsibility. Hard and soft determinism are no longer popular, since we lack reason to think determinism true. Further problems: the problem of luck, agent causation, the claim that free will is an illusion, and neuroscience. Compatibilists deny any tension: either the ability to do otherwise isn't required (Frankfurt), or there is a sense of it compatible with determinism (PAP). Table 1 in the entry sorts the positions by what each is committed to.\n**Example:** Table 1 in the entry: which positions accept determinism, incompatibilism and free action.\n**Connections:**\n- maps [[Compatibilism]], [[Incompatibilism]], [[Libertarianism]], [[Hard Determinism]] and [[Soft Determinism]]: because these are the main positions.\n- maps [[Consequence Argument]], [[Principle of Alternate Possibilities (PAP)]] and [[Frankfurt's Nefarious Neurosurgeon]]: because they are the central arguments.\n- maps [[Problem of Luck]], [[Agent Causation]], [[Illusion of Free Will]] and [[Neuroscience and Free Will]]: because they are the further problems.\n- underlies [[Moral Responsibility]]: because only free acts are thought to be ones we are responsible for.\n**Bridges to other groups:**\n- [[Law of Nature]] and [[Causation and Laws]] (Causation and laws): because determinism is defined via the laws, and the free will debate draws on causation.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** O’Connor (2008); Blackburn (1999, Chapter 3); Beebee and Dodd (2006, Chapter 2)\n  Full references (from the book's bibliography):\n  - O’Connor, T. (2008) ‘Free will’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/freewill.\n  - Blackburn, S. (1999) *Think!*, Oxford: Oxford University Press.\n  - Beebee, H. and Dodd, J. (eds) (2006) *Reading Metaphysics*, Oxford: Blackwell.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Guidance Control vs Regulative Control.md": "---\ngroup: Free will\nrole: concept\nsource: Beebee et al. 2011, entry \"Guidance Control vs Regulative Control\"\npages: p. 88\nstatus: unread\n---\n# Guidance Control vs Regulative Control\n**Page(s):** p. 88\n**Book's definition:** p. 88. Copy the second sentence (guidance control) and the last sentence (regulative control).\n**In one line:** Fischer's distinction. Guidance control (controlling what you actually do) is compatible with determinism; regulative control requires alternative possibilities.\n**Role in [[00 – Free will]]:** The distinction behind Fischer's semicompatibilism.\n**Explanation:** You exercise guidance control over when you get up by deciding when to set your alarm, setting it, and getting up when it rings; determinism doesn't undermine that. Regulative control requires alternative possibilities, so it may not be compatible with determinism.\n**Example:** Setting your alarm clock and getting up when it rings.\n**Connections:**\n- supports [[Compatibilism]]: because guidance control is said to be compatible with [[Determinism]].\n- ties regulative control to [[Principle of Alternate Possibilities (PAP)]]: because regulative control requires alternatives.\n- [[Regulative Control]]: a pointer entry that sends you here.\n- is illustrated by [[Frankfurt's Nefarious Neurosurgeon]]: because Fischer uses the case to separate the two notions (Compatibilism entry).\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Hard Determinism.md": "---\ngroup: Free will\nrole: position\nsource: Beebee et al. 2011, entry \"Hard Determinism\"\npages: p. 90\nstatus: unread\n---\n# Hard Determinism\n**Page(s):** p. 90\n**Book's definition:** p. 90, the opening sentence of the entry.\n**In one line:** Free will is incompatible with determinism, and determinism is true, so nobody is ever morally responsible for anything.\n**Role in [[00 – Free will]]:** The pessimistic incompatibilist position.\n**Explanation:** Its popularity has waned as philosophers have come to accept that indeterminism might be true. Its obvious consequence is that nobody is ever morally responsible. Strawson (1962) argues that if hard determinism were true, our practices of praise, blame and punishment, and our 'reactive attitudes' (resentment, gratitude, forgiveness), would all be unjustified. Yet it is psychologically impossible for us to give them up, since that would amount to giving up interpersonal relationships, so we couldn't seriously endorse the view. Other philosophers argue that believing hard determinism needn't mean giving these up.\n**Example:** Strawson: giving up resentment and gratitude would mean giving up personal relationships.\n**Connections:**\n- is a form of [[Incompatibilism]] that accepts [[Determinism]]: because it holds both theses.\n- contrasts with [[Soft Determinism]]: because that view accepts determinism but is compatibilist.\n- denies [[Moral Responsibility]]: because nobody is ever responsible on this view.\n- is challenged through [[Reactive Attitudes]]: because Strawson argues we can't give them up (pointer entry).\n- has declined because of [[Indeterminism]]: because indeterminism might well be true.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Illusion of Free Will.md": "---\ngroup: Free will\nrole: position\nsource: Beebee et al. 2011, entry \"Illusion of Free Will\"\npages: pp. 99–100 (entry starts p. 99)\nstatus: unread\n---\n# Illusion of Free Will\n**Page(s):** pp. 99–100 (entry starts p. 99)\n**Book's definition:** p. 99. Copy the last sentence of paragraph 1 (some philosophers hold that this ordinary belief is mistaken, so free will is an illusion).\n**In one line:** The view that our belief in free will is not just false but an *illusion*: a belief grounded in how deciding seems to us.\n**Role in [[00 – Free will]]:** The sceptical conclusion that some incompatibilists draw.\n**Explanation:** An illusion isn't just any false belief: thinking Sydney is Australia's capital is merely false, while thinking the sun circles the earth rests on how things look. It *seems* to us that we could have done otherwise, or that we are uncaused causes of our decisions. Yet perhaps determinism is true, or we don't cause our decisions, or prior brain states cause them. Illusionists are typically incompatibilists. Some also think free will is incompatible with indeterminism, at least the quantum-mechanical kind ('hard incompatibilism', Pereboom 2001). Recent claims from neuroscience and psychology also say free will is an illusion.\n**Example:** The sun seeming to move round the earth (an illusion) vs thinking Sydney is the capital (a false belief).\n**Connections:**\n- targets the appearance behind [[Principle of Alternate Possibilities (PAP)]] and [[Agent Causation]]: because it seems we could do otherwise and are uncaused causes.\n- is usually held by those accepting [[Incompatibilism]]: because illusionists are typically incompatibilists.\n- may follow from [[Hard Determinism]] or the [[Problem of Luck]]: because if freedom is incompatible with both determinism and indeterminism, it is impossible.\n- is claimed by [[Neuroscience and Free Will]]: because Libet-style findings are said to reveal it.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** The entry distinguishes an illusion from a merely false belief. 'Hard incompatibilism' is Pereboom's name for one version.\n**Further reading (book):** Pereboom (2001, Chapter 5)\n  Full references (from the book's bibliography):\n  - Pereboom, D. (2001) *Living Without Free Will*, Cambridge: Cambridge University Press.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Incompatibilism.md": "---\ngroup: Free will\nrole: position\nsource: Beebee et al. 2011, entry \"Incompatibilism\"\npages: pp. 100–102 (entry starts p. 100)\nstatus: unread\n---\n# Incompatibilism\n**Page(s):** pp. 100–102 (entry starts p. 100)\n**Book's definition:** p. 100, the opening sentence of the entry.\n**In one line:** The view that acting freely is incompatible with determinism.\n**Role in [[00 – Free will]]:** One of the two sides of the traditional debate. Libertarianism and hard determinism are its two forms.\n**Explanation:** One motivation: acting freely seems to require that you *could* have done otherwise. When deciding between tea and coffee, you assume you could do either; and if a neuroscientist's button had made you choose tea, you wouldn't have chosen freely. By the Consequence Argument, determinism rules out that ability, even when what determines you is your ordinary situation plus the laws. A second argument, the 'causal chain argument', says that under determinism all the sources of our actions ultimately lie outside us. Incompatibilists persuaded by this typically require agent causation. Hard determinists say determinism is true and we never act freely; the more popular libertarians say we sometimes act freely, so indeterminism is true.\n**Example:** Choosing tea over coffee, assuming you could have chosen coffee.\n**Connections:**\n- opposes [[Compatibilism]]: because it denies free will and determinism are compatible.\n- is argued for by the [[Consequence Argument]] and relies on [[Principle of Alternate Possibilities (PAP)]]: because the ability to do otherwise is said to be incompatible with determinism.\n- often requires [[Agent Causation]]: because the causal chain argument locates freedom in agents being the source of their acts.\n- divides into [[Hard Determinism]] and [[Libertarianism]]: because incompatibilists disagree on whether we ever act freely.\n- [[Source Incompatibilism]]: a pointer entry that sends you here.\n**Bridges to other groups:**\n- [[Law of Nature]] (Causation and laws): because determinism is defined through the past plus the laws.\n**Multiple meanings:** The entry gives two arguments: the alternative-possibilities argument (the Consequence Argument) and the causal chain (source) argument.\n**Further reading (book):** Clarke (2008); Vihvelin (2008)\n  Full references (from the book's bibliography):\n  - Clarke, R. (2008) ‘Incompatibilist (nondeterministic) theories of free will’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/incompatibilism-theories.\n  - Vihvelin, K. (2008) ‘Arguments for incompatibilism’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/incompatibilism-arguments.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Indeterminism.md": "---\ngroup: Free will\nrole: concept\nsource: Beebee et al. 2011, entry \"Indeterminism\"\npages: pp. 102–104 (entry starts p. 102)\nstatus: unread\n---\n# Indeterminism\n**Page(s):** pp. 102–104 (entry starts p. 102)\n**Book's definition:** p. 102, the opening sentence of the entry.\n**In one line:** The denial of determinism: the state of the Universe at one time, plus the laws, does not entail its state at every other time.\n**Role in [[00 – Free will]]:** The thesis libertarians need, and the source of the problem of luck.\n**Explanation:** A common view is that quantum mechanics shows determinism to be false. Radioactive atoms have a 'half-life': for strontium-90 (spread over Europe after Chernobyl) there is a probability of ½ that a given atom decays within 28 years. One might think such probabilities just reflect our ignorance, but many scientists and philosophers take them to be rock-bottom 'chances'. This matters for libertarianism, which claims that at least some of our *decisions* are not determined by prior facts plus the laws.\n**Example:** A strontium-90 atom with a 50% chance of decaying in 28 years.\n**Connections:**\n- is the denial of [[Determinism]]: because the entry defines it that way.\n- is required by [[Libertarianism]]: because libertarians say some decisions are undetermined.\n- raises the [[Problem of Luck]]: because undetermined decisions may look like a matter of chance.\n- has undermined [[Hard Determinism]]: because philosophers now accept that indeterminism might be true.\n**Bridges to other groups:**\n- [[Chance]] (Causation and laws): because quantum probabilities are taken to be rock-bottom chances.\n- [[Law of Nature]] (Causation and laws): because indeterminism concerns what the laws plus the past entail.\n- [[Probabilistic Theories of Causation]] (Causation and laws): because indeterminism seems to require probabilistic causation.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Penrose (1989, Chapter 6); see also the *Further reading* for **determinism**\n  Full references (from the book's bibliography):\n  - Penrose, R. (1989) *The Emperor’s New Mind*, Oxford: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Libertarianism.md": "---\ngroup: Free will\nrole: position\nsource: Beebee et al. 2011, entry \"Libertarianism\"\npages: pp. 116–118 (entry starts p. 116)\nstatus: unread\n---\n# Libertarianism\n**Page(s):** pp. 116–118 (entry starts p. 116)\n**Book's definition:** p. 116, the opening sentence of the entry.\n**In one line:** The view that we sometimes act freely, and that acting freely requires indeterminism.\n**Role in [[00 – Free will]]:** The more popular form of incompatibilism.\n**Explanation:** This is not the political position of the same name. Libertarianism has two main motivations. *Leeway* libertarians are moved by the Consequence Argument: indeterminism gives the 'leeway' for a genuine choice, so they uphold PAP. *Source* (or causal history) libertarians are moved by the causal chain argument: what matters is whether the agent is the ultimate source of the action. They are more relaxed about PAP, even allowing an act to be determined at the moment it is performed, and sometimes require agent causation. Is there any evidence for libertarianism? Whether indeterminism is true is an empirical question, and even if it is, our best science gives no reason to think the processes leading to decisions are indeterministic in the right way. Still, if compatibilism is false, libertarianism looks more attractive than hard determinism or illusionism.\n**Example:** A decision about lunch that is not fixed by prior facts plus the laws (Indeterminism entry).\n**Connections:**\n- is a form of [[Incompatibilism]] that requires [[Indeterminism]]: because it holds that free action needs undetermined acts.\n- has a leeway version moved by the [[Consequence Argument]] and [[Principle of Alternate Possibilities (PAP)]]: because leeway libertarians uphold PAP.\n- has a source version that may need [[Agent Causation]]: because source libertarians sometimes require it.\n- competes with [[Hard Determinism]] and [[Illusion of Free Will]]: because those are its main rivals if compatibilism fails.\n- is consistent with [[Neuroscience and Free Will]]: because libertarians require only that decisions aren't determined, not uncaused (Neuroscience entry).\n**Bridges to other groups:**\n- [[Law of Nature]] (Causation and laws): because free acts must not be determined by the past plus the laws.\n**Multiple meanings:** Yes: free-will libertarianism vs political libertarianism; leeway vs source (causal history) libertarianism.\n**Further reading (book):** Clarke (2008)\n  Full references (from the book's bibliography):\n  - Clarke, R. (2008) ‘Incompatibilist (nondeterministic) theories of free will’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/incompatibilism-theories.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Moral Responsibility.md": "---\ngroup: Free will\nrole: concept\nsource: Beebee et al. 2011, entry \"Moral Responsibility\"\npages: pp. 132–133 (entry starts p. 132)\nstatus: unread\n---\n# Moral Responsibility\n**Page(s):** pp. 132–133 (entry starts p. 132)\n**Book's definition:** p. 132. Copy the second sentence (acting freely is generally taken to be necessary for moral responsibility).\n**In one line:** Being truly accountable for what one does. Acting freely is generally taken to be necessary for it.\n**Role in [[00 – Free will]]:** What is at stake in the free will debate.\n**Explanation:** Incompatibilists say acting freely, and so responsibly, is incompatible with determinism; compatibilists see no tension. What *is* moral responsibility? On a 'deep' conception, being truly accountable requires being the originating cause of one's act (agent causation), or being able to do otherwise in the incompatibilist sense. On a 'shallow' conception, praise and blame are like rewarding and punishing a dog: tools for social cohesion, which determinism wouldn't undermine. Experimental philosophy tests whether the ordinary concept is compatibilist or incompatibilist (Nichols and Knobe 2007). Strawson (1962) takes a different approach: the legitimacy of reactive attitudes can't seriously be questioned, as hard determinists do, because abandoning them would be impossible and catastrophic.\n**Example:** Praise and blame as like training a dog (the 'shallow' view).\n**Connections:**\n- requires acting freely, the subject of [[Free Will]]: because acting freely is generally taken to be necessary for it.\n- is contested between [[Incompatibilism]] and [[Compatibilism]]: because they disagree on whether determinism undermines it.\n- has a deep conception tied to [[Agent Causation]] and [[Libertarianism]]: because one may need to be the originating cause, or able to do otherwise.\n- is defended against [[Hard Determinism]] via [[Reactive Attitudes]]: because Strawson argues we can't abandon those attitudes (pointer entry).\n**Bridges to other groups:**\n- [[Experimental Philosophy]] (Method): because experimental work tests whether the ordinary notion is compatibilist.\n**Multiple meanings:** Yes: 'deep' vs 'shallow' conceptions. The entry also asks whether there is one concept or two.\n**Further reading (book):** Fischer (1999); Eschleman (2009)\n  Full references (from the book's bibliography):\n  - Fischer, J. M. (1999) ‘Recent work on moral responsibility’, *Ethics*, 110: 93–139.\n  - Eschleman, A. (2009) ‘Moral responsibility’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Winter 2009 edn. Online. Available at: http://plato.stanford.edu/archives/win2009/entries/moral-responsibility.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Neuroscience and Free Will.md": "---\ngroup: Free will\nrole: case\nsource: Beebee et al. 2011, entry \"Neuroscience and Free Will\"\npages: pp. 143–145 (entry starts p. 143)\nstatus: unread\n---\n# Neuroscience and Free Will\n**Page(s):** pp. 143–145 (entry starts p. 143)\n**Book's definition:** p. 143, the opening sentence of the entry.\n**In one line:** The debate over whether experiments like Libet's show that free will is an illusion.\n**Role in [[00 – Free will]]:** The empirical challenge to free will.\n**Explanation:** In 'Is free will an illusion?' (1999), Benjamin Libet reported this experiment. Subjects with their brains monitored said when they felt an urge to flex their wrist, by noting the position of a fast-moving clock hand. 'Readiness potentials' in the brain came about 350 milliseconds *before* the felt urge, so Libet concluded that voluntary acts are initiated unconsciously, leaving the 'conscious will' a very limited role. Philosophers have been largely critical. The worry assumes something like an agent-causal view. Compatibilists wouldn't be surprised that decisions are caused by prior brain events, and libertarians require only that decisions aren't *determined*, not that they are uncaused.\n**Example:** Readiness potentials about a third of a second before the felt urge to flex.\n**Connections:**\n- is offered as evidence for [[Illusion of Free Will]]: because Libet concludes the conscious will plays little role.\n- presupposes something like [[Agent Causation]]: because only on such a view is prior brain causation a threat.\n- doesn't trouble [[Compatibilism]] or [[Libertarianism]]: because neither requires decisions to be uncaused.\n- contrasts with [[Frankfurt's Nefarious Neurosurgeon]]: because Libet's is a real experiment, not a thought experiment.\n**Bridges to other groups:**\n- [[Thought Experiment]] (Method): because the entry stresses that this is an actual experiment, not a thought experiment.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Mele (2004, 2008)\n  Full references (from the book's bibliography):\n  - Mele, A. R. (2004) ‘Bad news for free will’, *New Humanist*, 119. Online. Available at: http://newhumanist.org.uk/698/bad-news-for-free-will (accessed 1 February, 2010).\n  - Mele, A. R. (2008) ‘Free will and science’, *American Philosophical Quarterly*, 45: 107–30.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Principle of Alternate Possibilities (PAP).md": "---\ngroup: Free will\nrole: concept\nsource: Beebee et al. 2011, entry \"Principle of Alternate Possibilities (PAP)\"\npages: pp. 182–185 (entry starts p. 182)\nstatus: unread\n---\n# Principle of Alternate Possibilities (PAP)\n**Page(s):** pp. 182–185 (entry starts p. 182)\n**Book's definition:** p. 182, the opening sentence of the entry.\n**In one line:** An agent is morally responsible for doing A only if they could have done otherwise than A.\n**Role in [[00 – Free will]]:** The pivotal principle of the free will debate.\n**Explanation:** PAP matters because acting freely is taken to be a precondition of responsibility. If PAP is false, as Frankfurt's case is alleged to show, then acting freely doesn't require the ability to do otherwise either, and that requirement is a premise of the Consequence Argument. Most incompatibilists accept only a *weaker* principle, restricted to direct responsibility. Drunk Sam, who can't avoid hitting a pedestrian, is still *indirectly* responsible, because earlier she could have done otherwise: driven slower, not driven, or not got drunk. Compatibilists fall into two camps. Some say there's a sense of 'could have done otherwise' that is compatible with determinism. Others say PAP is simply false (Dennett 1984; Frankfurt).\n**Example:** Drunk Sam and the pedestrian: indirect responsibility.\n**Connections:**\n- is a condition on [[Moral Responsibility]]: because it says responsibility requires alternatives.\n- is a premise of the [[Consequence Argument]]: because the argument assumes freedom needs the ability to do otherwise.\n- is attacked by [[Frankfurt's Nefarious Neurosurgeon]]: because the case claims responsibility without alternatives.\n- divides [[Compatibilism]]: because compatibilists either reinterpret 'could have done otherwise' or reject PAP.\n- is upheld by leeway [[Libertarianism]]: because leeway libertarians require alternatives.\n**Bridges to other groups:**\n- None named outside this group in the entry.\n**Multiple meanings:** The entry distinguishes PAP from weaker principles restricted to *direct* moral responsibility.\n**Further reading (book):** Dennett (1984, Chapter 6); see also the *Further reading* for **Frankfurt’s nefarious neurosurgeon**\n  Full references (from the book's bibliography):\n  - Dennett, D. (1984) *Elbow Room: The Varieties of Free Will Worth Wanting*, Cambridge, MA: Bradford Books.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Problem of Luck.md": "---\ngroup: Free will\nrole: argument\nsource: Beebee et al. 2011, entry \"Problem of Luck\"\npages: pp. 191–193 (entry starts p. 191)\nstatus: unread\n---\n# Problem of Luck\n**Page(s):** pp. 191–193 (entry starts p. 191)\n**Book's definition:** p. 191. Copy the last sentence of paragraph 1 (the problem of luck concerns the compatibility of moral responsibility with *indeterminism*).\n**In one line:** The worry that if our decisions are undetermined, they are a matter of luck, like an indeterministic coin toss, and so not under our control.\n**Role in [[00 – Free will]]:** The challenge to free will from the indeterministic side.\n**Explanation:** The Consequence Argument says determinism rules out responsibility; the problem of luck says indeterminism does too. If a coin toss were genuinely indeterministic, nobody could control the outcome: there is a possible world exactly like ours up to the toss in which it lands tails. Now suppose Jane's decision is undetermined right up to the moment she makes it. That meets the incompatibilist requirement that she could have done otherwise, yet the outcome looks like luck. If free will is incompatible with *both* determinism and indeterminism, free will is impossible. Kane (1999) argues that the problem can be overcome.\n**Example:** An indeterministic coin toss that nobody can control.\n**Connections:**\n- targets [[Indeterminism]], as the [[Consequence Argument]] targets [[Determinism]]: because it asks whether responsibility survives undetermined choices.\n- threatens [[Libertarianism]] and [[Incompatibilism]]: because they require undetermined decisions.\n- can lead to [[Illusion of Free Will]]: because if freedom is incompatible with both, it is impossible.\n- concerns [[Moral Responsibility]]: because it is a problem about responsibility and indeterminism.\n**Bridges to other groups:**\n- [[Chance]] (Causation and laws): because an undetermined toss has a 50% chance of heads.\n- [[Possible Worlds]] (Modality): because the case uses a world identical to ours up to the toss.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Kane (1999); Mele (2006, Chapter 1)\n  Full references (from the book's bibliography):\n  - Kane, R. (1999) ‘Responsibility, luck, and chance: reflections on free will and indeterminism’, *Journal of Philosophy*, 96: 217–40.\n  - Mele, A. R. (2006) *Free Will and Luck*, New York: Oxford University Press.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Reactive Attitudes.md": "---\ngroup: Free will\nrole: pointer\nsource: Beebee et al. 2011, entry \"Reactive Attitudes\"\npages: p. 209\nstatus: unread\n---\n# Reactive Attitudes\n**Page(s):** p. 209\n**Pointer entry:** the book only says \"see\" → [[Moral Responsibility]]. Read that note.\n**Role in [[00 – Free will]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "01 Free will/Regulative Control.md": "---\ngroup: Free will\nrole: pointer\nsource: Beebee et al. 2011, entry \"Regulative Control\"\npages: p. 219\nstatus: unread\n---\n# Regulative Control\n**Page(s):** p. 219\n**Pointer entry:** the book only says \"see\" → [[Guidance Control vs Regulative Control]]. Read that note.\n**Role in [[00 – Free will]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "01 Free will/Soft Determinism.md": "---\ngroup: Free will\nrole: position\nsource: Beebee et al. 2011, entry \"Soft Determinism\"\npages: p. 234\nstatus: unread\n---\n# Soft Determinism\n**Page(s):** p. 234\n**Book's definition:** p. 234, the opening sentence of the entry.\n**In one line:** Free will is compatible with determinism, and determinism is actually true.\n**Role in [[00 – Free will]]:** The traditional optimistic compatibilist package.\n**Explanation:** Acting freely is fully compatible with our acts being fixed by the distant past plus the laws, and our acts are in fact so fixed. The view's popularity has waned as philosophers have come to accept that indeterminism might be true. Most compatibilists today are neutral on whether determinism is true, and many think it simply irrelevant to free will.\n**Example:** (The entry gives no example.)\n**Connections:**\n- is a form of [[Compatibilism]] that accepts [[Determinism]]: because it holds both theses.\n- contrasts with [[Hard Determinism]]: because that view is incompatibilist.\n- has declined because of [[Indeterminism]]: because indeterminism might well be true.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "01 Free will/Source Incompatibilism.md": "---\ngroup: Free will\nrole: pointer\nsource: Beebee et al. 2011, entry \"Source Incompatibilism\"\npages: p. 235\nstatus: unread\n---\n# Source Incompatibilism\n**Page(s):** p. 235\n**Pointer entry:** the book only says \"see\" → [[Incompatibilism]]. Read that note.\n**Role in [[00 – Free will]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "02 Personal identity/00 – Personal identity.md": "---\ngroup: Personal identity\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Personal identity\n**Central question:** What makes a person at one time the same person as a person at another time, and what is a self at a time?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| [[Psychological Continuity]] | Same person = psychologically continuous | Rooted in Locke; Parfit (no-branching); Lewis (multiple occupancy) | Butler and Reid (transitivity, circularity); [[Fission]] |\n| [[Animalism]] | Same person = same human animal | Olson | Faces analogous splitting cases |\n| [[Bodily Continuity]] | Same person = same body or brain | — | The brain version is an unstable halfway house; the whole-body version may just be animalism |\n| [[Simple View of Personal Identity]] | Personal identity is primitive, not reducible | (souls / Cartesian egos) | Dualism alone doesn't give it (Locke) |\n| [[Bundle Theory of the Self or Person]] | The self has no irreducible unity | Hume (strong), Parfit (moderate) | Many claim introspection reveals a unity |\n| Parfit on [[Survival]] | Survival, not identity, is what matters | Parfit | — |\n\n## Key arguments and test cases\n- Old Jack, Captain McFaddon and Wee Johnny: [[Psychological Continuity]] (p. 197)\n- The Queen's hemispheres in Obama and Cameron: [[Fission]] (p. 75)\n- Freddy in the year 4000: [[Survival]] (p. 241)\n- Genuinely remembering requires being the person remembered: [[Quasi-Memory - Quasi-States]] (p. 199)\n- Hume's introspection: [[Bundle Theory of the Self or Person]] (p. 21)\n\n## Bridges to other groups\n- **Identity:** [[Identity Over Time]], [[Identity]] and [[Phase Sortal]], because personal identity is numerical identity over time for persons, and animalism treats 'person' as a phase sortal.\n- **Sets:** [[Transitive Relation]], [[One-to-One Relation]] and [[Ancestral Relation]], because fission and the memory theory turn on these properties of relations.\n- **Time:** [[Perdurantism]] and [[Temporal Parts]], because the Multiple Occupancy Thesis lets two persons share temporal parts.\n- **Method:** [[Thought Experiment]] and [[Conceptual Analysis]], because the debate runs on imagined cases and proposed analyses.\n- **Tools:** [[Reductionism]] and [[Primitive]], because the main divide is reductive theories vs the simple view.\n\n## Reading path (pages in the book)\n1. [[Personal Identity]] (p. 161), [[Psychological Continuity]] (p. 197), [[Memory Theory]] (p. 120), [[Quasi-Memory - Quasi-States]] (p. 199)\n2. [[Animalism]] (p. 7), [[Bodily Continuity]] (p. 17), [[Simple View of Personal Identity]] (p. 231)\n3. [[Fission]] (p. 75), [[Multiple Occupancy Thesis]] (p. 134), [[Survival]] (p. 241)\n4. [[Bundle Theory of the Self or Person]] (p. 21)\n- Short and pointer entries: [[Anti-Criterialism]] (p. 10), [[Only X and Y Principle]] (p. 151), [[Split Brain Case]] (p. 237)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258).*\n", "02 Personal identity/Animalism.md": "---\ngroup: Personal identity\nrole: position\nsource: Beebee et al. 2011, entry \"Animalism\"\npages: pp. 7–10 (entry starts p. 7)\nstatus: unread\n---\n# Animalism\n**Page(s):** pp. 7–10 (entry starts p. 7)\n**Book's definition:** p. 7. Copy the first sentence of paragraph 2 (\"Animalists claim that, as a matter of contingent fact…\").\n**In one line:** The view that each person on this planet is, as a contingent matter, identical to a human animal, so personal identity over time is the identity of a human animal.\n**Role in [[00 – Personal identity]]:** Perhaps the most popular rival to psychological continuity theories.\n**Explanation:** Psychological theories ground personal identity in psychological facts; animalists ground it in biological ones. Old Jack is Wee Johnny just in case they are the same human animal. That still leaves the question of what makes an animal the same over time, but arguably it turns a deeply puzzling question into a more tractable one. Animalism doesn't say that necessarily all persons are human animals: there could be alien or machine persons. Nor does it say all human animals are persons (a foetus isn't one). Eric Olson explains the view by treating 'person' as a phase sortal: we are not *essentially* persons, which fits common sense. Olson nonetheless follows Parfit in holding that survival, not literal identity, is what matters.\n**Example:** A foetus is a human animal but not (yet) a person.\n**Connections:**\n- rivals [[Psychological Continuity]]: because it grounds identity in biological rather than psychological facts.\n- may be the same theory as [[Bodily Continuity]]: because the whole-body version may not differ from animalism (Bodily Continuity entry).\n- agrees with Parfit on [[Survival]]: because Olson holds that survival, not identity, is what matters.\n- is one answer to [[Personal Identity]]: because it explains persons' diachronic identity by animals' identity.\n**Bridges to other groups:**\n- [[Phase Sortal]] (Identity): because Olson treats 'person' as a phase sortal.\n- [[Essence]] (Modality): because animalists deny that we are essentially persons.\n- [[Common Sense]] (Method): because that denial is said to fit pre-theoretical common sense.\n- [[Identity Over Time]] (Identity): because the theory reduces persons' identity to animals' identity over time.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Noonan (1989, Chapter 11); Olson (1997, 2008); Snowdon (1991); van Inwagen (1990, Chapters 15 and 16)\n  Full references (from the book's bibliography):\n  - Noonan, H. (1989) *Personal Identity*, London and New York: Routledge.\n  - Olson, E. (1997) *The Human Animal: Personal Identity Without Psychology*, Oxford: Oxford University Press.\n  - Olson, E. (2008) ‘Personal identity’, in E. N. Zalta (ed.) *The Stanford Encyclopedia of Philosophy*, Winter 2008 edn. Online. Available at: http://plato.stanford.edu/archives/win2008/entries/identity-personal.\n  - Snowdon, P. F. (1991) ‘Personal identity and brain transplants’, in D. Cockburn (ed.), *Human Beings*, Cambridge: Cambridge University Press.\n  - van Inwagen, P. (1990) *Material Beings*, New York: Cornell University Press.\n**Beyond the book:** —\n**My notes:**\n", "02 Personal identity/Anti-Criterialism.md": "---\ngroup: Personal identity\nrole: position\nsource: Beebee et al. 2011, entry \"Anti-Criterialism\"\npages: p. 10\nstatus: unread\n---\n# Anti-Criterialism\n**Page(s):** p. 10\n**Book's definition:** p. 10. The whole entry is one sentence: copy it.\n**In one line:** Another name for the simple view of personal identity.\n**Role in [[00 – Personal identity]]:** A synonym.\n**Explanation:** This one-sentence entry sends you to the simple view: the claim that personal identity over time is primitive and cannot be reduced to psychological or physical facts.\n**Example:** (See [[Simple View of Personal Identity]].)\n**Connections:**\n- is a synonym of [[Simple View of Personal Identity]]: because the entry defines it that way.\n**Bridges to other groups:**\n- None named in this entry.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "02 Personal identity/Bodily Continuity.md": "---\ngroup: Personal identity\nrole: position\nsource: Beebee et al. 2011, entry \"Bodily Continuity\"\npages: pp. 17–18 (entry starts p. 17)\nstatus: unread\n---\n# Bodily Continuity\n**Page(s):** pp. 17–18 (entry starts p. 17)\n**Book's definition:** p. 17, the opening sentence of the entry.\n**In one line:** Theories that identify persons with their bodies (or their brains), so that personal identity is the identity over time of a body or brain.\n**Role in [[00 – Personal identity]]:** The physical alternative to psychological theories, close to animalism.\n**Explanation:** Old Jack is Wee Johnny if they are the same body (or brain). That doesn't require the same atoms: most theories allow a body to change its parts gradually, usually with some kind of causal continuity. It's unclear whether the whole-body version differs from animalism. It would be strange for a living body and the human animal co-located with it to be able to outlive each other; if they are the same thing, the two theories are one theory under two names. The brain version might look like an unstable halfway house between full-body views and psychological theories.\n**Example:** Old Jack in 2010 and Wee Johnny in 1952: one body, with different atoms.\n**Connections:**\n- may be identical to [[Animalism]]: because a living body and its human animal are arguably the same thing.\n- is one answer to [[Personal Identity]]: because it grounds identity in the identity of bodies or brains.\n- has a brain version that sits between it and [[Psychological Continuity]]: because brain theorists can make sense of body-swapping (Psychological Continuity entry).\n**Bridges to other groups:**\n- [[Identity Over Time]] (Identity): because the theory relies on the diachronic identity of bodies, which can change their parts gradually.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Noonan (1989, Chapters 1 and 11); Parfit (1984, Chapter 10); Williams (1970); Olson (2008)\n  Full references (from the book's bibliography):\n  - Noonan, H. (1989) *Personal Identity*, London and New York: Routledge.\n  - Parfit, D. (1984) *Reasons and Persons*, Oxford: Clarendon Press.\n  - Williams, B. (1970) ‘The self and the future’, *The Philosophical Review*, 79: 161–80; reprinted in Williams, B. (ed.) (1973) *Problems of the Self*, Cambridge: Cambridge University Press.\n  - Olson, E. (2008) ‘Personal identity’, in E. N. Zalta (ed.) *The Stanford Encyclopedia of Philosophy*, Winter 2008 edn. Online. Available at: http://plato.stanford.edu/archives/win2008/entries/identity-personal.\n**Beyond the book:** —\n**My notes:**\n", "02 Personal identity/Bundle Theory of the Self or Person.md": "---\ngroup: Personal identity\nrole: position\nsource: Beebee et al. 2011, entry \"Bundle Theory of the Self or Person\"\npages: pp. 21–23 (entry starts p. 21)\nstatus: unread\n---\n# Bundle Theory of the Self or Person\n**Page(s):** pp. 21–23 (entry starts p. 21)\n**Book's definition:** p. 21. Copy the last sentence of paragraph 1 (\"Bundle theorists deny that…\").\n**In one line:** The view that the self is not an irreducibly unified thing: at any moment a person is a bundle of thoughts, feelings and impressions.\n**Role in [[00 – Personal identity]]:** A view about the self *at a time* (synchronic), unlike most of this group, which is about identity over time.\n**Explanation:** Introspection reveals a great variety of thoughts, feelings and sensations, and many philosophers say it also reveals a strong unity: all are aspects of one thing, 'I'. Bundle theorists deny that the self has this irreducible unity. The strong form, famously Hume's, denies the self exists: whenever he looked inward, he only ever found some particular perception, never himself (Hume 1739–40: 252). The moderate form, Derek Parfit's, accepts that the self exists but denies its irreducible unity, using the analogy of a nation. This is similar to, but not the same as, the bundle theory of objects. The entry also notes an overlap with Buddhist philosophy.\n**Example:** Hume looking inward and finding only perceptions of heat, cold, light, pleasure and pain, never a self.\n**Connections:**\n- is a view within [[Personal Identity]]: because it concerns what a person is at a time.\n**Bridges to other groups:**\n- [[Reductionism]] (Tools): because the dispute is whether the self is an *irreducibly* unified thing.\n- [[Hume, David]] (Philosophers): because he defended the strong form.\n- [[Bundle Theory vs Substance-Attribute Theory]] (Particulars and universals): because the entry says the two bundle theories are similar but must not be confused.\n- [[Empiricism]] (Tools): because Hume's meaning-empiricism targets the idea of the self (Empiricism entry).\n- [[Synchronic Identity]] (Identity): because the debate concerns facts about a person at a time.\n**Multiple meanings:** Yes: the strong form (no self: Hume) vs the moderate form (a self without irreducible unity: Parfit).\n**Further reading (book):** Collins (1982); Hume (1739–40, Book I, Part IV, § 6); Parfit (1984, Chapter 1)\n  Full references (from the book's bibliography):\n  - Collins, S. (1982) *Selfless Persons*, Cambridge: Cambridge University Press.\n  - Hume, D. (1739–40) *A Treatise of Human Nature*; reprinted in L. A. Selby-Bigge (ed.) (1978), Oxford: Clarendon Press.\n  - Parfit, D. (1984) *Reasons and Persons*, Oxford: Clarendon Press.\n**Beyond the book:** —\n**My notes:**\n", "02 Personal identity/Fission.md": "---\ngroup: Personal identity\nrole: case\nsource: Beebee et al. 2011, entry \"Fission\"\npages: pp. 75–77 (entry starts p. 75)\nstatus: unread\n---\n# Fission\n**Page(s):** pp. 75–77 (entry starts p. 75)\n**Book's definition:** p. 75, the opening sentence of the entry.\n**In one line:** When one thing a later becomes two things b and c, each with a claim to be identical with a. This is a problem because identity is one-to-one.\n**Role in [[00 – Personal identity]]:** The central puzzle case of personal identity, and a challenge to every reductive theory.\n**Explanation:** Fission cases (like the Ship of Theseus) arise for identity over time in general, but the standard one is the 'split-brain case'. Suppose the Queen's two brain hemispheres are put into the bodies of Obama and Cameron (their own brains having been removed), producing two people who are both psychologically continuous with the Queen. If both are the Queen, then since identity is transitive they are identical to each other, which they are not. Responses include a 'no branching' clause, which can look ad hoc and makes identity depend on matters extrinsic to the people involved. David Lewis's Multiple Occupancy Thesis says two persons were there all along, sharing temporal parts, which makes most sense given perdurantism. Analogous problems arise for animal and body theories (an animal could split), and indeed for any reductive theory, since any relation offered might branch.\n**Example:** The Queen's hemispheres transplanted into Obama's and Cameron's bodies.\n**Connections:**\n- challenges [[Psychological Continuity]]: because both survivors are psychologically continuous with the original.\n- is answered by the [[Multiple Occupancy Thesis]]: because it says two persons were present all along.\n- underlies Parfit's view of [[Survival]]: because his conclusions come from reflecting on fission.\n- may support the [[Simple View of Personal Identity]]: because the entry says fission may lend it support.\n- [[Only X and Y Principle]] and [[Split Brain Case]]: pointer entries that send you here.\n**Bridges to other groups:**\n- [[One-to-One Relation]] and [[Transitive Relation]] (Sets, classes and infinity): because the puzzle depends on identity being one-to-one and transitive.\n- [[Identity Over Time]] (Identity): because fission cases arise for identity over time generally.\n- [[Perdurantism]] and [[Temporal Parts]] (Time): because the Multiple Occupancy Thesis treats the two persons as sharing temporal parts.\n- [[Thought Experiment]] (Method): because fission cases are thought experiments.\n- [[Reductionism]] (Tools): because analogous difficulties face any reductive theory of personal identity.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Noonan (1989, Chapter 7); Parfit (1971, § 1)\n  Full references (from the book's bibliography):\n  - Noonan, H. (1989) *Personal Identity*, London and New York: Routledge.\n  - Parfit, D. (1971) ‘Personal identity’, *The Philosophical Review*, 80: 3–27. An abridged version is reprinted, with commentary, in Beebee and Dodd 2006.\n**Beyond the book:** —\n**My notes:**\n", "02 Personal identity/Memory Theory.md": "---\ngroup: Personal identity\nrole: position\nsource: Beebee et al. 2011, entry \"Memory Theory\"\npages: p. 120\nstatus: unread\n---\n# Memory Theory\n**Page(s):** p. 120\n**Book's definition:** p. 120, the opening sentence of the entry.\n**In one line:** Locke's theory: an earlier person x is identical to a later person y if and only if y remembers the experiences of x.\n**Role in [[00 – Personal identity]]:** The historical root of psychological continuity theories.\n**Explanation:** This short entry gives the rough idea and sends you to Psychological Continuity. That entry explains the two classic objections, from Butler and Reid. Identity is transitive but remembering isn't (the Captain McFaddon case). And genuine memory already presupposes personal identity, which leads to the idea of quasi-memory.\n**Example:** Old Jack remembers winning the 100 metres in 1952 as Wee Johnny (Psychological Continuity entry).\n**Connections:**\n- is developed into [[Psychological Continuity]]: because the entry sends you there for the full view.\n- is rescued by [[Quasi-Memory - Quasi-States]]: because quasi-memory answers the circularity objection.\n**Bridges to other groups:**\n- [[Locke, John]] (Philosophers): because the theory is rooted in his work.\n- [[Transitive Relation]] (Sets, classes and infinity): because the first classic objection is that remembering isn't transitive.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "02 Personal identity/Multiple Occupancy Thesis.md": "---\ngroup: Personal identity\nrole: position\nsource: Beebee et al. 2011, entry \"Multiple Occupancy Thesis\"\npages: p. 134\nstatus: unread\n---\n# Multiple Occupancy Thesis\n**Page(s):** p. 134\n**Book's definition:** p. 134, the opening sentence of the entry.\n**In one line:** The claim that, in a fission case, two people were housed in the original body all along.\n**Role in [[00 – Personal identity]]:** Lewis's solution to fission.\n**Explanation:** The thesis targets fission: one person seemingly 'becoming' two when their brain hemispheres are rehoused in two bodies. The Fission entry explains that the thesis is David Lewis's and makes most sense given perdurantism. Before the split the two persons share their temporal parts, so there is no single person who becomes two.\n**Example:** Before the split, two people overlap in one body.\n**Connections:**\n- answers [[Fission]]: because it denies that one person became two.\n- is a move within [[Psychological Continuity]] theory: because it is one way psychological theorists have responded to fission.\n- is a position in [[Personal Identity]]: because it is a thesis in that debate.\n**Bridges to other groups:**\n- [[Perdurantism]] and [[Temporal Parts]] (Time): because the persons share temporal parts.\n- [[Lewis, David]] (Philosophers): because the thesis is his (Fission entry).\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "02 Personal identity/Only X and Y Principle.md": "---\ngroup: Personal identity\nrole: pointer\nsource: Beebee et al. 2011, entry \"Only X and Y Principle\"\npages: p. 151\nstatus: unread\n---\n# Only X and Y Principle\n**Page(s):** p. 151\n**Pointer entry:** the book only says \"see\" → [[Fission]]. Read that note.\n**Role in [[00 – Personal identity]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "02 Personal identity/Personal Identity.md": "---\ngroup: Personal identity\nrole: concept\nsource: Beebee et al. 2011, entry \"Personal Identity\"\npages: entry starts p. 161\nstatus: unread\n---\n# Personal Identity\n**Page(s):** entry starts p. 161\n**Book's definition:** p. 161. Copy the first sentence (most work concerns the diachronic identity of persons) and the central question that follows it.\n**In one line:** The book's overview of the question: what makes a person at one time the same person as a person at another time?\n**Role in [[00 – Personal identity]]:** The book's own topic entry for this group.\n**Explanation:** What makes grey-haired Old Jack in 2010 the same person as Wee Johnny, who ran in the 1952 Helsinki Olympics? The most popular answer grounds personal identity in psychological continuity. Rivals identify persons with human animals (animalism) or with bodies or brains (bodily continuity). The simple view rejects any reductive account: identity can't be explained in more fundamental terms. Cases of fission raise the most interesting issues. From them Derek Parfit argues that we have no non-derivative reason to ensure our future existence; what we have reason to care about is survival.\n**Example:** Old Jack in 2010 and Wee Johnny in 1952.\n**Connections:**\n- maps [[Psychological Continuity]], [[Animalism]], [[Bodily Continuity]] and [[Simple View of Personal Identity]]: because these are the main answers.\n- highlights [[Fission]] and [[Survival]]: because they raise the deepest puzzles.\n**Bridges to other groups:**\n- [[Identity Over Time]] and [[Diachronic Identity]] (Identity): because the topic is identity over time for persons.\n- [[Reductionism]] (Tools): because the simple view rejects reductive accounts.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** None listed in this entry.\n**Beyond the book:** —\n**My notes:**\n", "02 Personal identity/Psychological Continuity.md": "---\ngroup: Personal identity\nrole: position\nsource: Beebee et al. 2011, entry \"Psychological Continuity\"\npages: pp. 197–199 (entry starts p. 197)\nstatus: unread\n---\n# Psychological Continuity\n**Page(s):** pp. 197–199 (entry starts p. 197)\n**Book's definition:** p. 197, the opening sentence of the entry.\n**In one line:** The most popular approach: a person at one time is the same person as a person at another time if they are psychologically continuous.\n**Role in [[00 – Personal identity]]:** The leading theory of personal identity. Most of the group's puzzles are puzzles for it.\n**Explanation:** The view grows out of Locke's memory theory: Old Jack is Wee Johnny because he remembers Wee Johnny's experiences. Butler and Reid raised two difficulties. First, identity is transitive but remembering isn't. Old Jack remembers being Captain McFaddon, who remembers being Wee Johnny, but Old Jack no longer remembers being Wee Johnny. The fix is to use memory *continuity*, the ancestral of memory connection, which is transitive. Second, genuine memory presupposes identity; the standard fix is quasi-memory. Many find it natural to describe the Obama–Cameron brain swap as the two men swapping bodies, which suits the theory. Its deepest challenge is fission, and responses such as Lewis's Multiple Occupancy Thesis came from reflecting on it.\n**Example:** Old Jack, Captain McFaddon and Wee Johnny: a chain of memories.\n**Connections:**\n- grows from [[Memory Theory]]: because it is rooted in Locke's memory theory.\n- uses [[Quasi-Memory - Quasi-States]]: because quasi-states avoid circularity.\n- is challenged by [[Fission]]: because two later people can both be psychologically continuous with one earlier person.\n- is answered with the [[Multiple Occupancy Thesis]]: because that is one response to fission.\n- rivals [[Animalism]] and [[Bodily Continuity]]: because they ground identity in biological or physical facts.\n**Bridges to other groups:**\n- [[Ancestral Relation]] and [[Transitive Relation]] (Sets, classes and infinity): because memory continuity is the ancestral of memory connection, and ancestral relations are always transitive.\n- [[Thought Experiment]] (Method): because body-swapping cases are thought experiments.\n- [[Locke, John]] and [[Lewis, David]] (Philosophers): because of the memory theory and the Multiple Occupancy Thesis.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Chapters 2 and 3 of Noonan (1989) discuss Locke’s memory theory and objections to it; Chapters 7–10 deal in depth with issues closely related to the psychological continuity theory of personal identity. See also Williams (1970) and Olson (2008)\n  Full references (from the book's bibliography):\n  - Noonan, H. (1989) *Personal Identity*, London and New York: Routledge.\n  - Williams, B. (1970) ‘The self and the future’, *The Philosophical Review*, 79: 161–80; reprinted in Williams, B. (ed.) (1973) *Problems of the Self*, Cambridge: Cambridge University Press.\n  - Olson, E. (2008) ‘Personal identity’, in E. N. Zalta (ed.) *The Stanford Encyclopedia of Philosophy*, Winter 2008 edn. Online. Available at: http://plato.stanford.edu/archives/win2008/entries/identity-personal.\n**Beyond the book:** —\n**My notes:**\n", "02 Personal identity/Quasi-Memory - Quasi-States.md": "---\ngroup: Personal identity\nrole: concept\nsource: Beebee et al. 2011, entry \"Quasi-Memory/Quasi-States\"\npages: p. 199\nstatus: unread\n---\n# Quasi-Memory/Quasi-States\n**Page(s):** p. 199\n**Book's definition:** p. 199. There's no opening definition: paragraph 1 states Butler's circularity problem. Copy the sentence in paragraph 3 beginning \"The most popular response to this dilemma…\", which introduces quasi-memory.\n**In one line:** Memory-like and intention-like states ('q-memory', 'q-intending') defined so as not to presuppose personal identity. They are used to avoid circularity in psychological theories.\n**Role in [[00 – Personal identity]]:** The standard technical fix for the circularity objection to memory and psychological continuity theories.\n**Explanation:** Butler's problem is that the concepts of memory and intention are partly analysed in terms of personal identity. Part of what makes Captain McPhaddon genuinely *remember* winning in 1952, rather than merely seem to, is that he *is* the person who won. You can't remember someone else's experiences. Likewise, you can only intend that you yourself do something. So ascriptions of memory and intention presuppose personal identity and can't explain it. The popular response is to analyse identity in terms of quasi-memory, quasi-intending and quasi-states in general.\n**Example:** Genuinely remembering winning the race requires being the person who won it.\n**Connections:**\n- rescues [[Memory Theory]]: because it answers Butler's circularity objection.\n- is used by [[Psychological Continuity]]: because most of its proponents use quasi-states in their analyses.\n**Bridges to other groups:**\n- [[Conceptual Analysis]] (Method): because the problem is that the concepts of memory and intention are partly analysed in terms of identity.\n- [[Locke, John]] (Philosophers): because Butler raised the problem against Locke's theory.\n**Multiple meanings:** The note's filename uses ' - ' because the entry title contains a slash. Also, the book's own spelling of the captain's name varies (McFaddon/McPhaddon).\n**Further reading (book):** Noonan (1989, Chapter 8); Parfit (1971, Section III); Olson (2008); Schechtman (1990)\n  Full references (from the book's bibliography):\n  - Noonan, H. (1989) *Personal Identity*, London and New York: Routledge.\n  - Parfit, D. (1971) ‘Personal identity’, *The Philosophical Review*, 80: 3–27. An abridged version is reprinted, with commentary, in Beebee and Dodd 2006.\n  - Olson, E. (2008) ‘Personal identity’, in E. N. Zalta (ed.) *The Stanford Encyclopedia of Philosophy*, Winter 2008 edn. Online. Available at: http://plato.stanford.edu/archives/win2008/entries/identity-personal.\n  - Schechtman, M. (1990) ‘Personhood and personal identity’, *The Journal of Philosophy* 87: 71–92; reprinted in Beebee and Dodd 2006.\n**Beyond the book:** —\n**My notes:**\n", "02 Personal identity/Simple View of Personal Identity.md": "---\ngroup: Personal identity\nrole: position\nsource: Beebee et al. 2011, entry \"Simple View of Personal Identity\"\npages: pp. 231–232 (entry starts p. 231)\nstatus: unread\n---\n# Simple View of Personal Identity\n**Page(s):** pp. 231–232 (entry starts p. 231)\n**Book's definition:** p. 231. Copy paragraph 2 (two sentences): proponents reject all reductions, and take identity to be a primitive fact.\n**In one line:** The view that facts about personal identity over time are primitive: they can't be reduced to psychological, biological or bodily facts.\n**Role in [[00 – Personal identity]]:** The anti-reductionist position in this group.\n**Explanation:** Psychological, animalist and bodily theories all give reductive conceptual analyses of personal identity. The simple view rejects them all. The most straightforward way to hold it is to think a person is a fundamental non-physical entity, a soul or Cartesian ego. If such souls persist, there is nothing more to say about what makes Wednesday's soul the same as Thursday's. But dualism alone doesn't commit you to the simple view: Locke was inclined to dualism, yet gave a psychological account of personal identity. Cases of fission may lend the simple view some support.\n**Example:** A persisting soul: the same soul on Wednesday and Thursday, with nothing more to say.\n**Connections:**\n- is also called [[Anti-Criterialism]]: because that entry defines it as another word for this view.\n- rejects [[Psychological Continuity]], [[Animalism]] and [[Bodily Continuity]]: because they are all reductive.\n- may be supported by [[Fission]]: because the entry says so.\n**Bridges to other groups:**\n- [[Reductionism]] and [[Primitive]] (Tools): because it treats personal identity as primitive and irreducible.\n- [[Conceptual Analysis]] (Method): because it denies there is an analysis of personal identity.\n- [[Locke, John]] (Philosophers): because his case shows dualism doesn't imply the simple view.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Merricks (1998); Noonan (1989, Chapters 1 and 5); Olson (2008); Swinburne (1984)\n  Full references (from the book's bibliography):\n  - Merricks, T. (1998) ‘There are no criteria of identity over time’, *Noûs**,* 32: 106–24.\n  - Noonan, H. (1989) *Personal Identity*, London and New York: Routledge.\n  - Olson, E. (2008) ‘Personal identity’, in E. N. Zalta (ed.) *The Stanford Encyclopedia of Philosophy*, Winter 2008 edn. Online. Available at: http://plato.stanford.edu/archives/win2008/entries/identity-personal.\n  - Swinburne, R. (1984) ‘Personal identity: the dualist theory’, in S. Shoemaker and R. Swinburne (eds), *Personal Identity*, Oxford: Blackwell.\n**Beyond the book:** —\n**My notes:**\n", "02 Personal identity/Split Brain Case.md": "---\ngroup: Personal identity\nrole: pointer\nsource: Beebee et al. 2011, entry \"Split Brain Case\"\npages: p. 237\nstatus: unread\n---\n# Split Brain Case\n**Page(s):** p. 237\n**Pointer entry:** the book only says \"see\" → [[Fission]]. Read that note.\n**Role in [[00 – Personal identity]]:** cross-reference only; the book gives no separate definition here.\n**My notes:**\n", "02 Personal identity/Survival.md": "---\ngroup: Personal identity\nrole: position\nsource: Beebee et al. 2011, entry \"Survival\"\npages: pp. 241–244 (entry starts p. 241)\nstatus: unread\n---\n# Survival\n**Page(s):** pp. 241–244 (entry starts p. 241)\n**Book's definition:** p. 241. Copy the definition of 'survival' in Parfit's sense, which comes later in the entry (the sentence beginning \"We can thus define 'survival', in Parfit's sense, as follows…\"). It is probably on p. 242.\n**In one line:** Parfit's notion: x survives at a later time if someone then is psychologically connected with x. Survival, not identity, is what matters.\n**Role in [[00 – Personal identity]]:** Parfit's famous conclusion from fission: identity is not what we have basic reason to care about.\n**Explanation:** In the year 4000, Freddy's hemispheres must be put into two new bodies, giving New-Freddy 1 and New-Freddy 2. Parfit holds a no-branching psychological continuity theory, so after the operation Freddy no longer exists. Freddy could stay in existence by having one hemisphere destroyed, but intuitively he has nothing to gain from that. So he has no reason to ensure his own future existence. What he has reason to want is that someone in the future is psychologically continuous or connected with him. Parfit explains this by saying our reason to keep existing is derived from a more basic reason to *survive*. Normally the two come together, but fission separates them.\n**Example:** Freddy's operation in the year 4000.\n**Connections:**\n- comes from [[Fission]]: because Parfit's conclusions arise from reflecting on fission.\n- uses [[Psychological Continuity]]: because survival is defined by psychological connection, and Parfit holds a no-branching continuity theory.\n- is accepted by [[Animalism]]'s Olson: because Olson follows Parfit in thinking survival is what matters (Animalism entry).\n**Bridges to other groups:**\n- [[Identity]] (Identity): because neither New-Freddy can be identical to Freddy, since identity is one-to-one.\n- [[Thought Experiment]] (Method): because the argument runs on an imagined case.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Noonan (1989, Chapter 9); Parfit (1971); Olson (2008)\n  Full references (from the book's bibliography):\n  - Noonan, H. (1989) *Personal Identity*, London and New York: Routledge.\n  - Parfit, D. (1971) ‘Personal identity’, *The Philosophical Review*, 80: 3–27. An abridged version is reprinted, with commentary, in Beebee and Dodd 2006.\n  - Olson, E. (2008) ‘Personal identity’, in E. N. Zalta (ed.) *The Stanford Encyclopedia of Philosophy*, Winter 2008 edn. Online. Available at: http://plato.stanford.edu/archives/win2008/entries/identity-personal.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/00 – Particulars and universals.md": "---\ngroup: Particulars and universals\nrole: hub\nsource: Beebee et al. 2011\n---\n# 00 – Particulars and universals\n**Central question:** What is it to be an object, and what are properties? Are there universals shared by many things, or only particulars?\n\n## Main positions\n| Position | Core claim | Key defenders (named in the book) | Main objection (from the book) |\n|---|---|---|---|\n| Realism about [[Universals]] (Platonist) | Universals exist, abstract and outside space and time | Plato | Most see no reason to think properties are abstract |\n| [[Immanent Realism About Universals]] | Universals are wholly present in each instance; none are uninstantiated | Aristotle, Armstrong | Red would be 'a metre away from itself' ([[Nominalism]]) |\n| [[Trope Theory]] | Properties are unrepeatable particulars | — | Resemblance has to be taken as primitive |\n| [[Class Nominalism]] | To be red is to be in the class of red things | Lewis (with possibilia) | Co-extensive properties (heart/kidneys) |\n| [[Resemblance Nominalism]] | Properties are explained by primitive resemblance | — | Shares many of class nominalism's difficulties |\n| [[Austere Nominalism]] | There are no properties; resemblance needs no explanation | Quine | Armstrong: 'ostrich nominalism' dodges a compulsory question |\n| Bundle theory ([[Bundle Theory vs Substance-Attribute Theory]]) | An object is a bundle of properties joined by compresence | — | Faces its own version of [[Bradley's Regress]] |\n| Substance-attribute theory ([[Bundle Theory vs Substance-Attribute Theory]]) | An object is a [[Substratum]] bearing properties | Armstrong (as states of affairs) | Binding substratum to properties without [[Bradley's Regress]] |\n\n## Key arguments and test cases\n- Plato, wisdom and the world where only Socrates is wise: [[Bradley's Regress]] (p. 18)\n- Having-a-heart vs having-kidneys: [[Class Nominalism]] (p. 38)\n- The red lamp and curtains, and 'no entity without identity': [[Nominalism]] (p. 145)\n- The telephone box and the Coke can: [[Austere Nominalism]] (p. 12)\n- Soldiers' 'same uniform' vs brothers' 'same father': [[Trope Theory]] (p. 255)\n- The apple stripped of its properties: [[Bundle Theory vs Substance-Attribute Theory]] (p. 23)\n\n## Bridges to other groups\n- **Ontology:** [[Ontological Commitment]], [[Paraphrase]] and [[Abstract vs Concrete]], because the nominalist–realist debate is a debate about commitment to properties, and about whether they are abstract.\n- **Truth:** [[States of Affairs]] and [[Truthmakers]], because Armstrong answers Bradley's regress with states of affairs and rejects Quine's criterion in favour of truthmakers.\n- **Modality:** [[Modal Realism]], because Lewis rescues class nominalism with possibilia.\n- **Kinds of properties:** [[Natural Property]] and [[Sparse Property]], because realists usually take only natural properties to be universals.\n- **Tools:** [[Primitive]], [[Type and Tokens]] and [[Reductionism]], because each theory chooses its primitives, tropes are tokens of types, and class and trope theories are reductive.\n- **Sets:** [[Class]], because class nominalism explains properties through classes.\n\n## Reading path (pages in the book)\n1. **Overview:** [[Particulars and Universals]] (p. 157), [[Properties]] (p. 195), [[Universals]] (p. 265), [[Particulars]] (p. 157)\n2. **Realist options:** [[Platonism]] (p. 165), [[Immanent Realism About Universals]] (p. 100), [[Instantiation]] (p. 108), [[Bradley's Regress]] (p. 18)\n3. **Nominalist options:** [[Nominalism]] (p. 145), [[Austere Nominalism]] (p. 12), [[Class Nominalism]] (p. 38), [[Resemblance Nominalism]] (p. 225), [[Trope Theory]] (p. 255)\n4. **Structure of objects:** [[Bundle Theory vs Substance-Attribute Theory]] (p. 23), [[Substratum]] (p. 239), [[Substance]] (p. 238), [[Form and Matter]] (p. 78)\n- Short and pointer entries: [[Ostrich Nominalism]] (p. 153), [[Platonic Heaven]] (p. 165), [[Exemplification]] (about p. 68), [[Participation]] (about p. 156), [[Substance-Attribute Theory]] (p. 238)\n\n*Page numbers are the print pages recorded in the ebook (ISBN 9780203835258). 'About' means estimated from neighbouring entries.*\n", "03 Particulars and universals/Austere Nominalism.md": "---\ngroup: Particulars and universals\nrole: position\nsource: Beebee et al. 2011, entry \"Austere Nominalism\"\npages: pp. 12–14 (entry starts p. 12)\nstatus: unread\n---\n# Austere Nominalism\n**Page(s):** pp. 12–14 (entry starts p. 12)\n**Book's definition:** p. 12. There's no one-sentence definition. Copy paragraph 2, which describes the second nominalist strategy: denying that resemblance needs any deeper explanation.\n**In one line:** The view that there are no universals, and that facts like 'the Coke can is red' need no deeper metaphysical explanation.\n**Role in [[00 – Particulars and universals]]:** The most minimal nominalist answer to the problem of resemblance.\n**Explanation:** Realists explain why a telephone box and a Coke can are both red by a shared universal. Other nominalists appeal to classes or to resembling tropes. The austere nominalist denies that any deeper explanation is needed: as Wittgenstein said, explanation has to end somewhere. Quine is its most famous defender. Armstrong mockingly called it 'ostrich nominalism', a refusal to answer 'a compulsory question on the examination paper'. The dispute is tied to ontological commitment: Quine paraphrases property-talk so that no bound variable ranges over properties, while Armstrong's rejection of Quine's criterion goes with his truthmaker theory.\n**Example:** The red telephone box and the red Coke can: 'the can is red, the box is red', and nothing more to say.\n**Connections:**\n- is a form of [[Nominalism]]: because it denies that there are universals.\n- opposes [[Universals]]: because it rejects the realist's explanation of resemblance.\n- is called [[Ostrich Nominalism]] by its critics: because Armstrong gave it that name.\n- differs from [[Class Nominalism]] and [[Trope Theory]]: because those nominalists still offer a deeper explanation.\n**Bridges to other groups:**\n- [[Ontological Commitment]] and [[Paraphrase]] (Ontology): because Quine avoids commitment to properties by paraphrasing sentences so that no bound variable ranges over them.\n- [[Truthmakers]] (Truth): because Armstrong's rejection of Quine's criterion is connected with his truthmaker theory.\n- [[Primitive]] (Tools): because the austere nominalist has to take many predicates as primitive (Primitive entry).\n- [[Quine, W. V.]] and [[Armstrong, David]] (Philosophers): because they are its main defender and its main critic.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Armstrong (1980); Devitt (1980); Loux (2006, Chapter 2)\n  Full references (from the book's bibliography):\n  - Armstrong, D. (1980) ‘Against “austere” nominalism: a reply to Michael Devitt’, *Pacific Philosophical Quarterly*, 61: 440–9; reprinted in Beebee and Dodd 2006.\n  - Devitt, M. (1980) ‘“Austere nominalism” or “mirage realism”?’, *Pacific Philosophical Quarterly*, 61: 433–9; reprinted in Beebee and Dodd 2006.\n  - Loux, M. (2006) *Metaphysics: A Contemporary Introduction*, 3rd edn, London: Routledge.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Bradley's Regress.md": "---\ngroup: Particulars and universals\nrole: argument\nsource: Beebee et al. 2011, entry \"Bradley's Regress\"\npages: pp. 18–20 (entry starts p. 18)\nstatus: unread\n---\n# Bradley's Regress\n**Page(s):** pp. 18–20 (entry starts p. 18)\n**Book's definition:** p. 18. There's no single definition: the regress is built up over paragraphs 1–3. Copy paragraph 1's statement of what has to be explained (that Plato is wise).\n**In one line:** A regress: if 'Plato is wise' needs Plato, wisdom and an instantiation relation, we seem to need a further relation, and another, without end.\n**Role in [[00 – Particulars and universals]]:** The main problem for realists about universals (and for bundle theorists): explaining how a thing and its properties are bound together.\n**Explanation:** Substance-attribute realists explain 'Plato is wise' by Plato (his substratum) and the universal wisdom. Their existence isn't enough: in a world where only Socrates is wise, both still exist. Adding an instantiation relation doesn't help, because that relation exists there too (relating Socrates to wisdom). So we need 'instantiation*' to relate Plato to instantiation, then 'instantiation**', and so on. If we just take 'Plato instantiates wisdom' as primitive, why not stop a stage earlier, as the austere nominalist does, with 'Plato is wise'? Armstrong's response: the fundamental constituents of reality are irreducibly unified wholes of particulars-having-universals, that is, states of affairs. Bundle theorists avoid the substratum version but face a parallel regress for the relation that binds their properties.\n**Example:** The possible world where Plato and wisdom both exist, but only Socrates is wise.\n**Connections:**\n- targets [[Universals]] and [[Instantiation]]: because the regress arises for the relation that ties a thing to its universal.\n- arises within [[Bundle Theory vs Substance-Attribute Theory]]: because both views must explain what binds an object's properties together.\n- supports [[Nominalism]]: because some nominalists reject universals on the ground that they fall foul of the regress.\n- is compared with [[Austere Nominalism]]: because taking instantiation as primitive invites stopping where the austere nominalist stops.\n**Bridges to other groups:**\n- [[States of Affairs]] (Truth): because Armstrong's answer makes reality ultimately composed of states of affairs.\n- [[Primitive]] and [[Reductionism]] (Tools): because the responses treat instantiation as primitive, or posit irreducibly unified wholes.\n- [[Possible Worlds]] (Modality): because the argument works by describing a possible world in which only Socrates is wise.\n- [[Armstrong, David]] (Philosophers): because his 'states of affairs' strategy is the main response.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Martin (1980); T. Wetzel (2008)\n  Full references (from the book's bibliography):\n  - Martin, C. B. (1980) ‘Substance substantiated’, *Australasian Journal of Philosophy*, 58: 3–10.\n  - Wetzel, T. (2008) ‘States of affairs’, in E. N. Zalta (ed.), *The Stanford Encyclopedia of Philosophy*, Fall 2008 edn. Online. Available at: http://plato.stanford.edu/archives/fall2008/entries/states-of-affairs.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Bundle Theory vs Substance-Attribute Theory.md": "---\ngroup: Particulars and universals\nrole: position\nsource: Beebee et al. 2011, entry \"Bundle Theory vs Substance-Attribute Theory\"\npages: pp. 23–25 (entry starts p. 23)\nstatus: unread\n---\n# Bundle Theory vs Substance-Attribute Theory\n**Page(s):** pp. 23–25 (entry starts p. 23)\n**Book's definition:** p. 23. Copy the two sentences in paragraph 2 that begin \"The bundle theorist believes…\" and \"The substance-attribute theorist believes…\".\n**In one line:** The debate over whether an object is nothing but a bundle of its properties, or its properties plus a substratum that bears them.\n**Role in [[00 – Particulars and universals]]:** The book's main question about the structure of particular objects.\n**Explanation:** Suppose an apple's properties (shape, colour, juiciness) are its constituents. If you strip them all away, is anything left? Bundle theorists say no: the apple is a collection of properties bound together by a relation such as compresence or co-location. Substance-attribute theorists say yes: there is also a substratum, which is not itself a property but bears the apple's properties. Bundle theory leaves open whether the properties are universals or tropes, though the entry notes a significant difficulty for bundle theorists who choose universals. The problem that most occupies substance-attribute theorists is uniting the substratum with its properties without Bradley's regress. Armstrong's answer treats the apple as a single thing, 'substratum-having-redness-&-roundness…', which commits him to a world of facts or states of affairs.\n**Example:** An ordinary apple, imaginatively stripped of its size, shape and juiciness.\n**Connections:**\n- [[Substance-Attribute Theory]]: a pointer entry that sends you here.\n- posits a [[Substratum]] on the substance-attribute side: because that is the extra constituent bearing the properties.\n- faces [[Bradley's Regress]]: because both sides must explain what binds an object's properties together.\n- is neutral between [[Universals]] and [[Trope Theory]]: because bundle theory leaves open which kind of property makes up the bundle.\n- contrasts with [[Class Nominalism]] and [[Resemblance Nominalism]]: because on those views properties are not constituents of the apple at all.\n**Bridges to other groups:**\n- [[States of Affairs]] and [[Facts]] (Truth): because Armstrong's solution commits him to a world of facts or states of affairs rather than things.\n- [[Armstrong, David]] (Philosophers): because his approach is the entry's main example.\n**Multiple meanings:** None noted in the entry.\n**Further reading (book):** Allaire (1963); Ayer (1954); Loux (2006, Chapter 3); Williams (1953)\n  Full references (from the book's bibliography):\n  - Allaire, E. (1963) ‘Bare particulars’, *Philosophical Studies*, 14: 1–8; reprinted in Laurence, S. and Macdonald, C. (eds) (1998) *Contemporary Readings in the Foundations of Metaphysics*, Oxford: Blackwell.\n  - Ayer, A. J. (1954) ‘The identity of indiscernibles’, in A. J. Ayer (ed.), *Philosophical Essays*, London: St. Martin’s Press, 1965.\n  - Loux, M. (2006) *Metaphysics: A Contemporary Introduction*, 3rd edn, London: Routledge.\n  - Williams, D. C. (1953) ‘On the elements of being: II’, *The Review of Metaphysics*, 7: 171–92.\n**Beyond the book:** —\n**My notes:**\n", "03 Particulars and universals/Class Nominalism.md": "---\ngroup: Particulars and universals\nrole: position\nsource: Beebee et al. 2011, entry \"Class Nominalism\"\npages: pp. 38–39 (entry starts p. 38)\nstatus: unread\n---\n# Class Nominalism\n**Page(s):** pp. 38–39 (entry starts p. 38)\n**Book's definition:** p. 38. Skip the opening sentence (it tells you to read Nominalism first) and copy the next one, beginning \"Class nominalists explain property possession…\".\n**In one line:** Nominalism that explains having a property, and resemblance, by class membership: an object is red because it belongs to the class of red things.\n**Role in [[00 – Particulars and universals]]:** A reductive nominalist account of properties, with a famous problem (co-extensive properties) and a famous fix (Lewis).\n**Explanation:** Class nominalists may be anti-realists about properties, paraphrasing 'wisdom is a virtue'. More often they *identify* properties with classes, so they are realists about properties who analyse them reductively. The main difficulty is co-extensive properties. Everything with a heart has kidneys and vice versa, so the two classes are identical, and *having-a-heart* would be the same property as *having-kidneys*, which seems wrong. David Lewis avoids this with genuine modal realism, letting the classes include non-actual possible things as well as actual ones.\n**Example:** *Having-a-heart* vs *having-kidneys*: same actual members, apparently different properties.\n**Connections:**\n- is a form of [[Nominalism]]: because it denies universals.\n- gives an account of [[Properties]]: because it identifies them with classes of particulars.\n- is compared with [[Resemblance Nominalism]]: because that view explains class membership by resemblance and is slightly less parsimonious but more intuitive (Resemblance Nominalism entry).\n- is improved on by [[Trope Theory]]: because the trope theorist's reductive account avoids the co-extension problem (Trope Theory entry).\n**Bridges to other groups:**\n- [[Class]] and [[Set]] (Sets, classes and infinity): because properties and resemblance are explained through classes or sets.\n- [[Modal Reali
